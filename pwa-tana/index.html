<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#efe9dd">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="棚卸">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512.png">
<title>棚卸</title>
<style>
  :root { --bone: #efe9dd; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: var(--bone); overflow: hidden; -webkit-tap-highlight-color: transparent; }
  /* 棚卸ダッシュボード（GAS）を全画面表示 */
  #app {
    position: fixed; inset: 0; width: 100%; height: 100%; border: 0;
    background: var(--bone);
  }
  /* 読み込み中の表示（アイコンと同じ生成りベース） */
  #splash {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: linear-gradient(155deg, #f4efe6, #e3dccb);
    transition: opacity .35s ease; z-index: 2;
  }
  #splash.hide { opacity: 0; pointer-events: none; }
  #splash img { width: 96px; height: 96px; border-radius: 22px;
    box-shadow: 0 10px 26px -10px rgba(40,35,28,.45); }
  #splash .t { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Mincho ProN", "Zen Old Mincho", serif;
    font-size: 22px; font-weight: 700; color: #1c1a16; letter-spacing: .08em; }
  #splash .s { font-size: 12px; color: #6b655a; }
  /* 通知オンの案内バー（初回のみ・ログイン済みのとき） */
  #pushbar {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 78px); z-index: 3;
    display: none; align-items: center; gap: 8px;
    background: #1c1a16; color: #f4efe6; padding: 9px 10px 9px 15px;
    border-radius: 999px; box-shadow: 0 12px 28px -8px rgba(0,0,0,.5);
    font-size: 13px; max-width: 92vw; white-space: nowrap;
  }
  #pushbar button { font: inherit; border: 0; border-radius: 999px; cursor: pointer; }
  #pushbar .on { background: #3f7d4f; color: #fff; padding: 7px 14px; font-weight: 700; }
  #pushbar .x { background: transparent; color: #cfc8ba; padding: 4px 7px; font-size: 16px; line-height: 1; }
</style>
</head>
<body>
<div id="splash">
  <img src="./icons/icon-192.png" alt="棚卸">
  <div class="t">棚卸</div>
  <div class="s">読み込み中…</div>
</div>
<iframe id="app"
  allow="clipboard-write; fullscreen"
  referrerpolicy="no-referrer-when-downgrade"></iframe>
<div id="pushbar">
  <span>🔔 棚卸の通知を受け取る</span>
  <button class="on" type="button">オンにする</button>
  <button class="x" type="button" aria-label="閉じる">×</button>
</div>
<script>
  (function () {
    var URL = 'https://script.google.com/macros/s/AKfycbyvVFWDpXDnjDP9r7PvzlCYSycCcKtDe6fpd_lykXywETy51Y-s3kF1YoryDmpnn3621Q/exec';
    var app = document.getElementById('app');
    var splash = document.getElementById('splash');
    var loaded = false, hidden = false;

    // ── ログイン保持（IG自動投稿と同じ方式）─────────────────────────
    // GASダッシュボードはiframe内で表示されるため、iOSではiframe内に保存した
    // パスコードが消され、毎回ログイン画面が出てしまう。そこで「消えない親ページ
    // （このGitHub Pages側）」にパスコードを覚えさせ、iframeを ?p= 付きで開いて
    // 自動ログインさせる。初回ログイン成功時にGASから postMessage で受け取り保存。
    function savedPass() { try { return localStorage.getItem('tana_p') || ''; } catch (e) { return ''; } }
    function srcWithPass() {
      var p = savedPass();
      return p ? (URL + '?p=' + encodeURIComponent(p)) : URL;
    }
    // GAS（サンドボックス）からのログイン成功通知を受けてパスコードを保存
    window.addEventListener('message', function (ev) {
      try {
        var o = ev.data;
        if (!o || o.type !== 'tana-auth' || !o.p) return;
        if (!/^https:\/\/([a-z0-9-]+\.googleusercontent\.com|script\.google\.com)$/.test(ev.origin || '')) return;
        if (String(o.p) !== savedPass()) localStorage.setItem('tana_p', String(o.p));
      } catch (e) {}
    });
    // 保存済みパスコードがあれば ?p= 付きで自動ログイン、無ければ通常表示（iframe内でログイン）
    app.src = srcWithPass();

    function hideSplash() { if (hidden) return; hidden = true; splash.classList.add('hide'); }
    app.addEventListener('load', function () { loaded = true; setTimeout(hideSplash, 300); });
    // 保険1: 読み込みイベントが来ても数秒でスプラッシュは必ず消す
    setTimeout(hideSplash, 5000);
    // 保険2: フレーム表示が何らかの理由で読み込めない環境では、直接アプリを開く
    setTimeout(function () { if (!loaded) location.replace(srcWithPass()); }, 6000);

    // Service Worker（インストール可能に・オフライン時は入口だけキャッシュ）
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function () {});
      });
    }

    // ── プッシュ通知の購読（この入口ページ＝ファーストパーティで行う）─────────
    // GAS本体はiframe（別オリジン）でSW/Pushを持てないため、購読はこの入口ページで実施し、
    // 購読情報を /exec へ POST(no-cors) して「通知購読」シートに保存する。配信はサーバ側。
    var VAPID_PUBLIC = 'BLVsj54hjtcCedqf7MXBZO2wgyr1a27SDt0oc6mTmlikp8jcKtQCa_URZ17qBIcUSuZksT2CbQX_K57yJYS1FME';
    function urlB64ToUint8(s) {
      var pad = '='.repeat((4 - s.length % 4) % 4);
      var b = (s + pad).replace(/-/g, '+').replace(/_/g, '/');
      var raw = atob(b); var arr = new Uint8Array(raw.length);
      for (var i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
      return arr;
    }
    function postSub(payload) { try { fetch(URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(payload) }); } catch (e) {} }
    function subscribePush() {
      return navigator.serviceWorker.ready.then(function (reg) {
        return Notification.requestPermission().then(function (perm) {
          if (perm !== 'granted') return false;
          return reg.pushManager.getSubscription().then(function (sub) {
            if (sub) return sub;
            return reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64ToUint8(VAPID_PUBLIC) });
          }).then(function (sub) {
            postSub({ action: 'subscribe', p: savedPass(), sub: sub.toJSON() });
            return true;
          });
        });
      }).catch(function () { return false; });
    }
    function pushEligible() {
      return ('serviceWorker' in navigator) && ('PushManager' in window) && ('Notification' in window) && !!savedPass();
    }
    function maybeShowPushBar() {
      if (!pushEligible()) return;
      if (Notification.permission === 'granted') { subscribePush(); return; }   // 既許可なら購読を再同期
      if (Notification.permission === 'denied') return;
      var dismissed = false; try { dismissed = localStorage.getItem('tana_push_dismiss') === '1'; } catch (e) {}
      if (dismissed) return;
      var bar = document.getElementById('pushbar');
      bar.querySelector('.on').onclick = function () { subscribePush().then(function () { bar.style.display = 'none'; }); };
      bar.querySelector('.x').onclick = function () { try { localStorage.setItem('tana_push_dismiss', '1'); } catch (e) {} bar.style.display = 'none'; };
      bar.style.display = 'flex';
    }
    // ログイン済み（パスコード保存済み）のとき、スプラッシュが消えた後に案内。
    setTimeout(maybeShowPushBar, 3500);
  })();
</script>
</body>
</html>
