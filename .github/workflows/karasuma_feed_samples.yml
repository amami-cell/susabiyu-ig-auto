name: karasuma-feed-samples
# 烏丸すさび湯フィード投稿画像の3案サンプルを実データで焼いて永続CDN(jsDelivr)へ上げる（投稿しない）。
# ログの [FEEDSAMPLE] ... -> URL / FEED SAMPLES(JSON) を見れば各案のサンプル画像が確認できる。
on:
  workflow_dispatch:
    inputs:
      n_dishes:
        description: "サンプルに使う料理数（各料理×各案を焼く）"
        required: false
        default: "2"
      feed_set:
        description: "デザインセット（空=3案 / tate=案①ファミリー）"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: susabiyu-remotion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python deps
        run: pip install google-api-python-client google-auth Pillow numpy requests boto3
      - name: Install 日本語フォント（明朝/ゴシック）
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk fonts-ipafont-mincho fonts-ipafont-gothic
      - name: Write creds.json
        run: echo "$GOOGLE_CREDS_B64" | base64 -d > creds.json
        env:
          GOOGLE_CREDS_B64: ${{ secrets.GOOGLE_CREDS_B64 }}
      - name: 3案サンプルを焼いてCDNへ
        env:
          N_DISHES: ${{ github.event.inputs.n_dishes }}
          FEED_SET: ${{ github.event.inputs.feed_set }}
          GENRE_FOOD_ID: "1viSmFmc2W9fDrfUENffYwTDTf124ekW0"
          GH_MEDIA_TOKEN: ${{ secrets.GH_MEDIA_TOKEN }}
          GH_MEDIA_REPO: ${{ secrets.GH_MEDIA_REPO }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
        run: python karasuma_feed_samples.py creds.json
