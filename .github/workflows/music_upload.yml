name: susabiyu-music-upload
on:
  push:
    branches:
      - claude/epic-maxwell-mj7dkg
    paths:
      - '.github/workflows/music_upload.yml'
jobs:
  music-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: susabiyu-remotion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python deps
        run: pip install google-api-python-client google-auth
      - name: Write creds.json
        run: echo "$GOOGLE_CREDS_B64" | base64 -d > creds.json
        env:
          GOOGLE_CREDS_B64: ${{ secrets.GOOGLE_CREDS_B64 }}
      - name: Upload current music to Drive
        env:
          GENRE_MUSIC_UPTEMPO_ID: ${{ secrets.GENRE_MUSIC_UPTEMPO_ID }}
          GENRE_MUSIC_NORMAL_ID: ${{ secrets.GENRE_MUSIC_NORMAL_ID }}
        run: |
          python - <<'PY'
          import os
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          scopes = ["https://www.googleapis.com/auth/drive"]
          creds = service_account.Credentials.from_service_account_file("creds.json", scopes=scopes)
          drive = build("drive", "v3", credentials=creds)

          def existing(fid):
              names = {}
              page = None
              while True:
                  r = drive.files().list(q="'%s' in parents and trashed=false" % fid,
                      fields="nextPageToken, files(id,name)", pageSize=100, pageToken=page,
                      supportsAllDrives=True, includeItemsFromAllDrives=True).execute()
                  for f in r.get("files", []):
                      names[f["name"]] = f["id"]
                  page = r.get("nextPageToken")
                  if not page:
                      break
              return names

          EXT = (".mp3", ".m4a", ".wav")
          targets = [
              ("public/music/uptempo", os.environ.get("GENRE_MUSIC_UPTEMPO_ID"), "uptempo"),
              ("public/music/normal",  os.environ.get("GENRE_MUSIC_NORMAL_ID"),  "normal"),
          ]
          for local_dir, fid, label in targets:
              print("=== %s (folder %s) ===" % (label, fid))
              if not fid:
                  print("  [SKIP] folder id not set")
                  continue
              have = existing(fid)
              print("  existing in Drive:", sorted(have.keys()))
              if not os.path.isdir(local_dir):
                  print("  [SKIP] no local dir", local_dir)
                  continue
              for name in sorted(os.listdir(local_dir)):
                  if not name.lower().endswith(EXT):
                      continue
                  if name in have:
                      print("  [EXISTS] %s -> skip" % name)
                      continue
                  path = os.path.join(local_dir, name)
                  media = MediaFileUpload(path, resumable=True)
                  meta = {"name": name, "parents": [fid]}
                  try:
                      f = drive.files().create(body=meta, media_body=media,
                          fields="id,name", supportsAllDrives=True).execute()
                      print("  [UPLOADED] %s (%s)" % (f["name"], f["id"]))
                  except Exception as e:
                      print("  [ERR] upload %s: %r" % (name, e))
          print("=== verify ===")
          for local_dir, fid, label in targets:
              if not fid:
                  continue
              names = existing(fid)
              print("  %s now has %d files: %s" % (label, len(names), sorted(names.keys())))
          PY
