name: susabiyu-list-cats
# 汎用の手動確認ワークフロー（main登録済み＝branch refでも dispatch 可能なため流用）。
# 現在の用途: ナガグツのフィード投稿画像テンプレ（4:5・複数デザイン候補）を静止画レンダリングして
# 永続CDNへ納品し、確認アプリの見本「画像」タブ用の FEED SAMPLES(JSON) をログに出す。投稿はしない。
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  list-cats:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: susabiyu-remotion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python deps
        run: pip install google-api-python-client google-auth requests Pillow boto3 numpy
      - name: Install Node deps
        run: npm ci
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Write creds.json
        run: echo "$GOOGLE_CREDS_B64" | base64 -d > creds.json
        env:
          GOOGLE_CREDS_B64: ${{ secrets.GOOGLE_CREDS_B64 }}
      - name: Render feed patterns (nagagutsu)
        env:
          STORE_ACCOUNT: nagagutsu
          GOOGLE_CREDS_B64: ${{ secrets.GOOGLE_CREDS_B64 }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GH_MEDIA_TOKEN: ${{ secrets.GH_MEDIA_TOKEN }}
          GH_MEDIA_REPO: ${{ secrets.GH_MEDIA_REPO }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
        run: python render_feed.py creds.json
