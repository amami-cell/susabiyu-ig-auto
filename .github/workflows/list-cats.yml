name: susabiyu-list-cats
on:
  workflow_dispatch: {}
jobs:
  list-cats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: susabiyu-remotion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python deps
        run: pip install google-api-python-client google-auth
      - name: Write creds.json
        run: echo "$GOOGLE_CREDS_B64" | base64 -d > creds.json
        env:
          GOOGLE_CREDS_B64: ${{ secrets.GOOGLE_CREDS_B64 }}
      - name: List categories
        run: python list_cats.py creds.json
      - name: List dishes (nagagutsu)
        env:
          STORE_ACCOUNT: nagagutsu
        run: python list_dishes.py creds.json
