name: recruit-scorecard
# 店舗別スコアカードを週1で各店長へ配信する。
# ?scorecard=1 で店舗ごとのカードを通知キュー(_Push送信待ち)へ積み、
# recruit_push.py がドレインして「購読者ごとの店舗prefs」で各店長に振り分けて送る。
# LINEは店舗別カードを含めない設計（個人向けのため）。手動実行(workflow_dispatch)も可。
on:
  schedule:
    - cron: '0 0 * * 1'    # JST 月曜 9:00
  workflow_dispatch:
jobs:
  scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: entrypocket-recruit/push
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python deps
        run: pip install pywebpush google-api-python-client google-auth requests cryptography
      - name: Write creds.json
        run: echo "$GOOGLE_CREDS_B64" | base64 -d > creds.json
        env:
          GOOGLE_CREDS_B64: ${{ secrets.GOOGLE_CREDS_B64 }}
      - name: Enqueue store scorecards
        env:
          RECRUIT_EXEC_URL: ${{ secrets.RECRUIT_EXEC_URL }}
          EP_PUSH_KEY: ${{ secrets.EP_PUSH_KEY }}
        run: |
          export RECRUIT_EXEC_URL="${RECRUIT_EXEC_URL:-https://script.google.com/macros/s/AKfycbz6i36c7UjbM3S44kl1kEcsI0CSjYo9jL-W-T4BJUAr9jmBlVXj-vnQTUwQbGoxcHYT/exec}"
          curl -sSL "$RECRUIT_EXEC_URL?scorecard=1&key=$EP_PUSH_KEY"; echo
      - name: Send (drain queue -> per-store push)
        env:
          RECRUIT_EXEC_URL: ${{ secrets.RECRUIT_EXEC_URL }}
          EP_PUSH_KEY: ${{ secrets.EP_PUSH_KEY }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
        run: |
          export RECRUIT_EXEC_URL="${RECRUIT_EXEC_URL:-https://script.google.com/macros/s/AKfycbz6i36c7UjbM3S44kl1kEcsI0CSjYo9jL-W-T4BJUAr9jmBlVXj-vnQTUwQbGoxcHYT/exec}"
          python recruit_push.py
