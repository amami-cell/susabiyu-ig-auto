name: susabiyu-patterns-status
# いま「採用(GO)」になっている投稿パターン数を、パターンタブ(enabled列)から読み出して表示するだけ。
# 手動実行のみ（cronなし・シートは変更しない・読み取り専用）。
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: susabiyu-remotion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install google-api-python-client google-auth requests
      - name: Write creds.json
        run: echo "$GOOGLE_CREDS_B64" | base64 -d > creds.json
        env:
          GOOGLE_CREDS_B64: ${{ secrets.GOOGLE_CREDS_B64 }}
      - name: 採用(GO)パターン数を表示
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: |
          python - <<'PY'
          import decide_post as D
          v, s = D._enabled_patterns()   # [ENABLED] 採用動画/採用画像 を内部でprint
          LAB = D.LABEL
          print("==== 採用(GO)状況 ====")
          print("動画(リール/ストーリー) %d種: %s" % (len(v), "、".join(LAB.get(k,k) for k in v)))
          print("画像(フィード)         %d種: %s" % (len(s), "、".join(LAB.get(k,k) for k in s)))
          print("合計 %d種" % (len(v)+len(s)))
          # --- 成績で自動重み付け（A1）＆ 曜日別ベスト時間（A2）の可視化 ---
          try:
              import perf
              sc = perf.pattern_scores(set(D.ALL))
              if sc:
                  print("\n==== 成績の重み(倍率・高い順) ====")
                  for k, w in sorted(sc.items(), key=lambda x: -x[1]):
                      print("  %s : x%.2f" % (LAB.get(k, k), w))
              else:
                  print("\n[成績] まだデータ不足→均等運用（探索中）")
              wd = ["月","火","水","木","金","土","日"]
              bh = perf.best_hours_by_weekday()
              if bh:
                  print("\n==== 曜日別“伸びる時間帯”(平均リーチ) ====")
                  for d in range(7):
                      if d in bh:
                          cells = " / ".join("%d時:%.0f" % (h, a) for h, a in bh[d][:4])
                          print("  %s: %s" % (wd[d], cells))
                  print("※現状は学習のみ表示。スケジュール自動変更はデータが十分＆GOをもらってから。")
              else:
                  print("[時間帯] まだデータ不足→現状の固定時間のまま")
              tg = perf.tag_performance()
              if tg:
                  print("\n==== ハッシュタグ成績(平均リーチ・上位/下位) ====")
                  print("  ◎効いてる:", "  ".join("%s(%.0f/%d回)" % (t, a, n) for t, a, n in tg[:8]))
                  print("  △弱い    :", "  ".join("%s(%.0f/%d回)" % (t, a, n) for t, a, n in tg[-5:]))
                  print("※編集はアプリのハッシュタグ編集で。下位タグを差し替えるとリーチ改善が見込めます。")
              else:
                  print("[タグ] まだデータ不足→評価は保留")
          except Exception as e:
              print("[perf] 集計スキップ:", e)
          PY
