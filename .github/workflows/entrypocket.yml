name: エントリーポケット取得

# 毎朝8:00 JST（= 前日23:00 UTC）+ 手動更新 + ダッシュボードの更新ボタン
on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [ep-refresh]

concurrency:
  group: entrypocket
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: entrypocket-recruit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 依存インストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Playwright(Chromium)導入
        run: python -m playwright install --with-deps chromium

      - name: 取得・蓄積
        env:
          EP_USER: ${{ secrets.EP_USER }}
          EP_PASS: ${{ secrets.EP_PASS }}
          EP_LOGIN_URL: ${{ secrets.EP_LOGIN_URL }}
          EP_APPLICANT_URL: ${{ secrets.EP_APPLICANT_URL }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          HEADLESS: "1"
          # schedule 起動なら auto、それ以外は manual
          EP_TRIGGER: ${{ github.event_name == 'schedule' && 'auto' || 'manual' }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python -m src.main

      - name: スクリーンショット等を保存（失敗時の調査用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ github.run_id }}
          path: entrypocket-recruit/artifacts/
          if-no-files-found: ignore
          retention-days: 14
