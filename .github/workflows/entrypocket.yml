name: エントリーポケット取得

# 毎朝8:00 JST（= 前日23:00 UTC）+ 手動更新 + ダッシュボードの更新ボタン
on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [ep-refresh]

concurrency:
  group: entrypocket
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: entrypocket-recruit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 診断（IPブロックかパス別かを切り分け）
        if: always()
        continue-on-error: true
        run: |
          echo "===== このランナーのIP / 国 ====="
          curl -sS --max-time 20 https://ipinfo.io/json || true
          echo
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
          echo "===== 複数URLのHTTPステータス（ブラウザUA） ====="
          for u in \
            "https://manage.entrypocket.jp/" \
            "https://manage.entrypocket.jp/login" \
            "https://manage.entrypocket.jp/web/-/login" \
            "https://manage.entrypocket.jp/c/portal/login" ; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" -L --max-time 30 \
              -A "$UA" -H "Accept-Language: ja-JP,ja;q=0.9" "$u" 2>/dev/null || echo "ERR")
            echo "  [$code] $u"
          done
          echo "===== /login の本文先頭400字 ====="
          curl -sS -L --max-time 30 -A "$UA" -H "Accept-Language: ja-JP,ja;q=0.9" \
            "https://manage.entrypocket.jp/login" 2>/dev/null | head -c 400 || true
          echo

      - name: 依存インストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Playwright(Chromium)導入
        run: python -m playwright install --with-deps chromium

      - name: 取得・蓄積
        env:
          EP_USER: ${{ secrets.EP_USER }}
          EP_PASS: ${{ secrets.EP_PASS }}
          EP_LOGIN_URL: ${{ secrets.EP_LOGIN_URL }}
          EP_APPLICANT_URL: ${{ secrets.EP_APPLICANT_URL }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          HEADLESS: "1"
          # schedule 起動なら auto、それ以外は manual
          EP_TRIGGER: ${{ github.event_name == 'schedule' && 'auto' || 'manual' }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python -m src.main

      - name: スクリーンショット等を保存（失敗時の調査用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ github.run_id }}
          path: entrypocket-recruit/artifacts/
          if-no-files-found: ignore
          retention-days: 14
