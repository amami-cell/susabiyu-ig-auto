name: susabiyu-sheet-dedup
on:
  push:
    branches:
      - claude/epic-maxwell-mj7dkg
    paths:
      - '.github/workflows/sheet_dedup.yml'
jobs:
  dedup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: susabiyu-remotion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python deps
        run: pip install google-api-python-client google-auth
      - name: Write creds.json
        run: echo "$GOOGLE_CREDS_B64" | base64 -d > creds.json
        env:
          GOOGLE_CREDS_B64: ${{ secrets.GOOGLE_CREDS_B64 }}
      - name: Dedup 承認待ち rows for 2026-06-27
        run: |
          python - <<'PY'
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          SHEET_ID = "13zKaUblOwmgZ-lgCfxylCLlW2Fqutqct5h5TvMRWv30"
          TAB = "承認待ち"
          DATE = "2026-06-27"
          KEEP = ("posted", "approved")
          DELETABLE = ("pending", "")
          scopes = ["https://www.googleapis.com/auth/spreadsheets"]
          creds = service_account.Credentials.from_service_account_file("creds.json", scopes=scopes)
          svc = build("sheets", "v4", credentials=creds)
          sh = svc.spreadsheets()

          meta = sh.get(spreadsheetId=SHEET_ID, fields="sheets(properties(sheetId,title))").execute()
          gid = None
          for s in meta.get("sheets", []):
              if s["properties"]["title"] == TAB:
                  gid = s["properties"]["sheetId"]
          print("tab gid:", gid)
          if gid is None:
              raise SystemExit("tab not found")

          data = sh.values().get(spreadsheetId=SHEET_ID, range=TAB + "!A:K").execute().get("values", [])
          groups = {}
          for i, r in enumerate(data):
              if i == 0:
                  continue
              when = str(r[1]) if len(r) > 1 else ""
              if not when.startswith(DATE):
                  continue
              token = r[0] if len(r) > 0 else ""
              status = (r[7] if len(r) > 7 else "") or ""
              groups.setdefault(token, []).append((i, status))  # i = 0-based row index

          to_delete = []  # 0-based indices
          for token, rows in groups.items():
              if len(rows) <= 1:
                  continue
              keeper = None
              for idx, st in rows:
                  if st in KEEP:
                      keeper = idx
                      break
              if keeper is None:
                  keeper = min(idx for idx, _ in rows)
              for idx, st in rows:
                  if idx == keeper:
                      continue
                  if st in DELETABLE:
                      to_delete.append(idx)
                      print("PLAN delete row %d (token=%s status=%r) | keep row %d" % (idx + 1, token, st, keeper + 1))
                  else:
                      print("SKIP row %d (token=%s status=%r) NOT deletable" % (idx + 1, token, st))

          if not to_delete:
              print("nothing to delete")
          else:
              reqs = [{"deleteDimension": {"range": {
                  "sheetId": gid, "dimension": "ROWS",
                  "startIndex": idx, "endIndex": idx + 1}}}
                  for idx in sorted(to_delete, reverse=True)]  # bottom-up
              sh.batchUpdate(spreadsheetId=SHEET_ID, body={"requests": reqs}).execute()
              print("DELETED rows (1-based):", sorted([i + 1 for i in to_delete]))

          print("--- after: 2026-06-27 rows ---")
          data2 = sh.values().get(spreadsheetId=SHEET_ID, range=TAB + "!A:K").execute().get("values", [])
          for i, r in enumerate(data2):
              if i == 0:
                  continue
              when = str(r[1]) if len(r) > 1 else ""
              if when.startswith(DATE):
                  print("row %d | token=%s | when=%s | status=%s"
                        % (i + 1, (r[0] if len(r) > 0 else ""), when, (r[7] if len(r) > 7 else "")))
          PY
