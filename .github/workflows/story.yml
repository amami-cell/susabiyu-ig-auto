name: Auto Story Post
on:
  schedule:
    - cron: '0 1 * * *'   # 10:00 JST (OPEN前)
    - cron: '0 10 * * *'  # 19:00 JST
    - cron: '0 12 * * *'  # 21:00 JST
  workflow_dispatch: {}    # 手動実行も可能

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Install Python deps
        run: pip install google-api-python-client google-auth requests
      - name: Run auto story
        env:
          GOOGLE_CREDS_B64: ${{ secrets.GOOGLE_CREDS_B64 }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GENRE_FOOD_ID: ${{ secrets.GENRE_FOOD_ID }}
          GENRE_SAKE_ID: ${{ secrets.GENRE_SAKE_ID }}
          GENRE_INTERIOR_ID: ${{ secrets.GENRE_INTERIOR_ID }}
          GENRE_EVENT_ID: ${{ secrets.GENRE_EVENT_ID }}
        run: python auto_story_cloud.py
