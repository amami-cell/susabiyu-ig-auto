name: recruit-webpush-test
# 動作確認専用（手動実行のみ）。テスト通知を1件キューに積んで即送信する。
# LINE公式アカウントの友だち全員＋PWA購読者全員に「🔔 テスト通知」が届く点に注意。
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: entrypocket-recruit/push
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python deps
        run: pip install pywebpush google-api-python-client google-auth requests cryptography
      - name: Write creds.json
        run: echo "$GOOGLE_CREDS_B64" | base64 -d > creds.json
        env:
          GOOGLE_CREDS_B64: ${{ secrets.GOOGLE_CREDS_B64 }}
      - name: Enqueue a test notification, then send
        env:
          RECRUIT_EXEC_URL: ${{ secrets.RECRUIT_EXEC_URL }}
          EP_PUSH_KEY: ${{ secrets.EP_PUSH_KEY }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
        run: |
          export RECRUIT_EXEC_URL="${RECRUIT_EXEC_URL:-https://script.google.com/macros/s/AKfycbz6i36c7UjbM3S44kl1kEcsI0CSjYo9jL-W-T4BJUAr9jmBlVXj-vnQTUwQbGoxcHYT/exec}"
          echo "--- テスト通知をキューに投入 ---"
          curl -sSL "$RECRUIT_EXEC_URL?push=test&key=$EP_PUSH_KEY" ; echo
          echo "--- 送信役を実行（drain + 送信） ---"
          python recruit_push.py
