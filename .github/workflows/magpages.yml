name: magpages
# No.11 雑誌ストーリーの「商品ページ」デザイン提案10案を静止画で書き出して永続CDNへ納品する。
# 同じ料理・同じ紙で10案を並べ、どの組み方にするかを選んでもらうための比較用。投稿はしない。
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  magpages:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: susabiyu-remotion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          # npm の依存をキャッシュ（npm ci の待ちを削る）
          cache: 'npm'
          cache-dependency-path: susabiyu-remotion/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python deps
        run: pip install google-api-python-client google-auth requests Pillow boto3 numpy rembg onnxruntime
      - name: Install Node deps
        run: npm ci
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Write creds.json
        run: echo "$GOOGLE_CREDS_B64" | base64 -d > creds.json
        env:
          GOOGLE_CREDS_B64: ${{ secrets.GOOGLE_CREDS_B64 }}
      - name: Render 商品ページ案10種 (nagagutsu)
        env:
          STORE_ACCOUNT: nagagutsu
          # 見本(フィード画像)づくりも「使った」に数えない。
          USAGE_SKIP: "1"
          GOOGLE_CREDS_B64: ${{ secrets.GOOGLE_CREDS_B64 }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GH_MEDIA_TOKEN: ${{ secrets.GH_MEDIA_TOKEN }}
          GH_MEDIA_REPO: ${{ secrets.GH_MEDIA_REPO }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
        run: python render_magpages.py creds.json
