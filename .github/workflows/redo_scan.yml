name: susabiyu-redo-scan
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'   # 30分ごとに redo枠を確実に処理（GAS→GitHub起動に依存しない安全網）
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: susabiyu-remotion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python deps (軽量チェック用)
        run: pip install google-api-python-client google-auth requests jpholiday Pillow boto3 pywebpush
      - name: Write creds.json
        run: echo "$GOOGLE_CREDS_B64" | base64 -d > creds.json
        env:
          GOOGLE_CREDS_B64: ${{ secrets.GOOGLE_CREDS_B64 }}
      - name: Check redo rows (軽量・renderせず件数だけ)
        id: chk
        env:
          GOOGLE_CREDS_B64: ${{ secrets.GOOGLE_CREDS_B64 }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python post_approved.py creds.json redo-check
      - name: Setup Node (redoがある時だけ)
        if: steps.chk.outputs.redo != '0' && steps.chk.outputs.redo != ''
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Node deps (redoがある時だけ)
        if: steps.chk.outputs.redo != '0' && steps.chk.outputs.redo != ''
        run: npm ci
      - name: Install ffmpeg (redoがある時だけ)
        if: steps.chk.outputs.redo != '0' && steps.chk.outputs.redo != ''
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Run redo scan (redoがある時だけ・必ず作り直す)
        if: steps.chk.outputs.redo != '0' && steps.chk.outputs.redo != ''
        env:
          GOOGLE_CREDS_B64: ${{ secrets.GOOGLE_CREDS_B64 }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GENRE_FOOD_ID: ${{ secrets.GENRE_FOOD_ID }}
          GENRE_SAKE_ID: ${{ secrets.GENRE_SAKE_ID }}
          GENRE_INTERIOR_ID: ${{ secrets.GENRE_INTERIOR_ID }}
          GENRE_EVENT_ID: ${{ secrets.GENRE_EVENT_ID }}
          GENRE_MUSIC_UPTEMPO_ID: ${{ secrets.GENRE_MUSIC_UPTEMPO_ID }}
          GENRE_MUSIC_NORMAL_ID: ${{ secrets.GENRE_MUSIC_NORMAL_ID }}
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
          GH_MEDIA_TOKEN: ${{ secrets.GH_MEDIA_TOKEN }}
          GH_MEDIA_REPO: ${{ secrets.GH_MEDIA_REPO }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          PWA_URL: ${{ secrets.PWA_URL }}
        run: python post_approved.py creds.json redo-scan
