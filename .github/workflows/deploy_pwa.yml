name: deploy-pwa
on:
  workflow_dispatch:
    inputs:
      publish_lp:
        description: "1=予約LP(pwa/sanjo.html)を amami-cell.github.io/<slug> に公開（新規リポ作成＋Pages有効化）"
        required: false
        default: "0"
      lp_slug:
        description: "公開先リポ名（＝URLの頭に出る文字。既定 yoyaku）"
        required: false
        default: "yoyaku"
      lp_file:
        description: "公開するLPファイル（既定 pwa/sanjo.html）"
        required: false
        default: "pwa/sanjo.html"
  push:
    branches: [ main ]
    paths: [ 'pwa/**', '.github/workflows/deploy_pwa.yml' ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject GAS URL into config.js
        env:
          GAS_EXEC_URL: ${{ secrets.GAS_EXEC_URL }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
          GIFUYA_GAS_EXEC_URL: ${{ secrets.GIFUYA_GAS_EXEC_URL }}
          GH_MEDIA_REPO: ${{ secrets.GH_MEDIA_REPO }}
        run: |
          if [ -n "$GAS_EXEC_URL" ]; then
            sed -i "s#PASTE_YOUR_GAS_EXEC_URL_HERE#${GAS_EXEC_URL}#" pwa/config.js
            echo "GAS URL injected."
          else
            echo "WARNING: GAS_EXEC_URL secret is empty; app will not connect until set."
          fi
          # 素材ギャラリーが clips/index.json を読むための公開メディアリポ("owner/repo")
          if [ -n "$GH_MEDIA_REPO" ]; then
            sed -i "s#PASTE_MEDIA_REPO_HERE#${GH_MEDIA_REPO}#" pwa/config.js
            echo "MEDIA_REPO injected."
          else
            echo "INFO: GH_MEDIA_REPO not set; gallery stays in 準備中 mode."
          fi
          if [ -n "$R2_PUBLIC_BASE" ]; then
            sed -i "s#PASTE_MEDIA_BASE_HERE#${R2_PUBLIC_BASE%/}#" pwa/config.js
            echo "MEDIA_BASE injected."
          fi
          # ぎふや福岡天神：専用GASのURLが設定されていれば注入（未設定なら見本モードのまま）
          if [ -n "$GIFUYA_GAS_EXEC_URL" ]; then
            sed -i "s#PASTE_GIFUYA_GAS_EXEC_URL_HERE#${GIFUYA_GAS_EXEC_URL}#" pwa/config.gifuya.js
            echo "GIFUYA GAS URL injected (live)."
          else
            echo "INFO: GIFUYA_GAS_EXEC_URL not set; gifuya stays in 見本(demo) mode."
          fi
          if [ -n "$R2_PUBLIC_BASE" ]; then
            sed -i "s#PASTE_MEDIA_BASE_HERE#${R2_PUBLIC_BASE%/}#" pwa/config.gifuya.js
          fi
          # ナガグツ：GASは共有GAS(config内にハードコード)。メディアベースだけ注入。
          if [ -n "$R2_PUBLIC_BASE" ] && [ -f pwa/config.nagagutsu.js ]; then
            sed -i "s#PASTE_MEDIA_BASE_HERE#${R2_PUBLIC_BASE%/}#" pwa/config.nagagutsu.js
          fi
      - name: 公開フロントを難読化（コメント除去＋本格minify＝作り方を読み取られにくく）
        run: |
          cd pwa
          # JS: 変数名まで潰す本格minify。app.jsはIIFE内＝外部接点はwindowプロパティのみで安全。
          for f in app.js sw.js config.js; do
            if [ -f "$f" ]; then
              npx -y terser "$f" --compress --mangle --comments false -o "$f.tmp" \
                && mv "$f.tmp" "$f" && echo "minified $f" \
                || echo "skip $f (terser失敗・元のまま継続)"
            fi
          done
          # HTML: コメント削除＋CSSコメント削除（崩れ防止のため空白圧縮・JS圧縮はしない）
          for h in index.html reels.html gifuya_reels.html gifuyatenjin.html nagagutsu_reels.html nagagutsu.html; do
            if [ -f "$h" ]; then
              npx -y html-minifier-terser "$h" --remove-comments --minify-css -o "$h.tmp" \
                && mv "$h.tmp" "$h" && echo "stripped $h" \
                || echo "skip $h (継続)"
            fi
          done
      - name: Publish pwa/ to public site repo (app/ subfolder)
        env:
          TOKEN: ${{ secrets.GH_MEDIA_TOKEN }}
          MEDIA_REPO: ${{ secrets.GH_MEDIA_REPO }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$MEDIA_REPO" ]; then
            echo "ERROR: GH_MEDIA_TOKEN / GH_MEDIA_REPO not set"; exit 1
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${MEDIA_REPO}.git" _site
          rm -rf _site/app
          mkdir -p _site/app
          cp -r pwa/. _site/app/
          touch _site/.nojekyll
          cd _site
          git add app .nojekyll
          if git diff --cached --quiet; then
            echo "No changes to deploy."; exit 0
          fi
          git commit -m "deploy PWA app"
          git push
          echo "Deployed. Pages URL (after enabling Pages): https://${MEDIA_REPO%%/*}.github.io/${MEDIA_REPO#*/}/app/"
      - name: 予約LPを独自スラッグのGitHub Pagesへ公開（publish_lp=1のときだけ）
        # インスタのプロフィールリンクを「amami-cell.github.io/<slug>」に。独立リポなので
        # 毎日のapp再デプロイで消えない（＝404の再発防止）。LPは画像を全て内蔵し自己完結。
        if: ${{ github.event.inputs.publish_lp == '1' }}
        env:
          TOKEN: ${{ secrets.GH_MEDIA_TOKEN }}
          OWNER: amami-cell
          SLUG: ${{ github.event.inputs.lp_slug }}
          LP: ${{ github.event.inputs.lp_file }}
        run: |
          set -e
          SLUG="${SLUG:-yoyaku}"; LP="${LP:-pwa/sanjo.html}"
          API=https://api.github.com
          if [ ! -f "$LP" ]; then echo "ERROR: $LP が無い"; exit 1; fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # 1) 公開先リポが無ければ public で作成
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: token $TOKEN" "$API/repos/$OWNER/$SLUG")
          if [ "$code" != "200" ]; then
            echo "creating public repo $OWNER/$SLUG"
            curl -s -X POST -H "Authorization: token $TOKEN" -H "Accept: application/vnd.github+json" \
              "$API/user/repos" \
              -d "{\"name\":\"$SLUG\",\"private\":false,\"description\":\"予約・アクセスLP（Instagramプロフィールリンク）\",\"auto_init\":true}" \
              -o /tmp/repo.json -w "create repo: %{http_code}\n"
            sleep 5
          fi
          # 2) LP を index.html として push（自己完結HTMLなので画像依存なし）
          rm -rf _lp
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/$OWNER/$SLUG.git" _lp
          cp "$LP" _lp/index.html
          touch _lp/.nojekyll
          cd _lp
          git add index.html .nojekyll
          if git diff --cached --quiet; then
            echo "LP に変更なし"
          else
            git commit -m "予約LPを公開（index.html）"
            git push origin HEAD:main
          fi
          cd ..
          # 3) GitHub Pages を有効化（source=main /）。既に有効なら409＝無視。
          curl -s -X POST -H "Authorization: token $TOKEN" -H "Accept: application/vnd.github+json" \
            "$API/repos/$OWNER/$SLUG/pages" -d '{"source":{"branch":"main","path":"/"}}' \
            -o /dev/null -w "pages enable: %{http_code}\n" || true
          echo "==== 公開URL（数分で有効化）: https://$OWNER.github.io/$SLUG/ ===="
