name: deploy-pwa
on:
  workflow_dispatch:
    inputs:
      publish_lp:
        description: "1=予約LPを <owner>.github.io/<store>/ に公開（新規リポ作成＋Pages有効化）"
        required: false
        default: "0"
      lp_owner:
        description: "公開先の GitHub 組織/ユーザー名（＝URLの頭。例 yoyaku-pocket）"
        required: false
        default: "yoyaku-pocket"
      lp_owner_kind:
        description: "org（組織）/ user（個人）"
        required: false
        default: "org"
      lp_store:
        description: "店舗サブフォルダ（例 susabiyu → <owner>.github.io/susabiyu/）。空=ルート"
        required: false
        default: "susabiyu"
      lp_file:
        description: "公開するLPファイル（既定 pwa/sanjo.html）"
        required: false
        default: "pwa/sanjo.html"
  push:
    branches: [ main ]
    paths: [ 'pwa/**', '.github/workflows/deploy_pwa.yml' ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject GAS URL into config.js
        env:
          GAS_EXEC_URL: ${{ secrets.GAS_EXEC_URL }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
          GIFUYA_GAS_EXEC_URL: ${{ secrets.GIFUYA_GAS_EXEC_URL }}
          GH_MEDIA_REPO: ${{ secrets.GH_MEDIA_REPO }}
        run: |
          if [ -n "$GAS_EXEC_URL" ]; then
            sed -i "s#PASTE_YOUR_GAS_EXEC_URL_HERE#${GAS_EXEC_URL}#" pwa/config.js
            echo "GAS URL injected."
          else
            echo "WARNING: GAS_EXEC_URL secret is empty; app will not connect until set."
          fi
          # 素材ギャラリーが clips/index.json を読むための公開メディアリポ("owner/repo")
          if [ -n "$GH_MEDIA_REPO" ]; then
            sed -i "s#PASTE_MEDIA_REPO_HERE#${GH_MEDIA_REPO}#" pwa/config.js
            echo "MEDIA_REPO injected."
          else
            echo "INFO: GH_MEDIA_REPO not set; gallery stays in 準備中 mode."
          fi
          if [ -n "$R2_PUBLIC_BASE" ]; then
            sed -i "s#PASTE_MEDIA_BASE_HERE#${R2_PUBLIC_BASE%/}#" pwa/config.js
            echo "MEDIA_BASE injected."
          fi
          # ぎふや福岡天神：専用GASのURLが設定されていれば注入（未設定なら見本モードのまま）
          if [ -n "$GIFUYA_GAS_EXEC_URL" ]; then
            sed -i "s#PASTE_GIFUYA_GAS_EXEC_URL_HERE#${GIFUYA_GAS_EXEC_URL}#" pwa/config.gifuya.js
            echo "GIFUYA GAS URL injected (live)."
          else
            echo "INFO: GIFUYA_GAS_EXEC_URL not set; gifuya stays in 見本(demo) mode."
          fi
          if [ -n "$R2_PUBLIC_BASE" ]; then
            sed -i "s#PASTE_MEDIA_BASE_HERE#${R2_PUBLIC_BASE%/}#" pwa/config.gifuya.js
          fi
          # ナガグツ：GASは共有GAS(config内にハードコード)。メディアベースだけ注入。
          if [ -n "$R2_PUBLIC_BASE" ] && [ -f pwa/config.nagagutsu.js ]; then
            sed -i "s#PASTE_MEDIA_BASE_HERE#${R2_PUBLIC_BASE%/}#" pwa/config.nagagutsu.js
          fi
          # GOLD京都ポルタ：同上（共有GAS・メディアベースのみ注入）
          if [ -n "$R2_PUBLIC_BASE" ] && [ -f pwa/config.goldporta.js ]; then
            sed -i "s#PASTE_MEDIA_BASE_HERE#${R2_PUBLIC_BASE%/}#" pwa/config.goldporta.js
          fi
      - name: 公開フロントを難読化（コメント除去＋本格minify＝作り方を読み取られにくく）
        run: |
          cd pwa
          # JS: 変数名まで潰す本格minify。app.jsはIIFE内＝外部接点はwindowプロパティのみで安全。
          for f in app.js sw.js config.js; do
            if [ -f "$f" ]; then
              npx -y terser "$f" --compress --mangle --comments false -o "$f.tmp" \
                && mv "$f.tmp" "$f" && echo "minified $f" \
                || echo "skip $f (terser失敗・元のまま継続)"
            fi
          done
          # HTML: コメント削除＋CSSコメント削除（崩れ防止のため空白圧縮・JS圧縮はしない）
          for h in index.html reels.html gifuya_reels.html gifuyatenjin.html nagagutsu_reels.html nagagutsu.html goldporta_reels.html goldporta.html; do
            if [ -f "$h" ]; then
              npx -y html-minifier-terser "$h" --remove-comments --minify-css -o "$h.tmp" \
                && mv "$h.tmp" "$h" && echo "stripped $h" \
                || echo "skip $h (継続)"
            fi
          done
      - name: Publish pwa/ to public site repo (app/ subfolder)
        env:
          TOKEN: ${{ secrets.GH_MEDIA_TOKEN }}
          MEDIA_REPO: ${{ secrets.GH_MEDIA_REPO }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$MEDIA_REPO" ]; then
            echo "ERROR: GH_MEDIA_TOKEN / GH_MEDIA_REPO not set"; exit 1
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${MEDIA_REPO}.git" _site
          rm -rf _site/app
          mkdir -p _site/app
          cp -r pwa/. _site/app/
          touch _site/.nojekyll
          cd _site
          git add app .nojekyll
          if git diff --cached --quiet; then
            echo "No changes to deploy."; exit 0
          fi
          git commit -m "deploy PWA app"
          git push
          echo "Deployed. Pages URL (after enabling Pages): https://${MEDIA_REPO%%/*}.github.io/${MEDIA_REPO#*/}/app/"
      - name: 予約LPを店舗中立ドメインのGitHub Pagesへ公開（publish_lp=1のときだけ）
        # 例: yoyaku-pocket.github.io/susabiyu/ 。全店で共通の頭「yoyaku-pocket」＝予約用と分かる。
        # 組織の user/org pages リポ <owner>.github.io に、店ごとのサブフォルダで置く。
        # 独立リポなので毎日のapp再デプロイで消えない（404再発防止）。LPは画像内蔵の自己完結HTML。
        if: ${{ github.event.inputs.publish_lp == '1' }}
        env:
          # 新規リポ作成＋別リポへのpush＋Pages有効化には広い権限が要るため専用PATを使う。
          # GitHub Secret LP_DEPLOY_TOKEN = classic PAT（repo スコープ）。未登録なら分かるように停止。
          TOKEN: ${{ secrets.LP_DEPLOY_TOKEN }}
          OWNER: ${{ github.event.inputs.lp_owner }}
          KIND: ${{ github.event.inputs.lp_owner_kind }}
          STORE: ${{ github.event.inputs.lp_store }}
          LP: ${{ github.event.inputs.lp_file }}
        run: |
          set -e
          OWNER="${OWNER:-yoyaku-pocket}"; KIND="${KIND:-org}"; LP="${LP:-pwa/sanjo.html}"
          REPO="${OWNER}.github.io"          # user/org pages リポ（ルート配信）
          API=https://api.github.com
          if [ -z "$TOKEN" ]; then
            echo "ERROR: Secret LP_DEPLOY_TOKEN が未登録です（classic PAT・repoスコープを登録してください）"; exit 1
          fi
          if [ ! -f "$LP" ]; then echo "ERROR: $LP が無い"; exit 1; fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # 1) 公開先リポ <owner>.github.io が無ければ public で作成（組織/個人で作成先を切替）
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: token $TOKEN" "$API/repos/$OWNER/$REPO")
          if [ "$code" != "200" ]; then
            if [ "$KIND" = "user" ]; then CREATE="$API/user/repos"; else CREATE="$API/orgs/$OWNER/repos"; fi
            echo "creating public repo $OWNER/$REPO via $CREATE"
            curl -s -X POST -H "Authorization: token $TOKEN" -H "Accept: application/vnd.github+json" \
              "$CREATE" \
              -d "{\"name\":\"$REPO\",\"private\":false,\"description\":\"予約・アクセスLP（各店 Instagram プロフィールリンク）\",\"auto_init\":true}" \
              -o /tmp/repo.json -w "create repo: %{http_code}\n"
            sleep 5
          fi
          # 2) LP を <store>/index.html（storeが空ならルート index.html）として push
          rm -rf _lp
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/$OWNER/$REPO.git" _lp
          DEST="_lp"; [ -n "$STORE" ] && DEST="_lp/$STORE" && mkdir -p "$DEST"
          cp "$LP" "$DEST/index.html"
          touch _lp/.nojekyll
          cd _lp
          git add -A
          if git diff --cached --quiet; then
            echo "LP に変更なし"
          else
            git commit -m "予約LPを公開（${STORE:-root}/index.html）"
            git push origin HEAD:main
          fi
          cd ..
          # 3) GitHub Pages を有効化（source=main /）。既に有効なら409＝無視。
          curl -s -X POST -H "Authorization: token $TOKEN" -H "Accept: application/vnd.github+json" \
            "$API/repos/$OWNER/$REPO/pages" -d '{"source":{"branch":"main","path":"/"}}' \
            -o /dev/null -w "pages enable: %{http_code}\n" || true
          echo "==== 公開URL（数分で有効化）: https://$OWNER.github.io/${STORE:+$STORE/} ===="
