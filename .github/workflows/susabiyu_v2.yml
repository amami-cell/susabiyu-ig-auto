name: susabiyu-story-v2

on:
  schedule:
    - cron: "0 2 * * *"
    - cron: "0 7 * * *"
    - cron: "0 9 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      datetime:
        description: "テスト日時 例 2026-06-23 16:00 (空=現在)"
        required: false
        default: ""

jobs:
  post:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: susabiyu-remotion
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Chromium libs
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2 libpango-1.0-0 libcairo2 fonts-noto-cjk

      - name: Python deps
        run: pip install google-api-python-client google-auth jpholiday requests Pillow

      - name: Node deps
        run: npm ci || npm install

      - name: Run pipeline
        env:
          GOOGLE_CREDS_B64: ${{ secrets.GOOGLE_CREDS_B64 }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
        run: python run_post.py "${{ github.event.inputs.datetime }}"
