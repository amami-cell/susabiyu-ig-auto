name: deploy-gas

# entrypocket-recruit/gas/ を編集して push すると、GAS（Apps Script）へ自動反映する。
# 手貼り不要。必要な GitHub Secrets は 1件だけ:
#   EP_CLASPRC_JSON … clasp login で作られる ~/.clasprc.json の中身（丸ごと）＝ログイン情報
#                     （インスタ等の既存 CLASPRC_JSON とは別名。競合しない）
# スクリプトID / デプロイID は秘密ではないので下にベタ書き（必要なら同名Secretで上書き可）。
on:
  workflow_dispatch:
  push:
    branches: [ main, 'claude/**' ]
    paths:
      - 'entrypocket-recruit/gas/**'
      - '.github/workflows/deploy_gas.yml'

concurrency:
  group: deploy-gas
  cancel-in-progress: false

env:
  # 募集システム（求人進捗_エントリーポケット）の Apps Script
  DEFAULT_SCRIPT_ID: "1OuDuD9HShlXgSR4oyNrnKXOcsy0qOHvkfupAil9mB52PfUOLdhevBWVZ"
  # 公開Webアプリ（/exec）の既存デプロイ。ここを同じURLのまま更新する
  DEFAULT_DEPLOYMENT_ID: "AKfycbz6i36c7UjbM3S44kl1kEcsI0CSjYo9jL-W-T4BJUAr9jmBlVXj-vnQTUwQbGoxcHYT"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: entrypocket-recruit/gas
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: clasp を導入（v2 で認証情報フォーマットを固定）
        run: npm i -g @google/clasp@2.4.2

      - name: 認証情報を書き込む（clasp login のトークン）
        env:
          EP_CLASPRC_JSON: ${{ secrets.EP_CLASPRC_JSON }}
        run: |
          if [ -z "$EP_CLASPRC_JSON" ]; then
            echo "::error::EP_CLASPRC_JSON secret が未設定です。DEPLOY.md の手順で1件だけ登録してください。"; exit 1
          fi
          printf '%s' "$EP_CLASPRC_JSON" > "$HOME/.clasprc.json"

      - name: .clasp.json を生成（Script ID）
        env:
          GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
        run: |
          ID="${GAS_SCRIPT_ID:-$DEFAULT_SCRIPT_ID}"
          printf '{"scriptId":"%s","rootDir":"."}' "$ID" > .clasp.json

      - name: push（コードを GAS へ反映）
        run: clasp push -f

      - name: deploy（本番 /exec を同じURLのまま更新）
        env:
          GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
        run: |
          DID="${GAS_DEPLOYMENT_ID:-$DEFAULT_DEPLOYMENT_ID}"
          clasp deploy --deploymentId "$DID" --description "auto ${GITHUB_SHA}"
