name: deploy-gas

# entrypocket-recruit/gas/ を編集して push すると、募集システムの GAS へ自動反映する。
# 手貼り不要。必要な GitHub Secrets は 1件だけ:
#   EP_CLASPRC_JSON … clasp login で作られる ~/.clasprc.json の中身（丸ごと）＝ログイン情報
#                     （インスタ等の既存 CLASPRC_JSON とは別名。競合しない）
#
# ★安全設計：
#   - Script ID / Deployment ID は「募集システム専用の値」をここに固定。
#     汎用名（GAS_SCRIPT_ID 等）のシークレットは一切参照しない＝別プロジェクトへ誤爆しない。
#   - ソース側に「分割版 ep_fetch.gs」が無い場合は push/deploy を安全にスキップ（緑）。
#     （main 等に旧い単一ファイル版 Code.gs しか無い状態で、ライブの分割版を壊さないため）
on:
  workflow_dispatch:
  push:
    branches: [ main, 'claude/**' ]
    paths:
      - 'entrypocket-recruit/gas/**'
      - '.github/workflows/deploy_gas.yml'

concurrency:
  group: deploy-gas
  cancel-in-progress: false

env:
  # 募集システム（求人進捗_エントリーポケット）の Apps Script ＝ここ以外へは絶対に送らない
  EP_SCRIPT_ID: "1OuDuD9HShlXgSR4oyNrnKXOcsy0qOHvkfupAil9mB52PfUOLdhevBWVZ"
  # 募集システムの公開Webアプリ（/exec）デプロイ。同じURLのまま更新する
  EP_DEPLOYMENT_ID: "AKfycbz6i36c7UjbM3S44kl1kEcsI0CSjYo9jL-W-T4BJUAr9jmBlVXj-vnQTUwQbGoxcHYT"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: entrypocket-recruit/gas
    steps:
      - uses: actions/checkout@v4

      - name: ソース検証（分割版 ep_fetch.gs が無ければ安全にスキップ）
        id: guard
        run: |
          if [ ! -f ep_fetch.gs ]; then
            echo "::notice::分割版(ep_fetch.gs)がこのフォルダに無いため、push/deploy をスキップします（Code.gs版は対象外・ライブ保護）。"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != '1'
        with:
          node-version: '20'

      - name: clasp を導入（v2 で認証情報フォーマットを固定）
        if: steps.guard.outputs.skip != '1'
        run: npm i -g @google/clasp@2.4.2

      - name: 認証情報を書き込む（clasp login のトークン）
        if: steps.guard.outputs.skip != '1'
        env:
          EP_CLASPRC_JSON: ${{ secrets.EP_CLASPRC_JSON }}
        run: |
          if [ -z "$EP_CLASPRC_JSON" ]; then
            echo "::error::EP_CLASPRC_JSON secret が未設定です。DEPLOY.md の手順で1件だけ登録してください。"; exit 1
          fi
          printf '%s' "$EP_CLASPRC_JSON" > "$HOME/.clasprc.json"

      - name: 対象が“募集システム”か、別フォルダで検証
        if: steps.guard.outputs.skip != '1'
        run: |
          tmp="$(mktemp -d)"
          printf '{"scriptId":"%s","rootDir":"."}' "$EP_SCRIPT_ID" > "$tmp/.clasp.json"
          ( cd "$tmp" && clasp pull >/dev/null 2>&1 || true )
          if grep -qrE "epRun|raw_応募者|エントリーポケット" "$tmp" 2>/dev/null; then
            echo "OK: 対象は募集システム（$EP_SCRIPT_ID）"
          else
            echo "::error::対象スクリプトが募集システムではありません。誤爆防止のため中止します。"; exit 1
          fi

      - name: .clasp.json を生成（募集システムのScript IDを固定）
        if: steps.guard.outputs.skip != '1'
        run: printf '{"scriptId":"%s","rootDir":"."}' "$EP_SCRIPT_ID" > .clasp.json

      - name: push（コードを募集システムの GAS へ反映）
        if: steps.guard.outputs.skip != '1'
        run: clasp push -f

      - name: deploy（募集システムの /exec を同じURLのまま更新）
        if: steps.guard.outputs.skip != '1'
        run: clasp deploy --deploymentId "$EP_DEPLOYMENT_ID" --description "auto ${GITHUB_SHA}"
