name: gifuya-post
# ぎふや福岡天神：承認待ち_gifuyatenjin の該当枠を、そのスロット時刻に本投稿する（三条方式）。
# GitHub cron 遅延に強くするため、各cronはスロット時刻(JST)を明示して post_approved に渡す。
# 承認/差し替え/やめる/作り直しは確認アプリ→GAS→シートに反映済みの状態を尊重して投稿する。
on:
  schedule:
    # 【根本対策】GitHubのschedule発火は数時間遅れる/間引かれる（実測4〜5.7h）。疎なcronだと
    # 発火が投稿許容窓(10-22時JST)を飛び越えて全枠スキップ＝未投稿になる。→ 窓の時間帯を
    # 30分おきにポーリングし、毎回“その日の全枠(11/17/20時JST)”を試す。各枠は post_approved の
    # ガードで「投稿済み/まだ枠前/窓外/大幅遅延」を判定し、窓内で最初に回った実行が1回だけ投稿。
    # 深夜は窓ガード(10-22時)で絶対に出さない。
    - cron: '*/30 1-13 * * *'   # UTC 01:00-13:30（＝JST 10:00-22:30）30分おき
  workflow_dispatch:
    inputs:
      datetime:
        description: "JST 例 2026-08-10 17:00（空=cronのスロット/実行時刻）"
        required: false
        default: ""
      dry:
        description: "DRY (1=生成のみ・投稿しない)"
        required: false
        default: "0"
permissions:
  contents: read
concurrency:
  group: gifuya-post
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: susabiyu-remotion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python deps
        run: pip install google-api-python-client google-auth requests jpholiday Pillow boto3 pywebpush numpy
      - name: Install Node deps
        run: npm ci
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Write creds.json
        run: echo "$GOOGLE_CREDS_B64" | base64 -d > creds.json
        env:
          GOOGLE_CREDS_B64: ${{ secrets.GOOGLE_CREDS_B64 }}
      - name: Run post (gifuyatenjin, gated)
        env:
          STORE_ACCOUNT: gifuyatenjin
          GOOGLE_CREDS_B64: ${{ secrets.GOOGLE_CREDS_B64 }}
          IG_ACCESS_TOKEN_GIFUYATENJIN: ${{ secrets.IG_ACCESS_TOKEN_GIFUYATENJIN }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
          GH_MEDIA_TOKEN: ${{ secrets.GH_MEDIA_TOKEN }}
          GH_MEDIA_REPO: ${{ secrets.GH_MEDIA_REPO }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          DRY: ${{ github.event.inputs.dry }}
          SCHED: ${{ github.event.schedule }}
          INPUT_DT: ${{ github.event.inputs.datetime }}
          # 深夜投稿ガード：自動投稿は 10:00〜22:00 JST の外では絶対に出さない。
          # 全枠ループ（日時未指定）では必ずガードON＝未来枠の早出し/窓外(夜間)/二重を防ぐ。
          # 日時を明示した手動 workflow_dispatch（アプリの「即投稿」）のときだけOFF＝その枠を即投稿。
          POST_SCHED_GUARD: ${{ github.event.inputs.datetime == '' && '1' || '' }}
          POST_WINDOW_FROM: "10"
          POST_WINDOW_TO: "22"
          POST_MAX_LATE_MIN: "600"
        run: |
          # 手動で日時指定があればその1枠だけ即投稿（従来どおり）。
          if [ -n "$INPUT_DT" ]; then
            echo "対象日時(JST)=$INPUT_DT"
            python post_approved.py creds.json "$INPUT_DT"
            exit 0
          fi
          # 通常は本日の全枠(11/17/20時JST)を順に試す。該当なし枠は post_approved 側でスキップ。JST日付で。
          D=$(TZ=Asia/Tokyo date +%F)
          for HH in 11 17 20; do
            DT="$D ${HH}:00"
            echo "=== 枠を試行: $DT ==="
            python post_approved.py creds.json "$DT" || true
          done
      - name: 失敗をLINE通知
        if: failure()
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$LINE_CHANNEL_TOKEN" ] && exit 0
          curl -s -X POST https://api.line.me/v2/bot/message/broadcast \
            -H "Authorization: Bearer $LINE_CHANNEL_TOKEN" -H "Content-Type: application/json" \
            -d "{\"messages\":[{\"type\":\"text\",\"text\":\"⚠️ ぎふや自動投稿(gifuya-post)が失敗しました。\n確認: $RUN_URL\"}]}" >/dev/null || true
