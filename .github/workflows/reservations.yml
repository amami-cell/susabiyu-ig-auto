name: susabiyu-reservations
# 確認画面(PWA)で予約した投稿を、その時刻になったら自動で本投稿する。
# 専用タブ「予約投稿」だけを見るので、既存の自動スロット投稿(post.yml)には影響しない。
# 実投稿は Variables の RESV_LIVE=1 のときだけ。未設定＝DRY-RUN（ログのみ・投稿しない）。
on:
  schedule:
    - cron: "*/5 * * * *"   # 5分ごと。予約時刻から最大5分前後で投稿（※GitHub側のスケジュール遅延は残る）
  workflow_dispatch:
    inputs:
      mode:
        description: "live=実投稿 / dry=ログのみ（既定dry）"
        required: false
        default: "dry"
        type: choice
        options: [dry, live]
permissions:
  contents: read
concurrency:
  group: susabiyu-reservations   # 多重起動での二重投稿を防ぐ
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: susabiyu-remotion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install google-api-python-client google-auth requests Pillow
      - name: Install ffmpeg (リール切り出し用) ＋ 日本語フォント(メンション相乗り用)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
      - name: Write creds.json
        run: echo "$GOOGLE_CREDS_B64" | base64 -d > creds.json
        env:
          GOOGLE_CREDS_B64: ${{ secrets.GOOGLE_CREDS_B64 }}
      - name: Run reservation poster
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          # 店舗別の投稿先アカウント用トークン（未登録でも既定=三条は動作。予約行のJ列account=gifuyatenjinで使用）
          IG_ACCESS_TOKEN_GIFUYATENJIN: ${{ secrets.IG_ACCESS_TOKEN_GIFUYATENJIN }}
          IG_ACCESS_TOKEN_NAGAGUTSU: ${{ secrets.IG_ACCESS_TOKEN_NAGAGUTSU }}
          IG_ACCESS_TOKEN_GOLDPORTA: ${{ secrets.IG_ACCESS_TOKEN_GOLDPORTA }}
          IG_ACCESS_TOKEN_KARASUMA: ${{ secrets.IG_ACCESS_TOKEN_KARASUMA }}
          GH_MEDIA_TOKEN: ${{ secrets.GH_MEDIA_TOKEN }}
          GH_MEDIA_REPO: ${{ secrets.GH_MEDIA_REPO }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          # 既定で実投稿ON（全自動運用）。手動dispatchで mode=dry の時だけ投稿しない。
          RESV_LIVE: ${{ github.event.inputs.mode == 'dry' && '0' || '1' }}
        run: |
          python post_reservations.py creds.json
      - name: メンション自動リポストも処理（承認済み→店ストーリー・全店／5分ループに相乗り＝新cronなし）
        # 予約投稿と同じ5分ループで、確認アプリで承認済みのストーリーメンションを店IGへリポスト。
        # gifuya_mentions.yml(*/15＝実際はGitHub側で~2h間隔に間引き)より速く反映される。失敗しても予約投稿は止めない。
        env:
          IG_AUTO_HOLD_MIN: "120"    # 保留付き自動は2h待つ（明示承認approvedは即時）。深夜ガードは既定8-22時。
          GOOGLE_CREDS_B64: ${{ secrets.GOOGLE_CREDS_B64 }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_ACCESS_TOKEN_GIFUYATENJIN: ${{ secrets.IG_ACCESS_TOKEN_GIFUYATENJIN }}
          IG_ACCESS_TOKEN_NAGAGUTSU: ${{ secrets.IG_ACCESS_TOKEN_NAGAGUTSU }}
          IG_ACCESS_TOKEN_GOLDPORTA: ${{ secrets.IG_ACCESS_TOKEN_GOLDPORTA }}
          IG_ACCESS_TOKEN_KARASUMA: ${{ secrets.IG_ACCESS_TOKEN_KARASUMA }}
          GH_MEDIA_TOKEN: ${{ secrets.GH_MEDIA_TOKEN }}
          GH_MEDIA_REPO: ${{ secrets.GH_MEDIA_REPO }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          # 予約がdry(手動)のときはメンションもdry。cron(live)は実リポスト。
          DRY: ${{ github.event.inputs.mode == 'dry' && '1' || '' }}
        run: |
          python mention_repost.py || true
      - name: 失敗をLINE通知
        if: failure()
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$LINE_CHANNEL_TOKEN" ] && exit 0
          curl -s -X POST https://api.line.me/v2/bot/message/broadcast \
            -H "Authorization: Bearer $LINE_CHANNEL_TOKEN" -H "Content-Type: application/json" \
            -d "{\"messages\":[{\"type\":\"text\",\"text\":\"⚠️ 予約投稿(susabiyu-reservations)が失敗しました。\n確認: $RUN_URL\"}]}" >/dev/null || true

  # 鮨処すさび湯（karasuma）の日次自動ストーリー（承認待ち_karasuma＋post_approved）を、
  # この5分ループに相乗りさせる＝単独cron(karasuma-post *30)より発火機会が多く、GitHubの
  # schedule間引きに強い。上の run ジョブ(全店予約投稿)とは独立した別ジョブで並列実行するので、
  # 予約投稿の挙動・他店には一切影響しない（karasuma専用）。
  # ガードは常時ON（INPUT_DT空＝全枠ループ）＝「投稿済み=skip／枠前=skip(早出し防止)／
  # 窓外(10-22時JST外)=skip(夜間防止)／大幅遅延=skip」を post_approved 側が判定。
  # 窓内で最初に回った実行だけが各枠を1回投稿する（二重投稿しない）。
  karasuma_slots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: susabiyu-remotion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python deps
        run: pip install google-api-python-client google-auth requests jpholiday Pillow boto3 pywebpush numpy
      - name: Install Node deps
        run: npm ci
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Write creds.json
        run: echo "$GOOGLE_CREDS_B64" | base64 -d > creds.json
        env:
          GOOGLE_CREDS_B64: ${{ secrets.GOOGLE_CREDS_B64 }}
      - name: Run karasuma slots (gated)
        env:
          STORE_ACCOUNT: karasuma
          GOOGLE_CREDS_B64: ${{ secrets.GOOGLE_CREDS_B64 }}
          IG_ACCESS_TOKEN_KARASUMA: ${{ secrets.IG_ACCESS_TOKEN_KARASUMA }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
          GH_MEDIA_TOKEN: ${{ secrets.GH_MEDIA_TOKEN }}
          GH_MEDIA_REPO: ${{ secrets.GH_MEDIA_REPO }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          # 手動dispatchで mode=dry の時だけ生成のみ。cron/live は実投稿。
          DRY: ${{ github.event.inputs.mode == 'dry' && '1' || '' }}
          # 全枠ループ（INPUT_DT空）は必ずガードON＝早出し/窓外(夜間)/二重を防ぐ。
          POST_SCHED_GUARD: "1"
          POST_MAX_LATE_MIN: "600"
        run: |
          # 本日の全枠(11/18/20時JST)を順に試す。JST日付で枠を作る。
          D=$(TZ=Asia/Tokyo date +%F)
          for HH in 11 18 20; do
            DT="$D ${HH}:00"
            echo "=== 枠を試行: $DT ==="
            python post_approved.py creds.json "$DT" || true
          done
