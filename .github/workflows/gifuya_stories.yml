name: gifuya-stories
# ぎふやのストーリー動画を、同期済みのDrive写真(pwa/gifuya/f_*.jpg)から再生成する。
# 焼き込み写真が古くなった時に手動で回す（造り盛り等のズレを一括修正）。
on:
  workflow_dispatch:
    inputs:
      only:
        description: "対象を限定（例: dv_05 / dv_15）。空=全対象"
        required: false
        default: ""
permissions:
  contents: write
  actions: write
concurrency:
  group: gifuya-stories
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: susabiyu-remotion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install node deps (Remotion)
        run: npm ci
      - name: Re-render gifuya story videos
        run: python gifuya_render_stories.py ${{ github.event.inputs.only }}
      - name: Commit changed videos + deploy
        working-directory: .
        run: |
          set -e
          if [ -z "$(git status --porcelain -- pwa/gifuya)" ]; then
            echo "動画に変更なし（コミットなし）。"; exit 0
          fi
          cur=$(grep -oE 'susabiyu-v[0-9]+' pwa/sw.js | grep -oE '[0-9]+' | head -1)
          nxt=$((cur + 1))
          sed -i "s/susabiyu-v$cur/susabiyu-v$nxt/" pwa/sw.js
          sed -i "s/?v=$cur/?v=$nxt/" pwa/gifuyatenjin.html pwa/gifuya_reels.html
          echo "cache v$cur -> v$nxt"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pwa/gifuya pwa/sw.js pwa/gifuyatenjin.html pwa/gifuya_reels.html
          git commit -m "ぎふや: ストーリー動画を最新Drive写真で再生成＋キャッシュv$nxt"
          git push origin HEAD:main
          curl -sS -X POST -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/actions/workflows/deploy_pwa.yml/dispatches" \
            -d '{"ref":"main"}' && echo "deploy_pwa をトリガーしました。"
