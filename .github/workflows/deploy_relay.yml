name: deploy-relay

# 中継(Cloudflare Worker)の自動デプロイ。relay/ を push すると反映される（GASと同じ発想）。
# CF_API_TOKEN シークレットが無ければ何もしない（他の人の環境で失敗しないように）。
on:
  push:
    paths:
      - "relay/**"
      - ".github/workflows/deploy_relay.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: シークレットの有無を確認（無ければスキップ）
        id: guard
        run: |
          if [ -z "${{ secrets.CF_API_TOKEN }}" ]; then
            echo "CF_API_TOKEN 未設定。中継のデプロイをスキップします（relay/README.md 参照）。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Node をセットアップ
        if: steps.guard.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cloudflare へデプロイ（wrangler）
        if: steps.guard.outputs.skip == 'false'
        working-directory: relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
