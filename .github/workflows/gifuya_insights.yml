name: gifuya-insights
# ぎふや福岡天神のInstagramインサイトを日次収集（アカウント別タブ インサイト日次_gifuyatenjin 等）。
# アプリのレポートタブ（api=report&account=gifuyatenjin）がこのデータを表示する。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "collect / check / heal"
        required: false
        default: "collect"
  schedule:
    - cron: '0 15 * * *'    # 毎日 00:00 JST に日次収集
jobs:
  insights:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: susabiyu-remotion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python deps
        run: pip install google-api-python-client google-auth requests Pillow boto3
      - name: Write creds.json
        run: echo "$GOOGLE_CREDS_B64" | base64 -d > creds.json
        env:
          GOOGLE_CREDS_B64: ${{ secrets.GOOGLE_CREDS_B64 }}
      - name: Run gifuya insights
        env:
          STORE_ACCOUNT: gifuyatenjin
          GOOGLE_CREDS_B64: ${{ secrets.GOOGLE_CREDS_B64 }}
          IG_ACCESS_TOKEN_GIFUYATENJIN: ${{ secrets.IG_ACCESS_TOKEN_GIFUYATENJIN }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GH_MEDIA_TOKEN: ${{ secrets.GH_MEDIA_TOKEN }}
          GH_MEDIA_REPO: ${{ secrets.GH_MEDIA_REPO }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          python insights.py "${MODE:-collect}"
