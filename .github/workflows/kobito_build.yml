name: kobito-build

# 小人一家と汚れた世界（kobito-3d）の自動チェック＆ビルド。
#
# ねらい: 「push したら、壊れていないかが自動で分かる／奥さんのスマホに入れるAPKが出てくる」。
# 募集システムや インスタ投稿システムとは無関係。paths で kobito-3d/ だけを見ているので
# 他の仕組みには一切影響しない。
#
# 無料枠について: このリポジトリは public なので標準ランナーは無料・無制限。
# 重いのは Godot本体(75MB)とエクスポートテンプレート(1.3GB)のダウンロードなので、
# cache に載せて2回目以降はほぼ待たない。従量課金の要素は無し。

on:
  workflow_dispatch:
  push:
    branches: [ main, 'claude/**' ]
    paths:
      - 'kobito-3d/**'
      - '.github/workflows/kobito_build.yml'

env:
  GODOT_VERSION: 4.7-stable

concurrency:
  group: kobito-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # 1) 自己点検 … ひとりぶん＋2台つないだオンラインを headless で通す
  # ------------------------------------------------------------------
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p ~/godot-bin && cd ~/godot-bin
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mv Godot_v${GODOT_VERSION}_linux.x86_64 godot
          chmod +x godot

      - name: Import project
        run: ~/godot-bin/godot --headless --path kobito-3d --import

      - name: ひとりぶんの通し確認（庭・虫・戦闘・経験値・環境回復度）
        run: |
          ~/godot-bin/godot --headless --path kobito-3d -- --selftest | tee solo.log
          grep -q "\[selftest\] OK" solo.log

      - name: ブラウザ版と同じ条件（待ち受け不可）での1人プレイ確認
        run: |
          ~/godot-bin/godot --headless --path kobito-3d -- --selftest --offline | tee offline.log
          grep -q "\[selftest\] OK" offline.log

      - name: 2台つなぐ確認（ENet）
        run: |
          ~/godot-bin/godot --headless --path kobito-3d -- --selftest-host > host.log 2>&1 &
          HOST_PID=$!
          sleep 3
          ~/godot-bin/godot --headless --path kobito-3d -- --selftest-join > join.log 2>&1
          JOIN_RC=$?
          wait $HOST_PID; HOST_RC=$?
          cat host.log join.log
          test "$HOST_RC" = "0" && test "$JOIN_RC" = "0"

      - name: 2台つなぐ確認（WebSocket＝ブラウザ用の通信路）
        run: |
          ~/godot-bin/godot --headless --path kobito-3d -- --selftest-host --ws > hostws.log 2>&1 &
          HOST_PID=$!
          sleep 3
          ~/godot-bin/godot --headless --path kobito-3d -- --selftest-join --ws > joinws.log 2>&1
          JOIN_RC=$?
          wait $HOST_PID; HOST_RC=$?
          cat hostws.log joinws.log
          test "$HOST_RC" = "0" && test "$JOIN_RC" = "0"

  # ------------------------------------------------------------------
  # 2) Web書き出し … スマホにURLを送ってその場で試せる形
  # ------------------------------------------------------------------
  web:
    runs-on: ubuntu-latest
    needs: selftest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot + templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-tpl-${{ env.GODOT_VERSION }}

      - name: Download Godot + templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p ~/godot-bin && cd ~/godot-bin
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mv Godot_v${GODOT_VERSION}_linux.x86_64 godot && chmod +x godot
          curl -fsSL -o tpl.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q tpl.tpz -d tpl
          mv tpl/templates ~/.local/share/godot/export_templates/${GODOT_VERSION/-/.}
          rm -rf tpl tpl.tpz

      - name: Export Web
        run: |
          ~/godot-bin/godot --headless --path kobito-3d --import
          mkdir -p kobito-3d/build/web
          ~/godot-bin/godot --headless --path kobito-3d --export-release "Web" build/web/index.html
          ls -la kobito-3d/build/web

      - uses: actions/upload-artifact@v4
        with:
          name: kobito-web
          path: kobito-3d/build/web
          retention-days: 14

      # テストプレイ用の公開URL：Web書き出しを既存の公開サイト(GH_MEDIA_REPO)の
      # kobito/ フォルダへ載せる。iPhoneはこのURLをSafariで開くだけでテストできる。
      # 求人PWA(deploy_pwa_recruit)と同じ仕組み。app/recruit/tana には一切触れない。
      # ※シークレット未設定なら黙ってスキップ（CIは緑のまま／成果物 kobito-web は取得可）。
      # ※iPhone(Safari)版は現行の見た目（Vulkanのリアル強化は届かない）。
      - name: テストプレイ用の公開URLへ載せる（kobito2/ サブフォルダ＝キャッシュ回避の新URL）
        env:
          TOKEN: ${{ secrets.GH_MEDIA_TOKEN }}
          MEDIA_REPO: ${{ secrets.GH_MEDIA_REPO }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$MEDIA_REPO" ]; then
            echo "INFO: GH_MEDIA_TOKEN / GH_MEDIA_REPO 未設定のため公開はスキップ（成果物 kobito-web は取得可）"
            exit 0
          fi
          # 旧URL(/kobito/)は古いサービスワーカーがキャッシュを握って更新が反映されないため、
          # まっさらな新URL(/kobito2/)へ配信する。PWAも無効化済みなので今後は普通に更新される。
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${MEDIA_REPO}.git" _site
          rm -rf _site/kobito2
          mkdir -p _site/kobito2
          cp -r kobito-3d/build/web/. _site/kobito2/
          touch _site/.nojekyll
          cd _site
          git add kobito2 .nojekyll
          if git diff --cached --quiet; then
            echo "変更なし"; exit 0
          fi
          git commit -m "deploy kobito web (test play, /kobito2/ no-PWA)"
          git push
          echo "公開URL: https://${MEDIA_REPO%%/*}.github.io/${MEDIA_REPO#*/}/kobito2/"

  # ------------------------------------------------------------------
  # 3) PC版（Windows / Linux）… ダウンロードして展開 → ダブルクリックで起動。
  #    Python もサーバーも要らないので、これが「PCで触る」いちばん確実な形。
  # ------------------------------------------------------------------
  desktop:
    runs-on: ubuntu-latest
    needs: selftest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot + templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-tpl-${{ env.GODOT_VERSION }}

      - name: Download Godot + templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p ~/godot-bin && cd ~/godot-bin
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mv Godot_v${GODOT_VERSION}_linux.x86_64 godot && chmod +x godot
          curl -fsSL -o tpl.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q tpl.tpz -d tpl
          mv tpl/templates ~/.local/share/godot/export_templates/${GODOT_VERSION/-/.}
          rm -rf tpl tpl.tpz

      - name: Export Windows / Linux
        run: |
          ~/godot-bin/godot --headless --path kobito-3d --import
          mkdir -p kobito-3d/build/windows kobito-3d/build/linux
          ~/godot-bin/godot --headless --path kobito-3d --export-release "Windows" "build/windows/kobito.exe"
          ~/godot-bin/godot --headless --path kobito-3d --export-release "Linux" build/linux/kobito.x86_64
          ls -la kobito-3d/build/windows kobito-3d/build/linux

      - name: 遊びかたのメモを同梱
        run: |
          cat > kobito-3d/build/windows/はじめに.txt <<'TXT'
          小人一家と汚れた世界 — PC版（Windows）

          このフォルダを「すべて展開」してから、
          「kobito.exe」をダブルクリックしてください（これがゲーム本体です）。

          ※ zip の中身のまま実行すると動きません。必ず展開してから。
          ※ 初回は Windows が「WindowsによってPCが保護されました」と出ます。
             （身内用で署名を買っていないため。ストアの審査とは無関係です）
             「詳細情報」→「実行」で進めます。

          ※ 起動しても画面が真っ黒なときは、
             同じフォルダの「黒画面のときはこれ.bat」をダブルクリックしてください。
             グラフィックの描き方を切り替えて起動します。

          ★ きれいな画質で遊びたいとき（新しめのPC向け）
             同じフォルダの「きれい版（新しめPC向け）.bat」をダブルクリック。
             Vulkan(Forward+)で起動し、接触影(AO)などが効いて一段リアルになります。
             動かない/真っ黒なら、そのPCは非対応なので通常の.exeで遊んでください。
             （通常起動＝軽い版・全PC対応 / きれい版＝新しめPCのみ）

          遊びかた
            起動したら「ひとりで始める」
            移動      WASD / 矢印キー（マウスで画面左半分をドラッグでも可）
            こうげき  J
            つかむ    E
            跳ぶ・飛ぶ スペース（レベル3から長押しで飛べます）
            戻る      Esc

          2人で遊ぶとき
            片方が「ホストする」→ 画面に出るIPを、もう片方が入れて「参加する」
          TXT
          # 古いGPUドライバだと素のOpenGLが弾かれて真っ黒になることがある。
          # そのときのための「D3D11経由で起動する」ワンクリック。
          printf '@echo off\r\nstart "" "%%~dp0kobito.exe" --rendering-driver opengl3_angle\r\n' \
            > "kobito-3d/build/windows/黒画面のときはこれ.bat"
          # 新しめPC向け「きれい版」：Vulkan(Forward+)で起動＝接触影(AO)などが効く。
          # 非対応PCなら起動に失敗するだけ（通常の.exeは影響を受けない）。
          printf '@echo off\r\nstart "" "%%~dp0kobito.exe" --rendering-method forward_plus --rendering-driver vulkan\r\n' \
            > "kobito-3d/build/windows/きれい版（新しめPC向け）.bat"
          cp kobito-3d/build/windows/はじめに.txt kobito-3d/build/linux/

      - uses: actions/upload-artifact@v4
        with:
          name: kobito-windows
          path: kobito-3d/build/windows
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: kobito-linux
          path: kobito-3d/build/linux
          retention-days: 14

  # ------------------------------------------------------------------
  # 4) Android APK … 本命。Actions の成果物 kobito-apk を落として端末に入れる
  # ------------------------------------------------------------------
  android:
    runs-on: ubuntu-latest
    needs: selftest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Cache Godot + templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-tpl-${{ env.GODOT_VERSION }}

      - name: Download Godot + templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p ~/godot-bin && cd ~/godot-bin
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mv Godot_v${GODOT_VERSION}_linux.x86_64 godot && chmod +x godot
          curl -fsSL -o tpl.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q tpl.tpz -d tpl
          mv tpl/templates ~/.local/share/godot/export_templates/${GODOT_VERSION/-/.}
          rm -rf tpl tpl.tpz

      - name: デバッグ用の署名鍵をその場で作る（配布用ではない）
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore "$HOME/debug.keystore" -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12

      - name: Godot のエディタ設定に SDK と鍵を書く
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.7.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${HOME}/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Export APK
        run: |
          ~/godot-bin/godot --headless --path kobito-3d --import
          mkdir -p kobito-3d/build/android
          ~/godot-bin/godot --headless --path kobito-3d --export-debug "Android" build/android/kobito.apk
          ls -la kobito-3d/build/android

      - uses: actions/upload-artifact@v4
        with:
          name: kobito-apk
          path: kobito-3d/build/android/*.apk
          retention-days: 14
