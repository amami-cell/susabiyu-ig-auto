name: recruit-summary-preview
# 手動実行専用。サマリー本文を「送らずに」取得して確認するだけ（dry=1）。
on:
  workflow_dispatch:
    inputs:
      period:
        description: 'weekly か monthly'
        required: false
        default: 'weekly'
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Preview summary (no send)
        env:
          RECRUIT_EXEC_URL: ${{ secrets.RECRUIT_EXEC_URL }}
          EP_PUSH_KEY: ${{ secrets.EP_PUSH_KEY }}
          INPUT_PERIOD: ${{ github.event.inputs.period }}
        run: |
          export RECRUIT_EXEC_URL="${RECRUIT_EXEC_URL:-https://script.google.com/macros/s/AKfycbz6i36c7UjbM3S44kl1kEcsI0CSjYo9jL-W-T4BJUAr9jmBlVXj-vnQTUwQbGoxcHYT/exec}"
          P="${INPUT_PERIOD:-weekly}"
          echo "--- サマリー($P)プレビュー（送信なし） ---"
          curl -sSL "$RECRUIT_EXEC_URL?summary=$P&dry=1&key=$EP_PUSH_KEY"; echo
