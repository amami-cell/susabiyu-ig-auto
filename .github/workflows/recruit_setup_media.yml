name: recruit-setup-media
# 手動実行専用。master_媒体（媒体｜標準週数）を用意する。
# 標準週数は空欄なら過去実績の平均週数で仮入力。実行後、バイトル=2/マイナビ=4 のように
# スプレッドシートで各媒体の標準週数を入力すれば、募集終了時に連載終了日が自動でセットされる。
on:
  workflow_dispatch:
jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Setup master_媒体
        env:
          RECRUIT_EXEC_URL: ${{ secrets.RECRUIT_EXEC_URL }}
          EP_PUSH_KEY: ${{ secrets.EP_PUSH_KEY }}
        run: |
          export RECRUIT_EXEC_URL="${RECRUIT_EXEC_URL:-https://script.google.com/macros/s/AKfycbz6i36c7UjbM3S44kl1kEcsI0CSjYo9jL-W-T4BJUAr9jmBlVXj-vnQTUwQbGoxcHYT/exec}"
          echo "--- master_媒体 を用意 ---"
          curl -sSL "$RECRUIT_EXEC_URL?setup=media&key=$EP_PUSH_KEY"; echo
