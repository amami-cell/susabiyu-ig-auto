name: susabiyu-prepare

on:
  workflow_dispatch:
    inputs:
      date:
        description: "対象日 例 2026-06-25 (空=今日+2日)"
        required: false
        default: ""

jobs:
  prepare:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: susabiyu-remotion
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Chromium libs
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2 libpango-1.0-0 libcairo2 fonts-noto-cjk

      - name: Python deps
        run: pip install google-api-python-client google-auth jpholiday requests Pillow

      - name: Node deps
        run: npm ci || npm install

      - name: Run prepare
        env:
          GOOGLE_CREDS_B64: ${{ secrets.GOOGLE_CREDS_B64 }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
        run: python prepare.py "" "${{ github.event.inputs.date }}"
