name: susabiyu-prepare
on:
  schedule:
    # JST 06:40 / 07:40 / 08:40 (= UTC 21:40 / 22:40 / 23:40, prev day).
    # Off the 00:00 UTC peak. prepare.py is idempotent, so multiple fires
    # per JST-day only generate once; the extra crons are reliability backups.
    - cron: '40 21 * * *'
    - cron: '40 22 * * *'
    - cron: '40 23 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: "Target date JST e.g. 2026-06-26 / 'repair'=承認待ちの一時URLを恒久化のみ (empty=2 days ahead)"
        required: false
        default: ""
      quiet:
        description: "1=LINE/Push通知を送らない（夜間作業用）"
        required: false
        default: "0"
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: susabiyu-remotion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python deps
        run: pip install google-api-python-client google-auth requests jpholiday Pillow boto3 pywebpush numpy
      - name: Install Node deps
        run: npm ci
      - name: Install ffmpeg (faststartで即再生に)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Write creds.json
        run: echo "$GOOGLE_CREDS_B64" | base64 -d > creds.json
        env:
          GOOGLE_CREDS_B64: ${{ secrets.GOOGLE_CREDS_B64 }}
      - name: Run prepare
        env:
          GOOGLE_CREDS_B64: ${{ secrets.GOOGLE_CREDS_B64 }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GENRE_FOOD_ID: ${{ secrets.GENRE_FOOD_ID }}
          GENRE_SAKE_ID: ${{ secrets.GENRE_SAKE_ID }}
          GENRE_INTERIOR_ID: ${{ secrets.GENRE_INTERIOR_ID }}
          GENRE_EVENT_ID: ${{ secrets.GENRE_EVENT_ID }}
          GENRE_MUSIC_UPTEMPO_ID: ${{ secrets.GENRE_MUSIC_UPTEMPO_ID }}
          GENRE_MUSIC_NORMAL_ID: ${{ secrets.GENRE_MUSIC_NORMAL_ID }}
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
          GH_MEDIA_TOKEN: ${{ secrets.GH_MEDIA_TOKEN }}
          GH_MEDIA_REPO: ${{ secrets.GH_MEDIA_REPO }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          PWA_URL: ${{ secrets.PWA_URL }}
          QUIET_NOTIFY: ${{ github.event.inputs.quiet }}
        run: python prepare.py creds.json "${{ github.event.inputs.date }}"
      - name: 失敗をLINE通知
        if: failure()
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$LINE_CHANNEL_TOKEN" ] && exit 0
          curl -s -X POST https://api.line.me/v2/bot/message/broadcast \
            -H "Authorization: Bearer $LINE_CHANNEL_TOKEN" -H "Content-Type: application/json" \
            -d "{\"messages\":[{\"type\":\"text\",\"text\":\"⚠️ 動画準備(susabiyu-prepare)が失敗しました。\n確認: $RUN_URL\"}]}" >/dev/null || true
