name: susabiyu-prepare
on:
  schedule:
    # JST 06:40 / 07:40 / 08:40 (= UTC 21:40 / 22:40 / 23:40, prev day).
    # Off the 00:00 UTC peak. prepare.py is idempotent, so multiple fires
    # per JST-day only generate once; the extra crons are reliability backups.
    - cron: '40 21 * * *'
    - cron: '40 22 * * *'
    - cron: '40 23 * * *'
    # TEMP schedule-probe (to be removed): verify GitHub fires prepare's schedule today
    - cron: '11 4 * * *'
    - cron: '19 4 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: "Target date JST e.g. 2026-06-26 (empty=2 days ahead)"
        required: false
        default: ""
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: susabiyu-remotion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python deps
        run: pip install google-api-python-client google-auth requests jpholiday Pillow
      - name: Install Node deps
        run: npm ci
      - name: Write creds.json
        run: echo "$GOOGLE_CREDS_B64" | base64 -d > creds.json
        env:
          GOOGLE_CREDS_B64: ${{ secrets.GOOGLE_CREDS_B64 }}
      - name: Run prepare
        env:
          GOOGLE_CREDS_B64: ${{ secrets.GOOGLE_CREDS_B64 }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GENRE_FOOD_ID: ${{ secrets.GENRE_FOOD_ID }}
          GENRE_SAKE_ID: ${{ secrets.GENRE_SAKE_ID }}
          GENRE_INTERIOR_ID: ${{ secrets.GENRE_INTERIOR_ID }}
          GENRE_EVENT_ID: ${{ secrets.GENRE_EVENT_ID }}
          GENRE_MUSIC_UPTEMPO_ID: ${{ secrets.GENRE_MUSIC_UPTEMPO_ID }}
          GENRE_MUSIC_NORMAL_ID: ${{ secrets.GENRE_MUSIC_NORMAL_ID }}
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
        run: python prepare.py creds.json "${{ github.event.inputs.date }}"
