name: susabiyu-sheet-inspect
on:
  push:
    branches:
      - claude/epic-maxwell-mj7dkg
    paths:
      - '.github/workflows/sheet_inspect.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: susabiyu-remotion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python deps
        run: pip install google-api-python-client google-auth
      - name: Write creds.json
        run: echo "$GOOGLE_CREDS_B64" | base64 -d > creds.json
        env:
          GOOGLE_CREDS_B64: ${{ secrets.GOOGLE_CREDS_B64 }}
      - name: Inspect 承認待ち rows for 2026-06-27
        run: |
          python - <<'PY'
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          SHEET_ID = "13zKaUblOwmgZ-lgCfxylCLlW2Fqutqct5h5TvMRWv30"
          TAB = "承認待ち"
          scopes = ["https://www.googleapis.com/auth/spreadsheets.readonly"]
          creds = service_account.Credentials.from_service_account_file("creds.json", scopes=scopes)
          sh = build("sheets", "v4", credentials=creds).spreadsheets()
          data = sh.values().get(spreadsheetId=SHEET_ID, range=TAB + "!A:K").execute().get("values", [])
          print("total rows (incl header):", len(data))
          print("--- rows where B starts with 2026-06-27 ---")
          seen = {}
          for i, r in enumerate(data):
              if i == 0:
                  continue
              when = (r[1] if len(r) > 1 else "")
              if str(when).startswith("2026-06-27"):
                  token = r[0] if len(r) > 0 else ""
                  status = r[7] if len(r) > 7 else ""
                  pattern = r[3] if len(r) > 3 else ""
                  print("row %d | token=%s | when=%s | slot=%s | pattern=%s | status=%s"
                        % (i + 1, token, when, (r[2] if len(r) > 2 else ""), pattern, status))
                  seen.setdefault(token, []).append(i + 1)
          print("--- duplicate tokens (token -> rownums) ---")
          dups = {t: rs for t, rs in seen.items() if len(rs) > 1}
          if not dups:
              print("none")
          for t, rs in dups.items():
              print("DUP", t, "->", rs)
          PY
