name: gourmet-fetch
# グルメキャリーの応募者CSVを自動取得→募集アプリへ投入。GitHub Actionsから実行（PC不要）。
on:
  workflow_dispatch:
  schedule:
    - cron: "0 22 * * *"   # 07:00 JST
    - cron: "0 4 * * *"    # 13:00 JST
  push:
    branches: [claude/entrypocket-recruit-system-zklr9u]
    paths:
      - 'entrypocket-recruit/scripts/gourmet_fetch.py'
      - '.github/workflows/gourmet_fetch.yml'

concurrency:
  group: gourmet-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Playwright(Chromium)導入
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: 取得＆投入
        env:
          GOURMET_USER: ${{ secrets.GOURMET_USER }}
          GOURMET_PASS: ${{ secrets.GOURMET_PASS }}
          RECRUIT_EXEC_URL: ${{ secrets.RECRUIT_EXEC_URL }}
        run: python entrypocket-recruit/scripts/gourmet_fetch.py
      # 保存されるスクショ/HTMLはログイン後の応募者ページ＝個人情報を含む。当リポジトリは公開で
      # artifactは誰でもDL可能なため、ここでは公開アップロードしない（調査はローカル実行で行う）。
      # 参照: 監査 S-2（応募者PIIの公開artifact流出）。
