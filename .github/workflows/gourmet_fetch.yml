name: gourmet-fetch
# グルメキャリーの応募者CSVを自動取得→募集アプリへ投入。GitHub Actionsから実行（PC不要）。
on:
  workflow_dispatch:
  schedule:
    - cron: "0 22 * * *"   # 07:00 JST
    - cron: "0 4 * * *"    # 13:00 JST
  push:
    branches: [claude/entrypocket-recruit-system-zklr9u]
    paths:
      - 'entrypocket-recruit/scripts/gourmet_fetch.py'
      - '.github/workflows/gourmet_fetch.yml'

concurrency:
  group: gourmet-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Playwright(Chromium)導入
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: 取得＆投入
        env:
          GOURMET_USER: ${{ secrets.GOURMET_USER }}
          GOURMET_PASS: ${{ secrets.GOURMET_PASS }}
          RECRUIT_EXEC_URL: ${{ secrets.RECRUIT_EXEC_URL }}
          RECRUIT_INGEST_KEY: ${{ secrets.RECRUIT_INGEST_KEY }}
        run: python entrypocket-recruit/scripts/gourmet_fetch.py
      - name: 失敗時の調査用スクショ保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gourmet-fetch-${{ github.run_id }}
          path: entrypocket-recruit/artifacts/
          if-no-files-found: ignore
          retention-days: 7
