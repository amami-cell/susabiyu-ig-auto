name: gifuya-post-legacy（固定ローテ・停止中）
# 【停止】旧・固定ローテのストーリー投稿。三条方式の生成パイプライン
#   （gifuya-prepare → 承認待ち_gifuyatenjin → gifuya-post が承認済みを投稿）へ移行したため、
#   二重ストーリー投稿を防ぐ目的でスケジュールを撤去（手動 workflow_dispatch のみ残す）。
#   ※ 新方式が安定運用に入ったら、このファイル自体を削除して良い。
on:
  workflow_dispatch:
    inputs:
      datetime:
        description: "JST e.g. 2026-08-03 17:00 (empty=now)"
        required: false
        default: ""
      dry:
        description: "DRY (1=ON・URL確認のみ/投稿しない)"
        required: false
        default: "0"
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.IG_ACCESS_TOKEN_GIFUYATENJIN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "go=1" >> "$GITHUB_OUTPUT"; echo "トークン設定あり：ぎふやストーリー投稿を実行します。"
          else
            echo "go=0" >> "$GITHUB_OUTPUT"
            echo "スキップ：IG_ACCESS_TOKEN_GIFUYATENJIN 未設定。登録すると11/17/20の自動投稿が始まります。"
          fi
  post:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: susabiyu-remotion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python deps
        run: pip install requests google-api-python-client google-auth jpholiday Pillow boto3 pywebpush cryptography
      - name: Write creds.json
        run: echo "$GOOGLE_CREDS_B64" | base64 -d > creds.json
        env:
          GOOGLE_CREDS_B64: ${{ secrets.GOOGLE_CREDS_B64 }}
      - name: Post gifuya story (rotation)
        env:
          IG_ACCESS_TOKEN_GIFUYATENJIN: ${{ secrets.IG_ACCESS_TOKEN_GIFUYATENJIN }}
          # 三条と同じ自動延命：AcctTokens 保存のため三条シート＋creds を渡す（トークンは店舗別に分離）
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_CREDS_B64: ${{ secrets.GOOGLE_CREDS_B64 }}
          GIFUYA_MEDIA_BASE: ${{ vars.GIFUYA_MEDIA_BASE }}
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          # Web Push（三条と同じVAPIDを再利用・購読_gifuyatenjin へ送信）
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          PWA_URL: https://amami-cell.github.io/susabiyu-media/app/gifuyatenjin.html
          DRY: ${{ github.event.inputs.dry }}
        run: python post_gifuya_story.py "${{ github.event.inputs.datetime }}"
      - name: 失敗をLINE通知
        if: failure()
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$LINE_CHANNEL_TOKEN" ] && exit 0
          curl -s -X POST https://api.line.me/v2/bot/message/broadcast \
            -H "Authorization: Bearer $LINE_CHANNEL_TOKEN" -H "Content-Type: application/json" \
            -d "{\"messages\":[{\"type\":\"text\",\"text\":\"⚠️ ぎふや自動投稿(gifuya-post)が失敗しました。\n確認: $RUN_URL\"}]}" >/dev/null || true
