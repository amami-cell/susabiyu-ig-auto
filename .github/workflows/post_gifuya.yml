name: gifuya-post
# ぎふや福岡天神店 ストーリー自動投稿（1日3回：11:00 / 17:00 / 20:00 JST）
# 自己完結版：採用中のぎふやストーリー動画（CDN公開済み）をローテーション投稿する。
# Googleスプレッドシート/GAS/生成パイプラインは不要。
#
# ★必要なのは Secret「IG_ACCESS_TOKEN_GIFUYATENJIN」だけ。
#   未設定なら gate ジョブで即スキップ（何も投稿しない＝安全）。
#   登録した瞬間から、次の 11/17/20 の枠で自動投稿が始まる。
on:
  schedule:
    - cron: '0 2 * * *'    # 11:00 JST
    - cron: '0 8 * * *'    # 17:00 JST
    - cron: '0 11 * * *'   # 20:00 JST
  workflow_dispatch:
    inputs:
      datetime:
        description: "JST e.g. 2026-08-03 17:00 (empty=now)"
        required: false
        default: ""
      dry:
        description: "DRY (1=ON・URL確認のみ/投稿しない)"
        required: false
        default: "0"
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.IG_ACCESS_TOKEN_GIFUYATENJIN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "go=1" >> "$GITHUB_OUTPUT"; echo "トークン設定あり：ぎふやストーリー投稿を実行します。"
          else
            echo "go=0" >> "$GITHUB_OUTPUT"
            echo "スキップ：IG_ACCESS_TOKEN_GIFUYATENJIN 未設定。登録すると11/17/20の自動投稿が始まります。"
          fi
  post:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: susabiyu-remotion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python deps
        run: pip install requests google-api-python-client google-auth jpholiday Pillow boto3
      - name: Post gifuya story (rotation)
        env:
          IG_ACCESS_TOKEN_GIFUYATENJIN: ${{ secrets.IG_ACCESS_TOKEN_GIFUYATENJIN }}
          GIFUYA_MEDIA_BASE: ${{ vars.GIFUYA_MEDIA_BASE }}
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          DRY: ${{ github.event.inputs.dry }}
        run: python post_gifuya_story.py "${{ github.event.inputs.datetime }}"
      - name: 失敗をLINE通知
        if: failure()
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$LINE_CHANNEL_TOKEN" ] && exit 0
          curl -s -X POST https://api.line.me/v2/bot/message/broadcast \
            -H "Authorization: Bearer $LINE_CHANNEL_TOKEN" -H "Content-Type: application/json" \
            -d "{\"messages\":[{\"type\":\"text\",\"text\":\"⚠️ ぎふや自動投稿(gifuya-post)が失敗しました。\n確認: $RUN_URL\"}]}" >/dev/null || true
