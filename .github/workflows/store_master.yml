name: susabiyu-store-master
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "init=タブ作成＋すさび湯三条を吸い上げ / setup=新店のDriveフォルダ作成 / all=両方"
        required: true
        default: "init"
        type: choice
        options: [init, setup, columns, intake, requestsheet, roster, names, pending, saemail, distsheet, distdrive, distsub, distnote, disttop, distwarn, disttime, distmove, distfinal, distdump, inbox, inboxget, all]
      store_id:
        description: "setup対象のstore_id（空=Drive URL未設定の全店）"
        required: false
        default: ""
jobs:
  master:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: susabiyu-remotion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python deps
        run: pip install google-api-python-client google-auth requests
      - name: Write creds.json
        run: echo "$GOOGLE_CREDS_B64" | base64 -d > creds.json
        env:
          GOOGLE_CREDS_B64: ${{ secrets.GOOGLE_CREDS_B64 }}
      - name: Run store_master
        env:
          GOOGLE_CREDS_B64: ${{ secrets.GOOGLE_CREDS_B64 }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GAS_EXEC_URL: ${{ secrets.GAS_EXEC_URL }}
          GENRE_MUSIC_UPTEMPO_ID: ${{ secrets.GENRE_MUSIC_UPTEMPO_ID }}
          GENRE_MUSIC_NORMAL_ID: ${{ secrets.GENRE_MUSIC_NORMAL_ID }}
          SHARE_EMAIL: ${{ secrets.SHARE_EMAIL }}
          REQ_SHEET_ID: ${{ secrets.REQ_SHEET_ID }}
        run: python store_master.py "${{ github.event.inputs.mode }}" "${{ github.event.inputs.store_id }}"
