name: goldporta-logo
# GOLD京都ポルタ：公式ロゴをDriveから取得し、LPヘッダー用に保存する。
#   pwa/goldporta/lp_logo.png を作り、コミット→deploy_pwa を発火。手動実行のみ（軽い）。
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: goldporta-logo
  cancel-in-progress: false
jobs:
  logo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: susabiyu-remotion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install google-api-python-client google-auth Pillow
      - name: Fetch logo
        env:
          GOOGLE_CREDS_B64: ${{ secrets.GOOGLE_CREDS_B64 }}
        run: |
          echo "$GOOGLE_CREDS_B64" | base64 -d > creds.json
          python goldporta_logo.py creds.json
          rm -f creds.json
      - name: Commit + deploy
        working-directory: .
        run: |
          set -e
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "main 以外（${{ github.ref }}）からの実行のためコミットしません。"; exit 0
          fi
          if [ -z "$(git status --porcelain -- pwa/goldporta/lp_logo.png)" ]; then
            echo "変更なし。コミットしません。"; exit 0
          fi
          cur=$(grep -oE 'susabiyu-v[0-9]+' pwa/sw.js | grep -oE '[0-9]+' | head -1)
          nxt=$((cur + 1))
          sed -i "s/susabiyu-v$cur/susabiyu-v$nxt/" pwa/sw.js
          echo "sw v$cur -> v$nxt"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pwa/goldporta/lp_logo.png pwa/sw.js
          git commit -m "GOLD京都ポルタ: 公式ロゴをDriveから取得（LPヘッダー用 lp_logo.png）＋キャッシュv$nxt"
          git push origin HEAD:main
