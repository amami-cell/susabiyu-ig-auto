name: susabiyu-i2v
# すさび湯三条：料理写真1枚→数秒の実写風クリップをHF無料I2Vで「1日1本」生成し、
# シート「リール素材」に貯める（貯まるほど後でリールに使える）。無料枠内・連打しない設計。
#   ・要 Secret: HF_TOKEN（無料Hugging Faceアカウントの read トークン）
#   ・probe: 使うSpaceのAPI仕様を表示（初回の配線確認用）。gen: 実生成。
on:
  schedule:
    # 1日3回トライ（朝・昼・夜に分散）。混雑での空き待ちはクォータを消費しないので無料枠は減らない。
    # 実際に生成できるのはクォータぶん（=通常1本）。どこかの回で空きを掴めれば1本取れる確率が上がる。
    - cron: '0 21 * * *'   # 毎日 JST 06:00（前日UTC21時）
    - cron: '0 4 * * *'    # 毎日 JST 13:00
    - cron: '0 13 * * *'   # 毎日 JST 22:00
  workflow_dispatch:
    inputs:
      mode:
        description: "probe=API確認 / gen=生成"
        required: false
        default: "gen"
      space:
        description: "HF Space上書き（空=既定）"
        required: false
        default: ""
      api_name:
        description: "predictのapi_name上書き（空=既定 /generate）"
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: susabiyu-i2v
  cancel-in-progress: false
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: susabiyu-remotion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install gradio_client google-api-python-client google-auth requests boto3
      - name: Write creds.json
        run: echo "$GOOGLE_CREDS_B64" | base64 -d > creds.json
        env:
          GOOGLE_CREDS_B64: ${{ secrets.GOOGLE_CREDS_B64 }}
      - name: Generate (or probe) I2V clip
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ github.event.inputs.space }}
          HF_API_NAME: ${{ github.event.inputs.api_name }}
          GOOGLE_CREDS_B64: ${{ secrets.GOOGLE_CREDS_B64 }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GENRE_FOOD_ID: ${{ secrets.GENRE_FOOD_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
          GH_MEDIA_TOKEN: ${{ secrets.GH_MEDIA_TOKEN }}
          GH_MEDIA_REPO: ${{ secrets.GH_MEDIA_REPO }}
        run: |
          # env の空文字は既定値に戻す（workflow_dispatch未入力時）
          [ -z "$HF_SPACE" ] && unset HF_SPACE || true
          [ -z "$HF_API_NAME" ] && unset HF_API_NAME || true
          python gen_i2v.py "${{ github.event.inputs.mode || 'gen' }}" creds.json
