name: susabiyu-reservations-clean
# 予約シートに残っている予約(scheduled/posting)の本文を“ハッシュタグ1か所だけ”に整える一括処理。
# 手動実行のみ（cronなし＝無料枠を消費しない）。既定は dry(表示のみ)。write で実際に書き換える。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry=対象の表示のみ / write=シートを実際に書き換え"
        required: false
        default: "dry"
        type: choice
        options: [dry, write]
permissions:
  contents: read
concurrency:
  group: susabiyu-reservations   # 予約ポスターと同じグループ＝二重実行を避ける
  cancel-in-progress: false
jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: susabiyu-remotion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install google-api-python-client google-auth requests
      - name: Write creds.json
        run: echo "$GOOGLE_CREDS_B64" | base64 -d > creds.json
        env:
          GOOGLE_CREDS_B64: ${{ secrets.GOOGLE_CREDS_B64 }}
      - name: Clean captions（重複ハッシュタグを1か所に畳む）
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          # write のときだけ実書き換え（RESV_LIVE=1）。dryは表示のみ。
          RESV_LIVE: ${{ github.event.inputs.mode == 'write' && '1' || '0' }}
        run: |
          python post_reservations.py creds.json clean
