name: nagagutsu-feed
# ナガグツの「フィード投稿画面」の素材を作る（ぎふやの gifuya-sync に相当）。
#   ・Driveの料理写真を4:5に整えて pwa/nagagutsu/f_*.jpg
#   ・承認済みフィードデザイン6案を料理ごとに割り当てて焼き込み → fd_*.jpg
#   ・feed.json を書き出す（確認アプリのフィードタブがこれを読む）
#   ・変更があればキャッシュ版数を上げてコミット → deploy_pwa を発火
# デザインは1案固定ではなく「連続回避＋均等＋明るい写真では下地なし案を外す」で散らす。
on:
  schedule:
    - cron: '50 19 * * *'   # 毎日 04:50 JST（ぎふや04:30とずらす）
  workflow_dispatch:
    inputs:
      limit:
        description: "先頭N品だけ焼く（空=全品／動作確認用）"
        required: false
        default: ""
permissions:
  contents: write
  actions: write
concurrency:
  group: nagagutsu-feed
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: susabiyu-remotion/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python deps
        run: pip install google-api-python-client google-auth Pillow
      - name: Install Node deps
        run: npm ci
        working-directory: susabiyu-remotion
      - name: Build feed assets
        working-directory: susabiyu-remotion
        env:
          STORE_ACCOUNT: nagagutsu
          GOOGLE_CREDS_B64: ${{ secrets.GOOGLE_CREDS_B64 }}
        run: |
          echo "$GOOGLE_CREDS_B64" | base64 -d > creds.json
          LIM=""
          if [ -n "${{ github.event.inputs.limit }}" ]; then LIM="--limit ${{ github.event.inputs.limit }}"; fi
          python nagagutsu_feed.py creds.json $LIM
          rm -f creds.json
      - name: Commit changes + deploy
        run: |
          set -e
          if [ -z "$(git status --porcelain -- pwa/nagagutsu)" ]; then
            echo "変更なし（Drive未更新）。コミットしません。"; exit 0
          fi
          cur=$(grep -oE 'susabiyu-v[0-9]+' pwa/sw.js | grep -oE '[0-9]+' | head -1)
          nxt=$((cur + 1))
          sed -i "s/susabiyu-v$cur/susabiyu-v$nxt/" pwa/sw.js
          # 画像の中身が変わった時だけ ?v を上げる（＝この同期が唯一の上げどころ）。
          # 対象は reels 側だけ。nagagutsu.html の ?v は __BUILD__（コミットSHA置換）で数字ではない。
          vcur=$(grep -oE '\?v=[0-9]+' pwa/nagagutsu_reels.html | grep -oE '[0-9]+' | head -1)
          vnxt=$((vcur + 1))
          sed -i "s/?v=$vcur/?v=$vnxt/" pwa/nagagutsu_reels.html
          echo "sw v$cur -> v$nxt / media ?v=$vcur -> ?v=$vnxt"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pwa/nagagutsu pwa/sw.js pwa/nagagutsu_reels.html
          git commit -m "ナガグツ: フィード素材をDriveから同期＋キャッシュv$nxt"
          git push origin HEAD:main
          curl -sS -X POST -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/actions/workflows/deploy_pwa.yml/dispatches" \
            -d '{"ref":"main"}'
