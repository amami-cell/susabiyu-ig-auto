name: susabiyu-post
on:
  schedule:
    # 【根本対策】GitHubのschedule発火は数時間遅れる/間引かれる（実測4〜5.7h）。疎なcronだと
    # 発火が投稿許容窓(10-22時JST)を飛び越えて全枠スキップ＝未投稿になる。→ 窓の時間帯を
    # 30分おきにポーリングし、毎回“その日の全枠”を試す。各枠は post_approved のガードで
    # 「投稿済み/まだ枠前/窓外/大幅遅延」を判定し、窓内で最初に回った実行が1回だけ投稿する。
    # 深夜は窓ガード(10-22時)で絶対に出さない。
    - cron: '*/30 1-13 * * *'   # UTC 01:00-13:30（＝JST 10:00-22:30）30分おき
  workflow_dispatch:
    inputs:
      datetime:
        description: "JST e.g. 2026-06-26 18:00 (empty=now)"
        required: false
        default: ""
      dry:
        description: "DRY (1=ON)"
        required: false
        default: "0"
# 多重起動防止（手動dispatchとcron/他店舗方式と揃える）: 同グループは同時に1つだけ
concurrency:
  group: susabiyu-post
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: susabiyu-remotion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python deps
        run: pip install google-api-python-client google-auth requests jpholiday Pillow boto3
      - name: Install Node deps
        run: npm ci
      - name: Write creds.json
        run: echo "$GOOGLE_CREDS_B64" | base64 -d > creds.json
        env:
          GOOGLE_CREDS_B64: ${{ secrets.GOOGLE_CREDS_B64 }}
      - name: Run post (gated)
        env:
          GOOGLE_CREDS_B64: ${{ secrets.GOOGLE_CREDS_B64 }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GENRE_FOOD_ID: ${{ secrets.GENRE_FOOD_ID }}
          GENRE_SAKE_ID: ${{ secrets.GENRE_SAKE_ID }}
          GENRE_INTERIOR_ID: ${{ secrets.GENRE_INTERIOR_ID }}
          GENRE_EVENT_ID: ${{ secrets.GENRE_EVENT_ID }}
          GENRE_MUSIC_UPTEMPO_ID: ${{ secrets.GENRE_MUSIC_UPTEMPO_ID }}
          GENRE_MUSIC_NORMAL_ID: ${{ secrets.GENRE_MUSIC_NORMAL_ID }}
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
          GH_MEDIA_TOKEN: ${{ secrets.GH_MEDIA_TOKEN }}
          GH_MEDIA_REPO: ${{ secrets.GH_MEDIA_REPO }}
          DRY: ${{ github.event.inputs.dry }}
          # 深夜投稿ガード：自動投稿は 10:00〜22:00 JST の外では絶対に出さない。
          # 全枠ループ（日時未指定）では必ずガードON＝未来枠の早出し/窓外(夜間)/二重を防ぐ。
          # 日時を明示した手動 workflow_dispatch（アプリの「即投稿」）のときだけOFF＝その枠を即投稿。
          POST_SCHED_GUARD: ${{ github.event.inputs.datetime == '' && '1' || '' }}
          POST_WINDOW_FROM: "10"
          POST_WINDOW_TO: "22"
          POST_MAX_LATE_MIN: "600"
          SCHED: ${{ github.event.schedule }}
          INPUT_DT: ${{ github.event.inputs.datetime }}
        run: |
          # 手動で日時指定があればその1枠だけ即投稿（従来どおり）。
          if [ -n "$INPUT_DT" ]; then
            echo "対象日時(JST)=$INPUT_DT"
            python post_approved.py creds.json "$INPUT_DT"
            exit 0
          fi
          # 通常は本日の全枠(平日/祝日どちらの枠でも該当があれば投稿)を順に試す。
          # 該当しない枠は post_approved 側で「該当枠なし→スキップ」になるので無害。JST日付で枠を作る。
          D=$(TZ=Asia/Tokyo date +%F)
          for HH in 11 16 18 20; do
            DT="$D ${HH}:00"
            echo "=== 枠を試行: $DT ==="
            python post_approved.py creds.json "$DT" || true
          done
      - name: 失敗をLINE通知
        if: failure()
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$LINE_CHANNEL_TOKEN" ] && exit 0
          curl -s -X POST https://api.line.me/v2/bot/message/broadcast \
            -H "Authorization: Bearer $LINE_CHANNEL_TOKEN" -H "Content-Type: application/json" \
            -d "{\"messages\":[{\"type\":\"text\",\"text\":\"⚠️ 自動投稿(susabiyu-post)が失敗しました。\n確認: $RUN_URL\"}]}" >/dev/null || true
