name: susabiyu-post
on:
  schedule:
    # 【根本対策】cron分を「00分」から外す（GitHubは毎時00分が最混雑で遅延しやすい）。
    # 遅延で分がズレても、下のcaseで枠時刻(JST)へ明示マップするので投稿枠は不変。
    - cron: '9 2 * * *'    # JST 11:00 枠（02:09 UTC・祝日）
    - cron: '31 7 * * *'   # JST 16:00 枠（07:31 UTC・平日）
    - cron: '21 9 * * *'   # JST 18:00 枠（09:21 UTC）
    - cron: '51 11 * * *'  # JST 20:00 枠（11:51 UTC）
  workflow_dispatch:
    inputs:
      datetime:
        description: "JST e.g. 2026-06-26 18:00 (empty=now)"
        required: false
        default: ""
      dry:
        description: "DRY (1=ON)"
        required: false
        default: "0"
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: susabiyu-remotion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python deps
        run: pip install google-api-python-client google-auth requests jpholiday Pillow boto3
      - name: Install Node deps
        run: npm ci
      - name: Write creds.json
        run: echo "$GOOGLE_CREDS_B64" | base64 -d > creds.json
        env:
          GOOGLE_CREDS_B64: ${{ secrets.GOOGLE_CREDS_B64 }}
      - name: Run post (gated)
        env:
          GOOGLE_CREDS_B64: ${{ secrets.GOOGLE_CREDS_B64 }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GENRE_FOOD_ID: ${{ secrets.GENRE_FOOD_ID }}
          GENRE_SAKE_ID: ${{ secrets.GENRE_SAKE_ID }}
          GENRE_INTERIOR_ID: ${{ secrets.GENRE_INTERIOR_ID }}
          GENRE_EVENT_ID: ${{ secrets.GENRE_EVENT_ID }}
          GENRE_MUSIC_UPTEMPO_ID: ${{ secrets.GENRE_MUSIC_UPTEMPO_ID }}
          GENRE_MUSIC_NORMAL_ID: ${{ secrets.GENRE_MUSIC_NORMAL_ID }}
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
          GH_MEDIA_TOKEN: ${{ secrets.GH_MEDIA_TOKEN }}
          GH_MEDIA_REPO: ${{ secrets.GH_MEDIA_REPO }}
          DRY: ${{ github.event.inputs.dry }}
          # 深夜投稿ガード：スケジュール実行時のみ有効。自動投稿は 10:00〜22:00 JST の外では出さない。
          # 手動 workflow_dispatch（アプリの「即投稿」）では未設定＝従来どおり時刻不問で投稿。
          POST_SCHED_GUARD: ${{ github.event.schedule && '1' || '' }}
          POST_WINDOW_FROM: "10"
          POST_WINDOW_TO: "22"
          SCHED: ${{ github.event.schedule }}
          INPUT_DT: ${{ github.event.inputs.datetime }}
        run: |
          # 手動datetime優先。スケジュールはcron→枠時刻(JST)へ明示マップ（cron分がズレても枠は不変）。
          DT="$INPUT_DT"
          if [ -z "$DT" ] && [ -n "$SCHED" ]; then
            D=$(date -u +%F)   # 全枠ともUTC日=JST日
            case "$SCHED" in
              "9 2 * * *")   DT="$D 11:00" ;;
              "31 7 * * *")  DT="$D 16:00" ;;
              "21 9 * * *")  DT="$D 18:00" ;;
              "51 11 * * *") DT="$D 20:00" ;;
            esac
          fi
          echo "対象日時(JST)=$DT"
          python post_approved.py creds.json "$DT"
      - name: 失敗をLINE通知
        if: failure()
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$LINE_CHANNEL_TOKEN" ] && exit 0
          curl -s -X POST https://api.line.me/v2/bot/message/broadcast \
            -H "Authorization: Bearer $LINE_CHANNEL_TOKEN" -H "Content-Type: application/json" \
            -d "{\"messages\":[{\"type\":\"text\",\"text\":\"⚠️ 自動投稿(susabiyu-post)が失敗しました。\n確認: $RUN_URL\"}]}" >/dev/null || true
