<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>他媒体の応募者</title>
<style>
  :root{--bg:#f5f6f8;--card:#fff;--card2:#f0f2f5;--fg:#1a1d21;--fg2:#3a3f45;--muted:#7a828b;--line:#e5e8ec;--accent:#2563eb;--accent2:#e8f0ff}
  @media (prefers-color-scheme:dark){:root{--bg:#0f1216;--card:#181c22;--card2:#20252c;--fg:#eef1f4;--fg2:#c7cdd4;--muted:#8b939c;--line:#2a3039;--accent:#4f8cff;--accent2:#1a2740}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;font-size:14px;line-height:1.5}
  header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;gap:10px}
  header a.back{color:var(--accent);text-decoration:none;font-size:22px;line-height:1}
  header h1{font-size:16px;margin:0;font-weight:800;flex:1}
  .wrap{max-width:640px;margin:0 auto;padding:12px}
  .tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
  .tab{flex:1;min-width:90px;padding:9px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-weight:700;font-size:12.5px;text-align:center;cursor:pointer}
  .tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .sbar{margin-bottom:10px}
  .sbar input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:14px}
  .grp{margin:14px 0 6px;font-weight:800;font-size:13px;color:var(--fg2);display:flex;align-items:center;gap:8px}
  .grp .cnt{color:var(--muted);font-weight:600;font-size:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:9px}
  .row1{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .nm{font-weight:800;font-size:15px}
  .kana{color:var(--muted);font-size:11.5px}
  .badge{display:inline-block;font-size:11px;padding:2px 7px;border-radius:999px;background:var(--accent2);color:var(--accent);font-weight:700}
  .meta{color:var(--fg2);font-size:12.5px;margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 12px}
  .contact{margin-top:7px;display:flex;gap:8px;flex-wrap:wrap}
  .contact a{text-decoration:none;font-size:12.5px;font-weight:700;padding:6px 10px;border-radius:8px;background:var(--card2);color:var(--fg);border:1px solid var(--line)}
  .pr{margin-top:8px;font-size:12.5px;color:var(--fg2);white-space:pre-wrap;max-height:3.6em;overflow:hidden;position:relative}
  .pr.open{max-height:none}
  .prtog{margin-top:4px;color:var(--accent);font-size:12px;cursor:pointer;font-weight:700}
  .date{color:var(--muted);font-size:12px;margin-left:auto}
  .empty{color:var(--muted);text-align:center;padding:40px 10px}
  /* PC（ワイド画面）最適化：モバイルは変えず、広い画面だけ幅拡張。メッセージ(フラット)は多列、応募者はグループを崩さず1列で広く。 */
  @media (min-width:820px){
    .wrap{max-width:1080px;padding:16px 22px}
    header{padding:14px 22px}
    #list.cols{column-width:360px;column-gap:16px}
    #list.cols>*{break-inside:avoid}
    .card:hover{border-color:var(--accent)}
    .tab{cursor:pointer}
  }
</style>
</head>
<body>
<header>
  <a class="back" href="?" title="戻る">‹</a>
  <h1 id="h1title">📋 他媒体の応募者</h1>
  <span id="tot" style="color:var(--muted);font-size:12px"></span>
</header>
<div class="wrap">
  <div class="tabs" id="modebar">
    <div class="tab on" data-mode="apps">👤 応募者</div>
    <div class="tab" data-mode="msgs">💬 スカウト・メッセージ</div>
  </div>
  <div id="appsbox">
    <div class="tabs" id="tabs"></div>
    <div class="sbar"><input id="q" type="search" placeholder="🔍 氏名・店舗・電話・メールで検索"></div>
  </div>
  <div id="msgsbox" style="display:none">
    <div class="sbar"><input id="mq" type="search" placeholder="🔍 店舗・本文で検索"></div>
  </div>
  <div id="list"></div>
</div>
<script>
  var DATA = (<?!= MEDIA ?>) || {items:[]};
  var ITEMS = (DATA.items||[]).map(function(x){ return x; });
  var MSGS = (<?!= MSGS ?>) || {items:[]};
  var MSGITEMS = MSGS.items||[];
  var MEDIA_ALL = '全媒体';
  var curMedia = MEDIA_ALL, curQ = '', mode = 'apps', curMQ = '', _msgInfo = '(未読込)';
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function mediaList(){ var s={}; ITEMS.forEach(function(x){ if(x['媒体']) s[x['媒体']]=1; }); return Object.keys(s).sort(); }
  function renderTabs(){
    var ms=[MEDIA_ALL].concat(mediaList());
    // curMediaが現在の媒体一覧に無ければ「全媒体」へ自己修復（表示0のガード）
    if(curMedia!==MEDIA_ALL && ms.indexOf(curMedia)<0) curMedia=MEDIA_ALL;
    var box=document.getElementById('tabs');
    box.innerHTML = ms.map(function(m){
      return '<div class="tab'+(m===curMedia?' on':'')+'" data-m="'+esc(m)+'">'+esc(m)+'</div>';
    }).join('');
    // ⚠️ 媒体タブだけにハンドラを付ける（#tabs配下限定）。全.tab を拾うと
    //    モードバー(👤/💬)のクリックまで奪って curMedia=null になり「表示0」になる。
    Array.prototype.forEach.call(box.querySelectorAll('.tab'),function(t){
      t.onclick=function(){ curMedia=t.getAttribute('data-m')||MEDIA_ALL; renderTabs(); render(); };
    });
  }
  function match(x){
    if(curMedia!==MEDIA_ALL && x['媒体']!==curMedia) return false;
    if(!curQ) return true;
    var hay=[x['氏名'],x['カナ'],x['店舗'],x['電話'],x['メール'],x['職種']].join(' ').toLowerCase();
    return hay.indexOf(curQ)>=0;
  }
  function render(){
    var rows=ITEMS.filter(match);
    document.getElementById('tot').textContent='全'+ITEMS.length+'件'+(rows.length!==ITEMS.length?'（表示'+rows.length+'）':'');
    if(!rows.length){ document.getElementById('list').innerHTML='<div class="empty">該当する応募者がいません</div>'; return; }
    // 店舗ごとにグループ
    var byStore={}, order=[];
    rows.forEach(function(x){ var s=x['店舗']||'（店舗不明）'; if(!byStore[s]){byStore[s]=[];order.push(s);} byStore[s].push(x); });
    var html=order.map(function(s){
      var cards=byStore[s].map(cardHtml).join('');
      return '<div class="grp">🏪 '+esc(s)+'<span class="cnt">'+byStore[s].length+'名</span></div>'+cards;
    }).join('');
    document.getElementById('list').innerHTML=html;
    Array.prototype.forEach.call(document.querySelectorAll('.prtog'),function(t){
      t.onclick=function(){ var p=t.previousElementSibling; p.classList.toggle('open'); t.textContent=p.classList.contains('open')?'閉じる':'…もっと見る'; };
    });
  }
  // 選考ステータスを色分け（未対応=赤/面接系=青/面接済=紫/採用=緑/見送り=灰）
  function statusStyle(s){
    s=String(s||'');
    if(/採用|内定/.test(s)) return 'background:#dcfce7;color:#166534';
    if(/見送|不採用|辞退|お断り/.test(s)) return 'background:#f1f5f9;color:#64748b';
    if(/未対応|要初回|未読|未返信/.test(s)) return 'background:#fee2e2;color:#b91c1c';
    if(/面接済|面接完了|1次面接済/.test(s)) return 'background:#ede9fe;color:#6d28d9';
    if(/面接|日程|調整|確定|連絡/.test(s)) return 'background:#dbeafe;color:#1d4ed8';
    return 'background:var(--accent2);color:var(--accent)';
  }
  function statusIcon(s){
    s=String(s||'');
    if(/採用|内定/.test(s)) return '✅';
    if(/見送|不採用|辞退|お断り/.test(s)) return '🚫';
    if(/未対応|要初回|未読|未返信/.test(s)) return '🔴';
    if(/面接済|面接完了|1次面接済/.test(s)) return '☑️';
    if(/面接|日程|調整|確定/.test(s)) return '📅';
    return '📌';
  }
  function cardHtml(x){
    var tel=String(x['電話']||'').replace(/[^\d]/g,'');
    var mail=String(x['メール']||'');
    var age=x['年齢']!==''&&x['年齢']!=null?(x['年齢']+'歳'):'';
    var meta=[x['雇用形態'],x['職種'],[age,x['性別']].filter(Boolean).join('・')].filter(Boolean).map(function(v){return esc(v);}).join('<span style="opacity:.4">|</span> ');
    var status=String(x['状況/資格']||'').trim();
    var pr=String(x['自己PR']||'').trim();
    var c='';
    c+='<div class="card">';
    c+='<div class="row1"><span class="nm">'+esc(x['氏名']||'（無名）')+'</span>'+(x['カナ']?'<span class="kana">'+esc(x['カナ'])+'</span>':'')+(status?'<span class="badge" style="'+statusStyle(status)+'">'+statusIcon(status)+' '+esc(status)+'</span>':'')+'<span class="date">'+esc(x['応募日時']||'')+'</span></div>';
    c+='<div style="font-size:12.5px;color:var(--fg2);margin-top:2px;font-weight:700">🏪 '+esc(x['店舗']||'（店舗不明）')+'</div>';
    c+='<div class="meta">'+meta+'</div>';
    c+='<div class="contact">';
    if(tel) c+='<a href="tel:'+tel+'">📞 '+esc(x['電話'])+'</a>';
    if(mail) c+='<a href="mailto:'+esc(mail)+'">✉️ メール</a>';
    c+='</div>';
    if(pr){ c+='<div class="pr">'+esc(pr)+'</div>'; if(pr.length>90) c+='<div class="prtog">…もっと見る</div>'; }
    c+='</div>';
    return c;
  }
  // 本文テキストを読みやすく整形：返信フォーム除去／「>>」を改行／文末で改行。
  function beautify(s){
    s=String(s||'');
    // 返信フォーム・テンプレ・サイトのフッター/メニュー以降を丸ごと落とす（最初に出てきた所で打ち切り）
    s=s.replace(/\s*(?:[^\n\s。、！？「」『』（）]{0,14}さんへメッセージを送る|は必須項目です|【記入例】|送信者\s*[:：]?|送信先\s*[:：]?|宛先\s*[:：]?|返信する|返信を送信|返信内容|テンプレート|利用規約|個人情報|運営会社|ページトップへ|このページの先頭|マイページ\s*求人管理トップ|各種サービス比較|飲食店ドットコムサービス|求人飲食店ドットコムとは)[\s\S]*$/,'');
    // 引用/区切りの >> ＞＞ を改行に
    s=s.replace(/[ \t　]*[>＞]{1,}[ \t　]*/g,'\n');
    // 文末（。！？）の後に文字が続く場合は改行（閉じ括弧が続く時は除く）
    s=s.replace(/([。！？])(?![\n」』）】])/g,'$1\n');
    // 各行の前後空白を除去
    var lines=s.split('\n').map(function(t){return t.replace(/^[ \t　]+|[ \t　]+$/g,'');});
    // 末尾のゴミ行（※ / 件名：、 / 単独の記号 / 空行）を落とす
    while(lines.length && /^(?:※+|件名\s*[:：]?\s*[、,]*|[。・…〜ー\-]+|)$/.test(lines[lines.length-1])) lines.pop();
    s=lines.join('\n').replace(/\n{3,}/g,'\n\n').trim();
    return s;
  }
  // 本文詳細（差出人 …受信日 …件名 …本文 …）を項目に分解して整形
  function parseMsgDetail(raw){
    raw=String(raw||''); var out={from:'',date:'',subj:'',body:'',ok:false};
    if(!raw) return out;
    var m, rest='';
    m=raw.match(/差出人\s*[:：]?\s*([^\n]*)/); if(m) out.from=m[1].trim();
    // 差出人が空/別ラベルを誤取得した場合は表示しない（「差出人：件名：…」等の崩れ防止）
    if(/件名|本文|受信日|送信日/.test(out.from) || out.from.length>24) out.from='';
    m=raw.match(/(?:受信日|送信日)\s*[:：]?\s*([^\n]*)/); if(m) out.date=m[1].trim();
    if(/件名|本文|差出人/.test(out.date) || out.date.length>40) out.date='';
    // 「本文」ラベルがあればそこ以降を本文、件名はその手前。無ければ件名以降を本文扱い（件名に本文が混ざる問題の解消）。
    var hasHon=false;
    m=raw.match(/本文\s*[:：]?\s*([\s\S]*)$/);
    if(m){ rest=m[1]; hasHon=true;
      var sm=raw.match(/件名\s*[:：]?\s*([\s\S]*?)\s*(?=本文)/); if(sm) out.subj=sm[1].replace(/\s+/g,' ').trim();
    } else {
      var km=raw.match(/件名\s*[:：]?\s*([\s\S]*)$/); rest = km ? km[1] : raw;
    }
    out.body=beautify(rest);
    // 本文ラベルが無い場合、先頭行が「短い件名」の時だけ件名に切り出す（長い本文は絶対に件名へ入れない）
    if(!hasHon && !out.subj && out.body){
      var fl=out.body.split('\n');
      var f=(fl[0]||'').trim();
      if(fl.length>1 && f.length<=60 && /^(?:Re:|RE:|re:|返信|【)/.test(f)){
        out.subj=f; out.body=fl.slice(1).join('\n').trim();
        // 件名に本文冒頭がくっついている場合は「）」で分割して本文へ戻す
        var pi=out.subj.indexOf('）');
        if(pi>0 && pi<out.subj.length-1){ var extra=out.subj.slice(pi+1).trim(); out.subj=out.subj.slice(0,pi+1).trim(); if(extra){ out.body=beautify(extra)+'\n'+out.body; } }
      }
    }
    // 保険：件名が長すぎる（本文が混ざった）時は、件名を本文へ戻して件名は空に＝ベタ書きを件名に出さない
    if(out.subj && out.subj.length>70){ out.body=beautify(out.subj)+'\n'+out.body; out.subj=''; }
    out.ok=!!(out.from||out.subj||out.body);
    return out;
  }
  function msgMatch(x){
    if(!curMQ) return true;
    return [x['店舗'],x['本文'],x['種別'],x['本文詳細']].join(' ').toLowerCase().indexOf(curMQ)>=0;
  }
  function renderMsgs(){
    var rows=MSGITEMS.filter(msgMatch);
    document.getElementById('tot').textContent='全'+MSGITEMS.length+'件'+(rows.length!==MSGITEMS.length?'（表示'+rows.length+'）':'');
    if(!rows.length){
      var hint = (MSGITEMS.length===0)
        ? ('まだスカウト/メッセージはありません。<br><span style="font-size:12px">飲食店ドットコムのメッセージは、PCの取得（RecruitAuto.bat）実行時に取り込まれます。受信箱に未読があるのに0のままなら、PCの <b>recruit_log.txt</b> の「<b>scout:</b>」の行（rows=◯）を確認してください。</span><br><span style="font-size:11px;opacity:.6">'+esc(_msgInfo)+'</span>')
        : '検索に一致するメッセージがありません';
      document.getElementById('list').innerHTML='<div class="empty">'+hint+'</div>'; return; }
    document.getElementById('list').innerHTML=rows.map(function(x){
      var scout=/スカウト|返答/.test(String(x['種別']||'')+String(x['本文']||''));
      var bg=scout?'background:#fde68a33;color:#b45309;':'';
      var c='<div class="card">';
      c+='<div class="row1"><span class="badge" style="'+bg+'">'+esc(x['種別']||'メッセージ')+'</span><span class="nm" style="font-size:13.5px">🏪 '+esc(x['店舗']||'（店舗不明）')+'</span><span class="date">'+esc(x['日時']||'')+'</span></div>';
      c+='<div class="pr open" style="margin-top:6px">'+esc(x['本文']||'')+'</div>';
      var d=parseMsgDetail(x['本文詳細']);
      if(d.from||d.subj||d.body){
        c+='<div style="margin-top:7px;padding:10px 12px;background:var(--card2);border:1px solid var(--line);border-radius:9px;font-size:13px;color:var(--fg)">';
        if(x['店舗']) c+='<div style="color:var(--muted);font-size:11.5px">店舗：<span style="color:var(--fg);font-weight:700">'+esc(x['店舗'])+'</span></div>';
        if(d.from) c+='<div style="color:var(--muted);font-size:11.5px;margin-top:2px">差出人：<span style="color:var(--fg);font-weight:700">'+esc(d.from)+'</span></div>';
        if(d.subj) c+='<div style="color:var(--muted);font-size:11.5px;margin-top:2px">件名：<span style="color:var(--fg2)">'+esc(d.subj)+'</span></div>';
        if(d.body) c+='<div style="margin-top:7px;padding-top:7px;border-top:1px dashed var(--line);white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.85;color:var(--fg2)">'+esc(d.body)+'</div>';
        c+='</div>';
      } else { var raw=beautify(x['本文詳細']);
        if(raw) c+='<div style="margin-top:7px;padding:9px 11px;background:var(--card2);border:1px solid var(--line);border-radius:9px;font-size:13px;color:var(--fg2);white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.85">💬 '+esc(raw)+'</div>';
      }
      c+='</div>';
      return c;
    }).join('');
  }
  function draw(){ if(mode==='msgs'){ renderMsgs(); } else { render(); } }
  function setMode(m){
    mode=m;
    document.getElementById('appsbox').style.display = (m==='apps')?'':'none';
    document.getElementById('msgsbox').style.display = (m==='msgs')?'':'none';
    document.getElementById('list').className = (m==='msgs')?'cols':'';  // メッセージはPCで多列、応募者はグループ維持で1列
    document.getElementById('h1title').textContent = (m==='msgs')?'💬 スカウト・メッセージ':'📋 他媒体の応募者';
    Array.prototype.forEach.call(document.querySelectorAll('#modebar .tab'),function(t){ t.className='tab'+(t.getAttribute('data-mode')===m?' on':''); });
    draw();
  }
  Array.prototype.forEach.call(document.querySelectorAll('#modebar .tab'),function(t){
    t.onclick=function(){ setMode(t.getAttribute('data-mode')); };
  });
  document.getElementById('q').addEventListener('input',function(){ curQ=this.value.trim().toLowerCase(); render(); });
  document.getElementById('mq').addEventListener('input',function(){ curMQ=this.value.trim().toLowerCase(); renderMsgs(); });
  renderTabs(); render();
  // サーバー埋め込みが空でも確実に出すため、開いた時にサーバーから直接読み込んで再描画する（キャッシュ無効）。
  try{
    if(window.google && google.script && google.script.run){
      _msgInfo='読込中…';
      google.script.run.withSuccessHandler(function(r){ if(r&&r.items){ ITEMS=r.items; renderTabs(); if(mode!=='msgs') render(); } })
        .withFailureHandler(function(e){})
        .mediaListPublic();
      google.script.run.withSuccessHandler(function(r){
          _msgInfo='ok='+(r&&r.ok)+' 件='+((r&&r.items&&r.items.length)||0)+((r&&r.error)?(' err='+r.error):'');
          if(r&&r.items){ MSGITEMS=r.items; }
          if(mode==='msgs') renderMsgs();
        })
        .withFailureHandler(function(e){ _msgInfo='読込失敗: '+((e&&e.message)||e); if(mode==='msgs') renderMsgs(); })
        .mediaMsgsPublic();
    } else { _msgInfo='この環境ではgoogle.script.run利用不可'; }
  }catch(e){ _msgInfo='読込例外: '+((e&&e.message)||e); }
</script>
</body>
</html>
