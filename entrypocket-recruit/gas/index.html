<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <style>
    :root {
      --bg:#0d1117; --card:#161d27; --card2:#1b2430; --line:#28323f; --line2:#33414f;
      --fg:#eef3f8; --fg2:#c3ccd6; --muted:#8593a1; --accent:#5aa2ff;
      --green:#3ec17f; --amber:#f6c343; --orange:#ff8a5c; --red:#ff6b6b; --purple:#b98be0;
      --warnbg:#2c1f18; --warnbd:#6b4a34;
    }
    * { box-sizing:border-box; min-width:0; -webkit-tap-highlight-color:transparent; }
    html,body { max-width:100%; overflow-x:hidden; }
    body { margin:0; background:var(--bg); color:var(--fg); line-height:1.5;
      font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
      font-size:15px; padding-bottom:40px; -webkit-font-smoothing:antialiased; }
    img { max-width:100%; }
    b { font-weight:700; }
    header { position:sticky; top:0; z-index:6; background:rgba(13,17,23,.92); backdrop-filter:blur(8px); padding:12px 15px 0; border-bottom:1px solid var(--line); }
    .htop { display:flex; align-items:center; justify-content:space-between; gap:8px; }
    header h1 { font-size:17px; margin:0; letter-spacing:.02em; }
    .updated { font-size:11px; color:var(--muted); margin-top:2px; }
    button.refresh { background:var(--accent); color:#08192e; border:0; border-radius:9px; padding:9px 15px; font-size:13px; font-weight:700; white-space:nowrap; }
    button.refresh:active { transform:scale(.96); } button.refresh:disabled { opacity:.5; }
    .tabs { display:flex; gap:2px; margin-top:12px; }
    .tabs button { flex:1; background:transparent; border:0; border-bottom:2.5px solid transparent; color:var(--muted); font-size:13.5px; font-weight:700; padding:10px 4px; transition:color .15s; }
    .tabs button.on { color:var(--fg); border-bottom-color:var(--accent); }
    main { padding:14px 15px; max-width:720px; margin:0 auto; width:100%; overflow-x:hidden; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:15px; margin-bottom:13px; }
    .card h2 { font-size:12px; color:var(--muted); margin:0 0 12px; font-weight:700; letter-spacing:.03em; }
    .muted { color:var(--muted); font-size:12px; }
    .empty { color:var(--muted); font-size:13px; text-align:center; padding:34px 12px; }
    .sec-h { font-size:11.5px; color:var(--muted); font-weight:700; letter-spacing:.03em; margin:16px 3px 9px; text-transform:none; }
    .sec-h:first-child { margin-top:2px; }
    .badge { font-size:10.5px; padding:2px 9px; border-radius:999px; white-space:nowrap; font-weight:700; line-height:1.7; }
    .badge.on { color:#06210f; background:var(--green); }
    .badge.rec { color:var(--amber); background:#312a13; }
    .badge.end { color:var(--muted); background:#222c38; }
    .badge.warn { color:#2a1400; background:var(--amber); }
    /* 未提出アラート */
    .alert { background:var(--warnbg); border:1px solid var(--warnbd); border-radius:14px; padding:14px 15px; margin-bottom:14px; }
    .al-h { font-size:15px; font-weight:800; color:var(--amber); display:flex; align-items:center; gap:6px; }
    .al-note { font-size:11.5px; color:#cbb08f; margin:5px 0 10px; }
    .al-row { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 0; border-top:1px solid var(--warnbd); }
    .al-nm { font-size:13.5px; overflow:hidden; } .al-nm b { color:var(--fg); } .al-nm .pd { color:#cbb08f; font-size:11px; display:block; margin-top:1px; }
    .btn-in { background:var(--orange); color:#2a1200; border-radius:9px; padding:9px 13px; font-size:12.5px; font-weight:800; text-decoration:none; white-space:nowrap; }
    .btn-in:active { transform:scale(.97); }
    .btn-in.sm { padding:5px 10px; font-size:11px; margin-left:auto; }
    .pr.unsub { border-color:var(--warnbd); background:#1c1712; }
    /* KPI */
    .kpis { display:flex; gap:9px; } .kpi { flex:1; text-align:center; background:var(--card2); border-radius:11px; padding:11px 4px; }
    .kpi .n { font-size:24px; font-weight:800; letter-spacing:-.01em; } .kpi .l { font-size:10.5px; color:var(--muted); margin-top:2px; }
    /* funnel & bars */
    .frow { display:flex; align-items:center; margin:7px 0; gap:10px; }
    .frow .nm { width:38px; font-size:12px; color:var(--muted); font-weight:600; }
    .bar { height:26px; border-radius:7px; min-width:2px; display:flex; align-items:center; padding:0 9px; color:#08131f; font-size:12px; font-weight:800; }
    .s応募{background:var(--accent);} .s接触{background:var(--green);} .s面接{background:var(--amber);} .s内定{background:var(--orange);} .s入社{background:var(--purple);color:#180a24;} .s終了{background:#6b7886;}
    .bd{display:flex;align-items:center;gap:9px;margin:7px 0;font-size:12.5px;}
    .bd .bl{width:96px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .bd .bb{flex:1;height:16px;background:#222c38;border-radius:6px;overflow:hidden;}
    .bd .bf{height:100%;background:linear-gradient(90deg,var(--accent),#7bb6ff);border-radius:6px;}
    .bd .bn{width:44px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700;}
    /* store card */
    .sc{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 15px; margin-bottom:11px; }
    .sc.tapped{ border-color:#3a628f; background:var(--card2); }
    .sc-top{ cursor:pointer; position:relative; padding-right:22px; }
    .chev{ position:absolute; right:0; top:2px; color:var(--muted); font-size:18px; transition:transform .2s; line-height:1; }
    .sc.tapped .chev{ transform:rotate(90deg); color:var(--accent); }
    .sc-h{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .sc-nm{ font-weight:800; font-size:16px; overflow-wrap:anywhere; letter-spacing:.01em; }
    .sc-sub{ font-size:12px; color:var(--muted); margin-top:5px; overflow-wrap:anywhere; }
    .sc-stat{ font-size:12.5px; color:var(--muted); margin-top:9px; display:flex; flex-wrap:wrap; gap:8px; }
    .sc-stat span{ background:var(--card2); border:1px solid var(--line); border-radius:8px; padding:4px 9px; }
    .sc.tapped .sc-stat span{ background:#141b25; }
    .sc-stat b{ color:var(--fg); font-weight:800; }
    .sc-body{ margin-top:13px; border-top:1px solid var(--line2); padding-top:12px; }
    .dl{ font-size:11px; color:var(--muted); font-weight:800; letter-spacing:.03em; margin:15px 0 8px; }
    .dl:first-child{ margin-top:0; }
    /* 店舗内 ステータス絞り込み */
    .sfil{ display:flex; flex-wrap:wrap; gap:7px; margin:2px 0 11px; }
    .sf{ border:1px solid var(--line2); background:#141b25; color:var(--fg2); border-radius:999px; padding:7px 13px; font-size:12.5px; font-weight:700; }
    .sf:active{ transform:scale(.97); }
    .sf b{ color:var(--fg); margin-left:3px; }
    .sf.on{ background:var(--accent); color:#08192e; border-color:var(--accent); } .sf.on b{ color:#08192e; }
    .sf.warn{ color:var(--amber); border-color:#4a4326; }
    .sf.warn.on{ background:var(--amber); color:#2a1400; border-color:var(--amber); } .sf.warn.on b{ color:#2a1400; }
    .warnchip{ color:var(--amber) !important; background:#312a13 !important; }
    .demo{ margin:2px 0 12px; padding:12px 13px; background:#10161f; border:1px solid var(--line); border-radius:11px; }
    .mb-t{ font-size:11px; color:var(--muted); font-weight:800; margin:12px 0 6px; } .demo .mb-t:first-child{ margin-top:0; }
    .ap.new{ border-left:3px solid var(--amber); }
    .tag.req{ background:#312a13; color:var(--amber); }
    /* posting row */
    .pr{ border:1px solid var(--line); border-radius:11px; padding:11px 13px; margin-bottom:9px; cursor:pointer; background:var(--card2); }
    .pr-h{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:14px; font-weight:700; }
    .pr-h .pd{ color:var(--muted); font-size:11.5px; font-weight:500; }
    .pr-sub{ font-size:12px; color:var(--fg2); margin-top:6px; overflow-wrap:anywhere; }
    .pr-stat{ font-size:12.5px; color:var(--muted); margin-top:8px; display:flex; flex-wrap:wrap; gap:7px; }
    .pr-stat span{ background:#141b25; border:1px solid var(--line); border-radius:7px; padding:3px 8px; }
    .pr-stat b{ color:var(--fg); font-weight:800; font-variant-numeric:tabular-nums; }
    .pr-more{ margin-top:9px; padding-top:9px; border-top:1px dashed var(--line2); font-size:12px; color:var(--fg2); }
    .pr-more .k{ color:var(--muted); }
    .pr-more div{ margin:4px 0; overflow-wrap:anywhere; white-space:pre-wrap; }
    /* applicant */
    .ap{ border:1px solid var(--line); border-radius:11px; padding:12px 13px; margin-bottom:9px; background:var(--card2); }
    .ap-nm{ font-weight:800; font-size:15px; }
    .ap-meta{ font-size:12.5px; color:var(--muted); font-weight:500; margin-left:7px; }
    .ap-sub{ font-size:12px; color:var(--fg2); margin-top:4px; overflow-wrap:anywhere; }
    .tag{ font-size:10px; padding:2px 7px; border-radius:5px; margin-left:6px; font-weight:700; } .tag.dup{ background:#4a2c2c; color:#ffb454; }
    .pills{ display:flex; gap:7px; flex-wrap:wrap; margin-top:9px; }
    .pill{ border:1px solid var(--line2); background:#141b25; color:var(--fg); border-radius:8px; padding:7px 11px; font-size:12.5px; font-weight:600; }
    .pill:active{ transform:scale(.97); }
    .pill.st{ color:var(--accent); border-color:#33506e; } .pill.memo{ color:var(--amber); border-color:#4a4326; }
    .acts{ display:flex; gap:8px; margin-top:11px; }
    .btn{ flex:1; text-align:center; border-radius:10px; padding:11px 5px; text-decoration:none; font-size:13.5px; font-weight:800; white-space:nowrap; }
    .btn:active{ transform:scale(.97); }
    .btn.call{ background:var(--green); color:#06210f; } .btn.sms{ background:var(--accent); color:#08192e; } .btn.mail{ background:var(--orange); color:#2a1200; }
    .btn.off{ background:#222c38; color:var(--muted); pointer-events:none; }
    .adetail{ margin-top:11px; padding:11px 12px; background:#10161f; border:1px solid var(--line); border-radius:10px; }
    .ent{ display:flex; gap:10px; font-size:12px; margin:5px 0; }
    .ent .ed{ color:var(--accent); white-space:nowrap; min-width:78px; font-weight:600; }
    .ent .eb{ flex:1; color:var(--fg2); overflow-wrap:anywhere; white-space:pre-wrap; }
    .cinfo{ font-size:12.5px; color:var(--fg2); overflow-wrap:anywhere; }
    .toast{ position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--card2); border:1px solid var(--line2); padding:11px 18px; border-radius:11px; font-size:13px; opacity:0; transition:opacity .3s; max-width:90%; box-shadow:0 6px 24px rgba(0,0,0,.4); }
    .toast.show{ opacity:1; }
  </style>
</head>
<body>
  <header>
    <div class="htop">
      <div><h1>求人進捗</h1><div class="updated" id="updated">読み込み中…</div></div>
      <button class="refresh" id="refreshBtn" onclick="doRefresh()">更新</button>
    </div>
    <div class="tabs">
      <button id="tb-recruit" class="on" onclick="showTab('recruit')">募集中</button>
      <button id="tb-history" onclick="showTab('history')">打ち出し履歴</button>
      <button id="tb-stats" onclick="showTab('stats')">集計</button>
    </div>
  </header>
  <main>
    <section id="tab-recruit"><div id="recruitList"><div class="empty">読み込み中…</div></div></section>
    <section id="tab-history" hidden><div id="historyList"><div class="empty">読み込み中…</div></div></section>
    <section id="tab-stats" hidden>
      <div class="card"><div class="kpis">
        <div class="kpi"><div class="n" id="kTotal">–</div><div class="l">応募者(現在)</div></div>
        <div class="kpi"><div class="n" id="kDup">–</div><div class="l">重複率</div></div>
        <div class="kpi"><div class="n" id="kNew">–</div><div class="l">最終取得</div></div>
      </div></div>
      <div class="card"><h2>ファネル</h2><div id="funnel"></div></div>
      <div class="card"><h2>ステータス別</h2><div id="bdStatus"></div></div>
      <div class="card"><h2>年齢層</h2><div id="bdAgeGroup"></div></div>
      <div class="card"><h2>性別</h2><div id="bdGender"></div></div>
      <div class="card"><h2>年齢（単年）</h2><div id="bdAge"></div></div>
    </section>
  </main>
  <div class="toast" id="toast"></div>
  <script>
    var STAGES=['応募','接触','面接','内定','入社','終了'], WD=['日','月','火','水','木','金','土'];
    var STORD=['未対応','新規','応募','連絡中','接触','面接予約済','面接','保留','内定','採用','入社','不採用（辞退）','辞退','不採用','終了'];
    function isUntreated(s){ return /未対応|新規/.test(String(s||'')); }
    function ageGroup(a){ var n=parseInt(String(a==null?'':a).replace(/[^\d]/g,''),10);
      if(!(n>=10&&n<=99)) return '不明'; if(n<20)return'〜19歳'; if(n<30)return'20代'; if(n<40)return'30代'; if(n<50)return'40代'; if(n<60)return'50代'; return'60代〜'; }
    var apps=[], storeManual={}, storePosting={}, postings=[], appByCode={}, RECS=[];
    var postByStore={}, appByStore={}, reportUrl='';

    function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(function(){t.classList.remove('show');},2600); }
    function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
    function normStore(s){ return String(s||'').replace(/^(?:【[^】]*】)+/,'').replace(/[\s　・･]/g,'').toLowerCase(); }
    function toDate(s){ if(s==null||s==='') return null; if(typeof s==='object'&&s.getTime) return isNaN(s.getTime())?null:s;
      var m=String(s).match(/(\d{4})\D(\d{1,2})\D(\d{1,2})(?:\D+(\d{1,2}):(\d{2}))?/); if(!m) return null;
      return new Date(+m[1],+m[2]-1,+m[3],+(m[4]||0),+(m[5]||0)); }
    function fmtD(s){ var d=toDate(s); if(!d) return s?esc(s):''; return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()+'('+WD[d.getDay()]+')'; }
    function fmtDT(s){ var d=toDate(s); if(!d) return s?esc(s):''; var hm=(String(s).match(/(\d{1,2}:\d{2})/)||['',''])[1];
      return (d.getMonth()+1)+'/'+d.getDate()+'('+WD[d.getDay()]+')'+(hm?(' '+hm):''); }
    function pct(v){ if(v==null||v==='') return ''; var s=String(v).trim();
      var hasP=/%/.test(s); var n=parseFloat(s.replace(/[^\d.\-]/g,'')); if(isNaN(n)) return '';
      if(!hasP && n<=1) n=n*100; return n.toFixed(2)+'%'; }
    function ageTxt(a){ var n=parseInt(String(a==null?'':a).replace(/[^\d]/g,''),10); return (n>=10&&n<=99)?(n+'歳'):''; }
    function fmtCost(v){ v=String(v==null?'':v).trim(); if(!v) return ''; return /[¥￥]/.test(v)?v:('¥'+v); }
    function has(v){ return v!==''&&v!=null; }
    function manOverride(man){ var s=String(man||'').trim(); if(!s) return null;
      if(/終了|停止|休止|クローズ|close|off|×|✕|ｘ/i.test(s)) return 'ended';
      if(/^(0|なし)$/i.test(s)) return 'ended';
      if(/中|継続|再開|募集|active|on|○|◯|〇/i.test(s)) return 'active';
      if(/^(1|あり)$/i.test(s)) return 'active'; return null; }

    function showTab(t){
      ['recruit','history','stats'].forEach(function(x){
        document.getElementById('tab-'+x).hidden = (x!==t);
        document.getElementById('tb-'+x).classList.toggle('on', x===t);
      });
      window.scrollTo(0,0);
    }
    function load(){ google.script.run.withSuccessHandler(render).withFailureHandler(function(e){document.getElementById('updated').textContent='取得失敗: '+(e&&e.message||'');}).dashData(); }
    function doRefresh(){
      var b=document.getElementById('refreshBtn'); b.disabled=true; b.textContent='取得中…'; toast('最新データを取得中（15秒ほど）');
      google.script.run.withSuccessHandler(function(r){ b.disabled=false; b.textContent='更新';
        if(r&&r.ok){ toast('取得完了'); load(); } else { toast('取得失敗'+(r&&r.error?': '+r.error:'')); }
      }).withFailureHandler(function(e){ b.disabled=false; b.textContent='更新'; toast('エラー: '+(e&&e.message||'')); }).dashRefresh();
    }

    function render(d){
      var dash=d.dash||{};
      apps=d.apps||[]; storeManual=d.storeManual||{}; storePosting=d.storePosting||{}; postings=d.postings||[]; reportUrl=d.reportUrl||'';
      appByCode={}; apps.forEach(function(a){ appByCode[a.code]=a; });
      postByStore={}; postings.forEach(function(p){ var k=normStore(p.store); (postByStore[k]=postByStore[k]||[]).push(p); });
      appByStore={}; apps.forEach(function(a){ var k=normStore(a.store); (appByStore[k]=appByStore[k]||[]).push(a); });

      document.getElementById('updated').textContent = d.last?('最終取得 '+esc(d.last.at)):(dash.generated_at||'未取得');
      renderRecruit();
      renderHistory();
      renderStats(dash, d.last);
    }

    /* ===== 未提出（掲載終了なのに結果が空）===== */
    function isUnsubmitted(p){ return p.state!=='募集中' && !has(p.apps) && !has(p.hires); }
    function unsubmittedPostings(){ return postings.filter(isUnsubmitted); }
    function alertHtml(){
      var u=unsubmittedPostings(); if(!u.length) return '';
      var rows=u.slice(0,50).map(function(p){
        return '<div class="al-row"><div class="al-nm"><b>'+esc(p.store)+'</b>'+
          '<span class="pd"> '+fmtD(p.start)+'〜'+fmtD(p.end)+' 終了</span></div>'+
          (reportUrl?'<a class="btn-in" href="'+esc(reportUrl)+'" target="_top">結果を入力 ▸</a>':'')+'</div>';
      }).join('');
      return '<div class="alert"><div class="al-h">⚠️ 結果報告 未提出 '+u.length+'件</div>'+
        '<div class="al-note">掲載が終わったのに応募・採用の結果が未入力です。「結果を入力」で報告スプレッドシートを開きます。</div>'+rows+'</div>';
    }

    /* ===== 募集中タブ（掲載中の求人だけ）===== */
    function renderRecruit(){
      var el=document.getElementById('recruitList');
      var keys={};
      Object.keys(storePosting).forEach(function(k){ if(storePosting[k].active) keys[k]=1; });
      Object.keys(storeManual).forEach(function(name){ if(manOverride(storeManual[name])==='active') keys[normStore(name)]=1; });
      RECS=Object.keys(keys).map(function(k){
        var sp=storePosting[k], appsArr=appByStore[k]||[];
        var name=(sp&&sp.name)||(appsArr[0]&&appsArr[0].store)||k;
        return { key:k, name:name, sp:sp||null, appsArr:appsArr };
      });
      RECS.sort(function(a,b){ if(!!a.sp!==!!b.sp) return a.sp?-1:1; return b.appsArr.length-a.appsArr.length; });
      var h=alertHtml();
      if(!RECS.length){ el.innerHTML=h+'<div class="empty">現在、掲載中の求人はありません</div>'; return; }
      RECS.forEach(function(r){ h+=storeCard(r); });
      el.innerHTML=h;
    }
    function storeCard(r){
      var i=RECS.indexOf(r);
      var sub = r.sp ? ('掲載 '+fmtD(r.sp.latestStart)+'〜'+(r.sp.latestEnd?fmtD(r.sp.latestEnd):'継続')+(r.sp.media?('　'+esc(r.sp.media)):''))
                     : '掲載中（手動設定）';
      var untreated=r.appsArr.filter(function(a){return isUntreated(a.status);}).length;
      var chips=[ '<span>現応募者<b>'+r.appsArr.length+'</b></span>' ];
      if(untreated) chips.unshift('<span class="warnchip">未対応<b>'+untreated+'</b></span>');
      var stat=chips.join('');
      return '<div class="sc" id="sc_'+i+'">'+
        '<div class="sc-top" onclick="stoggle('+i+')">'+
          '<span class="chev">›</span>'+
          '<div class="sc-h"><span class="sc-nm">'+esc(r.name)+'</span><span class="badge on">●募集中</span></div>'+
          '<div class="sc-sub">'+sub+'</div>'+
          '<div class="sc-stat">'+stat+'</div>'+
        '</div>'+
        '<div class="sc-body" id="sb_'+i+'" hidden></div>'+
      '</div>';
    }
    function stoggle(i){
      var body=document.getElementById('sb_'+i), card=document.getElementById('sc_'+i);
      if(!body) return;
      if(body.hidden){
        if(!body.getAttribute('data-built')){ RECS[i].af='all'; body.innerHTML=sbuild(i); body.setAttribute('data-built','1'); }
        body.hidden=false; card.classList.add('tapped');
      } else { body.hidden=true; card.classList.remove('tapped'); }
    }
    // ステータス絞り込みチップを押したとき（j<0=募集人数/すべて、それ以外=r.statuses[j]）
    function sSelect(i,j){ var r=RECS[i]; r.af=(j<0?'all':(r.statuses&&r.statuses[j])||'all'); document.getElementById('sb_'+i).innerHTML=sbuild(i); }
    // 店舗の中身：ステータス別カウント→絞り込み一覧、募集人数で属性内訳
    function sbuild(i){
      var r=RECS[i], af=r.af||'all';
      var arr=r.appsArr.slice().sort(function(a,b){ var ta=toDate(a.appliedAt), tb=toDate(b.appliedAt); return (tb?tb.getTime():0)-(ta?ta.getTime():0); });
      var counts={}; arr.forEach(function(a){ var s=a.status||'不明'; counts[s]=(counts[s]||0)+1; });
      var order=STORD.slice(); Object.keys(counts).forEach(function(s){ if(order.indexOf(s)<0) order.push(s); });
      r.statuses=order.filter(function(s){ return counts[s]; });
      // チップ（募集人数＝属性内訳、各ステータス＝一覧）
      var chips='<div class="sfil">';
      chips+='<button class="sf'+(af==='all'?' on':'')+'" onclick="sSelect('+i+',-1)">募集人数<b>'+arr.length+'</b></button>';
      r.statuses.forEach(function(s,j){
        var w=isUntreated(s)?' warn':'';
        chips+='<button class="sf'+w+(af===s?' on':'')+'" onclick="sSelect('+i+','+j+')">'+esc(s)+'<b>'+counts[s]+'</b></button>';
      });
      chips+='</div>';
      var demo = af==='all' ? demoHtml(arr) : '';
      var list = (af==='all') ? arr : arr.filter(function(a){ return (a.status||'不明')===af; });
      var lh = list.map(appCard).join('') || '<div class="muted">該当なし</div>';
      var pl=(postByStore[r.key]||[]).map(postingRow).join('') || '<div class="muted">打ち出しデータなし</div>';
      return chips+demo+'<div class="slist">'+lh+'</div>'+
        '<div class="dl">この店の打ち出し</div>'+pl;
    }
    // 属性内訳（性別・年齢・職業）
    function demoHtml(arr){
      var g={}, ag={}, oc={};
      arr.forEach(function(a){ g[a.gender||'不明']=(g[a.gender||'不明']||0)+1; var k=ageGroup(a.age); ag[k]=(ag[k]||0)+1; var o=a.occupation||'不明'; oc[o]=(oc[o]||0)+1; });
      return '<div class="demo">'+
        miniBars('性別', g, null, 0)+
        miniBars('年齢', ag, ['〜19歳','20代','30代','40代','50代','60代〜','不明'], 0)+
        miniBars('職業', oc, null, 6)+
      '</div>';
    }
    function miniBars(title, obj, order, limit){
      var keys=Object.keys(obj);
      if(order) keys.sort(function(a,b){ var ia=order.indexOf(a),ib=order.indexOf(b); ia=ia<0?99:ia; ib=ib<0?99:ib; return ia-ib; });
      else keys.sort(function(a,b){ return obj[b]-obj[a]; });
      if(limit) keys=keys.slice(0,limit);
      var max=1; keys.forEach(function(k){ max=Math.max(max,obj[k]); });
      var rows=keys.map(function(k){ var v=obj[k],w=Math.round(v/max*100);
        return '<div class="bd"><div class="bl">'+esc(k)+'</div><div class="bb"><div class="bf" style="width:'+w+'%"></div></div><div class="bn">'+v+'</div></div>'; }).join('');
      return '<div class="mb-t">'+title+'</div>'+rows;
    }

    /* ===== 打ち出し履歴タブ ===== */
    function renderHistory(){
      var el=document.getElementById('historyList');
      if(!postings.length){ el.innerHTML='<div class="empty">打ち出しデータがありません（次の取得で反映）</div>'; return; }
      el.innerHTML='<div class="card">'+postings.slice(0,300).map(postingRow).join('')+'</div>';
    }
    function postingRow(p){
      var id='pr'+(postingRow._i=(postingRow._i||0)+1);
      var unsub=isUnsubmitted(p);
      var badge = p.state==='募集中' ? '<span class="badge on">●募集中</span>'
                : (unsub ? '<span class="badge warn">結果未提出</span>' : '<span class="badge end">終了</span>');
      var inBtn = unsub&&reportUrl ? '<a class="btn-in sm" href="'+esc(reportUrl)+'" target="_top" onclick="event.stopPropagation()">結果を入力 ▸</a>' : '';
      var line=[esc(p.media||''), esc(p.plan||''), esc(fmtCost(p.cost))].filter(Boolean).join('　/　');
      var stat=[ (has(p.apps)?('応募<b>'+esc(p.apps)+'</b>'):''),
                 (has(p.hires)?('採用<b>'+esc(p.hires)+'</b>'):''),
                 (p.unit?('単価<b>'+esc(fmtCost(p.unit))+'</b>'):''),
                 (pct(p.hireRate)?('採用率<b>'+pct(p.hireRate)+'</b>'):''),
                 (has(p.quit)&&String(p.quit).replace(/[^\d]/g,'')!=='0'&&String(p.quit).replace(/[^\d]/g,'')!==''?('退職<b>'+esc(p.quit)+'</b>'+(pct(p.quitRate)?('/'+pct(p.quitRate)):'')):'')
               ].filter(Boolean).map(function(x){return '<span>'+x+'</span>';}).join('');
      var area=[esc(p.area1||''),esc(p.area2||'')].filter(Boolean).join(' / ');
      var line2=[esc(p.line1||''),esc(p.line2||'')].filter(Boolean).join(' / ');
      var more='';
      if(area||line2||p.reporter||p.note){
        more='<div class="pr-more" id="'+id+'" hidden>'+
          (area?'<div><span class="k">エリア：</span>'+area+'</div>':'')+
          (line2?'<div><span class="k">路線：</span>'+line2+'</div>':'')+
          (p.reporter?'<div><span class="k">報告者：</span>'+esc(p.reporter)+'</div>':'')+
          (p.note?'<div><span class="k">備考・退職理由：</span>\n'+esc(p.note)+'</div>':'')+
        '</div>';
      }
      return '<div class="pr'+(unsub?' unsub':'')+'" onclick="prtoggle(\''+id+'\')">'+
        '<div class="pr-h"><b>'+esc(p.store)+'</b>'+badge+'<span class="pd">'+fmtD(p.start)+'〜'+(p.end?fmtD(p.end):'継続')+'</span>'+inBtn+'</div>'+
        (line?'<div class="pr-sub">'+line+'</div>':'')+
        (stat?'<div class="pr-stat">'+stat+'</div>':'')+
        more+
      '</div>';
    }
    function prtoggle(id){ var el=document.getElementById(id); if(el) el.hidden=!el.hidden; }

    /* ===== 応募者カード（店舗ドリルダウン内） ===== */
    var TPL_SMS='{name}様\nこの度は【{store}】へご応募ありがとうございます。採用担当です。\n面接日程のご相談をさせていただきたくご連絡しました。ご都合のよい日時をご返信ください。';
    var TPL_MAIL_SUBJECT='【{store}】ご応募ありがとうございます';
    var TPL_MAIL_BODY='{name} 様\n\nこの度は【{store}】の求人へご応募いただき、誠にありがとうございます。採用担当です。\n\n面接日程についてご相談させていただきたく、ご連絡いたしました。下記より、ご都合のよい日時をお知らせください。\n\n・第1希望：\n・第2希望：\n・第3希望：\n\nご不明点がございましたら本メールへご返信ください。何卒よろしくお願いいたします。';
    function fillTpl(t,a){ return String(t).replace(/{name}/g,a.name||'').replace(/{store}/g,a.store||''); }
    function smsHref(a){ var num=String(a.telRaw||a.tel||'').replace(/[^\d+]/g,''); return num?('sms:'+num+'?body='+encodeURIComponent(fillTpl(TPL_SMS,a))):null; }
    function mailHref(a){ return a.email?('mailto:'+a.email+'?subject='+encodeURIComponent(fillTpl(TPL_MAIL_SUBJECT,a))+'&body='+encodeURIComponent(fillTpl(TPL_MAIL_BODY,a))):null; }
    function splitEntries(s){ s=String(s||'').trim(); if(!s) return [];
      var p=s.split(/\r?\n/).map(function(x){return x.trim();}).filter(Boolean);
      if(p.length<=1) p=s.split(/(?=\d{4}[\/年.\-]\d{1,2}[\/月.\-]\d{1,2})/).map(function(x){return x.trim();}).filter(Boolean); return p; }
    function parseEntry(e){ var m=e.match(/^\D*(\d{4})[\/年.\-](\d{1,2})[\/月.\-](\d{1,2})日?(?:[ 　T]*(\d{1,2})[:：](\d{2}))?[\)\]　 、\-]*(.*)$/);
      if(m){ var d=(+m[2])+'/'+(+m[3])+'('+WD[new Date(+m[1],+m[2]-1,+m[3]).getDay()]+')'+(m[4]?(' '+('0'+m[4]).slice(-2)+':'+m[5]):'');
        return {date:d, body:(m[6]||'').trim(), ts:new Date(+m[1],+m[2]-1,+m[3],+(m[4]||0),+(m[5]||0)).getTime()}; }
      return {date:'', body:e, ts:NaN}; }
    function summarize(s){ var e=splitEntries(s).map(parseEntry); if(e.length&&e.every(function(x){return !isNaN(x.ts);})) e.sort(function(a,b){return b.ts-a.ts;}); return e; }
    function entriesHtml(e){ if(!e.length) return '<div class="cinfo muted">記録なし</div>';
      return e.map(function(x){ return '<div class="ent"><div class="ed">'+esc(x.date||'―')+'</div><div class="eb">'+esc(x.body||'')+'</div></div>'; }).join(''); }
    function appDetail(a){ if(!a) return '';
      var hist=summarize(a.history), memo=summarize(a.memo);
      return '<div class="dl">ステータス変更履歴</div>'+entriesHtml(hist)+
        (memo.length?('<div class="dl">メモ</div>'+entriesHtml(memo)):'')+
        '<div class="dl">連絡先</div><div class="cinfo">☎ '+esc(a.telRaw||a.tel||'なし')+'　✉ '+esc(a.email||'なし')+'</div>'; }
    function atoggle(code){ var el=document.getElementById('ad_'+code); if(!el) return;
      if(el.hidden){ if(!el.getAttribute('data-built')){ el.innerHTML=appDetail(appByCode[code]); el.setAttribute('data-built','1'); } el.hidden=false; } else el.hidden=true; }
    function appCard(a){
      var id=esc(a.code);
      var meta=[ageTxt(a.age), a.gender].filter(Boolean).join('・');
      var metaS=meta?'<span class="ap-meta">'+esc(meta)+'</span>':'';
      var dup=a.dup?'<span class="tag dup">重複</span>':'';
      var req=isUntreated(a.status)?'<span class="tag req">要対応</span>':'';
      var occ=a.occupation?('💼 '+esc(a.occupation)):'';
      var stBtn='<button class="pill st" onclick="atoggle(\''+id+'\')">◆ '+esc(a.status||'状況不明')+' ▾</button>';
      var memoN=summarize(a.memo).length, memoBtn=memoN?('<button class="pill memo" onclick="atoggle(\''+id+'\')">📝 メモ'+memoN+' ▾</button>'):'';
      var sms=smsHref(a), mail=mailHref(a);
      var acts='<div class="acts">'+
        (a.telLink?'<a class="btn call" href="'+esc(a.telLink)+'">発信</a>':'<span class="btn off">TELなし</span>')+
        (sms?'<a class="btn sms" href="'+esc(sms)+'">SMS</a>':'<span class="btn off">SMS不可</span>')+
        (mail?'<a class="btn mail" href="'+esc(mail)+'">メール</a>':'<span class="btn off">メール無</span>')+'</div>';
      return '<div class="ap'+(isUntreated(a.status)?' new':'')+'"><div class="ap-nm">'+esc(a.name)+metaS+dup+req+'</div>'+
        (occ?'<div class="ap-sub">'+occ+'</div>':'')+
        '<div class="ap-sub">🕒 '+fmtDT(a.appliedAt)+(a.media?('　'+esc(a.media)):'')+'</div>'+
        '<div class="pills">'+stBtn+memoBtn+'</div>'+
        '<div class="adetail" id="ad_'+id+'" hidden></div>'+acts+'</div>';
    }

    /* ===== 集計タブ ===== */
    function renderStats(dash, last){
      document.getElementById('kTotal').textContent = dash.total!=null?dash.total:'–';
      document.getElementById('kDup').textContent = dash.duplicate_rate!=null? pct(dash.duplicate_rate) : '–';
      document.getElementById('kNew').textContent = last?last.n:'–';
      var f=dash.funnel||{}, max=1; STAGES.forEach(function(s){max=Math.max(max,f[s]||0);});
      document.getElementById('funnel').innerHTML=STAGES.map(function(s){ var v=f[s]||0,w=Math.round(v/max*100);
        return '<div class="frow"><div class="nm">'+s+'</div><div class="bar s'+s+'" style="width:'+Math.max(w,v?8:0)+'%">'+(v||'')+'</div></div>'; }).join('');
      renderBD('bdStatus', dash.by_status);
      renderBD('bdAgeGroup', dash.by_age_group, ['〜19歳','20代','30代','40代','50代','60代〜','不明']);
      renderBD('bdGender', dash.by_gender);
      renderBD('bdAge', dash.by_age, 'num');
    }
    function renderBD(id, obj, order){
      obj=obj||{}; var el=document.getElementById(id); if(!el) return;
      var keys=Object.keys(obj);
      if(order==='num') keys.sort(function(a,b){return (+a)-(+b);});
      else if(order&&order.length) keys.sort(function(a,b){var ia=order.indexOf(a),ib=order.indexOf(b); ia=ia<0?99:ia; ib=ib<0?99:ib; return ia-ib;});
      else keys.sort(function(a,b){return obj[b]-obj[a];});
      if(!keys.length){ el.innerHTML='<div class="empty">データなし</div>'; return; }
      var max=1; keys.forEach(function(k){max=Math.max(max,obj[k]);});
      el.innerHTML=keys.map(function(k){ var v=obj[k],w=Math.round(v/max*100);
        return '<div class="bd"><div class="bl">'+esc(order==='num'?k+'歳':k)+'</div><div class="bb"><div class="bf" style="width:'+w+'%"></div></div><div class="bn">'+v+'</div></div>'; }).join('');
    }

    load();
  </script>
</body>
</html>
