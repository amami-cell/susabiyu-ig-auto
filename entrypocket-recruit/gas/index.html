<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- アプリアイコン（GitHub Pagesで公開。差し替えは pwa-recruit/icons/ を置換してpush） -->
  <link rel="icon" type="image/png" sizes="32x32" href="https://amami-cell.github.io/susabiyu-media/recruit/icons/favicon-32.png?v=2">
  <link rel="icon" type="image/png" sizes="16x16" href="https://amami-cell.github.io/susabiyu-media/recruit/icons/favicon-16.png?v=2">
  <link rel="shortcut icon" type="image/png" href="https://amami-cell.github.io/susabiyu-media/recruit/icons/favicon-32.png?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="https://amami-cell.github.io/susabiyu-media/recruit/icons/apple-touch-icon-180.png?v=2">
  <link rel="manifest" href="https://amami-cell.github.io/susabiyu-media/recruit/manifest.webmanifest">
  <meta name="theme-color" content="#7c4dff">
  <style>
    :root {
      --bg:#0d1117; --card:#161d27; --card2:#1b2430; --line:#28323f; --line2:#33414f;
      --fg:#eef3f8; --fg2:#c3ccd6; --muted:#8593a1; --accent:#5aa2ff;
      --green:#3ec17f; --amber:#f6c343; --orange:#ff8a5c; --red:#ff6b6b; --purple:#b98be0;
      --warnbg:#2c1f18; --warnbd:#6b4a34;
    }
    /* ライトモード（設定で切替・端末保存） */
    :root[data-theme="light"] {
      --bg:#f4f6fa; --card:#ffffff; --card2:#eef2f7; --line:#dde3ec; --line2:#cbd4e0;
      --fg:#12181f; --fg2:#33414f; --muted:#6b7885; --accent:#2f6fe0;
      --green:#1f9d57; --amber:#b9860a; --orange:#e2683a; --red:#d84b4b; --purple:#7c53a8;
      --warnbg:#fff4e5; --warnbd:#e5c48a;
    }
    :root[data-theme="light"] header { background:rgba(244,246,250,.92) !important; }
    /* 文字サイズ（設定で切替・端末保存。zoomで全体を拡縮） */
    :root[data-fs="s"] body { zoom:.92; }
    :root[data-fs="l"] body { zoom:1.12; }
    /* 設定ポップオーバー */
    #setPop { position:fixed; top:56px; right:12px; z-index:60; background:var(--card); border:1px solid var(--line2); border-radius:12px; padding:12px; box-shadow:0 10px 30px rgba(0,0,0,.35); min-width:210px; }
    #setPop .setrow { margin:6px 0 10px; }
    #setPop .setlab { font-size:11px; color:var(--muted); margin-bottom:5px; }
    #setPop .setbtns { display:flex; gap:6px; }
    #setPop .setbtns button { flex:1; background:var(--card2); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:7px 4px; font-size:12px; font-weight:700; cursor:pointer; }
    #setPop .setbtns button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
    button.gear { background:var(--card2); color:var(--fg2); border:1px solid var(--line); border-radius:9px; padding:9px 11px; font-size:14px; line-height:1; white-space:nowrap; }
    /* 集計カードの折りたたみ */
    .card.collapsed > *:not(h2) { display:none; }
    .card.collapsed { padding-bottom:14px; }
    .card h2.h2c { cursor:pointer; }
    .statstoc button:active { transform:scale(.97); }
    * { box-sizing:border-box; min-width:0; -webkit-tap-highlight-color:transparent; }
    html,body { max-width:100%; overflow-x:hidden; }
    body { margin:0; background:var(--bg); color:var(--fg); line-height:1.5;
      font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
      font-size:15px; padding-bottom:40px; -webkit-font-smoothing:antialiased; }
    img { max-width:100%; }
    b { font-weight:700; }
    header { position:sticky; top:0; z-index:6; background:rgba(13,17,23,.92); backdrop-filter:blur(8px); padding:12px 15px 0; border-bottom:1px solid var(--line); }
    .htop { display:flex; align-items:center; justify-content:space-between; gap:8px; }
    header h1 { font-size:17px; margin:0; letter-spacing:.02em; }
    .updated { font-size:11px; color:var(--muted); margin-top:2px; }
    button.refresh { background:var(--accent); color:#08192e; border:0; border-radius:9px; padding:9px 15px; font-size:13px; font-weight:700; white-space:nowrap; }
    button.refresh:active { transform:scale(.96); } button.refresh:disabled { opacity:.5; }
    .tabs { display:flex; gap:2px; margin-top:12px; }
    .tabs button { flex:1; background:transparent; border:0; border-bottom:2.5px solid transparent; color:var(--muted); font-size:13.5px; font-weight:700; padding:10px 4px; transition:color .15s; }
    .tabs button.on { color:var(--fg); border-bottom-color:var(--accent); }
    main { padding:14px 15px; max-width:720px; margin:0 auto; width:100%; overflow-x:hidden; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:15px; margin-bottom:13px; }
    .card h2 { font-size:12px; color:var(--muted); margin:0 0 12px; font-weight:700; letter-spacing:.03em; }
    .muted { color:var(--muted); font-size:12px; }
    .empty { color:var(--muted); font-size:13px; text-align:center; padding:34px 12px; }
    .sec-h { font-size:11.5px; color:var(--muted); font-weight:700; letter-spacing:.03em; margin:16px 3px 9px; text-transform:none; }
    .sec-h:first-child { margin-top:2px; }
    .badge { font-size:10.5px; padding:2px 9px; border-radius:999px; white-space:nowrap; font-weight:700; line-height:1.7; }
    .badge.on { color:#06210f; background:var(--green); }
    .badge.rec { color:var(--amber); background:#312a13; }
    .badge.end { color:var(--muted); background:#222c38; }
    .badge.warn { color:#2a1400; background:var(--amber); }
    /* 未提出アラート */
    .alert { background:var(--warnbg); border:1px solid var(--warnbd); border-radius:14px; padding:14px 15px; margin-bottom:14px; }
    .al-h { font-size:15px; font-weight:800; color:var(--amber); display:flex; align-items:center; gap:6px; }
    .al-note { font-size:11.5px; color:#cbb08f; margin:5px 0 10px; }
    .al-row { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 0; border-top:1px solid var(--warnbd); }
    .al-nm { font-size:13.5px; overflow:hidden; } .al-nm b { color:var(--fg); } .al-nm .pd { color:#cbb08f; font-size:11px; display:block; margin-top:1px; }
    .btn-in { background:var(--orange); color:#2a1200; border-radius:9px; padding:9px 13px; font-size:12.5px; font-weight:800; text-decoration:none; white-space:nowrap; }
    .btn-in:active { transform:scale(.97); }
    .btn-in.sm { padding:5px 10px; font-size:11px; margin-left:auto; }
    .pr.unsub { border-color:var(--warnbd); background:#1c1712; }
    /* KPI */
    .kpis { display:flex; gap:9px; } .kpi { flex:1; text-align:center; background:var(--card2); border-radius:11px; padding:11px 4px; }
    .kpi .n { font-size:24px; font-weight:800; letter-spacing:-.01em; } .kpi .l { font-size:10.5px; color:var(--muted); margin-top:2px; }
    /* funnel & bars */
    .frow { display:flex; align-items:center; margin:7px 0; gap:10px; }
    .frow .nm { width:38px; font-size:12px; color:var(--muted); font-weight:600; }
    .bar { height:26px; border-radius:7px; min-width:2px; display:flex; align-items:center; padding:0 9px; color:#08131f; font-size:12px; font-weight:800; }
    .s応募{background:var(--accent);} .s接触{background:var(--green);} .s面接{background:var(--amber);} .s内定{background:var(--orange);} .s入社{background:var(--purple);color:#180a24;} .s終了{background:#6b7886;}
    .bd{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:13px;}
    .bd .bl{width:82px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;}
    .bd .bb{flex:1;height:20px;background:#1c2530;border-radius:6px;overflow:hidden;position:relative;}
    .bd .bf{height:100%;background:linear-gradient(90deg,var(--accent),#7bb6ff);border-radius:6px;min-width:3px;}
    .bd .bn{width:58px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
    .bd .bn b{font-weight:800;font-size:14px;} .bd .bn i{font-style:normal;color:var(--muted);font-size:11px;margin-left:4px;}
    /* store card */
    .sc{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 15px; margin-bottom:11px; }
    .sc.tapped{ border-color:#3a628f; background:var(--card2); }
    .sc-top{ cursor:pointer; position:relative; padding-right:22px; }
    .chev{ position:absolute; right:0; top:2px; color:var(--muted); font-size:18px; transition:transform .2s; line-height:1; }
    .sc.tapped .chev{ transform:rotate(90deg); color:var(--accent); }
    .sc-h{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .sc-nm{ font-weight:800; font-size:16px; overflow-wrap:anywhere; letter-spacing:.01em; }
    .sc-sub{ font-size:12px; color:var(--muted); margin-top:5px; overflow-wrap:anywhere; }
    .sc-stat{ font-size:12.5px; color:var(--muted); margin-top:9px; display:flex; flex-wrap:wrap; gap:8px; }
    .sc-stat span{ background:var(--card2); border:1px solid var(--line); border-radius:8px; padding:4px 9px; }
    .sc.tapped .sc-stat span{ background:#141b25; }
    .sc-stat b{ color:var(--fg); font-weight:800; }
    .sc-body{ margin-top:13px; border-top:1px solid var(--line2); padding-top:12px; }
    .dl{ font-size:11px; color:var(--muted); font-weight:800; letter-spacing:.03em; margin:15px 0 8px; }
    .dl:first-child{ margin-top:0; }
    /* 店舗内 ステータス絞り込み */
    .sfil{ display:flex; flex-wrap:wrap; gap:7px; margin:2px 0 11px; }
    .sf{ border:1px solid var(--line2); background:#141b25; color:var(--fg2); border-radius:999px; padding:7px 13px; font-size:12.5px; font-weight:700; }
    .sf:active{ transform:scale(.97); }
    .sf b{ color:var(--fg); margin-left:3px; }
    .sf.on{ background:var(--accent); color:#08192e; border-color:var(--accent); } .sf.on b{ color:#08192e; }
    .sf.warn{ color:var(--amber); border-color:#4a4326; }
    .sf.warn.on{ background:var(--amber); color:#2a1400; border-color:var(--amber); } .sf.warn.on b{ color:#2a1400; }
    .warnchip{ color:var(--amber) !important; background:#312a13 !important; }
    .demo{ margin:4px 0 8px; }
    .mb{ padding:11px 13px 9px; background:#10161f; border:1px solid var(--line); border-radius:11px; margin-bottom:9px; }
    .mb-t{ font-size:12.5px; color:var(--fg); font-weight:800; margin:0 0 9px; display:flex; align-items:center; gap:7px; }
    .mb-t::before{ content:''; width:9px; height:9px; border-radius:3px; background:var(--accent); flex:none; }
    .mb-t em{ font-style:normal; color:var(--muted); font-weight:700; font-size:11px; margin-left:auto; }
    .mb.g .mb-t::before{ background:var(--green); } .mb.g .bf{ background:linear-gradient(90deg,var(--green),#7ee0aa); }
    .mb.o .mb-t::before{ background:var(--purple); } .mb.o .bf{ background:linear-gradient(90deg,var(--purple),#d3b0ef); }
    .ap.new{ border-left:3px solid var(--amber); }
    .tag.req{ background:#312a13; color:var(--amber); }
    .stbtns{ display:flex; flex-wrap:wrap; gap:7px; margin-bottom:4px; }
    .stb{ border:1px solid var(--line2); background:#141b25; color:var(--fg); border-radius:8px; padding:8px 11px; font-size:12.5px; font-weight:700; }
    .stb:active{ transform:scale(.97); }
    .stb.cur{ background:var(--green); color:#06210f; border-color:var(--green); opacity:1; }
    /* 件数タイル（店舗詳細） */
    .sgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(84px,1fr)); gap:8px; margin:2px 0 4px; }
    .stile{ background:#141b25; border:1px solid var(--line2); border-radius:11px; padding:11px 6px; text-align:center; color:var(--fg); }
    button.stile:active{ transform:scale(.97); }
    .stile .sv{ font-size:19px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1.15; }
    .stile .sl{ font-size:10.5px; color:var(--muted); margin-top:3px; }
    .stile.on{ border-color:var(--accent); background:#12233a; }
    .stile.warn .sv{ color:var(--amber); } .stile.warn.on{ border-color:var(--amber); background:#2a2413; }
    /* 集計タイル（会社全体） */
    .mgrid{ display:grid; grid-template-columns:1fr 1fr; gap:9px; }
    .mtile{ background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:12px 13px; }
    .mtile.big{ grid-column:1 / -1; background:#12233a; border-color:#33506e; }
    .mtile .mv{ font-size:19px; font-weight:800; font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }
    .mtile.big .mv{ font-size:24px; color:var(--accent); }
    .mtile .ml{ font-size:11px; color:var(--muted); margin-top:2px; }
    /* posting row */
    .pr{ border:1px solid var(--line); border-radius:11px; padding:11px 13px; margin-bottom:9px; cursor:pointer; background:var(--card2); }
    .pr-h{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:14px; font-weight:700; }
    .pr-h .pd{ color:var(--muted); font-size:11.5px; font-weight:500; }
    .pr-sub{ font-size:12px; color:var(--fg2); margin-top:6px; overflow-wrap:anywhere; }
    .pr-stat{ font-size:12.5px; color:var(--muted); margin-top:8px; display:flex; flex-wrap:wrap; gap:7px; }
    .pr-stat span{ background:#141b25; border:1px solid var(--line); border-radius:7px; padding:3px 8px; }
    .pr-stat b{ color:var(--fg); font-weight:800; font-variant-numeric:tabular-nums; }
    .pr-more{ margin-top:9px; padding-top:9px; border-top:1px dashed var(--line2); font-size:12px; color:var(--fg2); }
    .pr-more .k{ color:var(--muted); }
    .pr-more div{ margin:4px 0; overflow-wrap:anywhere; white-space:pre-wrap; }
    .resform{ background:#0f151d; border:1px solid var(--line2); border-radius:10px; padding:11px; margin-bottom:9px; }
    .rf-grid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
    .rf-f label{ font-size:10.5px; color:var(--muted); display:block; margin-bottom:4px; }
    .rf-f input, .rf-ta{ width:100%; background:#0a0f16; border:1px solid var(--line2); color:var(--fg); border-radius:8px; padding:9px; font-size:15px; }
    .rf-l{ font-size:10.5px; color:var(--muted); display:block; margin:9px 0 4px; }
    .rf-ta{ min-height:58px; resize:vertical; white-space:pre-wrap; }
    .rf-save{ margin-top:10px; width:100%; background:var(--green); color:#06210f; border:0; border-radius:9px; padding:12px; font-size:13.5px; font-weight:800; }
    .rf-save:active{ transform:scale(.99); }
    .rf-hint{ font-size:10.5px; color:var(--muted); margin-top:6px; }
    /* applicant */
    .ap{ border:1px solid var(--line); border-radius:11px; padding:12px 13px; margin-bottom:9px; background:var(--card2); }
    .ap-nm{ font-weight:800; font-size:15px; }
    .ap-meta{ font-size:12.5px; color:var(--muted); font-weight:500; margin-left:7px; }
    .ap-sub{ font-size:12px; color:var(--fg2); margin-top:4px; overflow-wrap:anywhere; }
    .tag{ font-size:10px; padding:2px 7px; border-radius:5px; margin-left:6px; font-weight:700; } .tag.dup{ background:#4a2c2c; color:#ffb454; }
    .pills{ display:flex; gap:7px; flex-wrap:wrap; margin-top:9px; }
    .pill{ border:1px solid var(--line2); background:#141b25; color:var(--fg); border-radius:8px; padding:7px 11px; font-size:12.5px; font-weight:600; }
    .pill:active{ transform:scale(.97); }
    .pill.st{ color:var(--accent); border-color:#33506e; } .pill.memo{ color:var(--amber); border-color:#4a4326; }
    .acts{ display:flex; gap:8px; margin-top:11px; }
    .btn{ flex:1; text-align:center; border-radius:10px; padding:11px 5px; text-decoration:none; font-size:13.5px; font-weight:800; white-space:nowrap; }
    .btn:active{ transform:scale(.97); }
    .btn.call{ background:var(--green); color:#06210f; } .btn.sms{ background:var(--accent); color:#08192e; } .btn.mail{ background:var(--orange); color:#2a1200; }
    .btn.off{ background:#222c38; color:var(--muted); pointer-events:none; }
    .adetail{ margin-top:11px; padding:11px 12px; background:#10161f; border:1px solid var(--line); border-radius:10px; }
    .ent{ display:flex; gap:10px; font-size:12px; margin:5px 0; }
    .ent .ed{ color:var(--accent); white-space:nowrap; min-width:78px; font-weight:600; }
    .ent .eb{ flex:1; color:var(--fg2); overflow-wrap:anywhere; white-space:pre-wrap; }
    .cinfo{ font-size:12.5px; color:var(--fg2); overflow-wrap:anywhere; }
    .toast{ position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--card2); border:1px solid var(--line2); padding:11px 18px; border-radius:11px; font-size:13px; opacity:0; transition:opacity .3s; max-width:90%; box-shadow:0 6px 24px rgba(0,0,0,.4); }
    .toast.show{ opacity:1; }
    /* ===== 面接予定カレンダー ===== */
    .mnav{ display:flex; align-items:center; justify-content:center; gap:14px; margin:2px 0 12px; }
    .mnav button{ background:var(--card2); border:1px solid var(--line2); color:var(--fg); border-radius:9px; padding:6px 14px; font-size:16px; font-weight:800; }
    .mnav button:active{ transform:scale(.95); }
    .mnav .mlabel{ font-size:16px; font-weight:800; min-width:120px; text-align:center; }
    .schchips{ display:flex; flex-wrap:wrap; gap:6px; margin:0 0 12px; }
    .schchip{ border:1px solid var(--line2); background:#141b25; border-radius:999px; padding:5px 10px; font-size:11.5px; font-weight:700; display:flex; align-items:center; gap:6px; color:var(--fg); }
    .schchip .dot{ width:11px; height:11px; border-radius:3px; flex:none; }
    .schchip.off{ opacity:.38; }
    .schchip:active{ transform:scale(.97); }
    .cal{ display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
    .cal .dow{ text-align:center; font-size:10.5px; color:var(--muted); font-weight:700; padding:2px 0 4px; }
    .cal .dow.sun{ color:#ff9a9a; } .cal .dow.sat{ color:#9ab8ff; }
    .cell{ min-height:56px; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:3px 3px 4px; overflow:hidden; }
    .cell.blank{ background:transparent; border:0; min-height:0; }
    .cell.today{ border-color:var(--accent); background:#12203a; }
    .cell .dn{ font-size:10.5px; color:var(--muted); font-weight:800; line-height:1.1; }
    .cell.today .dn{ color:var(--accent); }
    .ev{ display:block; width:100%; text-align:left; border:0; border-radius:5px; padding:2px 4px; margin-top:3px; color:#0a1626; }
    .ev b{ font-size:9.5px; font-weight:800; } .ev .nm{ font-size:10.5px; font-weight:800; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .ev .evst{ font-size:9px; font-weight:700; opacity:.85; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .ev:active{ transform:scale(.97); }
    .cell.has{ cursor:pointer; -webkit-tap-highlight-color:transparent; }
    .cell.has:active{ transform:scale(.97); border-color:var(--accent); }
    .cell.has.today{ background:#12203a; }
    .cdots{ display:flex; flex-wrap:wrap; gap:3px; margin-top:5px; }
    .cdot{ width:9px; height:9px; border-radius:50%; flex:none; }
    .ccount{ margin-top:5px; font-size:10.5px; font-weight:800; color:var(--accent); line-height:1.1; }
    .lwrap{ overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 -2px; }
    .ltab{ width:100%; border-collapse:collapse; font-size:11.5px; min-width:340px; }
    .ltab th,.ltab td{ padding:6px 8px; border-bottom:1px solid var(--line); text-align:right; white-space:nowrap; }
    .ltab th{ color:var(--muted); font-weight:700; font-size:10.5px; }
    .ltab td:first-child,.ltab th:first-child{ text-align:left; }
    .ltab tbody tr:last-child td{ border-bottom:0; }
    .lnote{ color:var(--muted); font-size:11px; margin:2px 0 12px; line-height:1.6; }
    .lsub{ font-weight:800; font-size:13px; margin:16px 2px 7px; color:var(--fg2); }
    .ltab.hmap td,.ltab.hmap th{ padding:5px 3px; font-size:11px; }
    .ltab.hmap td{ border-bottom:1px solid var(--bg); }
    #report{ position:fixed; inset:0; background:var(--bg); z-index:100; overflow:auto; padding:16px 14px calc(28px + env(safe-area-inset-bottom)); display:none; }
    #report.show{ display:block; }
    #report .rep-bar{ display:flex; gap:8px; justify-content:flex-end; margin-bottom:10px; position:sticky; top:0; }
    #report .rep-bar button{ background:var(--accent); color:#fff; border:0; border-radius:9px; padding:9px 15px; font-size:13px; font-weight:700; cursor:pointer; }

<body>

  </main>
  <div id="report"></div>
  <div class="toast" id="toast"></div>
  <script>
    var STAGES=['応募','接触','面接','内定','入社','終了'], WD=['日','月','火','水','木','金','土'];
    var STORD=['未対応','新規','応募','連絡中','接触','面接予約済','面接','保留','内定','採用','入社','不採用（辞退）','辞退','不採用','終了'];
    function isUntreated(s){ return /未対応|新規/.test(String(s||'')); }
    function ageGroup(a){ var n=parseInt(String(a==null?'':a).replace(/[^\d]/g,''),10);
      if(!(n>=10&&n<=99)) return '不明'; if(n<20)return'〜19歳'; if(n<30)return'20代'; if(n<40)return'30代'; if(n<50)return'40代'; if(n<60)return'50代'; return'60代〜'; }
    var apps=[], storeManual={}, storePosting={}, postings=[], appByCode={}, RECS=[];
    var postByStore={}, appByStore={}, reportUrl='', postById={};
    var STORE_SCOPE=<?!= SCOPE ?>;   // 店長用ビュー時は店舗名（?store=…）。通常は空。
    var DASH={}, LAST=null, statYear='all', statRegion='all', liveShops=[], srMap={}, goalsMap={}, mediaWeeksMap={};
    // 媒体の標準週数から連載終了日を出す（開始日＋週数）。媒体未登録なら''。
    function mediaEndDate(startStr, media){ var w=mediaWeeksMap[String(media||'').trim()]; var d=toDate(startStr); if(!(w>0)||!d) return ''; return fmtYmd(new Date(d.getTime()+Math.round(w*7)*86400000)); }
    var statusMap={}, statusOrder=[], writeEnabled=false;
    function sameCode(a,b){ return parseInt(String(a),10)===parseInt(String(b),10); }

    function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(function(){t.classList.remove('show');},2600); }
    /* 表示設定（テーマ・文字サイズ）：端末に保存し、次回も反映 */
    var _prefTheme='dark', _prefFs='m';
    function _applyPrefs(){ try{ _prefTheme=localStorage.getItem('ep_theme')||'dark'; _prefFs=localStorage.getItem('ep_fs')||'m'; }catch(x){}
      var r=document.documentElement;
      if(_prefTheme==='light') r.setAttribute('data-theme','light'); else r.removeAttribute('data-theme');
      if(_prefFs!=='m') r.setAttribute('data-fs',_prefFs); else r.removeAttribute('data-fs'); }
    _applyPrefs();
    function _setSync(){ var p=document.getElementById('setPop'); if(!p) return;
      Array.prototype.forEach.call(p.querySelectorAll('[data-th]'),function(b){ b.classList.toggle('on', b.getAttribute('data-th')===_prefTheme); });
      Array.prototype.forEach.call(p.querySelectorAll('[data-fs]'),function(b){ b.classList.toggle('on', b.getAttribute('data-fs')===_prefFs); }); }
    function setTheme(v){ _prefTheme=v; try{ localStorage.setItem('ep_theme',v); }catch(x){} _applyPrefs(); _setSync(); }
    function setFs(v){ _prefFs=v; try{ localStorage.setItem('ep_fs',v); }catch(x){} _applyPrefs(); _setSync(); }
    function setToggle(){ var p=document.getElementById('setPop'); if(p){ p.parentNode.removeChild(p); return; }
      p=document.createElement('div'); p.id='setPop';
      p.innerHTML='<div class="setrow"><div class="setlab">テーマ</div><div class="setbtns">'+
        '<button data-th="dark" onclick="setTheme(\'dark\')">🌙 ダーク</button>'+
        '<button data-th="light" onclick="setTheme(\'light\')">☀️ ライト</button></div></div>'+
        '<div class="setrow"><div class="setlab">文字サイズ</div><div class="setbtns">'+
        '<button data-fs="s" onclick="setFs(\'s\')">小</button>'+
        '<button data-fs="m" onclick="setFs(\'m\')">中</button>'+
        '<button data-fs="l" onclick="setFs(\'l\')">大</button></div></div>'+
        '<div class="setrow"><div class="setlab">通知</div><div class="setbtns">'+
        '<button onclick="notifStoresOpen()">🔔 通知設定（店舗・種類）</button></div></div>'+
        (STORE_SCOPE?'':(function(){ var H='font-size:10.5px;color:var(--muted);margin-top:4px;line-height:1.5';
          return '<div class="setrow"><div class="setlab">取込：エントリーポケット</div><div class="setbtns">'+
          '<button onclick="openEpPage()">📱 スマホで取り込む</button>'+
          '<button onclick="doImportCsv()">📥 CSVファイル</button></div>'+
          '<div style="'+H+'">通常はPC起動時に自動取得。手動は「📱スマホで取り込む」→開いたEntryPocket画面でブックマーク「求人取り込み」を1タップ。</div></div>'+
          '<div class="setrow"><div class="setlab">取込：飲食店ドットコム</div><div class="setbtns">'+
          '<button onclick="openInshokuPage()">📱 スマホで取り込む</button>'+
          '<button onclick="doImportCsv(\'inshoku\')">📥 CSVファイル</button></div>'+
          '<div style="'+H+'">通常はPC起動時に自動取得。手動は「📱スマホで取り込む」→開いた応募者一覧でブックマーク「飲食店com取り込み」を1タップ。</div></div>'+
          '<div class="setrow"><div class="setlab">取込：グルメキャリー</div><div class="setbtns">'+
          '<button onclick="doGourmetRun()">🔄 今すぐ取得（クラウド）</button>'+
          '<button onclick="doImportCsv(\'gourmet\')">📥 CSVファイル</button></div>'+
          '<div style="'+H+'">毎日7:00/13:00にクラウドで自動取得（PC不要）。「🔄今すぐ取得」で今すぐクラウド実行→1〜2分で反映。</div></div>'+
          '<div class="setrow"><div class="setlab">他媒体の一覧</div><div class="setbtns">'+
          '<button onclick="openMediaPage()">📋 飲食店/グルメの応募者を見る</button></div></div>'+
          '<div class="setrow"><div class="setlab">セキュリティ</div><div class="setbtns">'+
          '<button onclick="armIngest()">🔐 取込を保護（上級・初回のみ）</button></div>'+
          '<div style="'+H+'">取込に合言葉を必須化し、外部からの不正なデータ投入を防ぎます。設定後は GitHub と PC にも同じ合言葉が必要（手順は使い方ガイドの「取込の保護」）。未設定なら今まで通り動きます。</div></div>'; })())+
        '<div class="setrow"><div class="setlab">ヘルプ</div><div class="setbtns">'+
        '<button onclick="openHelp()">❓ 使い方ガイド</button></div></div>';
      document.body.appendChild(p); _setSync(); }
    // 他媒体（飲食店ドットコム/グルメキャリー）の応募者一覧ページ（別ページ）を開く
    var EP_EXEC_URL='https://script.google.com/macros/s/AKfycbz6i36c7UjbM3S44kl1kEcsI0CSjYo9jL-W-T4BJUAr9jmBlVXj-vnQTUwQbGoxcHYT/exec';
    function openMediaPage(){ try{ window.open(EP_EXEC_URL+'?page=media','_blank'); }catch(e){ location.href=EP_EXEC_URL+'?page=media'; } }
    // スマホ保険：EntryPocketの応募者ページを開く→そこでブックマークレット「求人取り込み」を1タップ
    function openEpPage(){
      try{ window.open('https://manage.entrypocket.jp/web/8sin-saiyo/applicant','_blank'); }catch(e){}
      toast('EntryPocketを開きました。そのページで、ブックマーク「求人取り込み」を1タップしてください（数十秒後にこのアプリで最新化）。');
    }
    // スマホ保険：飲食店ドットコムの応募者一覧を開く→ブックマークレット「飲食店com取り込み」を1タップ
    function openInshokuPage(){
      try{ window.open('https://www.inshokuten.com/mypage/recruit/entry/list/','_blank'); }catch(e){}
      toast('飲食店ドットコムを開きました。その応募者一覧ページで、ブックマーク「飲食店com取り込み」を1タップしてください（数十秒後に最新化）。');
    }
    // グルメキャリー：クラウド(GitHub Actions)に取得を即時依頼（この場でワンタップ）
    var _gourmetBusy=false;
    function doGourmetRun(){
      if(_gourmetBusy){ toast('取得を実行中です。少しお待ちください。'); return; }  // 連打ガード
      _gourmetBusy=true;
      toast('クラウドに取得を依頼中…');
      google.script.run.withSuccessHandler(function(res){
        _gourmetBusy=false;
        if(res&&res.ok){ toast('✅ クラウドで取得を開始しました。1〜2分後にこのアプリへ反映されます（自動で最新化）。'); setTimeout(load, 90000); }
        else if(res&&(res.error==='no_token'||res.error==='token_invalid')){ askGhToken(res.error); }
        else if(res&&res.error==='rate_limited'){ toast('少し前に取得を実行しています。あと約'+(res.wait||60)+'秒お待ちください。'); }
        else if(res&&res.error==='workflow_not_found'){ toast('ワークフローが見つかりません（gourmet_fetch がmainに無い可能性）。'); }
        else { toast('依頼に失敗: '+((res&&res.error)||'unknown')); }
      }).withFailureHandler(function(e){ _gourmetBusy=false; toast('通信エラー: '+(e&&e.message||'')); }).epGourmetDispatch();
    }
    // 初回のみ：GitHubトークンを1回だけ登録（クラウド即時実行の権限。保存のみ・表示はしない）
    function askGhToken(reason){
      var msg=(reason==='token_invalid')
        ? 'GitHubトークンが無効/期限切れのようです。差し替えは安全のため管理者操作が必要です。担当にご連絡ください。'
        : '「今すぐ取得」を使うには、初回だけGitHubトークンの登録が必要です（1回だけ・無料）。\n作り方は使い方ガイドの「クラウド即時取得の設定」を参照。\n\nトークン(github_pat_ で始まる Fine-grained トークン)を貼り付け：';
      if(reason==='token_invalid'){ toast(msg); return; }  // 既存トークンの上書きは不可(write-once)。差し替えは管理操作。
      var t=window.prompt(msg,'');
      if(t==null) return;
      t=(''+t).trim(); if(!t){ toast('トークンが空です'); return; }
      toast('トークンを保存中…');
      google.script.run.withSuccessHandler(function(res){
        if(res&&res.ok){ toast('保存しました。もう一度「🔄今すぐ取得」を押してください。'); }
        else if(res&&res.error==='already_set'){ toast('トークンは登録済みです。差し替えたい時は担当にご連絡ください（安全のため保護）。'); }
        else { toast('保存に失敗: '+((res&&res.error)||'unknown')); }
      }).withFailureHandler(function(e){ toast('通信エラー: '+(e&&e.message||'')); }).epSetGhToken(t);
    }
    // 取込を保護（初回のみ）：サーバに取込キーを登録し、この端末にも保存。以後は外部からの不正投入を拒否。
    function armIngest(){
      var t=window.prompt('取込を保護します。合言葉(6文字以上・英数字)を決めて入力してください。\n\n※この後、同じ合言葉を GitHub Secret「RECRUIT_INGEST_KEY」と、PCの RecruitAuto.bat（初回に聞かれます）にも入れてください。手順は使い方ガイドへ。','');
      if(t==null) return; t=(''+t).trim();
      if(t.length<6){ toast('6文字以上にしてください'); return; }
      toast('保護を設定中…');
      google.script.run.withSuccessHandler(function(res){
        if(res&&res.ok){ try{localStorage.setItem('ep_ingest_key',t);}catch(e){} toast('✅ アプリ側を保護しました。次に GitHub Secret と PC(bat) に同じ合言葉を入れてください（入れるまで自動取得が止まります）。'); }
        else if(res&&res.error==='already_set'){ toast('すでに保護は設定済みです。差し替えは担当へご連絡ください。'); }
        else if(res&&res.error==='too_short'){ toast('6文字以上にしてください'); }
        else { toast('設定に失敗: '+((res&&res.error)||'unknown')); }
      }).withFailureHandler(function(e){ toast('通信エラー: '+(e&&e.message||'')); }).epSetIngestKey(t);
    }
    // 取込キー（この端末にのみ保存）。EP_INGEST_KEY をarm済みの時だけ必要。
    function _ingestKey(){ try{ return localStorage.getItem('ep_ingest_key')||''; }catch(e){ return ''; } }
    function askIngestKey(){
      var t=window.prompt('取込キーを入力してください（責任者が決めた合言葉。PC・GitHub・アプリで同じもの）：','');
      if(t==null) return false;
      t=(''+t).trim(); if(!t){ toast('キーが空です'); return false; }
      try{ localStorage.setItem('ep_ingest_key',t); }catch(e){}
      return true;
    }
    // 手動CSV取り込み（自動取得が止まっている時の代替。DLしたCSVをアップロード→蓄積して最新化）
    // media: 未指定/'ep'=エンポケ, 'inshoku'=飲食店ドットコム, 'gourmet'=グルメキャリー
    function doImportCsv(media){
      media=media||'ep';
      var inp=document.createElement('input'); inp.type='file'; inp.accept='.csv,text/csv';
      inp.onchange=function(){ var f=inp.files&&inp.files[0]; if(!f) return;
        toast('取り込み中…（少し時間がかかります）');
        var fr=new FileReader();
        fr.onload=function(){
          try{
            var bytes=new Uint8Array(fr.result), bin=''; for(var i=0;i<bytes.length;i++) bin+=String.fromCharCode(bytes[i]);
            var b64=btoa(bin);
            var send=function(){
              var key=_ingestKey();
              var ok=function(res){
                if(res&&res.ok){ toast('取り込み完了：応募'+res.rows+'件（新規'+(res.added!=null?res.added:0)+(res.changed!=null?'／変更'+res.changed:'')+'）'); var pp=document.getElementById('setPop'); if(pp)pp.parentNode.removeChild(pp); load(); }
                else if(res&&res.error==='forbidden'){ if(askIngestKey()){ send(); } else { toast('取込キーが必要です（設定で登録できます）'); } }
                else toast('取り込み失敗'+(res&&res.error?': '+res.error:''));
              };
              var fail=function(e){ toast('通信エラー: '+(e&&e.message||'')); };
              if(media==='inshoku'||media==='gourmet'){
                google.script.run.withSuccessHandler(ok).withFailureHandler(fail).mediaImportCsvB64(media,b64,key);
              } else {
                google.script.run.withSuccessHandler(ok).withFailureHandler(fail).epImportCsvB64(b64,key);
              }
            };
            send();
          }catch(x){ toast('読み込みエラー: '+(x&&x.message||'')); }
        };
        fr.readAsArrayBuffer(f);
      };
      inp.click();
    }
    // 使い方ガイド（オンボーディング）
    function openHelp(){
      var pop=document.getElementById('setPop'); if(pop) pop.parentNode.removeChild(pop);
      var sec=function(t,b){ return '<div style="margin:12px 0 4px;font-weight:800;font-size:14px">'+t+'</div><div style="font-size:13px;color:var(--fg2);line-height:1.7">'+b+'</div>'; };
      var html=
        '<div style="font-size:12px;color:var(--muted);margin-bottom:4px">このアプリは EntryPocket の応募を自動で取り込み、進捗・面接・集計を一目で見られるようにしたものです。取得は自動で1日5回。</div>'+
        sec('📋 募集中タブ','上部の「今日の要点」「今日のToDo」で当日の初動（未対応連絡・本日面接・結果未提出）を確認。🔍で応募者を横断検索。各店舗カードをタップで応募者一覧、募集終了ボタンで結果登録へ。')+
        sec('📅 面接タブ','面接予定をカレンダー/リストで表示。日付をタップでその日の面接一覧。📅カレンダーボタンで各自のGoogleカレンダーへ追加。')+
        sec('📊 集計タブ','上部の「目次」で見たい分析へジャンプ、見出しタップで折りたたみ。経営KPI・要注意店・データ品質・採用単価(加重/単純/中央値)・媒体別/店舗別・リスティング効果・リードタイム・定着率などを、年・地域フィルタ連動で確認。🖨レポート/⬇CSVで共有。')+
        sec('🔔 通知','⚙→通知する店舗で自店だけ通知にできます（ホーム画面アプリで有効）。新規応募・本日リマインド・週次の店舗スコアカードが届きます。')+
        sec('📥 取込（媒体別）','エンポケ・飲食店ドットコムは<b>PC起動時に自動取得</b>（PCの RecruitAuto.bat）。グルメキャリーは<b>毎日7:00/13:00にクラウド自動</b>。⚙の「取込」から手動もできます：エンポケ/飲食店＝「📱スマホで取り込む」（サイトを開いてブックマーク1タップ）、グルメ＝「🔄今すぐ取得（クラウド）」。どの媒体もDL済みCSVを選ぶ「📥CSVファイル」も可。')+
        sec('🔐 取込の保護（上級・任意）','外部からの不正なCSV投入を防ぎたい時に。⚙→セキュリティ→「🔐取込を保護」で合言葉(6文字以上)を決めると、以後その合言葉が無い取込は拒否されます。<b>設定したら、同じ合言葉を必ず次の2か所にも入れてください</b>（入れるまで自動取得が止まります）：<br>① GitHub → リポジトリ → Settings → Secrets and variables → Actions → New secret：名前 <b>RECRUIT_INGEST_KEY</b>、値＝その合言葉。<br>② PCの <b>RecruitAuto.bat</b> を一度ダブルクリック → 「Enter app ingest key」で同じ合言葉を入力。<br>※未設定なら今まで通り動きます（保護は任意）。差し替え・解除は担当へ。')+
        sec('🔄 クラウド即時取得の設定（グルメキャリーのみ・初回1回）','「🔄今すぐ取得」を初めて押すとトークン貼り付け画面が出ます。GitHubトークンの作り方：<br>① GitHub → 右上アイコン → Settings → 一番下 Developer settings → Personal access tokens → <b>Fine-grained tokens</b> → Generate new token。<br>② Repository access＝Only select repositories で <b>susabiyu-ig-auto</b> を選択。<br>③ Permissions → Repository permissions → <b>Actions</b> を <b>Read and write</b> に。<br>④ Generate して表示された文字列(github_pat_ で始まる Fine-grained トークン)をコピー → アプリの貼り付け画面へ。<br>※<b>権限は当該リポジトリのActionsのみ</b>の最小権限で。classic(ghp_)や広い権限のトークンは使わないでください。<br>※保存はこのアプリ内のみ・1回だけ（登録後の上書きは安全のため不可＝差し替えは担当へ）。使わない場合はPC/CSVでも取り込めます。')+
        sec('⚙ 表示設定','テーマ（ダーク/ライト）と文字サイズを変更できます（端末に保存）。')+
        sec('✅ データを正しく保つ','結果入力は 採用>応募 などの矛盾を保存前に警告。集計タブの「要マッピング」でスプシに無い店舗名（名寄せ漏れ）を確認できます。数値の正はスプレッドシートです。');
      document.getElementById('modalTitle').textContent='❓ 使い方ガイド';

    /* 通知する店舗の選択（アプリの通知prefsへ・ホーム画面アプリで有効） */
    function _allStoreNames(){ var seen={}, out=[]; function add(n){ if(!n) return; var k=normStore(n); if(k&&!seen[k]){ seen[k]=1; out.push(n); } }
      postings.forEach(function(p){ add(p.store); }); apps.forEach(function(a){ add(a.store); }); out.sort(function(a,b){ return a<b?-1:1; }); return out; }
    function _notifSel(){ try{ return JSON.parse(localStorage.getItem('ep_notif_stores')||'null'); }catch(x){ return null; } }
    function _notifTypes(){ try{ var t=JSON.parse(localStorage.getItem('ep_notif_types')||'null'); return t&&typeof t==='object'?t:{}; }catch(x){ return {}; } }

      var rows=names.map(function(n){ var on=all||selSet[normStore(n)];
        return '<label style="display:flex;align-items:center;gap:9px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:14px"><input type="checkbox" class="nfck" data-name="'+esc(n)+'" '+(on?'checked':'')+' style="width:18px;height:18px;flex:none">'+esc(n)+'</label>'; }).join('');

      var typeRows=TYPES.map(function(t){ return '<label style="display:flex;align-items:center;gap:9px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:14px"><input type="checkbox" class="nftype" data-k="'+t[0]+'" '+(_typeOn(ty,t[0])?'checked':'')+' style="width:18px;height:18px;flex:none"><span>'+t[1]+'<span style="color:var(--muted);font-size:11px;display:block">'+t[2]+'</span></span></label>'; }).join('');
      var ov=document.createElement('div'); ov.id='nfOv';
      ov.style.cssText='position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center';
      ov.onclick=function(e){ if(e.target===ov) nfClose(); };
      ov.innerHTML='<div style="background:var(--card);width:100%;max-width:520px;max-height:86vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px">'+
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><b style="font-size:15px">🔔 通知設定</b><span onclick="nfClose()" style="cursor:pointer;color:var(--muted);font-size:20px">✕</span></div>'+
        '<div class="muted" style="font-size:12px;margin-bottom:10px">この端末で受け取る通知を選べます。実際に届くのはホーム画面に追加した通知アプリ（🔔をオンにした端末）です。</div>'+
        '<div style="font-weight:800;font-size:13px;margin:6px 0 2px">通知の種類</div>'+
        typeRows+
        '<div style="font-weight:800;font-size:13px;margin:14px 0 2px">通知する店舗</div>'+
        '<div class="muted" style="font-size:11px;margin-bottom:6px">チェックした店舗の「新着応募」だけ届きます（種類でオフにした通知は届きません）。</div>'+
        '<div style="display:flex;gap:6px;margin-bottom:8px"><button onclick="nfAll(1)" style="flex:1;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card2);color:var(--fg);font-weight:700;font-size:12px">全選択</button>'+
        '<button onclick="nfAll(0)" style="flex:1;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card2);color:var(--fg);font-weight:700;font-size:12px">全解除</button></div>'+
        rows+
        '<button onclick="nfSave()" style="width:100%;margin-top:12px;background:var(--accent);color:#fff;border:0;border-radius:11px;padding:13px;font-size:15px;font-weight:700">保存</button></div>';
      document.body.appendChild(ov);

    function nfClose(){ var o=document.getElementById('nfOv'); if(o) o.parentNode.removeChild(o); }
    function nfAll(v){ Array.prototype.forEach.call(document.querySelectorAll('.nfck'),function(c){ c.checked=!!v; }); }
    function nfSave(){
      var all=document.querySelectorAll('.nfck'), sel=[], total=all.length, on=0;
      Array.prototype.forEach.call(all,function(c){ if(c.checked){ on++; sel.push(c.getAttribute('data-name')); } });
      var stores=(total>0&&on===total)?null:sel;   // 全部チェック＝全店舗（従来と同じ）
      var types={}; Array.prototype.forEach.call(document.querySelectorAll('.nftype'),function(c){ types[c.getAttribute('data-k')]=c.checked?1:0; });
      try{ localStorage.setItem('ep_notif_stores', JSON.stringify(stores)); }catch(x){}
      try{ localStorage.setItem('ep_notif_types', JSON.stringify(types)); }catch(x){}
      try{ if(window.parent&&window.parent!==window){ window.parent.postMessage({type:'ep_notif_prefs', stores:stores, types:types}, '*'); toast('通知設定を保存しました'); } else { toast('保存しました（通知はホーム画面アプリで反映されます）'); } }catch(x){ toast('保存しました'); }
      nfClose();
    }
    function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
    function normStore(s){ var t=String(s||''); try{ t=t.normalize('NFKC'); }catch(e){} return t.replace(/^(?:【[^】]*】)+/,'').replace(/[\s　・･]/g,'').toLowerCase(); }
    function toDate(s){ if(s==null||s==='') return null; if(typeof s==='object'&&s.getTime) return isNaN(s.getTime())?null:s;
      var m=String(s).match(/(\d{4})\D(\d{1,2})\D(\d{1,2})(?:\D+(\d{1,2}):(\d{2}))?/); if(!m) return null;
      return new Date(+m[1],+m[2]-1,+m[3],+(m[4]||0),+(m[5]||0)); }
    function fmtD(s){ var d=toDate(s); if(!d) return s?esc(s):''; return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()+'('+WD[d.getDay()]+')'; }
    function fmtDT(s){ var d=toDate(s); if(!d) return s?esc(s):''; var hm=(String(s).match(/(\d{1,2}:\d{2})/)||['',''])[1];
      return (d.getMonth()+1)+'/'+d.getDate()+'('+WD[d.getDay()]+')'+(hm?(' '+hm):''); }
    function pct(v){ if(v==null||v==='') return ''; var s=String(v).trim();
      var hasP=/%/.test(s); var n=parseFloat(s.replace(/[^\d.\-]/g,'')); if(isNaN(n)) return '';
      if(!hasP && n<=1) n=n*100; return n.toFixed(2)+'%'; }
    function ageTxt(a){ var n=parseInt(String(a==null?'':a).replace(/[^\d]/g,''),10); return (n>=10&&n<=99)?(n+'歳'):''; }
    function fmtCost(v){ v=String(v==null?'':v).trim(); if(!v) return '';
      var num=v.replace(/[¥￥,\s円]/g,'');
      if(num!=='' && !isNaN(num)) return yen(parseFloat(num));   // 数値は四捨五入・小数点なし・カンマ・¥
      return ''; }   // #DIV/0! 等の数値でない値は表示しない
    function has(v){ return v!==''&&v!=null; }
    function manOverride(man){ var s=String(man||'').trim(); if(!s) return null;
      if(/終了|停止|休止|クローズ|close|off|×|✕|ｘ/i.test(s)) return 'ended';
      if(/^(0|なし)$/i.test(s)) return 'ended';
      if(/中|継続|再開|募集|active|on|○|◯|〇/i.test(s)) return 'active';
      if(/^(1|あり)$/i.test(s)) return 'active'; return null; }

    function showTab(t){

    function load(){ google.script.run.withSuccessHandler(render).withFailureHandler(onLoadFail).dashData(STORE_SCOPE||''); }
    function onLoadFail(e){
      var raw=null; try{ raw=localStorage.getItem('ep_dash_cache'+(STORE_SCOPE?('_'+STORE_SCOPE):'')); }catch(x){}
      if(raw){ try{ var d=JSON.parse(raw); render(d); var u=document.getElementById('updated'); if(u) u.textContent='⚠ オフライン表示'+(d.last&&d.last.at?('（最終取得 '+d.last.at+'）'):'')+' — 通信が回復すると自動更新'; return; }catch(x){} }

        } else { toast('取得失敗'+(r&&r.error?': '+r.error:'')); }

    }
    // 打ち出しが0件のとき、取り込み元に何件あるかを確認して知らせる（原因切り分け）
    function diagPostings(){

        load();

                    : '→ 取り込み元にもデータがありません。元スプレッドシート/Notion側に打ち出しが入っているか確認が必要です。'));
      }).withFailureHandler(function(e){ load(); alert('取り込み元の確認に失敗: '+(e&&e.message||'')); }).dashDiagPostings();

    /* ===== 未提出（掲載終了なのに結果が空）===== */

    // 店舗が「求人結果報告(求人打ち出し)」に既にあるか

    // 「今日の要点」ホームパネル（未対応・本日/明日の面接・未提出・直近7日応募を一目で）
    function todayHomeHtml(){
      var now=Date.now(), D=86400000, nowD=new Date();
      var d0=new Date(nowD.getFullYear(),nowD.getMonth(),nowD.getDate()).getTime(), d1=d0+D;
      var un=untreatedList(), oldest=0;
      un.forEach(function(a){ var d=toDate(a.appliedAt); if(d){ var g=now-d.getTime(); if(g>oldest)oldest=g; } });
      var ivT=0, ivM=0;
      apps.forEach(function(a){ var di=toDate(a.interviewAt); if(!di) return; var day=new Date(di.getFullYear(),di.getMonth(),di.getDate()).getTime(); if(day===d0)ivT++; else if(day===d1)ivM++; });
      var unsub=(typeof unsubmittedPostings==='function')?unsubmittedPostings().length:0;

      var chip=function(t,c){ return '<span style="display:inline-block;border:1px solid '+c+';color:'+c+';border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;margin:3px 4px 0 0">'+t+'</span>'; };
      var s='';
      if(un.length) s+=chip('🔴 未対応 '+un.length+'件'+(oldest?'（最長'+(oldest>=D?Math.floor(oldest/D)+'日':Math.floor(oldest/3600000)+'h')+'）':''),'var(--red)');
      if(ivT) s+=chip('📅 本日の面接 '+ivT+'件','var(--accent)');

    // 今日のToDo（未対応連絡・本日面接・結果未提出をチェックリスト化。完了は端末に日付単位で保存＝毎日リセット）
    function _todoKey(){ var d=new Date(); return 'ep_todo_'+d.getFullYear()+('0'+(d.getMonth()+1)).slice(-2)+('0'+d.getDate()).slice(-2); }

    function todoToggle(id){ var m=_todoDone(); if(m[id]) delete m[id]; else m[id]=1; try{ localStorage.setItem(_todoKey(), JSON.stringify(m)); }catch(x){}
      var row=document.getElementById('td_'+id); if(row) row.style.opacity=m[id]?'.5':''; var box=document.getElementById('tb_'+id); if(box) box.textContent=m[id]?'✅':'⬜'; todoUpdateCount(); }
    function todoUpdateCount(){ var m=_todoDone(), all=document.querySelectorAll('[data-todo]'), done=0;
      Array.prototype.forEach.call(all,function(el){ if(m[el.getAttribute('data-todo')]) done++; });

    function todoHtml(){

      apps.forEach(function(a){ var di=toDate(a.interviewAt); if(!di) return; var day=new Date(di.getFullYear(),di.getMonth(),di.getDate()).getTime();
        if(day===d0) items.push({id:'iv_'+a.code, txt:'📅 面接: '+(a.name||'')+' '+schTime(a.interviewAt)+'（'+(a.store||'')+'）', click:"schDetail('"+esc(a.code)+"')"}); });

      return '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><h2 style="margin:0">今日のToDo</h2><span id="todoCount" style="font-size:12px;color:var(--muted)">'+doneN+'/'+items.length+' 完了</span></div>'+
        '<div style="background:var(--line);border-radius:5px;height:7px;overflow:hidden;margin-bottom:6px"><div id="todoBar" style="width:'+pct+'%;height:100%;background:var(--green)"></div></div>'+
        rows+'<div class="lnote" style="margin-top:6px">チェックは端末に保存され、日付が変わると自動リセット。連絡・面接はタップで詳細へ。</div></div>';
    }
    // 未対応アラートの対象＝新規/未対応 かつ 応募が直近この日数以内（古すぎる未対応は除外）
    var UNTREATED_ALERT_DAYS=10;
    function untreatedList(){ var mx=UNTREATED_ALERT_DAYS*86400000, now=Date.now();
      return apps.filter(function(a){ if(!isUntreated(a.status)) return false; var d=toDate(a.appliedAt); return !(d && (now-d.getTime())>mx); }); }
    // ⑥ 未対応（新規/未対応のまま）の応募アラート。放置時間つき・タップで詳細。
    function untreatedAlertHtml(){
      var now=Date.now();
      var un=untreatedList();
      if(!un.length) return '';
      un.sort(function(a,b){ var da=toDate(a.appliedAt),db=toDate(b.appliedAt); return (da?da.getTime():0)-(db?db.getTime():0); });
      var od=toDate(un[0].appliedAt), oh=od?Math.floor((now-od.getTime())/3600000):0;
      var age=function(h){ return h>=24?(Math.floor(h/24)+'日'):(h+'時間'); };
      var rows=un.slice(0,8).map(function(a){ var d=toDate(a.appliedAt), h=d?Math.floor((now-d.getTime())/3600000):0;
        return '<div class="prow" style="cursor:pointer" onclick="schDetail(\''+esc(a.code)+'\')">'+
          '<div class="pr-nm">'+esc(a.name||'(氏名なし)')+' <span class="warnchip" style="background:var(--warnbg);border-color:var(--warnbd);color:var(--amber)">'+age(h)+'</span></div>'+
          '<div class="pr-sub muted" style="font-size:12px">'+esc(a.store||'')+'　'+esc(a.status||'')+(d?'　'+fmtD(d):'')+'</div></div>'; }).join('');
      return '<div class="alert"><div class="al-h">🔴 未対応の応募 '+un.length+'件（最長 '+age(oh)+'放置）</div>'+
        '<div class="al-note">新規/未対応のままの応募です。早めの初回連絡を（タップで詳細）。</div>'+rows+
        (un.length>8?'<div class="rf-hint" style="margin-top:6px">ほか '+(un.length-8)+'件</div>':'')+'</div>';
    }
    // 長期応募なしで結果報告が“まだ無い”店舗＝未提出アラート（タップで結果入力）
    function dormantAlertHtml(list){
      if(!list.length) return '';
      return '<div class="alert"><div class="al-h">📋 結果報告 未提出（長期応募なし）'+list.length+'件</div>'+
        '<div class="al-note">最終応募から'+RECRUIT_DORMANT_DAYS+'日以上たち、結果報告がまだありません。タップして結果を入力してください（重複は作りません）。</div>'+
        list.map(function(r){ var i=RECS.indexOf(r);
          return '<div class="prow" style="cursor:pointer" onclick="endRecruitOpen('+i+')">'+
            '<div class="pr-nm">'+esc(r.name)+' <span class="warnchip" style="background:var(--warnbg);border-color:var(--warnbd);color:var(--amber)">'+dormantDays(r)+'日</span></div>'+
            '<div class="pr-sub muted" style="font-size:12px">最終応募 '+fmtD(new Date(r.latest))+' ・応募'+r.appsArr.length+'名　<span style="color:var(--amber)">タップで結果入力 ▾</span></div>'+
          '</div>'; }).join('')+'</div>';
    }

    /* ===== 募集中タブ（応募者ベース：直近に応募がある店舗＝募集中）===== */
    var RECRUIT_RECENT_DAYS=14;      // 直近この日数に応募がある店舗を「募集中」とみなす
    var RECRUIT_DORMANT_MAX_DAYS=180; // 応募がこの日数より古い店舗はもう扱わない（未提出アラートにも出さない）
    function renderRecruit(){
      var el=document.getElementById('recruitList');
      var now=Date.now();
      // EntryPocketの応募データから、店舗ごとの最新応募日時を出す
      var latest={}, nameOf={};
      apps.forEach(function(a){ var k=normStore(a.store); if(!k) return; if(a.store) nameOf[k]=a.store;
        var d=toDate(a.appliedAt), t=d?d.getTime():0; if(!latest[k]||t>latest[k]) latest[k]=t; });
      var keys={};
      // ★判定は「応募者(募集者)」ベース。EPの掲載中(原稿)は店舗ごとに何個もあり不明瞭なので判定に使わない。
      // 直近RECRUIT_DORMANT_MAX_DAYS以内に応募がある店舗を対象に拾う（45日以内＝募集中／超＝長期応募なし）。
      var maxCut=now-RECRUIT_DORMANT_MAX_DAYS*86400000;
      Object.keys(latest).forEach(function(k){ if(latest[k]>=maxCut) keys[k]=1; });
      // 手動上書き（master_店舗 F列 募集手動）：終了は外す・募集中は入れる（最後に適用＝終了が優先）
      Object.keys(storeManual).forEach(function(name){ var ov=manOverride(storeManual[name]), k=normStore(name);
        if(ov==='active') keys[k]=1; if(ov==='ended') delete keys[k]; });
      var liveSet={}; (liveShops||[]).forEach(function(nm){ liveSet[normStore(nm)]=1; });   // 掲載中バッジ表示用（判定には使わない）
      RECS=Object.keys(keys).map(function(k){
        var appsArr=appByStore[k]||[], sp=storePosting[k]||null;
        var name=nameOf[k]||(sp&&sp.name)||(appsArr[0]&&appsArr[0].store)||k;
        return { key:k, name:name, sp:sp, appsArr:appsArr, latest:latest[k]||0, live:!!liveSet[k] };
      });
      RECS.sort(function(a,b){ return (b.latest||0)-(a.latest||0); });                     // 最新応募順
      // 直近45日に応募あり＝募集中。45日超＝長期応募なし→結果報告へ（あればOK非表示／無ければ未提出アラート）。
      var active=[], dormNoResult=[];
      RECS.forEach(function(r){
        if(isDormant(r)){ if(!hasResultRow(r.key)) dormNoResult.push(r); }   // 結果報告あり→表示しない
        else active.push(r);
      });
      var autoHint='<div class="muted" style="font-size:11px;margin:2px 2px 8px;line-height:1.5">募集中＝直近'+RECRUIT_RECENT_DAYS+'日に応募がある店舗。最終応募から'+RECRUIT_DORMANT_DAYS+'日で自動的に結果報告へ移ります。すぐ確定したい店舗は「募集終了」ボタンを。</div>';
      var h=todayHomeHtml()+todoHtml()+
        '<button onclick="openSearch()" style="width:100%;margin:0 0 8px;background:var(--card2);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:11px;font-size:14px;cursor:pointer">🔍 応募者を検索（氏名・店舗・ステータス・媒体）</button>'+
        untreatedAlertHtml()+autoHint+alertHtml()+dormantAlertHtml(dormNoResult);
      if(!active.length && !dormNoResult.length){ el.innerHTML=h+'<div class="empty">現在、募集中の店舗はありません（直近'+RECRUIT_RECENT_DAYS+'日に応募なし）</div>'; return; }
      active.forEach(function(r){ h+=storeCard(r); });
      el.innerHTML=h;
    }
    var RECRUIT_DORMANT_DAYS=14;   // 最終応募からこの日数を超えたら「長期応募なし」＝結果報告未提出へ
    function dormantDays(r){ if(!r.latest) return 0; return Math.floor((Date.now()-r.latest)/86400000); }
    function isDormant(r){ return r.latest && dormantDays(r)>=RECRUIT_DORMANT_DAYS; }
    function storeCard(r){
      var i=RECS.indexOf(r);
      var sub = r.latest ? ((r.live?'掲載中・':'')+'最新応募 '+fmtD(new Date(r.latest))+'　現応募'+r.appsArr.length+'名')
                         : (r.live ? '掲載中（EntryPocket・応募なし）' : '募集中（手動設定）');
      var untreated=r.appsArr.filter(function(a){return isUntreated(a.status);}).length;
      var chips=[ '<span>現応募者<b>'+r.appsArr.length+'</b></span>' ];
      if(untreated) chips.unshift('<span class="warnchip">未対応<b>'+untreated+'</b></span>');
      var stat=chips.join('');
      return '<div class="sc" id="sc_'+i+'">'+
        '<div class="sc-top" onclick="stoggle('+i+')">'+
          '<span class="chev">›</span>'+
          '<div class="sc-h"><span class="sc-nm">'+esc(r.name)+'</span><span class="badge on">●募集中</span></div>'+
          '<div class="sc-sub">'+sub+'</div>'+
          '<div class="sc-stat">'+stat+'</div>'+
        '</div>'+
        '<div class="sc-body" id="sb_'+i+'" hidden></div>'+
      '</div>';
    }
    function stoggle(i){
      var body=document.getElementById('sb_'+i), card=document.getElementById('sc_'+i);
      if(!body) return;
      if(body.hidden){
        if(!body.getAttribute('data-built')){ RECS[i].af='all'; body.innerHTML=sbuild(i); body.setAttribute('data-built','1'); }
        body.hidden=false; card.classList.add('tapped');
      } else { body.hidden=true; card.classList.remove('tapped'); }
    }
    // タイルを押したとき（j<0=募集人数→属性内訳、それ以外=r.statuses[j]→一覧）。同じものを再度押すと閉じる。
    function sSelect(i,j){
      var r=RECS[i], target=(j<0?'all':(r.statuses&&r.statuses[j])||'all');
      r.af=(r.af===target?'none':target);
      document.getElementById('sb_'+i).innerHTML=sbuild(i);
    }
    // 店舗の中身：件数タイルに集約。タイルを押すと該当一覧／属性内訳を下に開く。
    function sbuild(i){
      var r=RECS[i], af=r.af||'none';
      var arr=r.appsArr.slice().sort(function(a,b){ var ta=toDate(a.appliedAt), tb=toDate(b.appliedAt); return (tb?tb.getTime():0)-(ta?ta.getTime():0); });
      var counts={}; arr.forEach(function(a){ var s=a.status||'不明'; counts[s]=(counts[s]||0)+1; });
      var order=STORD.slice(); Object.keys(counts).forEach(function(s){ if(order.indexOf(s)<0) order.push(s); });
      r.statuses=order.filter(function(s){ return counts[s]; });
      var tiles='<div class="sgrid">';
      tiles+='<button class="stile'+(af==='all'?' on':'')+'" onclick="sSelect('+i+',-1)"><div class="sv">'+arr.length+'</div><div class="sl">募集人数</div></button>';
      r.statuses.forEach(function(s,j){
        var w=isUntreated(s)?' warn':'';
        tiles+='<button class="stile'+w+(af===s?' on':'')+'" onclick="sSelect('+i+','+j+')"><div class="sv">'+counts[s]+'</div><div class="sl">'+esc(s)+'</div></button>';
      });
      tiles+='</div>';
      var below='';
      if(af==='all') below=demoHtml(arr)+'<div class="dl">応募者一覧（'+arr.length+'）</div>'+(arr.map(appCard).join('')||'<div class="muted">該当なし</div>');
      else if(af!=='none'){
        var list=arr.filter(function(a){ return (a.status||'不明')===af; });
        below='<div class="dl">'+esc(af)+'（'+list.length+'）</div>'+(list.map(appCard).join('')||'<div class="muted">該当なし</div>');
      }
      var endBtn = writeEnabled ? '<button class="endrec" onclick="endRecruitOpen('+i+')">■ 募集終了して結果を入力（スプシへ）</button>' : '';
      return endBtn+tiles+below;
    }
    /* ===== 募集終了 → 求人結果報告（スプシ/Notion）へ移行して結果入力 ===== */
    function fmtYmd(d){ return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
    // 文字列日付（"2026/05/25" 等）→ 入力欄用 yyyy-MM-dd。解釈できなければ元の文字列。
    function fmtYmd0(s){ var d=toDate(s); return d?fmtYmd(d):String(s||''); }
    function val(id){ var el=document.getElementById(id); return el?el.value:''; }
    // 募集終了モーダル：媒体または開始日が変わったら、媒体の標準週数で連載終了日を再計算（媒体未登録なら変えない）
    function erRecalcEnd(){ var e=mediaEndDate(val('er_start'), val('er_media')); if(e){ var el=document.getElementById('er_end'); if(el) el.value=e; } }
    // 既存の打ち出し行を狙う：未提出（結果未入力）を最優先、無ければ最新の行。重複を作らない。
    function existingPosting(r){
      var list=(postByStore[r.key]||[]).slice();
      if(!list.length) return null;
      var un=list.filter(isUnsubmitted);
      var pool=un.length?un:list;
      pool.sort(function(a,b){ var da=toDate(a.start),db=toDate(b.start); return (db?db.getTime():0)-(da?da.getTime():0); });
      return pool[0];
    }
    function endRecruitOpen(i){
      var r=RECS[i]; if(!r) return;
      var arr=r.appsArr||[];
      var ex=existingPosting(r);   // スプシに既にある同店舗の行（あれば上書き対象）
      r._srcSheet = ex ? ex.srcSheet : ''; r._srcRow = ex ? ex.srcRow : '';
      var times=arr.map(function(a){ var d=toDate(a.appliedAt); return d?d.getTime():0; }).filter(Boolean);
      // 既存行があれば期間はそれに合わせる（＝重複防止）。無ければEntryPocketの応募日から自動反映（開始=最初の応募／終了=最新の応募）。
      var start=(ex&&ex.start)?fmtYmd0(ex.start):(times.length?fmtYmd(new Date(Math.min.apply(null,times))):'');
      // 連載終了：既存行があればそれ／無ければ「媒体の標準週数」で開始日＋週数を自動セット／それも無ければ最新応募日
      var media0=(ex&&ex.media)?ex.media:'';
      var mEnd=mediaEndDate(start, media0);
      var end=(ex&&ex.end)?fmtYmd0(ex.end):(mEnd||(times.length?fmtYmd(new Date(Math.max.apply(null,times))):fmtYmd(new Date())));
      var apps=arr.length;
      var hires=arr.filter(function(a){ return sameCode(a.statusCode,'80')||a.status==='採用'; }).length;
      document.getElementById('modalTitle').textContent='募集終了：'+r.name;
      var f=function(lb,id,v){ return '<div class="rf-f"><label>'+lb+'</label><input id="'+id+'" type="text" inputmode="numeric" value="'+esc(v)+'"></div>'; };
      var ft=function(lb,id,v){ return '<div class="rf-f"><label>'+lb+'</label><input id="'+id+'" type="text" value="'+esc(v==null?'':v)+'"></div>'; };
      var fd=function(lb,id,v){ return '<div class="rf-f"><label>'+lb+'</label><input id="'+id+'" type="date" value="'+esc(v)+'"></div>'; };
      var xp=ex||{};
      var dupNote = ex
        ? '<div class="rf-hint" style="margin:6px 0;color:var(--accent)">既にスプシにある「'+esc(r.name)+'」の行を上書きします（重複は作りません）。</div>'
        : '<div class="rf-hint" style="margin:6px 0;color:var(--accent)">スプシに新しい結果行を追加します。</div>';
      document.getElementById('modalBody').innerHTML=
        '<div class="modal-when">この店舗を募集終了し、求人結果報告（スプシ→Notion）に登録します。採用率・単価は元スプシの数式で自動計算されます。</div>'+
        dupNote+
        '<button onclick="openQuoteReader('+i+')" style="width:100%;margin:2px 0 10px;background:var(--card2);border:1px dashed var(--accent);color:var(--accent);border-radius:10px;padding:11px;font-size:13px;font-weight:700;cursor:pointer">📄 見積書を読み取って自動入力（PDF）</button>'+
        '<label class="rf-l">求人情報（スプシへ反映）</label>'+
        '<div class="rf-grid"><div class="rf-f"><label>報告者</label><input id="er_reporter" type="text" value="'+esc(xp.reporter==null?'':xp.reporter)+'"></div>'+
          '<div class="rf-f"><label>求人媒体</label><input id="er_media" type="text" list="mediaList" value="'+esc(xp.media==null?'':xp.media)+'" onchange="erRecalcEnd()" oninput="erRecalcEnd()"></div></div>'+
        '<datalist id="mediaList">'+Object.keys(mediaWeeksMap).map(function(m){ return '<option value="'+esc(m)+'">'; }).join('')+'</datalist>'+
        '<div class="rf-f"><label>商品名（プラン）</label><input id="er_plan" type="text" value="'+esc(xp.plan==null?'':xp.plan)+'"></div>'+
        '<div class="rf-grid">'+f('エリアリスティング1週目','er_area1',xp.area1==null?'':xp.area1)+f('エリアリスティング2週目','er_area2',xp.area2==null?'':xp.area2)+'</div>'+
        '<div class="rf-grid">'+f('路線リスティング1週目','er_line1',xp.line1==null?'':xp.line1)+f('路線リスティング2週目','er_line2',xp.line2==null?'':xp.line2)+'</div>'+
        '<div class="rf-f"><label>求人費（税込）</label><input id="er_cost" type="text" inputmode="numeric" value="'+esc(xp.cost==null?'':xp.cost)+'"></div>'+
        '<label class="rf-l">連載期間（連載開始・連載終了日）</label>'+
        '<div class="rf-grid"><div class="rf-f"><label>連載開始</label><input id="er_start" type="date" value="'+esc(start)+'" onchange="erRecalcEnd()"></div>'+
          '<div class="rf-f"><label>連載終了</label><input id="er_end" type="date" value="'+esc(end)+'"></div></div>'+
        '<div class="rf-hint" style="margin:6px 0;color:var(--muted);font-size:11px">※応募人数・採用人数・連載開始日はエントリーポケットから自動反映。連載終了日は媒体の標準週数（master_媒体）で自動セット（媒体や開始日を変えると再計算・手動で上書きも可）。</div>'+
        '<div class="rf-grid">'+f('応募総数','er_apps',apps)+f('採用人数','er_hires',hires)+f('退職人数','er_quit','')+'</div>'+
        '<label class="rf-l">備考・退職理由</label><textarea class="rf-ta" id="er_note"></textarea>'+
        '<button class="rf-save" onclick="saveEndRecruit('+i+')">募集終了して結果を登録</button>'+
        '<button onclick="saveDraft('+i+')" style="width:100%;margin-top:8px;background:transparent;border:1px solid var(--green);color:var(--green);border-radius:9px;padding:10px;font-size:13px;font-weight:700;cursor:pointer">💾 一時保存（下書き・本登録しない）</button>'+
        '<div class="rf-hint" id="er_draftinfo" style="margin-top:5px">入力途中を保存できます。共有した人にも入力済みの内容が表示されます。</div>'+
        '<button onclick="copyEntryUrlR('+i+')" style="width:100%;margin-top:8px;background:transparent;border:1px solid var(--accent);color:var(--accent);border-radius:9px;padding:9px;font-size:12px;cursor:pointer">🔗 入力用URLをコピー（他の人に入力を依頼）</button>'+
        '<div class="rf-hint">URLを送れば、その人が入力欄だけ入力→そのまま求人結果に反映されます</div>'+
        '<div style="border-top:1px dashed var(--line);margin:12px 0 0;padding-top:10px">'+
          '<button onclick="dismissStore('+i+')" style="width:100%;background:transparent;border:1px solid var(--red);color:var(--red);border-radius:9px;padding:9px;font-size:12px;cursor:pointer">🗑 結果報告は不要（この店舗を削除）</button>'+
          '<div class="rf-hint" style="margin-top:6px">完全無料枠など、結果報告が不要な打ち出し用。登録せず削除するのでスプシ／Notionに残りません（要パスワード）。</div>'+
        '</div>';
      document.getElementById('modal').hidden=false;
      // 一時保存（下書き）があれば各欄へ復元
      google.script.run.withSuccessHandler(function(res){
        if(!(res&&res.ok&&res.draft)) return; var d=res.draft;
        ['reporter','media','plan','area1','area2','line1','line2','cost','start','end','apps','hires','quit','note'].forEach(function(f){
          var el=document.getElementById('er_'+f); if(el && d[f]!=null && String(d[f])!=='') el.value=d[f]; });
        var info=document.getElementById('er_draftinfo'); if(info) info.innerHTML='<span style="color:var(--green)">✓ 一時保存の内容を復元しました'+(res.at?('（'+esc(res.at)+'）'):'')+'</span>';
      }).epGetDraft(r.name);
    }
    // 一時保存（下書き）：本登録せず入力途中を保存。共有入力URLにも反映される。
    function saveDraft(i){
      var r=RECS[i]; if(!r) return;
      var o={ store:r.name, reporter:val('er_reporter'), media:val('er_media'), plan:val('er_plan'),
        area1:val('er_area1'), area2:val('er_area2'), line1:val('er_line1'), line2:val('er_line2'), cost:val('er_cost'),
        start:val('er_start'), end:val('er_end'), apps:val('er_apps'), hires:val('er_hires'), quit:val('er_quit'), note:val('er_note') };
      toast('一時保存中…');
      google.script.run.withSuccessHandler(function(res){
        if(res&&res.ok){ toast('一時保存しました（共有先にも反映）'); var info=document.getElementById('er_draftinfo'); if(info) info.innerHTML='<span style="color:var(--green)">✓ 一時保存しました'+(res.at?('（'+esc(res.at)+'）'):'')+'</span>'; }
        else toast('一時保存に失敗'+(res&&res.error?': '+res.error:''));

    function loadPdfJs(cb){
      if(window.pdfjsLib){ cb(); return; }
      var s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
      s.onload=function(){ try{ window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; }catch(e){} cb(); };
      s.onerror=function(){ cb('load-failed'); };

    function pdfText(file, cb){
      loadPdfJs(function(err){ if(err){ cb('PDFライブラリを読み込めませんでした（電波状況をご確認ください）'); return; }
        var fr=new FileReader();
        fr.onload=function(){ try{
          window.pdfjsLib.getDocument({data:new Uint8Array(fr.result)}).promise.then(function(pdf){
            var n=pdf.numPages, all=[], done=0;
            for(var p=1;p<=n;p++){ (function(pp){ pdf.getPage(pp).then(function(pg){ pg.getTextContent().then(function(tc){
              all[pp-1]=tc.items.map(function(it){ return it.str; }).join(' '); if(++done===n) cb(null, all.join('\n')); }); }); })(p); }
          }).catch(function(e){ cb('PDFを解析できませんでした: '+(e&&e.message||e)); });
        }catch(x){ cb('PDF解析エラー: '+(x&&x.message||x)); } };
        fr.readAsArrayBuffer(file);
      });

    // 見積書テキスト → フォーム値（媒体/プラン/エリア・路線リスティング名/求人費税込）
    function parseQuote(t){
      t=String(t||'').replace(/　/g,' ');
      var out={};
      var medias=['バイトル','マイナビバイト','マイナビ','タウンワーク','Indeed','indeed','求人ボックス','ジモティー','エンゲージ','engage','an','LINEバイト','ショットワークス','ジョブメドレー'];
      for(var i=0;i<medias.length;i++){ if(t.indexOf(medias[i])>=0){ out.media=medias[i]; break; } }
      var pm=t.match(/([0-9A-Za-zＡ-Ｚａ-ｚ一-龥ぁ-んァ-ヶー]{1,20}?プラン)/); if(pm){ out.plan=pm[1]; if(/ジョブブースト/.test(t)) out.plan+='（ジョブブースト適用）'; }
      var m, areas=[], reA=/エリアリスティング[\s\S]{0,14}?[（(]([^）)]{1,30})[）)]/g;
      while((m=reA.exec(t))){ areas.push(m[1].replace(/\s+/g,'').trim()); }
      if(areas[0]) out.area1=areas[0]; if(areas[1]) out.area2=areas[1];
      var lines=[], reL=/(?:沿線|路線)リスティング[\s\S]{0,14}?[（(]([^）)]{1,30})[）)]/g;
      while((m=reL.exec(t))){ lines.push(m[1].replace(/\s+/g,'').trim()); }
      if(lines[0]) out.line1=lines[0]; if(lines[1]) out.line2=lines[1];
      var amts=(t.match(/(?:[¥￥]\s*)?[0-9]{1,3}(?:,[0-9]{3})+/g)||[]).map(function(s){ return parseInt(s.replace(/[^\d]/g,''),10)||0; });
      if(amts.length) out.cost=Math.max.apply(null,amts);
      return out;
    }

      var map={reporter:'er_reporter',media:'er_media',plan:'er_plan',area1:'er_area1',area2:'er_area2',line1:'er_line1',line2:'er_line2',cost:'er_cost'};
      var filled=[];
      Object.keys(map).forEach(function(k){ if(o[k]!=null&&String(o[k])!==''){ var el=document.getElementById(map[k]); if(el){ el.value=o[k]; filled.push(k); } } });
      if(typeof erRecalcEnd==='function') erRecalcEnd();

      var finish=function(text){ var o=parseQuote(text); var n=qrApply(o);

        else { qrMsg('うまく読み取れませんでした。文字を貼り付けて再度お試しください。'); } };
      if(pasted){ finish(pasted); return; }

    function dupePostings(){
      var DEF=21*86400000;  // 掲載終了が不明な行は約3週間の打ち出しとみなす
      var by={}; postings.forEach(function(p){ var k=normStore(p.store); if(k) (by[k]=by[k]||[]).push(p); });
      var out=[];
      Object.keys(by).forEach(function(k){ var arr=by[k]; if(arr.length<2) return;
        var flagged=[];
        for(var i=0;i<arr.length;i++) for(var j=i+1;j<arr.length;j++){

          var e1=toDate(arr[i].end)||new Date(s1.getTime()+DEF), e2=toDate(arr[j].end)||new Date(s2.getTime()+DEF);
          if(s1<=e2 && s2<=e1){ if(flagged.indexOf(arr[i])<0)flagged.push(arr[i]); if(flagged.indexOf(arr[j])<0)flagged.push(arr[j]); }

    /* ===== 応募者カード（店舗ドリルダウン内） ===== */
    var TPL_SMS='{name}様\nこの度は【{store}】へご応募ありがとうございます。採用担当です。\n面接日程のご相談をさせていただきたくご連絡しました。ご都合のよい日時をご返信ください。';

    function copyText(t){ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(function(){toast('コピーしました');},function(){prompt('コピーしてください',t);}); } else prompt('コピーしてください',t); }

    function mailHref(a){ return a.email?('mailto:'+a.email+'?subject='+encodeURIComponent(fillTpl(TPL_MAIL_SUBJECT,a))+'&body='+encodeURIComponent(fillTpl(TPL_MAIL_BODY,a))):null; }
    function splitEntries(s){ s=String(s||'').trim(); if(!s) return [];
      var p=s.split(/\r?\n/).map(function(x){return x.trim();}).filter(Boolean);
      if(p.length<=1) p=s.split(/(?=\d{4}[\/年.\-]\d{1,2}[\/月.\-]\d{1,2})/).map(function(x){return x.trim();}).filter(Boolean); return p; }
    function parseEntry(e){ var m=e.match(/^\D*(\d{4})[\/年.\-](\d{1,2})[\/月.\-](\d{1,2})日?(?:[ 　T]*(\d{1,2})[:：](\d{2}))?[\)\]　 、\-]*(.*)$/);

    function summarize(s){ var e=splitEntries(s).map(parseEntry); if(e.length&&e.every(function(x){return !isNaN(x.ts);})) e.sort(function(a,b){return b.ts-a.ts;}); return e; }

    // 同一連絡先（電話/メール）の応募を検知して二重連絡を防ぐ
    var _dupIndex=null;

    }
    function dupPeers(a){ var m=_dupIndex||buildDupIndex(), set={}, out=[];
      var t=String(a.telRaw||a.tel||'').replace(/[^\d]/g,''), em=String(a.email||'').trim().toLowerCase();

    // 面接をGoogleカレンダーに追加するリンク（権限不要・タップで各自のカレンダーに登録）

    /* ===== 面接予定カレンダー ===== */
    var SCHPAL=['#5aa2ff','#3ec17f','#f6c343','#ff8a5c','#b98be0','#4dd0e1','#ff6f91','#a3c644','#e08b4d','#8aa0ff','#5ec7a8','#e6b800'];
    var schY=null, schM=null, schSel={}, schStores=[], schView='cal';
    function schSetView(v){ schView=v; renderSchedule(); }
    function schTime(s){ var m=String(s||'').match(/(\d{1,2}):(\d{2})/); return m?(('0'+m[1]).slice(-2)+':'+m[2]):''; }
    function schColorOf(key){ for(var i=0;i<schStores.length;i++){ if(schStores[i].key===key) return schStores[i].color; } return '#8aa0ff'; }
    // 打ち出し中の店舗 {key:表示名}
    function advertisedNames(){
      var out={};
      Object.keys(storePosting).forEach(function(k){ var r=storePosting[k]; if(r.active&&r.name) out[normStore(r.name)]=r.name; });
      Object.keys(storeManual).forEach(function(name){ if(manOverride(storeManual[name])==='active') out[normStore(name)]=name; });
      return out;
    }
    // 面接日時のある応募者を予定に
    function schedEvents(){
      var evs=[];
      apps.forEach(function(a){ var d=toDate(a.interviewAt); if(!d) return;
        evs.push({ y:d.getFullYear(), mo:d.getMonth(), da:d.getDate(), t:schTime(a.interviewAt),
          code:String(a.code), name:a.name||'(氏名なし)', store:a.store||'不明', key:normStore(a.store||'不明'), app:a });
      });
      return evs;
    }
    // 店舗リスト（打ち出し中→その後、面接予定のある店舗）＋色＋既定選択
    function schBuildStores(){
      var adv=advertisedNames(), advKeys=Object.keys(adv), names={};
      advKeys.forEach(function(k){ names[k]=adv[k]; });
      schedEvents().forEach(function(e){ if(!names[e.key]) names[e.key]=e.store; });
      var other=Object.keys(names).filter(function(k){ return advKeys.indexOf(k)<0; }).sort(function(a,b){ return names[a]<names[b]?-1:1; });
      var ordered=advKeys.concat(other);
      schStores=ordered.map(function(k,i){ return { key:k, name:names[k], color:SCHPAL[i%SCHPAL.length] }; });
      schStores.forEach(function(s){ if(!(s.key in schSel)) schSel[s.key]=true; });
    }
    function renderSchedule(){
      var el=document.getElementById('scheduleBody'); if(!el) return;
      if(schY==null){ var n=new Date(); schY=n.getFullYear(); schM=n.getMonth(); }
      schBuildStores();
      var nav='<div class="mnav"><button onclick="schMove(-1)">‹</button><span class="mlabel">'+schY+'年 '+(schM+1)+'月</span><button onclick="schMove(1)">›</button></div>';
      if(!schStores.length){ el.innerHTML=nav+'<div class="schempty">打ち出し中の店舗も、面接予定もありません</div>'; return; }
      var chips='<div class="schchips">'+schStores.map(function(s){
        return '<button class="schchip'+(schSel[s.key]?'':' off')+'" onclick="schToggle(\''+s.key.replace(/\\/g,'\\\\').replace(/'/g,"\\'")+'\')"><span class="dot" style="background:'+s.color+'"></span>'+esc(s.name)+'</button>';
      }).join('')+'</div>';
      var vbtn=function(v,label){ var on=schView===v; return '<button onclick="schSetView(\''+v+'\')" style="flex:1;padding:8px;border-radius:8px;border:1px solid var(--line);font-weight:700;font-size:12px;cursor:pointer;background:'+(on?'var(--accent)':'var(--card2)')+';color:'+(on?'#fff':'var(--fg)')+'">'+label+'</button>'; };
      var vtoggle='<div style="display:flex;gap:6px;margin:0 0 9px">'+vbtn('cal','📅 月表示')+vbtn('list','📋 リスト表示')+'</div>';
      if(schView==='list'){ el.innerHTML=vtoggle+chips+schListHtml(); return; }
      var dows=['日','月','火','水','木','金','土'];
      var head=dows.map(function(d,i){ return '<div class="dow'+(i===0?' sun':(i===6?' sat':''))+'">'+d+'</div>'; }).join('');
      var first=new Date(schY,schM,1), lead=first.getDay(), dim=new Date(schY,schM+1,0).getDate();
      var today=new Date(), thisMonth=(today.getFullYear()===schY&&today.getMonth()===schM);
      var byDay={}, total=0;
      schedEvents().forEach(function(e){ if(e.y===schY&&e.mo===schM&&schSel[e.key]){ (byDay[e.da]=byDay[e.da]||[]).push(e); total++; } });
      Object.keys(byDay).forEach(function(d){ byDay[d].sort(function(a,b){ return (a.t||'99:99')<(b.t||'99:99')?-1:1; }); });
      var cells='';
      for(var i=0;i<lead;i++) cells+='<div class="cell blank"></div>';
      for(var day=1;day<=dim;day++){
        var list=byDay[day]||[];
        var isT=thisMonth&&today.getDate()===day;
        // 面接がある日はセル全体を大きなタップ領域に。押すと選択店舗分の一覧を表示。
        // セルには日付＋店舗色のドット（最大6）＋件数だけを出す（小さな個別ボタンで押しづらい問題を解消）。
        if(list.length){
          var dots=list.slice(0,6).map(function(e){ return '<span class="cdot" style="background:'+schColorOf(e.key)+'"></span>'; }).join('');
          cells+='<div class="cell has'+(isT?' today':'')+'" onclick="schDay('+schY+','+schM+','+day+')">'+
            '<div class="dn">'+day+'</div>'+
            '<div class="cdots">'+dots+'</div>'+
            '<div class="ccount">'+list.length+'件 ▾</div>'+
          '</div>';
        } else {
          cells+='<div class="cell'+(isT?' today':'')+'"><div class="dn">'+day+'</div></div>';
        }

    // 要注意店（ヘルスチェック）：未対応滞留・定着率の低さ・応募急減・結果未提出 を合成して早期発見
    function healthScoreHtml(){

      function ensure(k,name){ if(!stores[k]) stores[k]={name:name||k,untOld:0,last7:0,prev7:0,hi:0,qu:0,unsub:false}; return stores[k]; }
      apps.forEach(function(a){ if(reg!=='all'&&appRegion(a)!==reg)return; var k=normStore(a.store); if(!k)return; var o=ensure(k,a.store), d=toDate(a.appliedAt);

      var A=bg(a),B=bg(b),inter=0,na=0,nb=0,k; for(k in A){na++; if(B[k])inter++;} for(k in B)nb++; return (na+nb)?2*inter/(na+nb):0; }
