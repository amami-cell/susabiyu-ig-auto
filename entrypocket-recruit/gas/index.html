<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <base target="_top">
  <style>
    :root { --bg:#0f141a; --card:#1a222c; --line:#2a3644; --fg:#e6edf3; --muted:#8b98a5; --accent:#4a9eff;
      --f1:#4a9eff; --f2:#38c172; --f3:#f6c343; --f4:#ff8a65; --f5:#ba68c8; --f6:#78909c; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body { margin:0; background:var(--bg); color:var(--fg); font-family:-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif; font-size:15px; padding-bottom:40px; }
    header { position:sticky; top:0; z-index:5; background:var(--bg); padding:14px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; }
    header h1 { font-size:17px; margin:0; } .updated { font-size:11px; color:var(--muted); margin-top:2px; }
    button.refresh { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:9px 14px; font-size:14px; font-weight:600; }
    button.refresh:disabled { opacity:.5; }
    main { padding:12px 16px; max-width:720px; margin:0 auto; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:14px; }
    .card h2 { font-size:13px; color:var(--muted); margin:0 0 12px; font-weight:600; }
    .kpis { display:flex; gap:10px; } .kpi { flex:1; text-align:center; }
    .kpi .n { font-size:26px; font-weight:700; } .kpi .l { font-size:11px; color:var(--muted); }
    .frow { display:flex; align-items:center; margin:6px 0; gap:10px; }
    .frow .nm { width:44px; font-size:13px; color:var(--muted); }
    .bar { height:26px; border-radius:6px; min-width:2px; display:flex; align-items:center; padding:0 8px; color:#fff; font-size:13px; font-weight:600; }
    .s応募{background:var(--f1);} .s接触{background:var(--f2);} .s面接{background:var(--f3);color:#222;} .s内定{background:var(--f4);} .s入社{background:var(--f5);} .s終了{background:var(--f6);}
    .bd{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13px;}
    .bd .bl{width:98px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .bd .bb{flex:1;height:20px;background:#22303f;border-radius:5px;overflow:hidden;}
    .bd .bf{height:100%;background:var(--accent);border-radius:5px;}
    .bd .bn{width:56px;text-align:right;font-variant-numeric:tabular-nums;}
    .bd .bf.on{background:var(--f2);}
    .badge{font-size:10px;color:var(--f2);margin-left:6px;white-space:nowrap;}
    .badge.end{color:var(--muted);}
    .rc{color:var(--f2);}
    .st-row{margin:9px 0;}
    .st-head{display:flex;align-items:center;gap:6px;margin-bottom:3px;flex-wrap:wrap;}
    .st-nm{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:56%;}
    .st-row.end .st-nm{color:#66757f;font-weight:500;}
    .st-bar{display:flex;align-items:center;gap:8px;}
    .st-bar .bb{flex:1;height:18px;background:#22303f;border-radius:5px;overflow:hidden;}
    .st-bar .bf{height:100%;background:var(--f2);border-radius:5px;}
    .st-bar .bf.end{background:#39434f;}
    .st-bar .bn{width:56px;text-align:right;font-size:13px;font-variant-numeric:tabular-nums;}
    .ago{font-size:11px;color:var(--muted);white-space:nowrap;}
    .src{font-size:9px;color:var(--f4);border:1px solid #5a3a2a;border-radius:3px;padding:0 4px;margin-left:4px;white-space:nowrap;}
    .prow{border-top:1px solid var(--line);padding:9px 2px;} .prow:first-child{border-top:0;}
    .phead{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
    .pnm{font-weight:600;font-size:14px;}
    .psub{font-size:12px;color:var(--muted);margin-top:2px;}
    .psub b{color:var(--fg);font-weight:600;}
    .filters { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
    .chip { border:1px solid var(--line); background:transparent; color:var(--muted); border-radius:999px; padding:6px 12px; font-size:12px; }
    .chip.on { background:var(--accent); color:#fff; border-color:var(--accent); }
    .app { border-top:1px solid var(--line); padding:11px 2px; } .app:first-child{border-top:0;}
    .app .nm { font-weight:600; font-size:15px; }
    .app .meta { font-size:12px; color:var(--muted); font-weight:400; margin-left:6px; }
    .app .sub { font-size:12px; color:var(--muted); margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .tag { font-size:10px; padding:2px 6px; border-radius:4px; margin-left:6px; }
    .tag.dup { background:#4a2c2c; color:#ffb454; }
    .pills { display:flex; gap:6px; flex-wrap:wrap; margin-top:7px; }
    .pill { border:1px solid var(--line); background:#22303f; color:var(--fg); border-radius:6px; padding:5px 9px; font-size:12px; }
    .pill.st { color:var(--accent); border-color:#2c4a68; }
    .pill.memo { color:var(--f3); border-color:#4a4326; }
    .acts { display:flex; gap:8px; margin-top:9px; }
    .btn { flex:1; text-align:center; border-radius:8px; padding:9px 6px; text-decoration:none; font-size:13px; font-weight:600; white-space:nowrap; }
    .btn.call { background:var(--f2); color:#fff; }
    .btn.sms { background:var(--f1); color:#fff; }
    .btn.mail { background:var(--f4); color:#fff; }
    .btn.off { background:var(--line); color:var(--muted); pointer-events:none; }
    .detail { margin-top:9px; padding:10px; background:#141b23; border:1px solid var(--line); border-radius:8px; }
    .detail .dl { font-size:11px; color:var(--muted); margin:8px 0 4px; font-weight:600; } .detail .dl:first-child{margin-top:0;}
    .ent { display:flex; gap:8px; font-size:12px; margin:3px 0; }
    .ent .ed { color:var(--muted); white-space:nowrap; min-width:78px; font-variant-numeric:tabular-nums; }
    .ent .eb { flex:1; white-space:pre-wrap; word-break:break-word; }
    .cinfo { font-size:12px; color:var(--fg); }
    .empty { color:var(--muted); font-size:13px; text-align:center; padding:20px; }
    .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--card); border:1px solid var(--line); padding:10px 16px; border-radius:8px; font-size:13px; opacity:0; transition:opacity .3s; }
    .toast.show { opacity:1; }
  </style>
</head>
<body>
  <header>
    <div><h1>求人進捗</h1><div class="updated" id="updated">読み込み中…</div></div>
    <button class="refresh" id="refreshBtn" onclick="doRefresh()">更新</button>
  </header>
  <main>
    <div class="card"><div class="kpis">
      <div class="kpi"><div class="n" id="kTotal">–</div><div class="l">応募者(現在)</div></div>
      <div class="kpi"><div class="n" id="kDup">–</div><div class="l">重複率</div></div>
      <div class="kpi"><div class="n" id="kNew">–</div><div class="l">最終取得件数</div></div>
    </div></div>
    <div class="card"><h2>ファネル</h2><div id="funnel"></div></div>
    <div class="card"><h2>ステータス別</h2><div id="bdStatus"></div></div>
    <div class="card"><h2>応募店舗別（●募集中＝掲載中or直近応募／💤終了。実データ優先・master_店舗「募集手動」で上書き可）</h2><div id="bdStore"></div></div>
    <div class="card"><h2>求人打ち出し履歴（Notion取込・実際の掲載期間／応募・採用）</h2><div id="bdPostings"></div></div>
    <div class="card"><h2>年齢層</h2><div id="bdAgeGroup"></div></div>
    <div class="card"><h2>性別</h2><div id="bdGender"></div></div>
    <div class="card"><h2>年齢（単年）</h2><div id="bdAge"></div></div>
    <div class="card"><h2>スタッフ一覧（◆ステータス／📝メモ をタップで履歴。発信・SMS・メールはテンプレ付き）</h2><div class="filters" id="filters"></div><div id="list"><div class="empty">読み込み中…</div></div></div>
  </main>
  <div class="toast" id="toast"></div>
  <script>
    var STAGES = ['応募','接触','面接','内定','入社','終了'];
    var apps = [], activeFunnel = null, storeManual = {}, appByCode = {}, shown = 80;
    var storePosting = {}, postings = [];
    // 店舗名の照合キー（サーバの epNormStore_ と同じ規則）
    function normStore(s){ return String(s||'').replace(/^(?:【[^】]*】)+/,'').replace(/[\s　・･]/g,'').toLowerCase(); }
    function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(function(){t.classList.remove('show');},2600); }
    function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
    function load(){ google.script.run.withSuccessHandler(render).withFailureHandler(function(e){document.getElementById('updated').textContent='取得失敗: '+e.message;}).dashData(); }
    function render(d){
      var dash=d.dash||{};
      document.getElementById('kTotal').textContent = dash.total!=null?dash.total:'–';
      document.getElementById('kDup').textContent = dash.duplicate_rate!=null?Math.round(dash.duplicate_rate*100)+'%':'–';
      document.getElementById('kNew').textContent = d.last?d.last.n:'–';
      document.getElementById('updated').textContent = d.last?('最終取得 '+d.last.at):(dash.generated_at||'未取得');
      var f=dash.funnel||{}, max=1; STAGES.forEach(function(s){max=Math.max(max,f[s]||0);});
      var html=''; STAGES.forEach(function(s){ var v=f[s]||0, w=Math.round(v/max*100); html+='<div class="frow"><div class="nm">'+s+'</div><div class="bar s'+s+'" style="width:'+Math.max(w,v?8:0)+'%">'+(v||'')+'</div></div>'; });
      document.getElementById('funnel').innerHTML=html;
      renderBD('bdStatus', dash.by_status);
      renderBD('bdAgeGroup', dash.by_age_group, ['〜19歳','20代','30代','40代','50代','60代〜','不明']);
      renderBD('bdGender', dash.by_gender);
      renderBD('bdAge', dash.by_age, 'num');
      storeManual=d.storeManual||{}; storePosting=d.storePosting||{}; postings=d.postings||[];
      apps=d.apps||[]; appByCode={}; apps.forEach(function(a){ appByCode[a.code]=a; });
      shown=80; renderStores(); renderPostings(); renderList();
    }
    function renderBD(id, obj, order){
      obj=obj||{}; var el=document.getElementById(id); if(!el) return;
      var keys=Object.keys(obj);
      if(order==='num') keys.sort(function(a,b){return (+a)-(+b);});
      else if(order&&order.length) keys.sort(function(a,b){var ia=order.indexOf(a),ib=order.indexOf(b); ia=ia<0?99:ia; ib=ib<0?99:ib; return ia-ib;});
      else keys.sort(function(a,b){return obj[b]-obj[a];});
      if(!keys.length){ el.innerHTML='<div class="empty">データなし</div>'; return; }
      var max=1; keys.forEach(function(k){max=Math.max(max,obj[k]);});
      el.innerHTML=keys.map(function(k){var v=obj[k],w=Math.round(v/max*100);
        return '<div class="bd"><div class="bl">'+esc(order==='num'?k+'歳':k)+'</div><div class="bb"><div class="bf" style="width:'+w+'%"></div></div><div class="bn">'+v+'</div></div>';}).join('');
    }
    // ===== 連絡テンプレート（ここを書き換えれば文面を変えられます。{name}=氏名 {store}=店舗名）=====
    var TPL_SMS = '{name}様\nこの度は【{store}】へご応募ありがとうございます。採用担当です。\n面接日程のご相談をさせていただきたくご連絡しました。ご都合のよい日時をご返信ください。';
    var TPL_MAIL_SUBJECT = '【{store}】ご応募ありがとうございます';
    var TPL_MAIL_BODY = '{name} 様\n\nこの度は【{store}】の求人へご応募いただき、誠にありがとうございます。採用担当です。\n\n面接日程についてご相談させていただきたく、ご連絡いたしました。下記より、ご都合のよい日時をお知らせください。\n\n・第1希望：\n・第2希望：\n・第3希望：\n\nご不明点がございましたら本メールへご返信ください。何卒よろしくお願いいたします。';
    function fillTpl(t,a){ return String(t).replace(/{name}/g, a.name||'').replace(/{store}/g, a.store||''); }
    function smsHref(a){ var num=String(a.telRaw||a.tel||'').replace(/[^\d+]/g,''); return num?('sms:'+num+'?body='+encodeURIComponent(fillTpl(TPL_SMS,a))):null; }
    function mailHref(a){ return a.email?('mailto:'+a.email+'?subject='+encodeURIComponent(fillTpl(TPL_MAIL_SUBJECT,a))+'&body='+encodeURIComponent(fillTpl(TPL_MAIL_BODY,a))):null; }

    // 変更履歴・メモ文字列を「日時＋内容」の配列へ要約
    function splitEntries(s){
      s=String(s||'').trim(); if(!s) return [];
      var p=s.split(/\r?\n/).map(function(x){return x.trim();}).filter(Boolean);
      if(p.length<=1) p=s.split(/(?=\d{4}[\/年.\-]\d{1,2}[\/月.\-]\d{1,2})/).map(function(x){return x.trim();}).filter(Boolean);
      return p;
    }
    function parseEntry(e){
      var m=e.match(/^\D*(\d{4})[\/年.\-](\d{1,2})[\/月.\-](\d{1,2})日?(?:[ 　T]*(\d{1,2})[:：](\d{2}))?[\)\]　 、\-]*(.*)$/);
      if(m){ var d=m[1]+'/'+('0'+m[2]).slice(-2)+'/'+('0'+m[3]).slice(-2)+(m[4]?(' '+('0'+m[4]).slice(-2)+':'+m[5]):'');
        return { date:d, body:(m[6]||'').trim(), ts:new Date(+m[1],+m[2]-1,+m[3],+(m[4]||0),+(m[5]||0)).getTime() }; }
      return { date:'', body:e, ts:NaN };
    }
    function summarize(s){
      var ents=splitEntries(s).map(parseEntry);
      if(ents.length && ents.every(function(e){return !isNaN(e.ts);})) ents.sort(function(a,b){return b.ts-a.ts;}); // 新しい順
      return ents;
    }
    function entriesHtml(ents){
      if(!ents.length) return '<div class="cinfo" style="color:var(--muted)">記録なし</div>';
      return ents.map(function(e){ return '<div class="ent"><div class="ed">'+esc(e.date||'―')+'</div><div class="eb">'+esc(e.body||'')+'</div></div>'; }).join('');
    }
    // 詳細は開いた瞬間に、すでに読み込んだデータから組み立てる（サーバー通信なし）
    function buildDetail(a){
      if(!a) return '';
      var histEnts=summarize(a.history), memoEnts=summarize(a.memo);
      return '<div class="dl">ステータス変更履歴</div>'+entriesHtml(histEnts)+
        (memoEnts.length?('<div class="dl">メモ</div>'+entriesHtml(memoEnts)):'')+
        '<div class="dl">連絡先</div><div class="cinfo">☎ '+esc(a.telRaw||a.tel||'なし')+'　✉ '+esc(a.email||'なし')+'</div>';
    }
    function toggle(code){
      var el=document.getElementById('d_'+code); if(!el) return;
      if(el.style.display==='none'){
        if(!el.getAttribute('data-built')){ el.innerHTML=buildDetail(appByCode[code]); el.setAttribute('data-built','1'); }
        el.style.display='block';
      } else el.style.display='none';
    }

    function renderList(){
      var fl=document.getElementById('filters');
      var c='<button class="chip '+(activeFunnel===null?'on':'')+'" onclick="setF(null)">すべて('+apps.length+')</button>';
      STAGES.forEach(function(s){ var n=apps.filter(function(a){return a.funnel===s;}).length; c+='<button class="chip '+(activeFunnel===s?'on':'')+'" onclick="setF(\''+s+'\')">'+s+'('+n+')</button>'; });
      fl.innerHTML=c;
      var rows=apps.filter(function(a){return activeFunnel===null||a.funnel===activeFunnel;});
      if(!rows.length){ document.getElementById('list').innerHTML='<div class="empty">該当なし</div>'; return; }
      // 表示は shown 件ずつ。詳細パネルは空のまま置き、開いた時に中身を作る（初期描画を軽く）。
      var h=''; rows.slice(0, shown).forEach(function(a){
        var id=esc(a.code);
        var age=(a.age!==''&&a.age!=null)?(a.age+'歳'):'';
        var metaBits=[age, a.gender].filter(Boolean).join('・');
        var meta=metaBits?'<span class="meta">'+esc(metaBits)+'</span>':'';
        var dup=a.dup?'<span class="tag dup">重複</span>':'';
        var occ=a.occupation?('💼 '+esc(a.occupation)):'';
        var line2=[occ, '🏪 '+esc(a.store||'不明')].filter(Boolean).join('　');
        var stBtn='<button class="pill st" onclick="toggle(\''+id+'\')">◆ '+esc(a.status||'状況不明')+' ▾</button>';
        var memoN=summarize(a.memo).length, memoBtn = memoN?('<button class="pill memo" onclick="toggle(\''+id+'\')">📝 メモ'+memoN+' ▾</button>'):'';
        var sms=smsHref(a), mail=mailHref(a);
        var acts='<div class="acts">'+
          (a.telLink?'<a class="btn call" href="'+esc(a.telLink)+'">発信</a>':'<span class="btn off">TELなし</span>')+
          (sms?'<a class="btn sms" href="'+esc(sms)+'">SMS</a>':'<span class="btn off">SMS不可</span>')+
          (mail?'<a class="btn mail" href="'+esc(mail)+'">メール</a>':'<span class="btn off">メール無</span>')+
          '</div>';
        h+='<div class="app"><div class="nm">'+esc(a.name)+meta+dup+'</div>'+
           '<div class="sub">'+line2+'</div>'+
           '<div class="sub">🕒 '+esc(a.appliedAt||'')+(a.media?('　/　'+esc(a.media)):'')+'</div>'+
           '<div class="pills">'+stBtn+memoBtn+'</div>'+
           '<div class="detail" id="d_'+id+'" style="display:none"></div>'+acts+'</div>';
      });
      if(rows.length>shown) h+='<div style="text-align:center;padding:8px"><button class="chip" onclick="showMore()">さらに表示（残り '+(rows.length-shown)+' 件）</button></div>';
      document.getElementById('list').innerHTML=h;
    }
    function showMore(){ shown+=120; renderList(); }
    // 応募店舗別：直近30日に応募があれば「募集中」、途絶えていれば「募集終了」とみなす。
    // master_店舗 F列「募集手動」に 募集中/終了 と書けば、その店だけ手動で上書きできる。
    var RECENT_DAYS = 30;
    // 手動フラグを active / ended / null(自動) に正規化
    function manOverride(man){
      var s=String(man||'').trim();
      if(!s) return null;
      if(/終了|停止|休止|クローズ|close|off|×|✕|ｘ/i.test(s)) return 'ended';
      if(/^(0|なし)$/i.test(s)) return 'ended';
      if(/中|継続|再開|募集|active|on|○|◯|〇/i.test(s)) return 'active';
      if(/^(1|あり)$/i.test(s)) return 'active';
      return null;
    }
    function renderStores(){
      var el=document.getElementById('bdStore'); if(!el) return;
      var now=Date.now(), cutoff=now-RECENT_DAYS*86400000;
      var tot={}, rec={}, last={};
      apps.forEach(function(a){
        var s=a.store||'不明'; tot[s]=(tot[s]||0)+1;
        var t=new Date(a.appliedAt).getTime();
        if(!isNaN(t)){ if(t>=cutoff) rec[s]=(rec[s]||0)+1; if(!last[s]||t>last[s]) last[s]=t; }
      });
      var names=Object.keys(tot);
      if(!names.length){ el.innerHTML='<div class="empty">データなし</div>'; return; }
      var info={};
      names.forEach(function(k){
        var mo=manOverride(storeManual[k]);            // 手動フラグ（最優先）
        var pd=storePosting[normStore(k)];             // 打ち出し実データ（次点）
        var state = mo || (pd ? (pd.active?'active':'ended') : ((rec[k]||0)>0 ? 'active' : 'ended'));
        info[k]={ tot:tot[k], rec:rec[k]||0, last:last[k]||0, state:state, manual:!!mo, pd:pd||null };
      });
      // 募集中を上へ。募集中どうしは直近応募数→総数、終了どうしは最終応募が新しい順→総数
      names.sort(function(a,b){
        var A=info[a], B=info[b];
        if(A.state!==B.state) return A.state==='active'?-1:1;
        if(A.state==='active'){ if(B.rec!==A.rec) return B.rec-A.rec; return B.tot-A.tot; }
        if(B.last!==A.last) return B.last-A.last; return B.tot-A.tot;
      });
      var max=1; names.forEach(function(k){ max=Math.max(max, info[k].tot); });
      el.innerHTML=names.map(function(k){
        var o=info[k], w=Math.round(o.tot/max*100), pd=o.pd;
        var ago = o.last ? Math.floor((now-o.last)/86400000) : null;
        var agoTxt = ago==null ? '' : (ago<=0 ? '本日応募' : ('最終'+ago+'日前'));
        // 補足テキスト：打ち出し実データがあれば掲載期間、無ければ最終応募
        var subTxt = pd ? ('掲載 '+esc(pd.latestStart||'?')+'〜'+esc(pd.latestEnd||'継続')) : agoTxt;
        var src = pd ? '<span class="src">実データ</span>' : (o.manual ? '<span class="src">手動</span>' : '');
        var badge, cls, bf;
        if(o.state==='active'){ badge='<span class="badge">●募集中</span>'; cls=''; bf=''; }
        else { badge='<span class="badge end">💤終了</span>'; cls=' end'; bf=' end'; }
        var num = o.tot + (o.state==='active'&&o.rec>0 ? ' <span class="rc">+'+o.rec+'</span>' : '');
        return '<div class="st-row'+cls+'">'+
          '<div class="st-head"><span class="st-nm">'+esc(k)+'</span>'+badge+src+(subTxt?'<span class="ago">'+subTxt+'</span>':'')+'</div>'+
          '<div class="st-bar"><div class="bb"><div class="bf'+bf+'" style="width:'+Math.max(w,4)+'%"></div></div><div class="bn">'+num+'</div></div>'+
        '</div>';
      }).join('');
    }
    // 求人打ち出し履歴（Notion取込の実データ）
    function renderPostings(){
      var el=document.getElementById('bdPostings'); if(!el) return;
      if(!postings.length){ el.innerHTML='<div class="empty">データなし（次の取得で反映されます）</div>'; return; }
      el.innerHTML=postings.slice(0,150).map(function(p){
        var badge = p.state==='募集中' ? '<span class="badge">●募集中</span>' : '<span class="badge end">終了</span>';
        var period = esc(p.start||'?')+'〜'+esc(p.end||'継続');
        var cost = p.cost ? ('・'+esc(p.cost)) : '';
        var stat=[ (p.apps?('応募<b>'+esc(p.apps)+'</b>'):''), (p.hires?('採用<b>'+esc(p.hires)+'</b>'):''), (p.hireRate?('採用率'+esc(p.hireRate)):'') ].filter(Boolean).join('　');
        return '<div class="prow">'+
          '<div class="phead"><span class="pnm">'+esc(p.store)+'</span>'+badge+'</div>'+
          '<div class="psub">'+period+'　'+esc(p.media||'')+(p.plan?('・'+esc(p.plan)):'')+cost+'</div>'+
          (stat?('<div class="psub">'+stat+'</div>'):'')+
        '</div>';
      }).join('');
    }
    function setF(s){ activeFunnel=s; shown=80; renderList(); }
    function doRefresh(){
      var b=document.getElementById('refreshBtn'); b.disabled=true; b.textContent='取得中…'; toast('最新データを取得中です（15秒ほど）');
      google.script.run.withSuccessHandler(function(r){
        b.disabled=false; b.textContent='更新';
        if(r&&r.ok){ toast('取得完了'); load(); } else { toast('取得失敗'+(r&&r.error?': '+r.error:'')); }
      }).withFailureHandler(function(e){ b.disabled=false; b.textContent='更新'; toast('エラー: '+e.message); }).dashRefresh();
    }
    load();
  </script>
</body>
</html>
