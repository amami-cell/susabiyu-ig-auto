        ltab(['店舗','期間','要確認'], bad.map(function(b){ return [esc(b.store), esc((b.start||'?')+'〜'+(b.end||'?')), b.probs.join('・')]; }))+'</div>';
    }
    // 店舗ごとの次アクション提案（過去実績から 推奨媒体・推奨予算・平均採用。前回終了からの経過が長い順）
    function nextActionHtml(per){
      var byS={}; per.forEach(function(p){ var k=normStore(p.store); (byS[k]=byS[k]||{name:p.store,list:[]}).list.push(p); });
      var now=Date.now(), rows=[];
      Object.keys(byS).forEach(function(k){ var o=byS[k], list=o.list;
        var lastEnd=0; list.forEach(function(p){ var d=toDate(p.end)||toDate(p.start); if(d&&d.getTime()>lastEnd)lastEnd=d.getTime(); });
        var byM={}; list.forEach(function(p){ var m=String(p.media==null?'':p.media).trim(); if(!m)return; (byM[m]=byM[m]||{h:0,c:0,n:0}); byM[m].h+=num(p.hires); byM[m].c+=parseCost(p.cost); byM[m].n++; });
        var bestM='', bestCph=Infinity, bestUse=0;
        Object.keys(byM).forEach(function(m){ var o2=byM[m]; if(o2.h>0&&o2.c>0){ var cph=o2.c/o2.h; if(cph<bestCph){bestCph=cph;bestM=m;} } if(o2.n>bestUse){bestUse=o2.n; if(!bestM)bestM=m;} });
        var costs=list.map(function(p){return parseCost(p.cost);}).filter(function(x){return x>0;}), recB=median_(costs);
        var hires=list.reduce(function(s,p){return s+num(p.hires);},0), avgH=list.length?hires/list.length:0;
        rows.push({name:o.name, idle:lastEnd?Math.floor((now-lastEnd)/86400000):null, media:bestM||'—', cph:isFinite(bestCph)?bestCph:0, budget:recB, avgH:avgH});
      });
      if(!rows.length) return '';
      rows.sort(function(x,y){ return (y.idle||0)-(x.idle||0); });
      return '<div class="card"><h2>店舗ごとの次アクション提案</h2>'+
        '<div class="lnote">過去実績から「次に打つなら」の目安。推奨媒体＝その店で採用単価が最も安かった媒体、推奨予算＝過去の求人費の中央値。前回終了からの経過が長い店ほど上（＝そろそろ打ち時）。参考値・最終判断は現場で。年・地域フィルタ連動。</div>'+
        ltab(['店舗','前回から','推奨媒体','推奨予算','平均採用/回'],
          rows.map(function(r){ return [esc(r.name), r.idle!=null?r.idle+'日':'—', esc(r.media)+(r.cph?'（'+yen(r.cph)+'）':''), r.budget?yen(r.budget):'—', r.avgH.toFixed(1)+'名']; }))+'</div>';
    }
    // 月別推移（連載開始の年月で集計・応募数の相対バー付き）
    function monthlyTrendHtml(per){
      var by={}; per.forEach(function(p){ var d=toDate(p.start)||toDate(p.end); if(!d) return;
        var key=d.getFullYear()+'/'+('0'+(d.getMonth()+1)).slice(-2); (by[key]=by[key]||[]).push(p); });
      var keys=Object.keys(by).sort(); if(!keys.length) return '';
      var maxA=1; keys.forEach(function(k){ maxA=Math.max(maxA, mset(by[k]).apps); });
      var rows=keys.map(function(k){ var m=mset(by[k]); var w=Math.round(m.apps/maxA*100);
        return '<tr><td>'+esc(k)+'</td>'+
          '<td style="min-width:130px"><div style="display:flex;align-items:center;gap:6px"><div style="flex:1;min-width:44px;background:var(--line);border-radius:4px;height:8px;overflow:hidden"><div style="width:'+w+'%;height:100%;background:var(--accent)"></div></div><b>'+m.apps+'</b></div></td>'+
          '<td>'+m.hires+'</td><td>'+m.n+'</td><td>'+(m.apps?(m.rate).toFixed(1)+'%':'—')+'</td><td>'+yen(m.cost)+'</td><td>'+(m.hires?yen(m.cph):'—')+'</td></tr>'; }).join('');
      return '<div class="card"><h2>月別推移</h2><div class="lnote">連載開始の年月で集計。バーは応募数の相対比較。年・地域フィルタに連動します。</div>'+
        '<div class="lwrap"><table class="ltab"><thead><tr><th>月</th><th>応募</th><th>採用</th><th>件数</th><th>採用率</th><th>求人費</th><th>採用単価</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
    }
    // 打ち出し期間（週）
    function pWeeks(p){ var s=toDate(p.start), e=toDate(p.end); if(!s||!e) return 0; var d=Math.round((e.getTime()-s.getTime())/86400000); return d>0?d/7:0; }
    // 媒体別 集計（打ち出し期間つき・見積もり判断材料）
    function mediaAnalysisHtml(per){
      var by={}; per.forEach(function(p){ var m=String(p.media==null?'':p.media).trim()||'(媒体なし)'; (by[m]=by[m]||[]).push(p); });
      var keys=Object.keys(by); if(!keys.length) return '';
      if(keys.length===1 && keys[0]==='(媒体なし)') return '';   // 媒体情報が無ければ出さない
      var rows=keys.map(function(k){ var m=mset(by[k]);
        var wl=by[k].map(pWeeks).filter(function(x){return x>0;}); var aw=wl.length?wl.reduce(function(a,b){return a+b;},0)/wl.length:0;
        return {k:k,m:m,aw:aw}; }).sort(function(x,y){ return y.m.apps-x.m.apps; });
      return '<div class="card"><h2>媒体別 集計</h2>'+
        '<div class="lnote">媒体ごとの打ち出し期間と効果。見積もり時の判断材料に（例：短期で応募単価が安い媒体／長期で採用に強い媒体）。平均期間＝連載開始〜終了の平均週数。</div>'+
        ltab(['媒体','件数','平均期間','応募','平均応募','採用','採用率','応募単価','採用単価'],
          rows.map(function(r){ var m=r.m; return [esc(r.k), m.n, (r.aw?r.aw.toFixed(1)+'週':'—'), m.apps, m.n?(m.apps/m.n).toFixed(1):'0', m.hires, (m.apps?m.rate.toFixed(1)+'%':'—'), m.apps?yen(m.cpa):'—', m.hires?yen(m.cph):'—']; }))+
        '</div>';
    }
    function mtile(label,val,big){ return '<div class="mtile'+(big?' big':'')+'"><div class="mv">'+val+'</div><div class="ml">'+esc(label)+'</div></div>'; }
    // ⑥ 月次/期間レポート（印刷・PDF保存できる1枚）。現在の年・地域フィルタで作成。
    function openReport(){
      var per=postings.filter(function(p){ return (statYear==='all'||postYear(p)==statYear)&&(statRegion==='all'||regionOf(p)===statRegion); });
      var A=aggPostings(per), now=new Date();
      var title=(statYear==='all'?'全期間':statYear+'年')+(statRegion==='all'?'':'・'+statRegion);
      var kpi='<div class="mgrid">'+mtile('打ち出し',A.n+'件')+mtile('応募',A.apps+'名')+mtile('採用',A.hires+'名')+
        mtile('採用単価',A.hires?yen(A.cost/A.hires):'—',true)+mtile('求人費',yen(A.cost))+mtile('採用率',A.apps?(A.hires/A.apps*100).toFixed(1)+'%':'—')+'</div>';
      var html='<div class="rep-bar"><button onclick="window.print()">🖨 印刷 / PDF保存</button><button onclick="closeReport()" style="background:var(--card2);color:var(--fg2)">✕ 閉じる</button></div>'+
        '<h1 style="font-size:20px;margin:2px 0">求人実績レポート</h1><div class="lnote">'+esc(title)+'　作成日 '+fmtYmd(now)+'</div>'+
        '<div class="card"><h2>サマリー</h2>'+kpi+'</div>'+
        yoyHtml()+storeRankingHtml(per)+mediaAnalysisHtml(per)+monthlyTrendHtml(per)+listingAnalysisHtml(per);
      var el=document.getElementById('report'); el.innerHTML=html; el.classList.add('show'); window.scrollTo(0,0);
    }
    function closeReport(){ var el=document.getElementById('report'); el.classList.remove('show'); el.innerHTML=''; }

    /* ===== リスティング効果分析（エリア/路線リスティング × 求人結果）===== */
    // セル値の正規化（全角半角・空白・改行を整理／よくある誤記 茨城→茨木 を統一）。空なら''。
    function listClean(v){ var t=String(v==null?'':v); try{ t=t.normalize('NFKC'); }catch(e){} return t.replace(/\s+/g,'').replace(/茨城/g,'茨木'); }
    function listOn(v){ return listClean(v)!==''; }
    function areasOf(p){ var s={}; [p.area1,p.area2].forEach(function(x){ var c=listClean(x); if(c) s[c]=1; }); return Object.keys(s); }
    function linesOf(p){ var s={}; [p.line1,p.line2].forEach(function(x){ var c=listClean(x); if(c) s[c]=1; }); return Object.keys(s); }
    function ymdShort(v){ var d=toDate(v); if(!d) return ''; return (d.getFullYear()%100)+'/'+(d.getMonth()+1)+'/'+d.getDate(); }
    // 集計：件数・求人費・応募・採用・平均・採用率・応募単価(費/応募)・採用単価(費/採用)
    function mset(list){ var c=0,a=0,h=0; list.forEach(function(p){ c+=parseCost(p.cost); a+=num(p.apps); h+=num(p.hires); });
      return { n:list.length, cost:c, apps:a, hires:h, avgA:list.length?a/list.length:0, avgH:list.length?h/list.length:0, rate:a?h/a*100:0, cpa:a?c/a:0, cph:h?c/h:0 }; }
    function ltab(head, body){ if(!body.length) return '<div class="empty">データなし</div>';
      return '<div class="lwrap"><table class="ltab"><thead><tr>'+head.map(function(h){return '<th>'+esc(h)+'</th>';}).join('')+
        '</tr></thead><tbody>'+body.map(function(r){ return '<tr>'+r.map(function(c){ return '<td>'+(c==null?'':c)+'</td>'; }).join('')+'</tr>'; }).join('')+'</tbody></table></div>'; }
    function listingAnalysisHtml(per){
      var withRes=per.filter(function(p){ return has(p.apps)||has(p.hires); });
      var out='<div class="card"><h2>リスティング効果分析</h2>';
      if(!withRes.length) return out+'<div class="empty">結果（応募・採用）が入った打ち出しがありません</div></div>';
      out+='<div class="lnote">対象＝結果入力済みの打ち出し '+withRes.length+'件。応募単価＝求人費÷応募数、採用単価＝求人費÷採用数。<br>※求人費は打ち出し全体の費用（エリア/路線ごとの内訳ではありません）。エリア別・路線別は「そのリスティングを使った打ち出しの平均応募数」を効果の目安に。</div>';
      // ① 展開パターン別
      var aOn=function(p){ return listOn(p.area1)||listOn(p.area2); }, lOn=function(p){ return listOn(p.line1)||listOn(p.line2); };
      var pat=[ {k:'エリア＋路線',f:function(p){return aOn(p)&&lOn(p);}}, {k:'エリアのみ',f:function(p){return aOn(p)&&!lOn(p);}},
                {k:'路線のみ',f:function(p){return !aOn(p)&&lOn(p);}}, {k:'リスティングなし',f:function(p){return !aOn(p)&&!lOn(p);}} ];
      out+='<div class="lsub">① 展開パターン別</div>'+ltab(['パターン','件数','平均応募','平均採用','採用率','応募単価','採用単価'],
        pat.map(function(g){ return {k:g.k,m:mset(withRes.filter(g.f))}; }).filter(function(r){return r.m.n;}).map(function(r){ var m=r.m;
          return [esc(r.k), m.n, m.avgA.toFixed(1), m.avgH.toFixed(1), m.rate.toFixed(1)+'%', m.apps?yen(m.cpa):'—', m.hires?yen(m.cph):'—']; }));
      // ② 週の展開別
      var wk=[ {k:'2週目まで展開',f:function(p){return listOn(p.area2)||listOn(p.line2);}},
               {k:'1週目のみ',f:function(p){return (listOn(p.area1)||listOn(p.line1))&&!(listOn(p.area2)||listOn(p.line2));}},
               {k:'リスティングなし',f:function(p){return !(listOn(p.area1)||listOn(p.line1)||listOn(p.area2)||listOn(p.line2));}} ];
      out+='<div class="lsub">② 週の展開別</div>'+ltab(['展開','件数','平均応募','平均採用','採用率','応募単価'],
        wk.map(function(g){ return {k:g.k,m:mset(withRes.filter(g.f))}; }).filter(function(r){return r.m.n;}).map(function(r){ var m=r.m;
          return [esc(r.k), m.n, m.avgA.toFixed(1), m.avgH.toFixed(1), m.rate.toFixed(1)+'%', m.apps?yen(m.cpa):'—']; }));
      // ③ エリア別（応募が多い順）
      var byA={}; withRes.forEach(function(p){ areasOf(p).forEach(function(a){ (byA[a]=byA[a]||[]).push(p); }); });
      out+='<div class="lsub">③ エリアリスティング別（平均応募が多い順）</div>'+ltab(['エリア','件数','平均応募','平均採用','採用率'],
        Object.keys(byA).map(function(a){ return {k:a,m:mset(byA[a])}; }).sort(function(x,y){ return y.m.avgA-x.m.avgA; }).map(function(r){ var m=r.m;
          return [esc(r.k), m.n, m.avgA.toFixed(1), m.avgH.toFixed(1), m.rate.toFixed(1)+'%']; }));
      // ④ 路線別（応募が多い順）
      var byL={}; withRes.forEach(function(p){ linesOf(p).forEach(function(a){ (byL[a]=byL[a]||[]).push(p); }); });
      out+='<div class="lsub">④ 路線リスティング別（平均応募が多い順）</div>'+ltab(['路線','件数','平均応募','平均採用','採用率'],
        Object.keys(byL).map(function(a){ return {k:a,m:mset(byL[a])}; }).sort(function(x,y){ return y.m.avgA-x.m.avgA; }).map(function(r){ var m=r.m;
          return [esc(r.k), m.n, m.avgA.toFixed(1), m.avgH.toFixed(1), m.rate.toFixed(1)+'%']; }));
      // ⑤ 明細（開閉）
      var det=withRes.slice().sort(function(p,q){ var tp=toDate(p.start),tq=toDate(q.start); return (tq?tq.getTime():0)-(tp?tp.getTime():0); });
      out+='<div class="lsub">⑤ 打ち出し明細（'+det.length+'件）<button id="ldetBtn" onclick="ldetToggle()" style="margin-left:8px;font-size:11px;background:transparent;border:1px solid var(--accent);color:var(--accent);border-radius:8px;padding:3px 11px;cursor:pointer">開く</button></div>';
      out+='<div id="ldet" hidden>'+ltab(['店舗','期間','エリア1/2','路線1/2','求人費','応募','採用','採用率','応募単価'],
        det.map(function(p){ var a=num(p.apps),h=num(p.hires),c=parseCost(p.cost);
          var pr=ymdShort(p.start)+(p.end?'〜'+ymdShort(p.end):'');
          var ar=[listClean(p.area1),listClean(p.area2)].filter(Boolean).join(' / ')||'—';
          var ln=[listClean(p.line1),listClean(p.line2)].filter(Boolean).join(' / ')||'—';
          return [esc(p.store), esc(pr), esc(ar), esc(ln), c?yen(c):'—', has(p.apps)?a:'—', has(p.hires)?h:'—', a?(h/a*100).toFixed(1)+'%':'—', (c&&a)?yen(c/a):'—']; }))+'</div>';
      return out+'</div>';
    }
    function ldetToggle(){ var d=document.getElementById('ldet'), b=document.getElementById('ldetBtn'); if(!d) return; d.hidden=!d.hidden; if(b) b.textContent=d.hidden?'開く':'閉じる'; }
    function storeAggRow(row){
      var id='sa'+(storeAggRow._i=(storeAggRow._i||0)+1), a=row.a;
      var st=[ '打ち出し<b>'+row.list.length+'</b>', '費<b>'+yen(a.cost)+'</b>', '応募<b>'+a.apps+'</b>',
               '採用<b>'+a.hires+'</b>', '単価<b>'+(a.hires?yen(a.cost/a.hires):'—')+'</b>' ]
             .map(function(x){return '<span>'+x+'</span>';}).join('');
      var body=row.list.slice().sort(function(p,q){ var tp=toDate(p.start), tq=toDate(q.start); return (tq?tq.getTime():0)-(tp?tp.getTime():0); }).map(postingRow).join('');
      return '<div class="sc" id="'+id+'w"><div class="sc-top" onclick="saToggle(\''+id+'\')"><span class="chev">›</span>'+
        '<div class="sc-h"><span class="sc-nm">'+esc(row.name)+'</span></div>'+
        '<div class="sc-stat">'+st+'</div></div>'+
        '<div class="sc-body" id="'+id+'" hidden>'+
          '<button data-s="'+esc(row.name)+'" onclick="event.stopPropagation();copyStoreLink(this.getAttribute(\'data-s\'))" style="width:100%;margin:0 0 8px;background:transparent;border:1px dashed var(--accent);color:var(--accent);border-radius:9px;padding:8px;font-size:12px;cursor:pointer">🔗 この店の「店長用リンク」をコピー（自店だけ見える閲覧専用）</button>'+
          body+'</div></div>';
    }
    function saToggle(id){ var b=document.getElementById(id), w=document.getElementById(id+'w'); if(!b) return; b.hidden=!b.hidden; if(w) w.classList.toggle('tapped',!b.hidden); }
    // 店長用リンク（その店舗だけ・閲覧専用）をコピー
    function copyStoreLink(name){ if(!name) return; copyUrl(EXEC_URL+'?store='+encodeURIComponent(name)); }

    load();
  </script>
</body>
</html>
