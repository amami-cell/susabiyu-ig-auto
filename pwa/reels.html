<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<!-- 初回通信を速く：GAS(JSONP)先へ事前接続（DNS/TLSを前倒し） -->
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="dns-prefetch" href="https://script.google.com">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>すさび湯 三条 ・ 投稿の確認（フィード / リール）</title>
<style>
  /* ぎふや gifuya_reels.html と同一の土台デザイン。すさび湯三条用に自己完結で実装。 */
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  :root{--bg:#0f1115;--card:#181c23;--line:#262c36;--fg:#eaeef2;--sub:#9aa3b2;
        --ok:#1f9d55;--rd:#3b6fd6;--ng:#3a414d;--accent:#7fd1a0;--gold:#e0b56e;--reel:#7a4fd6}
  html,body{background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif}
  button{touch-action:manipulation;font-family:inherit}
  .topbar{position:sticky;top:0;z-index:20;background:rgba(15,17,21,.92);
    backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line)}
  .bar{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 12px) 16px 10px}
  .bar .back{border:1px solid var(--line);background:#181c23;color:var(--fg);font-size:13px;font-weight:800;padding:7px 13px;border-radius:999px;text-decoration:none}
  .bar h1{font-size:16px;font-weight:800;flex:1}
  .bar .mode{font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px}
  .bar .mode.live{color:var(--accent);background:#10301f}
  .bar .mode.demo{color:#d9b25a;background:#241d10}
  .tabs{display:flex;gap:8px;padding:0 14px 12px}
  .tab{flex:1;text-align:center;padding:11px;border-radius:12px;border:1px solid var(--line);background:#141922;color:var(--sub);font-weight:800;font-size:14px}
  .tab.on{background:#12263a;border-color:#2f5a8f;color:#cfe4ff}
  .tab.on.reel{background:#241a33;border-color:#5a3fa0;color:#e2d3ff}
  #wrap{padding:14px 14px 60px;max-width:520px;margin:0 auto}
  .hint{color:var(--sub);font-size:12.5px;line-height:1.7;text-align:center;margin:2px 2px 16px}
  .seclabel{font-size:13px;font-weight:800;color:var(--fg);margin:8px 2px 10px;display:flex;align-items:center;gap:8px}
  .seclabel .cnt{color:var(--accent);font-size:12px;font-weight:800}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:16px;position:relative;content-visibility:auto;contain-intrinsic-size:auto 560px}
  .rpick .pk{content-visibility:auto;contain-intrinsic-size:auto 170px}
  .card.reco{border-color:var(--gold);box-shadow:0 0 0 1px rgba(224,181,110,.35)}
  .reco-badge{position:absolute;top:-11px;left:14px;background:linear-gradient(90deg,#e0b56e,#caa14e);color:#241c08;font-size:11.5px;font-weight:900;padding:4px 11px;border-radius:999px}
  .chead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .kind{font-size:12px;font-weight:800;color:#fff;background:var(--rd);padding:3px 10px;border-radius:999px}
  .kind.reel{background:var(--reel)}
  .cno{font-size:12.5px;color:var(--sub);font-weight:800;margin-left:auto}
  .mediaWrap{position:relative;border-radius:13px;overflow:hidden;background:#000;width:100%}
  .mediaWrap.feed{aspect-ratio:4/5}
  .mediaWrap.reel{aspect-ratio:9/16}
  /* トリミング（リール用） */
  .trim{margin:10px 2px 2px}
  .trimhd{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);font-weight:800;margin-bottom:6px}
  .trimhd b{color:#e2d3ff}
  .rangewrap{position:relative;height:34px}
  .rangewrap input[type=range]{position:absolute;left:0;top:0;width:100%;margin:0;-webkit-appearance:none;background:transparent;pointer-events:none}
  .rangewrap input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:20px;height:20px;border-radius:50%;background:var(--reel);border:2px solid #fff;margin-top:-8px}
  .rangewrap .track{position:absolute;left:0;right:0;top:15px;height:5px;border-radius:3px;background:#2a3140}
  .rangewrap .sel{position:absolute;top:15px;height:5px;border-radius:3px;background:var(--reel)}
  /* 最新タグ取得のパスコード・ゲート */
  .gate{position:fixed;inset:0;background:#0f1115;display:none;flex-direction:column;justify-content:center;
    align-items:center;gap:18px;padding:30px;z-index:200}
  .gate.on{display:flex}
  .gate h1{font-size:20px;letter-spacing:2px}
  .gate p{color:#9aa3b2;font-size:13px;text-align:center;line-height:1.7}
  .gate input{width:min(320px,80vw);padding:14px 16px;font-size:20px;text-align:center;letter-spacing:6px;
    border-radius:12px;border:1px solid #2a3542;background:#141b23;color:#fff;outline:none}
  .gate button{width:min(320px,80vw);padding:14px;font-size:16px;font-weight:700;border:0;border-radius:12px;
    background:#c8a24a;color:#1a1206}
  .gate .err{color:#ff8080;font-size:13px;min-height:18px}
  .gate a{color:#9aa3b2;font-size:13px;text-decoration:none;cursor:pointer}
  .gate p small{color:#7c8698;font-size:11.5px}
  .mediaWrap img,.mediaWrap video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
  .mediaWrap.feed img{object-fit:contain}
  .cap{font-size:13.5px;line-height:1.6;margin:11px 2px 4px;white-space:pre-wrap;color:#dfe5ee}
  /* ハッシュタグ */
  .tagttl{font-size:12.5px;font-weight:800;color:#cfd6e2;margin:12px 2px 7px;display:flex;align-items:center;gap:7px}
  .tagttl .tcnt{color:var(--accent);font-size:11.5px}
  .tagsel{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
  .tagsel .t{font-size:12px;color:#bfe0cf;background:#12241a;border:1px solid #21402f;border-radius:999px;padding:4px 9px}
  .tagsel .t.inb{color:#cfe0ff;background:#131f30;border-color:#274063}
  .tagedit{width:100%;border:1px dashed var(--line);border-radius:11px;background:#12161d;color:#cfd6e2;font-weight:800;font-size:12.5px;padding:9px}
  .acts{display:flex;gap:8px;margin-top:11px}
  .acts button{flex:1;border:0;border-radius:13px;padding:13px 0;font-size:14.5px;font-weight:800;color:#fff}
  .acts .now{background:var(--ok)}
  .acts .resv{background:#2a3547;border:1px solid var(--line);color:#dfe5ee}
  .acts button:active{transform:scale(.97)}
  .resvbox{display:none;gap:7px;margin-top:9px;align-items:center;flex-wrap:wrap;background:#12161d;border:1px solid var(--line);border-radius:12px;padding:10px}
  .resvbox.open{display:flex}
  .resvbox label{font-size:12px;font-weight:800;color:var(--sub);width:100%}
  .resvbox input{background:#0f1115;border:1px solid var(--line);color:var(--fg);border-radius:9px;padding:9px;font-size:13px;font-family:inherit}
  .resvbox .go{flex:1;background:var(--rd);border:0;color:#fff;font-weight:800;border-radius:10px;padding:11px;font-size:13.5px}
  .copybtn{margin-top:8px;width:100%;border:1px solid var(--line);border-radius:12px;background:#12161d;color:var(--accent);font-weight:800;font-size:13.5px;padding:11px;display:flex;align-items:center;justify-content:center;gap:7px}
  .copybtn.done{background:#10301f;border-color:#1f4d33}
  .banner{text-align:center;font-size:14.5px;font-weight:800;padding:13px 0;border-radius:13px;margin-top:11px}
  .banner.okb{background:#10301f;color:var(--accent)}
  .banner.ngb{background:#23262d;color:#aeb6c2}
  /* ハッシュタグ編集モーダル */
  .modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center}
  .modal.open{display:flex}
  .sheet{background:#141922;width:100%;max-width:520px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;border:1px solid var(--line);padding:16px 16px calc(env(safe-area-inset-bottom) + 20px)}
  .sheet h3{font-size:15px;font-weight:900;margin-bottom:4px}
  .sheet .sub{font-size:12px;color:var(--sub);margin-bottom:12px;line-height:1.6}
  .tebar{font-size:12px;color:var(--sub);margin-bottom:9px}
  .tebar b{color:var(--accent)}
  .fetchbtn{width:100%;border:1px solid #2f5a8f;background:#12263a;color:#cfe4ff;font-weight:800;font-size:13px;border-radius:11px;padding:11px;margin-bottom:6px}
  .fetchbtn.cd{border-color:var(--line);background:#12161d;color:var(--sub)}
  .fetchnote{font-size:10.5px;color:#6f7684;line-height:1.6;margin-bottom:12px}
  .reglabel{font-size:12px;font-weight:800;color:#e0b56e;margin:10px 0 7px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px}
  .regmeta{font-size:10.5px;color:#6f7684;font-weight:600}
  .rankrow{margin:10px 0 4px}
  .rankttl{font-size:11.5px;font-weight:800;color:#aab2c0;margin-bottom:6px;display:flex;gap:6px;align-items:center}
  .rankttl .stars{color:#e0b56e}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
  .chip{border:1px solid var(--line);background:#12161d;color:#cfd6e2;border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:5px}
  .chip.inb{border-style:dashed}
  .chip.on{background:#10301f;border-color:#1f4d33;color:var(--accent)}
  .chip .s{font-size:9px;color:#e0b56e}
  .chip.on .s{color:#7fd1a0}
  .sheetclose{width:100%;margin-top:14px;border:0;border-radius:12px;background:var(--ok);color:#fff;font-weight:800;font-size:14.5px;padding:13px}
  #toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translateX(-50%);
    background:#000;color:#fff;padding:11px 18px;border-radius:24px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:60;max-width:90%;text-align:center}
  #toast.show{opacity:.96}
  .foot{color:#6f685d;font-size:10px;text-align:center;padding:6px 0 calc(env(safe-area-inset-bottom) + 16px)}
  .tab.on{--x:0}
  .tab.sched.on{background:#2a2410;border-color:#7a6320;color:#f0dfa0}
  /* ===== 予約カレンダー ===== */
  .schsum{display:flex;align-items:center;gap:10px;background:#12161d;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:2px 2px 14px}
  .schsum .big{font-size:26px;font-weight:900;color:var(--gold);line-height:1}
  .schsum .lbl{font-size:12.5px;color:var(--sub);font-weight:700}
  .schsum .leg{margin-left:auto;display:flex;gap:10px;font-size:11px;color:var(--sub);font-weight:700}
  .schsum .leg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:middle}
  .cal{margin:0 0 20px}
  .calhd{font-size:14px;font-weight:900;color:var(--fg);margin:0 2px 8px;display:flex;align-items:center;gap:8px}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cwd{text-align:center;font-size:10.5px;font-weight:800;color:var(--sub);padding:2px 0}
  .cwd.sun{color:#e08a8a}.cwd.sat{color:#8ab4e0}
  .cday{min-height:52px;border:1px solid var(--line);border-radius:9px;background:#12161d;padding:4px 3px 3px;position:relative;overflow:hidden}
  .cday.pad{background:transparent;border-color:transparent}
  .cday.past{opacity:.4}
  .cday.today{border-color:var(--gold);box-shadow:0 0 0 1px rgba(224,181,110,.35)}
  .cday .dn{font-size:11px;font-weight:800;color:#cfd6e2}
  .cday.sun .dn{color:#e08a8a}.cday.sat .dn{color:#8ab4e0}
  .cday .ct{display:block;font-size:9.5px;font-weight:800;border-radius:5px;padding:1px 3px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
  .cday .ct.feed{background:#2f5a3a}.cday .ct.reel{background:#4a3a72}
  .cday .ct.posted{background:#1f6d3f}.cday .ct.failed{background:#7a2f2f}
  .cday.donesol{opacity:1}
  .cday .more{font-size:9px;color:var(--sub);font-weight:800}
  .cday.tapable{cursor:pointer}
  .cday.tapable:active{transform:scale(.96)}
  .cday .plus{position:absolute;right:4px;bottom:3px;font-size:12px;color:#5a6472;font-weight:900}
  /* 予約シート（日詳細／新規予約） */
  .rsheet .rrow{display:flex;gap:10px;align-items:center;padding:9px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:#12161d}
  .rsheet .rrow img,.rsheet .rrow .noimg{width:52px;height:65px;border-radius:8px;object-fit:cover;background:#000;flex:none}
  .rsheet .rrow .noimg{display:flex;align-items:center;justify-content:center;font-size:24px}
  .rsheet .rrow .rt{font-size:12px;font-weight:900;color:var(--gold)}
  .rsheet .rrow .rn{font-size:13px;font-weight:800;color:#eaeef2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rsheet .rrow .rcancel{margin-left:auto;flex:none;font-size:11.5px;font-weight:800;color:#e6a4a4;background:#2a1c1c;border:1px solid #5a3a3a;border-radius:9px;padding:8px 10px}
  .rpick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
  .rpick .pk{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#12161d;padding:0;text-align:left}
  .rpick .pk.on{border-color:var(--gold);box-shadow:0 0 0 1px rgba(224,181,110,.45)}
  .rpick .pk .th{width:100%;aspect-ratio:4/5;object-fit:cover;background:#000;display:block}
  .rpick .pk .th.contain{object-fit:contain}
  .rpick .pk .nm{font-size:10.5px;font-weight:800;color:#dfe5ee;padding:5px 6px;line-height:1.3;min-height:34px}
  .rpick .pk .gtag{font-size:9px;color:var(--sub);padding:0 6px 5px}
  .rgridprev{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:6px 0 4px}
  .rgridprev img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#000;display:block}
  .rgridprev .ph{width:100%;aspect-ratio:1/1;background:#12161d;display:flex;align-items:center;justify-content:center;color:#3a424e;font-size:11px}
  .rtime{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
  .rtime input{background:#0f1115;border:1px solid var(--line);color:var(--fg);border-radius:9px;padding:10px;font-size:14px;font-family:inherit}
  .rgo{width:100%;background:var(--rd);border:0;color:#fff;font-weight:900;border-radius:12px;padding:13px;font-size:14.5px;margin-top:4px}
  .rgo:disabled{opacity:.5}
  .rmore{width:100%;border:1px dashed var(--line);border-radius:12px;background:#12161d;color:#cfd6e2;font-weight:800;font-size:13px;padding:11px;margin:4px 0 10px}
</style>
</head>
<body>
<header class="topbar">
  <div class="bar">
    <a class="back" href="./index.html">← 戻る</a>
    <h1>投稿の確認</h1>
    <span class="mode" id="mode"></span>
  </div>
  <div class="tabs">
    <button class="tab on" id="tFeed">📸 フィード</button>
    <button class="tab reel" id="tReel">🎬 リール</button>
    <button class="tab sched" id="tSched">📅 予約済</button>
    <button class="tab" id="tMention">💬 メンション</button>
    <button class="tab" id="tDM">📨 DM</button>
    <button class="tab" id="tLP">📈 LP</button>
  </div>
</header>

<div id="wrap"></div>

<div class="gate" id="pcgate">
  <h1>🔑 最新タグの取得</h1>
  <p>地域の最新ハッシュタグを取得します。<br>取得コードを入力してください。<br><small>※取得すると全員に共有され、7日間は再取得できません。</small></p>
  <input id="pcpass" type="password" inputmode="numeric" autocomplete="off" placeholder="●●●●">
  <button id="pcgo">取得する</button>
  <div class="err" id="pcerr"></div>
  <a id="pccancel">キャンセル</a>
</div>

<!-- ハッシュタグ編集モーダル -->
<div class="modal" id="tagmodal">
  <div class="sheet">
    <h3>ハッシュタグを編集</h3>
    <div class="sub">タップで選択／解除。★＝人気の目安、点線＝インバウンド向け。「今の地域のおすすめ」で河原町三条・京都の人気タグを取得できます。</div>
    <div id="tagbody"></div>
    <button class="sheetclose" id="tagclose">この内容で決定</button>
  </div>
</div>

<!-- 予約シート（日の詳細／新規予約） -->
<div class="modal" id="resvmodal">
  <div class="sheet rsheet">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
      <button id="resvback" style="flex:none;background:#33415a;border:1px solid #4a5d7e;color:#eaf1ff;font-weight:900;font-size:14px;border-radius:11px;padding:9px 14px">← 戻る</button>
      <h3 id="resvttl" style="margin:0;flex:1;min-width:0">予約</h3>
    </div>
    <div class="sub" id="resvsub"></div>
    <div id="resvbody"></div>
    <button class="sheetclose" id="resvclose" style="background:#33415a;border:1px solid #4a5d7e;color:#eaf1ff">← 戻る</button>
  </div>
</div>

<!-- 画像の拡大表示（投稿画像の確認用） -->
<div id="imgbox" style="position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;padding:16px;flex-direction:column;gap:12px">
  <img id="imgboxImg" src="" alt="" style="max-width:100%;max-height:82vh;object-fit:contain;border-radius:10px;background:#000">
  <button id="imgboxClose" style="background:#33415a;border:1px solid #4a5d7e;color:#eaf1ff;font-weight:900;font-size:14px;border-radius:11px;padding:10px 18px">✕ 閉じる</button>
</div>

<div id="toast"></div>
<div class="foot">すさび湯グループ 投稿管理 ・ 大衆寿司酒場すさび湯 三条<br>
  <span id="verlbl" style="opacity:.7"></span>
  <a id="forceupd" style="color:#8ab4e0;text-decoration:underline;cursor:pointer;margin-left:8px">🔄 最新に更新</a>
</div>

<script src="./config.js"></script>
<script>
(function(){
  "use strict";
  window.__APPV = "v197";   // 画面下の版数表示用（sw.js の VER と同期・コード変更で更新）
  var CFG = window.SUSABIYU || {};
  var GAS = (CFG.GAS_URL||"").trim();
  // 実データ連携が有効か（config.js の GAS_URL が実物URLに置換済みか）。未置換(PASTE_)なら見本モード。
  var LIVE = /^https:\/\//.test(GAS) && GAS.indexOf("PASTE_")!==0;
  var ACCOUNT = CFG.ACCOUNT || "";               // 三条は既定（空）＝account送らない。多店舗時のみ指定。

  /* ---------- 予約データ（schedlist）キャッシュ＋カレンダー ---------- */
  var SCHED=[];          // 予約一覧 [{token,when,kind,media,name,caption,hashtags,status,note}]
  var schedCb=null;      // 取得後の再描画コールバック（現在のタブ用）
  var schedFetchedAt=0;  // 直近取得時刻（短時間キャッシュ＝無駄な通信を省く）
  function loadSched(cb, force){
    if(cb) schedCb=cb;
    if(!LIVE){ SCHED=[]; if(schedCb)schedCb(); return; }
    if(!force && (Date.now()-schedFetchedAt) < 20000){ if(schedCb)schedCb(); return; }
    gJsonp({api:"schedlist"}).then(function(res){ SCHED=(res&&res.items)||[]; schedFetchedAt=Date.now(); if(schedCb)schedCb(); })
      .catch(function(){ if(schedCb)schedCb(); });
  }
  /* フィード候補＝加工済みの投稿画像(pwa/susabiyu/feed_XX.jpg)。feed.jsonから全商品を読み込む。 */
  function loadFeedJson(){
    fetch("./susabiyu/feed.json", {cache:"no-store"}).then(function(r){ return r.ok?r.json():null; }).then(function(d){
      if(!d||!d.items||!d.items.length) return;
      FEED = d.items.map(function(it){ return {img:"./susabiyu/"+it.img, story:it.story?("./susabiyu/"+it.story):"", t:it.name||it.title||"", cap:it.cap||"", tags:it.tags||"", reco:!!it.reco, banner:!!it.banner}; });
      FEED = shuffleFeed(FEED);
      if(tF.classList.contains("on")) render("feed");
    }).catch(function(){});
  }
  /* リール候補を共有ストア(GAS)から読む（接続時）。フィードはfeed.jsonが正なので上書きしない。 */
  function loadCands(){
    gJsonp({api:"cands"}).then(function(res){
      if(!res||!res.ok) return;
      if(res.reel&&res.reel.length){
        REEL=res.reel.map(function(c){ return {video:c.media||SAMPLEVID, poster:c.poster||"", t:c.name||"", cap:c.copy||"", dur:c.dur||48, reco:!!c.reco}; });
        if(tR.classList.contains("on")) render("reel");
      }
    }).catch(function(){});
  }

  /* ---------- 料理ジャンル分類（連続の偏りを避ける・寿司/海鮮向け） ---------- */
  function genreOf(n){ n=String(n||"");
    if(/にぎり|握り|鮨|寿司|すし|軍艦|巻き|鉄火|手毬/.test(n)) return "寿司";
    if(/天ぷら|天麩羅|唐揚|から揚|フライ|揚げ|串カツ|串かつ|コロッケ|天$|天1本|えび天|あなご天|キス天/.test(n)) return "揚げ物";
    if(/つくね|ねぎま|串焼|焼き鳥|焼鳥|もも串|串|焼き|鉄板|グリル/.test(n)) return "焼き物";
    if(/まぐろ|マグロ|サーモン|トロ|とろ|鯛|たい|ぶり|ブリ|ハマチ|はまち|いか|イカ|たこ|タコ|えび|エビ|海鮮|刺身|刺し|造り|お造り|カルパッチョ|三昧|ネタ|いくら|うに|ウニ|帆立|ほたて|かんぱち|しめ|えんがわ|漬け/.test(n)) return "刺身・海鮮";
    if(/サラダ|枝豆|漬|野菜|冷奴|奴|トマト|なす|茄子|きゅうり|胡瓜|長芋|ピーマン/.test(n)) return "野菜・箸休め";
    if(/ラーメン|丼|ごはん|茶漬|〆|シメ|うどん|そば/.test(n)) return "〆";
    if(/ビール|ハイボール|日本酒|サワー|ドリンク|乾杯|酒/.test(n)) return "ドリンク";
    return "その他";
  }
  function schedTailGenres(kind,n){
    var wantReel=(kind==="reel");
    var arr=SCHED.filter(function(s){ return ((s.kind||"feed")==="reel")===wantReel; })
      .slice().sort(function(a,b){return String(a.when)<String(b.when)?-1:1;});
    return arr.slice(-n).map(function(s){return genreOf(s.name);});
  }
  // 直近に投稿/予約した“品名”（新しい順n件）＝おすすめがグリッド(投稿済み)と被らないよう除外に使う
  function recentNames(kind,n){
    var wantReel=(kind==="reel");
    return SCHED.filter(function(s){ return ((s.kind||"feed")==="reel")===wantReel; })
      .slice().sort(function(a,b){return String(a.when)>String(b.when)?-1:1;})
      .slice(0,n||8).map(function(s){return s.name;});
  }
  // 直近投稿の品を除いた候補（少なすぎたら元のリストにフォールバック＝おすすめが空にならない）
  function freshPool(list,kind,n){
    var rec=recentNames(kind,n); var f=list.filter(function(p){return rec.indexOf(p.t)<0;});
    return f.length>=3?f:list;
  }
  function pickRecos(pool,n,seedGenres){
    var picked=[],used={},lastG=(seedGenres&&seedGenres.length)?seedGenres[seedGenres.length-1]:null;
    function fill(strict){
      for(var i=0;i<pool.length&&picked.length<n;i++){ var p=pool[i]; if(used[p.t])continue;
        var g=genreOf(p.t);
        if(strict){ if(g===lastG)continue; if(picked.length&&genreOf(picked[picked.length-1].t)===g)continue; }
        picked.push(p);used[p.t]=1;lastG=g;
      }
    }
    fill(true); if(picked.length<n) fill(false);
    return picked;
  }

  var wrap = document.getElementById("wrap");
  var showAll={feed:false,reel:false};
  // おすすめ3に“たまに”バナーを1枠だけ混ぜる（3回に1回・料理2＋バナー1）。
  // フィードはグリッドに残るので出しすぎない＝自然に週1くらいで表面化させる狙い。
  var _recoBannerDecided=false, _recoBanner=null;
  function decideRecoBanner(){
    if(_recoBannerDecided) return;
    var banners=FEED.filter(function(p){return p.banner;});
    if(!banners.length) return;                 // feed.json未ロード→次のrenderで判定
    _recoBannerDecided=true;
    try{
      var n=parseInt(localStorage.getItem("susv_reco_n")||"0",10)||0;
      localStorage.setItem("susv_reco_n",String(n+1));
      _recoBanner=(n%3===2)?banners[Math.floor(n/3)%banners.length]:null;   // 3回に1回だけ
    }catch(e){ _recoBanner=null; }
  }
  // 候補カードを1枚作る（おすすめ欄・全商品欄で共通利用）
  function buildCard(kind,p,noLbl){
    var c=document.createElement("div"); c.className="card"+(p.reco?" reco":"");
    var isBn = (kind==="feed") && p.banner && !!p.story;   // バナー（フィード/ストーリー両対応）
    var dest = "feed";                                     // バナーの投稿先（既定=フィード）
    function effKind(){ return (isBn && dest==="story") ? "story" : kind; }
    var media=kind==="feed"
      ? '<div class="mediaWrap feed">'+(feedImg(p)?'<img loading="lazy" decoding="async" src="'+esc(cardSrc(feedImg(p)))+'" onerror="this.onerror=null;this.src=\''+esc(feedImg(p))+'\'" alt="">':'<div class="ph" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#3a424e">画像なし</div>')+'</div>'
      : '<div class="mediaWrap reel"><video '+(reelPoster(p)?'poster="'+esc(reelPoster(p))+'" ':'')+'src="'+esc(reelVid(p))+'" controls playsinline preload="none" webkit-playsinline></video></div>';
    var trim=kind==="reel"
      ? '<div class="trim"><div class="trimhd"><span>切り取り（リール用）</span><span><b class="tlen">--</b> / 元<span class="tall">--</span></span></div>'+
        '<div class="rangewrap"><div class="track"></div><div class="sel"></div>'+
        '<input type="range" class="ts" min="0" max="100" value="0"><input type="range" class="te" min="0" max="100" value="60"></div>'+
        '<div class="trimhd" style="margin-top:4px"><span class="tstart">開始 0:00</span><span class="tend">終了 0:30</span></div></div>'
      : '';
    c.innerHTML =
      (p.reco?'<div class="reco-badge">★ おすすめ</div>':'')+
      '<div class="chead"><span class="kind'+(kind==="reel"?" reel":"")+'">'+(kind==="feed"?"フィード":"リール")+'</span>'+
        '<span class="cno">'+esc(noLbl||"")+' ・ '+esc(p.t)+' <span style="color:#6f7684">['+esc(genreOf(p.t))+']</span></span></div>'+
      media+trim+
      '<div class="caplbl" style="font-size:11.5px;font-weight:800;color:#8b93a2;margin:11px 2px 4px">▼ 投稿される文面（本文テンプレ）／ハッシュタグは下で選んだ分が付きます</div>'+
      '<div class="cap"></div>'+
      '<div class="tagttl">ハッシュタグ <span class="tcnt"></span></div>'+
      '<div class="tagsel"></div><button class="tagedit">✏️ ハッシュタグを編集</button>'+
      (isBn ? '<div class="bdst" style="display:flex;gap:8px;align-items:center;margin:10px 2px 2px;font-size:12.5px;font-weight:800;color:#8b93a2">投稿先'+
        '<button class="bdf on" style="border:0;border-radius:999px;padding:6px 13px;font-weight:800;font-size:12.5px;cursor:pointer;background:var(--rd);color:#fff">📸 フィード</button>'+
        '<button class="bds" style="border:0;border-radius:999px;padding:6px 13px;font-weight:800;font-size:12.5px;cursor:pointer;background:#23262d;color:#aeb6c2">📱 ストーリー</button></div>'+
        '<div class="bdsthint" style="font-size:11px;color:#6f7684;margin:3px 2px 0">ストーリーは文面なし（画像のみ）で投稿されます。</div>' : '')+
      '<div class="acts"><button class="now">今すぐ投稿</button><button class="resv">日時を決めて予約</button></div>'+
      '<div class="resvbox"><label>予約日時</label><input type="date" class="rdate"><input type="time" class="rtime" value="18:00"><button class="go">この日時で予約</button></div>'+
      '<div class="slot"></div>'+
      '<button class="copybtn">📋 キャプションをコピー</button>';
    function refreshSel(){
      c.querySelector(".cap").textContent = previewCaption(kind,p);
      var w=c.querySelector(".tagsel"); w.innerHTML="";
      var keys=Object.keys(GSEL);
      if(!keys.length){ w.innerHTML='<span style="color:#7c8698;font-size:12.5px">（未選択）</span>'; }
      keys.forEach(function(t){ var inb=HTAGS.concat(REGION_POOL,REGIONAL).some(function(h){return h.t===t&&h.inb;}); var sp=document.createElement("span"); sp.className="t"+(inb?" inb":""); sp.textContent="#"+t; w.appendChild(sp); });
      c.querySelector(".tcnt").textContent=keys.length+"個";
    }
    c._refresh=refreshSel; refreshers.push(refreshSel); refreshSel();
    if(kind==="reel"){ setupTrim(c,p); }
    c.querySelector(".tagedit").onclick=function(){ openTagEditor(c); };
    var slot=c.querySelector(".slot"), rbox=c.querySelector(".resvbox");
    // バナーの投稿先トグル（フィード⇄ストーリー）。プレビュー画像も9:16/4:5で切り替え。
    if(isBn){
      var bF=c.querySelector(".bdf"), bS=c.querySelector(".bds"), mimg=c.querySelector(".mediaWrap img");
      function setDest(d){ dest=d;
        bF.style.background=(d==="feed")?"var(--rd)":"#23262d"; bF.style.color=(d==="feed")?"#fff":"#aeb6c2";
        bS.style.background=(d==="story")?"var(--rd)":"#23262d"; bS.style.color=(d==="story")?"#fff":"#aeb6c2";
        // フィードはWebP(cardSrc)。ストーリーはWebP未生成なのでjpg直指定（無駄な404を出さない）。
        if(mimg){ var src=(d==="story")?storyImg(p):feedImg(p); mimg.src=(d==="story")?src:cardSrc(src); mimg.onerror=function(){ this.onerror=null; this.src=src; }; }
      }
      bF.onclick=function(){ setDest("feed"); }; bS.onclick=function(){ setDest("story"); };
    }
    c.querySelector(".now").onclick=function(){ var d=new Date(); var when=d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)+" "+("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2); doSchedule(effKind(),p,when,slot,"投稿しました"); };
    c.querySelector(".resv").onclick=function(){ rbox.classList.toggle("open"); };
    c.querySelector(".go").onclick=function(){
      var dd=c.querySelector(".rdate").value, tt=c.querySelector(".rtime").value||"18:00";
      if(!dd){ toast("予約日を選んでください"); return; }
      rbox.classList.remove("open");
      doSchedule(effKind(),p,dd+" "+tt,slot,"予約しました");
    };
    var cb=c.querySelector(".copybtn");
    cb.onclick=function(){ var f = fullCaption(kind,p);
      copy(f,function(){ cb.textContent="✓ コピーしました"; cb.classList.add("done"); toast("キャプションをコピーしました");
      setTimeout(function(){ cb.textContent="📋 キャプションをコピー"; cb.classList.remove("done"); },2200); }); };
    return c;
  }
  // フィード/リールタブ：上部に「次のおすすめ3件（ジャンル分散）」＋「全商品から選ぶ」
  /* ---------- カルーセル（複数枚フィード）ビルダー：既存カードUIとは独立 ---------- */
  var carouselSel=[];   // 選んだフィード商品（順番＝表示順）
  function buildCarouselPanel(){
    // class は "card" にしない（renderListの再描画で .card は消されるため）。見た目はinlineで付与。
    var box=document.createElement("div"); box.className="cbwrap";
    box.style.cssText="padding:12px;background:#12151b;border:1px solid #222833;border-radius:16px;margin:10px 0";
    box.innerHTML=
      '<button class="cbtoggle" style="width:100%;border:0;border-radius:12px;padding:12px;font-weight:800;background:#152238;color:#cfe0ff;font-size:14px;cursor:pointer">🖼️ カルーセル投稿を作る（複数選択・2〜10枚）</button>'+
      '<div class="cbpanel" style="display:none;margin-top:10px">'+
        '<div style="font-size:12px;color:#8b93a2;margin:2px 2px 8px">タップで選択（番号＝並び順）。保存・滞在が伸びる複数枚投稿を作れます。</div>'+
        '<div class="cbgrid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-height:300px;overflow:auto"></div>'+
        '<div style="display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap">'+
          '<b class="cbcnt" style="font-size:13px;color:#8b93a2;flex:1;min-width:70px">0枚選択</b>'+
          '<button class="cbnow" disabled style="border:0;border-radius:999px;padding:8px 14px;font-weight:800;background:var(--rd);color:#fff;cursor:pointer;opacity:.5">今すぐ投稿</button>'+
          '<button class="cbresv" disabled style="border:0;border-radius:999px;padding:8px 14px;font-weight:800;background:#23262d;color:#cfe0ff;cursor:pointer;opacity:.5">日時予約</button>'+
          '<button class="cbclear" style="border:0;border-radius:999px;padding:8px 14px;font-weight:800;background:#23262d;color:#aeb6c2;cursor:pointer">クリア</button>'+
        '</div>'+
        '<div class="cbresvbox" style="display:none;margin-top:8px;gap:6px;align-items:center;flex-wrap:wrap">'+
          '<input type="date" class="cbdate"><input type="time" class="cbtime" value="18:00">'+
          '<button class="cbgo" style="border:0;border-radius:999px;padding:8px 14px;font-weight:800;background:var(--rd);color:#fff;cursor:pointer">この日時で予約</button></div>'+
        '<div class="cbslot" style="margin-top:8px"></div>'+
      '</div>';
    var panel=box.querySelector(".cbpanel"), grid=box.querySelector(".cbgrid");
    var cnt=box.querySelector(".cbcnt"), bNow=box.querySelector(".cbnow"), bResv=box.querySelector(".cbresv");
    var rbox=box.querySelector(".cbresvbox"), slot=box.querySelector(".cbslot");
    function refresh(){
      cnt.textContent=carouselSel.length+"枚選択";
      var ok=carouselSel.length>=2 && carouselSel.length<=10;
      [bNow,bResv].forEach(function(b){ b.disabled=!ok; b.style.opacity=ok?"1":".5"; });
      Array.prototype.forEach.call(grid.children,function(t){
        var i=carouselSel.indexOf(t._p); var n=t.querySelector(".cbnum");
        if(i>=0){ t.style.borderColor="var(--rd)"; n.style.display="flex"; n.textContent=String(i+1); }
        else { t.style.borderColor="transparent"; n.style.display="none"; }
      });
    }
    FEED.filter(function(p){return !p.banner;}).forEach(function(p){
      var t=document.createElement("button"); t.type="button"; t._p=p;
      t.style.cssText="position:relative;border:2px solid transparent;border-radius:8px;overflow:hidden;padding:0;background:#0b0f16;cursor:pointer;aspect-ratio:1/1";
      var src=feedImg(p);
      t.innerHTML='<img src="'+esc(cardSrc(src))+'" onerror="this.onerror=null;this.src=\''+esc(src)+'\'" style="width:100%;height:100%;object-fit:cover" loading="lazy"><span class="cbnum" style="position:absolute;top:2px;left:2px;background:var(--rd);color:#fff;font-weight:800;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:none;align-items:center;justify-content:center"></span>';
      t.onclick=function(){ var i=carouselSel.indexOf(p);
        if(i>=0) carouselSel.splice(i,1);
        else { if(carouselSel.length>=10){ toast("最大10枚です"); return; } carouselSel.push(p); }
        refresh(); };
      grid.appendChild(t);
    });
    box.querySelector(".cbtoggle").onclick=function(){ var op=panel.style.display!=="none"; panel.style.display=op?"none":"block"; };
    box.querySelector(".cbclear").onclick=function(){ carouselSel=[]; rbox.style.display="none"; slot.innerHTML=""; refresh(); };
    function submit(when,label){
      if(carouselSel.length<2){ toast("2枚以上選んでください"); return; }
      var media=carouselSel.map(function(p){ return absUrl(feedImg(p)); }).join("|");
      var caption=fullCaption("feed", carouselSel[0]);
      var name=(carouselSel[0].t||"")+" 他"+(carouselSel.length-1)+"枚";
      if(!LIVE){ slot.innerHTML='<div class="banner okb">✓ '+label+'（見本）</div>'; toast(label+"（見本）"); return; }
      slot.innerHTML='<div class="banner okb">送信中…</div>';
      gJsonp({api:"schedule", kind:"carousel", name:name, when:when, media:media, caption:caption, hashtags:""}).then(function(res){
        if(res&&(res.ok||res.result==="ok")){ slot.innerHTML='<div class="banner okb">✓ '+label+'（'+carouselSel.length+'枚）</div>'; toast(label); carouselSel=[]; refresh(); loadSched(null,true); }
        else { slot.innerHTML='<div class="banner ngb">送信できませんでした</div>'; toast("失敗しました"); }
      }).catch(function(){ slot.innerHTML='<div class="banner ngb">通信エラー</div>'; toast("通信エラー"); });
    }
    bNow.onclick=function(){ var d=new Date(); var w=d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)+" "+("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2); submit(w,"投稿しました"); };
    bResv.onclick=function(){ rbox.style.display=(rbox.style.display==="none"?"flex":"none"); };
    box.querySelector(".cbgo").onclick=function(){ var dd=box.querySelector(".cbdate").value, tt=box.querySelector(".cbtime").value||"18:00"; if(!dd){ toast("予約日を選んでください"); return; } rbox.style.display="none"; submit(dd+" "+tt,"予約しました"); };
    refresh();
    return box;
  }

  function render(kind){
    wrap.innerHTML=""; refreshers=[];
    var hint=document.createElement("div"); hint.className="hint";
    hint.innerHTML = (kind==="feed"
      ? "次に投稿する<b>おすすめを3つ</b>だけ表示（同じジャンル＝寿司・海鮮などが続かないよう自動で分散）。他の料理は「全商品から選ぶ」で。"
      : "リール候補です（現在は準備中・形のみ）。<b>今すぐ投稿</b> または <b>日時を決めて予約</b>できます。")
      + "<br>※大衆寿司酒場すさび湯 三条（@susabiyu_sanjyo）" + (LIVE?"：実データ連携中。":"：現在は見本モードです。");
    wrap.appendChild(hint);
    if(kind==="feed") wrap.appendChild(buildCarouselPanel());   // カルーセル（複数枚）ビルダー
    var list = kind==="feed"?FEED:REEL;
    function renderList(){
      Array.prototype.slice.call(wrap.querySelectorAll(".seclabel,.card,.rmore")).forEach(function(x){x.remove();});
      if(kind==="feed") decideRecoBanner();
      var useBn=(kind==="feed") && _recoBanner;
      var recos=pickRecos(freshPool(list.filter(function(p){return !p.banner;}),kind,8),useBn?2:3,schedTailGenres(kind,2));  // 料理を先に選ぶ（バナー除外＋直近投稿の品も除外）
      if(useBn) recos.splice(1,0,_recoBanner);   // 料理・バナー・料理 の並びで1枠だけ差し込む
      var lab=document.createElement("div"); lab.className="seclabel";
      lab.innerHTML=(kind==="feed"?"⭐ 次のおすすめ":"⭐ おすすめリール")+' <span class="cnt">'+recos.length+'件</span>';
      wrap.appendChild(lab);
      recos.forEach(function(p,i){ wrap.appendChild(buildCard(kind,p,"おすすめ "+(i+1))); });
      var rest=list.filter(function(p){return recos.indexOf(p)<0;});
      var more=document.createElement("button"); more.className="rmore";
      more.textContent=(showAll[kind]?"▲ おすすめだけ表示":"▼ 全商品から選ぶ（全"+list.length+"品）");
      wrap.appendChild(more);
      if(showAll[kind]){
        var lab2=document.createElement("div"); lab2.className="seclabel";
        lab2.innerHTML=(kind==="feed"?"📸 全商品":"🎬 全リール")+' <span class="cnt">'+rest.length+'件</span>';
        wrap.appendChild(lab2);
        rest.forEach(function(p,i){ wrap.appendChild(buildCard(kind,p,(i+1)+" / "+rest.length)); });
      }
      more.onclick=function(){ showAll[kind]=!showAll[kind]; renderList(); if(!showAll[kind]) window.scrollTo({top:0,behavior:"smooth"}); };
    }

  /* ---------- 予約カレンダー（当月＋来月・時間表示・タップで確認/新規） ---------- */
  function _ymd(d){ return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }
  function fmtDateJ(k){ var p=String(k).split("-"); return (+p[1])+"月"+(+p[2])+"日"; }
  function renderSched(){
    wrap.innerHTML="";
    var head=document.createElement("div"); wrap.appendChild(head);
    if(!LIVE){ var e=document.createElement("div"); e.className="hint"; e.innerHTML="実データ連携後に予約が表示されます（現在は見本モード）。<br>カレンダーの空いてる日をタップすると予約フローを確認できます。"; wrap.appendChild(e); }
    var cal=document.createElement("div"); wrap.appendChild(cal);
    function draw(){
      if(!tS.classList.contains("on")) return;
      var isDone=function(s){ return (s.status||"scheduled")!=="scheduled"; };
      var pending=SCHED.filter(function(s){return !isDone(s);});
      var done=SCHED.filter(isDone);
      var byDate={};
      SCHED.forEach(function(s){ var k=String(s.when||"").slice(0,10); if(!k)return; (byDate[k]=byDate[k]||[]).push(s); });
      Object.keys(byDate).forEach(function(k){ byDate[k].sort(function(a,b){return String(a.when)<String(b.when)?-1:1;}); });
      var feedN=pending.filter(function(s){return (s.kind||'feed')!=='reel';}).length;
      var reelN=pending.filter(function(s){return (s.kind||'feed')==='reel';}).length;
      var postedN=done.filter(function(s){return s.status==='posted';}).length;
      head.innerHTML='<div class="schsum"><div><div class="big">'+pending.length+'</div><div class="lbl">予約中の投稿</div></div>'+
        '<div class="leg"><span><i style="background:#2f5a3a"></i>フィード '+feedN+'</span><span><i style="background:#4a3a72"></i>リール '+reelN+'</span>'+(postedN?'<span><i style="background:#1f6d3f"></i>投稿済 '+postedN+'</span>':'')+'</div></div>'+
        '<div class="hint" style="margin:0 2px 12px">日付タップ＝その日の予約/投稿を確認／空き日タップ＝新しく予約。<b>✓＝投稿済み</b>・<b>✕＝失敗</b>。</div>';
      var now=new Date(); var todK=_ymd(now);
      var months=[new Date(now.getFullYear(),now.getMonth(),1), new Date(now.getFullYear(),now.getMonth()+1,1)];
      var html="";
      function chipCls(s){ var st=s.status||"scheduled"; return st==="posted"?"posted":(st==="failed"||st==="expired"?"failed":((s.kind||'feed')==='reel'?'reel':'feed')); }
      function chipMark(s){ var st=s.status||"scheduled"; return st==="posted"?"✓":(st==="failed"?"✕":(st==="expired"?"⤫":"")); }
      months.forEach(function(m){
        html+='<div class="cal"><div class="calhd">📅 '+m.getFullYear()+'年 '+(m.getMonth()+1)+'月</div><div class="calgrid">';
        ["日","月","火","水","木","金","土"].forEach(function(w,wi){ html+='<div class="cwd'+(wi===0?" sun":wi===6?" sat":"")+'">'+w+'</div>'; });
        var start=new Date(m.getFullYear(),m.getMonth(),1).getDay();
        var days=new Date(m.getFullYear(),m.getMonth()+1,0).getDate();
        for(var i=0;i<start;i++) html+='<div class="cday pad"></div>';
        for(var d=1;d<=days;d++){
          var dd=new Date(m.getFullYear(),m.getMonth(),d); var k=_ymd(dd); var wd=dd.getDay();
          var isPast=k<todK; var items=byDate[k]||[];
          var tap=(!isPast)||items.length>0;
          var cls="cday"+(wd===0?" sun":wd===6?" sat":"")+(k===todK?" today":"")+(isPast?" past":"")+(items.length?" donesol":"")+(tap?" tapable":"");
          var inner='<div class="dn">'+d+'</div>';
          items.slice(0,2).forEach(function(s){ inner+='<span class="ct '+chipCls(s)+'">'+chipMark(s)+esc(String(s.when||"").slice(11,16))+'</span>'; });
          if(items.length>2) inner+='<span class="more">+'+(items.length-2)+'件</span>';
          if(!isPast && !items.length) inner+='<span class="plus">＋</span>';
          html+='<div class="'+cls+'" data-k="'+k+'">'+inner+'</div>';
        }
        html+='</div></div>';
      });
      if(done.length){
        var hist=done.slice().sort(function(a,b){return String(a.when)>String(b.when)?-1:1;}).slice(0,20);
        html+='<div class="seclabel" style="margin-top:6px">✅ 投稿済み・履歴 <span class="cnt">直近'+done.length+'件</span></div>';
        hist.forEach(function(s){
          var ok=s.status==='posted';
          var badge=ok?'<span style="color:#7fd1a0;font-weight:800">✓ 投稿済</span>':(s.status==='failed'?'<span style="color:#e6a4a4;font-weight:800">✕ 失敗</span>':'<span style="color:#c9a06a;font-weight:800">期限切れ</span>');
          html+='<div class="rrow histrow" data-tok="'+esc(s.token)+'" style="cursor:pointer;margin-bottom:8px">'+
            (s.media?'<img loading="lazy" src="'+esc(thumbSrc(s.media))+'" data-full="'+esc(s.media)+'" onerror="this.onerror=null;this.src=this.getAttribute(\'data-full\')" alt="">':'<div class="noimg">🍣</div>')+
            '<div style="flex:1;min-width:0"><div class="rt">'+((s.kind||'feed')==='reel'?'🎬 リール':'📸 フィード')+' '+esc(String(s.when||"").slice(5,16))+'　'+badge+'</div>'+
            '<div class="rn">'+esc(s.name||"")+'</div>'+
            '<div style="font-size:10.5px;color:#7c8698;font-weight:700;margin-top:2px">▼ タップで投稿内容を表示</div></div>'+
            '<button class="histhide" data-tok="'+esc(s.token)+'" style="flex:none;align-self:center;font-size:11px;font-weight:800;color:#c9a9c9;background:#241c24;border:1px solid #3a2a3a;border-radius:8px;padding:8px 9px">消す</button></div>';
        });
      }
      cal.innerHTML=html;
      cal.querySelectorAll(".cday.tapable").forEach(function(cell){
        cell.onclick=function(){ var k=cell.getAttribute("data-k"); var items=byDate[k]||[];
          if(items.length) openDayDetail(k,items); else openNewResv(k); };
      });
      cal.querySelectorAll(".histrow").forEach(function(row){
        row.onclick=function(e){ if(e.target.closest(".histhide"))return; var tok=row.getAttribute("data-tok"); var s=SCHED.filter(function(x){return x.token===tok;})[0]; if(s) openDayDetail(String(s.when||"").slice(0,10),[s]); };
      });
      cal.querySelectorAll(".histhide").forEach(function(b){ b.onclick=function(e){ e.stopPropagation(); hideHist(b.getAttribute("data-tok")); }; });
    }
    schedCb=draw; draw(); if(LIVE) loadSched();
  }

            '<button class="histhide2" data-tok="'+esc(s.token)+'" style="font-size:10.5px;font-weight:800;color:#c9a9c9;background:#241c24;border:1px solid #3a2a3a;border-radius:8px;padding:5px 8px">履歴から消す</button>'+

      h+='<div class="rrow rtap" data-i="'+idx+'" style="cursor:pointer">'+thumb+
           '<div style="flex:1;min-width:0"><div class="rt">'+((s.kind||'feed')==='reel'?'🎬 リール':'📸 フィード')+' '+esc(String(s.when||"").slice(11,16))+'</div>'+

        .catch(function(){ if(removed){ SCHED.push(removed); if(schedCb)schedCb(); } toast("通信エラー（戻しました）"); }); }; });
    body.querySelectorAll(".histhide2").forEach(function(b){ b.onclick=function(ev){ ev.stopPropagation(); closeResv(); hideHist(b.getAttribute("data-tok")); }; });
    var addb=body.querySelector("#rAddDay"); if(addb) addb.onclick=function(){ openNewResv(k); };

  var newResv={};
  function openNewResv(k){
    var m=document.getElementById("resvmodal"), body=document.getElementById("resvbody");
    document.getElementById("resvttl").textContent=fmtDateJ(k)+" に新規予約";
    document.getElementById("resvsub").textContent="投稿を選んで時間を決めるだけ。おすすめは同じジャンルが続かないよう自動で分散します。";
    newResv={kind:"feed",pick:null,date:k,all:false};
    body.innerHTML=
      '<div style="display:flex;gap:8px;margin-bottom:10px">'+
        '<button class="tab on" id="nvFeed" style="flex:1;padding:9px">📸 フィード</button>'+
        '<button class="tab reel" id="nvReel" style="flex:1;padding:9px">🎬 リール</button>'+
      '</div>'+
      '<div id="nvGridPrev"></div>'+
      '<div id="nvPickWrap"></div>'+
      '<div id="nvDetail"></div>'+
      '<div class="rtime"><label style="font-size:12px;font-weight:800;color:var(--sub);width:100%">投稿時間（'+fmtDateJ(k)+'）</label>'+

      '<div id="nvSlot"></div>'+
      '<button class="rgo" id="nvGo" disabled>投稿を選んでください</button>';
    function drawPick(){
      var list=newResv.kind==="feed"?FEED:REEL;
      var recos=pickRecos(freshPool(list,newResv.kind,8),3,schedTailGenres(newResv.kind,2));   // 直近投稿の品は除外
      var pool=newResv.all?list:recos;
      var el=body.querySelector("#nvPickWrap");
      var html='<div style="font-size:12px;font-weight:800;color:var(--gold);margin:6px 2px">'+(newResv.all?'全商品から選ぶ':'⭐ おすすめ（ジャンル分散）')+'</div><div class="rpick">';
      pool.forEach(function(p){
        var base=newResv.kind==="feed"? feedImg(p) : (reelPoster(p)||"");
        var on=(newResv.pick&&newResv.pick.t===p.t)?" on":"";
        var img=base?'<img class="th'+(newResv.kind==="feed"?" contain":"")+'" loading="lazy" src="'+esc(thumbSrc(base))+'" onerror="this.onerror=null;this.src=\''+esc(base)+'\'">':'<div class="th" style="display:flex;align-items:center;justify-content:center;color:#3a424e;font-size:22px">'+(newResv.kind==="feed"?"🍣":"🎬")+'</div>';
        html+='<button class="pk'+on+'" data-t="'+esc(p.t)+'">'+img+'<div class="nm">'+esc(p.t)+'</div><div class="gtag">'+esc(genreOf(p.t))+'</div></button>';
      });
      html+='</div><button class="rmore" id="nvMore">'+(newResv.all?"▲ おすすめだけ":"▼ 全商品から選ぶ（全"+list.length+"品）")+'</button>';
      el.innerHTML=html;
      el.querySelectorAll(".pk").forEach(function(b){ b.onclick=function(){ var t=b.getAttribute("data-t"); newResv.pick=list.filter(function(x){return x.t===t;})[0]||null; drawPick(); drawGridPrev(); drawDetail(); updateGo(); }; });
      body.querySelector("#nvMore").onclick=function(){ newResv.all=!newResv.all; drawPick(); };
    }
    function drawDetail(){
      var el=body.querySelector("#nvDetail"); if(!el) return;
      if(!newResv.pick){ el.innerHTML=""; return; }
      var p=newResv.pick, full=fullCaption(newResv.kind,p);
      el.innerHTML='<div style="border:1px solid var(--line);border-radius:12px;background:#0f1319;padding:11px;margin:2px 0 10px">'+
        '<div style="font-size:11px;font-weight:800;color:var(--gold);margin-bottom:5px">📝 実際に投稿される内容（'+esc(p.t)+' ['+esc(genreOf(p.t))+']）</div>'+
        '<div style="font-size:13px;line-height:1.6;white-space:pre-wrap;color:#dfe5ee">'+esc(full)+'</div>'+
        '<div style="font-size:10.5px;color:#7c8698;margin-top:7px">※ハッシュタグは画面で選んだ分が付きます（フィード/リールの各カードで編集可）。</div>'+
      '</div>';
    }
    function drawGridPrev(){
      var gp=body.querySelector("#nvGridPrev");
      if(newResv.kind!=="feed"){ gp.innerHTML=""; return; }
      var feeds=SCHED.filter(function(s){return (s.kind||'feed')!=='reel';}).slice().sort(function(a,b){return String(a.when)>String(b.when)?-1:1;});
      var cells=[]; if(newResv.pick) cells.push({media:feedImg(newResv.pick),me:1});
      feeds.forEach(function(s){ cells.push({media:s.media}); });
      var h='<div style="font-size:11px;color:var(--sub);font-weight:800;margin:2px 2px 4px">プロフィールのグリッド見え方（新→旧・9枠）</div><div class="rgridprev">';

      var caption=fullCaption(kind,it);

      var opt={token:"tmp"+Date.now(), when:when, kind:kind, media:media, name:it.t||"", caption:caption, hashtags:"", status:"scheduled"};
      SCHED.push(opt); if(schedCb) schedCb(); closeResv(); toast("予約しました（予定時刻に自動投稿）");
      if(!LIVE) return;
      gJsonp({api:"schedule", kind:(kind==="feed"?"feed":"reel"), name:it.t||"", when:when, media:media, caption:caption, hashtags:""}).then(function(res){
        if(res&&(res.ok||res.result==="ok")){ loadSched(null,true); }
        else { _schedRemove(opt.token); if(schedCb)schedCb(); toast("予約に失敗しました。もう一度お試しください"); }
      }).catch(function(){ _schedRemove(opt.token); if(schedCb)schedCb(); toast("通信エラー。予約できませんでした"); });
    };
    drawPick(); drawGridPrev(); drawDetail(); updateGo();
    m.classList.add("open");
  }
  function closeResv(){ document.getElementById("resvmodal").classList.remove("open"); }
  function _schedRemove(token){ for(var i=0;i<SCHED.length;i++){ if(SCHED[i].token===token){ return SCHED.splice(i,1)[0]; } } return null; }
  function hideHist(token){
    if(!confirm("この投稿をカレンダーの履歴から消しますか？\n（Instagram側の投稿には影響しません）")) return;
    var removed=_schedRemove(token); if(schedCb) schedCb(); toast("履歴から消しました");
    gJsonp({api:"schedhide", token:token}).then(function(r){ if(!(r&&r.ok)&&removed){ SCHED.push(removed); if(schedCb)schedCb(); toast("消せませんでした（元に戻しました）"); } })
      .catch(function(){ if(removed){ SCHED.push(removed); if(schedCb)schedCb(); } toast("通信エラー（元に戻しました）"); });
  }

  function mentAct(mid,action,text,btn){
    if(action==="ignore" && !confirm("この投稿を無視（一覧から消す）しますか？")) return;
    var card=btn.closest(".card"); card.style.opacity=".5";
    card.querySelectorAll("button,textarea").forEach(function(b){b.disabled=true;});
    gJsonp({api:"mentionact", mid:mid, action:action, text:text||""}).then(function(r){

  function renderMentions(){
    wrap.innerHTML=""; refreshers=[];
    var hint=document.createElement("div"); hint.className="hint";
    hint.innerHTML="ストーリーズでメンションされた投稿です。文面を整えて <b>店ストーリーに追加</b>（リポスト）や <b>お礼DM</b> ができます。<br>※お客様のメンションを受け取るにはMeta側の設定・審査が必要です（それまでは自分のテスターからのみ届きます）。";

    gJsonp({api:"mentions"}).then(function(res){
      var items=(res&&res.items)||[];
      var live=items.filter(function(it){ return it.repostable!==false; });

      if(!items.length){ var e=document.createElement("div"); e.className="hint"; e.textContent="確認待ちのメンションはありません。"; wrap.appendChild(e); return; }
      var taStyle="width:100%;min-height:64px;border-radius:12px;border:1px solid #262c36;background:#12161d;color:#eaeef2;padding:10px;font-family:inherit;font-size:13.5px";
      function fmtWhen(it){ var _d=it.dt?new Date(it.dt):null; return (_d&&!isNaN(_d))?(("0"+_d.getHours()).slice(-2)+":"+("0"+_d.getMinutes()).slice(-2)):esc(String(it.dt||"")); }

        var storyChips=MENTION_STORY_TPL.map(function(t,i){ return '<button class="tpl" data-t="'+esc(t)+'">例'+(i+1)+'</button>'; }).join("")

          + '<button class="tpl" data-reset="dm">↩ 規定に戻す</button>';
        var isAuto=String(it.status)==="auto";
        var remainH=(typeof it.ageH==="number")?Math.max(0,Math.floor(24-it.ageH)):null;
        var remTxt=(remainH!=null)?('<span style="font-size:11px;color:'+(remainH<=3?'#e6a4a4':'#8b93a2')+';font-weight:700;margin-left:8px">リポスト期限 残り約'+remainH+'時間</span>'):'';
        var note=isAuto?'<div class="banner ngb" style="margin:8px 0 0">🕒 自動投稿の予定です。何もしなければ約2時間後にリポストします。それまでに文面を直して「今すぐ投稿」、やめる場合は「取り消し」。</div>':'';
        c.innerHTML=
          '<div class="chead"><span class="kind">💬 メンション</span><span class="cno">'+fmtWhen(it)+remTxt+'</span></div>'+
          mediaHtml(it)+note+
          '<div style="margin:10px 2px 4px;font-size:12px;color:#9aa3b2">① シェアコメント（店ストーリーに焼く文）</div>'+
          '<textarea class="mtext" style="'+taStyle+'"></textarea>'+
          '<div class="tplrow" style="display:flex;gap:6px;flex-wrap:wrap;margin:8px 0">'+storyChips+'</div>'+
          '<div style="margin:12px 2px 4px;font-size:12px;color:#9aa3b2">② お礼DM本文（お客様へ送るメッセージ・投稿文とは別）</div>'+
          '<textarea class="mdm" style="'+taStyle+';min-height:52px"></textarea>'+
          '<div class="tplrow" style="display:flex;gap:6px;flex-wrap:wrap;margin:8px 0">'+dmChips+'</div>'+
          '<div class="acts">'+
            '<button class="now" data-a="story">'+(isAuto?'今すぐ投稿（①で店ストーリー）':'店ストーリーに追加（①）')+'</button>'+
            '<button class="resv" data-a="reply">お礼DM（②）</button>'+

        var ta=c.querySelector(".mtext"); ta.value=it.text||MENTION_DEFAULT;

      });

        wrap.appendChild(dhint);
        dead.forEach(function(it){
          var c=document.createElement("div"); c.className="card"; c.style.opacity=".82";
          var why=(it.reason==="deleted")?"元の投稿が削除されています":"ストーリーの公開期限（24時間）が過ぎています";

          c.innerHTML=
            '<div class="chead"><span class="kind" style="background:#3a2a2a;color:#e6a4a4">⛔ リポスト不可</span><span class="cno">'+fmtWhen(it)+(ageTxt?'・'+ageTxt:'')+'</span></div>'+
            mediaHtml(it)+
            '<div class="banner ngb" style="margin:8px 0 0">⛔ '+why+'（店ストーリーへのリポストはできません）</div>'+
            '<div class="acts"><button class="resv" data-a="ignore" style="flex:1;background:#2a2330;border:1px solid #3a2a3a">一覧から消す</button></div>';

  var tF=document.getElementById("tFeed"), tR=document.getElementById("tReel"), tS=document.getElementById("tSched"), tM=document.getElementById("tMention"), tDM=document.getElementById("tDM"), tLP=document.getElementById("tLP");
  function _seltab(el){ [tF,tR,tS,tM,tDM,tLP].forEach(function(x){ x.classList.remove("on"); }); el.classList.add("on"); window.scrollTo({top:0}); }
  tF.onclick=function(){ _seltab(tF); render("feed"); };
  tR.onclick=function(){ _seltab(tR); render("reel"); };
  tS.onclick=function(){ _seltab(tS); renderSched(); };
  function renderDM(){
    wrap.innerHTML=""; refreshers=[];
    var hint=document.createElement("div"); hint.className="hint";
    hint.innerHTML="お客様から届いたInstagramのDMです（新しい順）。返信は各件の「Instagramで開く」から。<br>※通知は10〜22時。深夜に届いた分は翌朝まとめて通知します。";
    wrap.appendChild(hint);
    var lab=document.createElement("div"); lab.className="seclabel"; lab.innerHTML='\u{1F4E8} DM <span class="cnt">読み込み中…</span>'; wrap.appendChild(lab);
    gJsonp({api:"dm"}).then(function(res){
      var items=(res&&res.items)||[];
      lab.innerHTML='\u{1F4E8} DM <span class="cnt">'+items.length+'件</span>';
      if(!items.length){ var e=document.createElement("div"); e.className="hint"; e.textContent="まだ新着DMはありません。"; wrap.appendChild(e); return; }
      function fmt(t){ var d=t?new Date(t):null; if(!d||isNaN(d))return esc(String(t||"")); var mo=("0"+(d.getMonth()+1)).slice(-2),da=("0"+d.getDate()).slice(-2),hh=("0"+d.getHours()).slice(-2),mm=("0"+d.getMinutes()).slice(-2); return mo+"/"+da+" "+hh+":"+mm; }
      items.forEach(function(it){
        var c=document.createElement("div"); c.className="card";
        var u=String(it.sender||""); var isName=u && !/^[0-9]+$/.test(u);
        var link=isName?("https://ig.me/m/"+encodeURIComponent(u)):"https://www.instagram.com/direct/inbox/";
        var who=isName?("@"+u):"お客様";
        c.innerHTML=
          '<div class="chead"><span class="kind">\u{1F4E8} DM</span><span class="cno">'+fmt(it.time)+'</span></div>'+
          '<div style="font-weight:800;margin:6px 2px 2px;color:#cfe4ff">'+esc(who)+'</div>'+
          '<div style="white-space:pre-wrap;background:#12161d;border:1px solid #262c36;border-radius:12px;padding:10px;color:#eaeef2;font-size:14px">'+(it.text?esc(it.text):'<span style="color:#8b93a2">（本文なし・画像/スタンプ等）</span>')+'</div>'+
          '<div class="acts"><a class="now" href="'+link+'" target="_blank" rel="noopener" style="text-align:center;text-decoration:none;display:block">Instagramで開く</a></div>';
        wrap.appendChild(c);
      });
    }).catch(function(){ lab.innerHTML='\u{1F4E8} DM <span class="cnt">取得エラー（実データ連携時のみ）</span>'; });
  }

  tM.onclick=function(){ _seltab(tM); renderMentions(); };
  var lpDays=7;
  function renderLP(){
    wrap.innerHTML=""; refreshers=[];
    var hint=document.createElement("div"); hint.className="hint";
    hint.innerHTML="予約LP（yoyaku-pocket.github.io/susabiyu/）のアクセス推移です。<br>※「予約成立」は外部(Google/Resty)側のため取得できません。ここは<b>予約ボタンのクリック率＝予約意図(CV近似)</b>です。";
    wrap.appendChild(hint);
    var pr=document.createElement("div"); pr.style.cssText="display:flex;gap:8px;margin:8px 2px 12px";
    [[7,"週間"],[14,"14日間"],[30,"月間"]].forEach(function(p){
      var b=document.createElement("button"); b.textContent=p[1]; var on=(lpDays===p[0]);
      b.style.cssText="flex:1;padding:9px;border-radius:10px;border:1px solid "+(on?"#2f5a8f":"#262c36")+";background:"+(on?"#12263a":"#141922")+";color:"+(on?"#cfe4ff":"#9aa3b2")+";font-weight:800;font-size:13px";
      b.onclick=function(){ lpDays=p[0]; renderLP(); };
      pr.appendChild(b);
    });
    wrap.appendChild(pr);
    var lab=document.createElement("div"); lab.className="seclabel"; lab.innerHTML='\u{1F4C8} LPレポート <span class="cnt">読み込み中…</span>'; wrap.appendChild(lab);
    gJsonp({api:"lpreport", store:"susabiyu", days:lpDays}).then(function(r){
      r=r||{}; var cur=r.cur||{}, prev=r.prev||{}, ser=r.series||[];
      lab.innerHTML='\u{1F4C8} LPレポート <span class="cnt">直近'+(r.days||lpDays)+'日（前期比つき）</span>';
      function delta(a,b,suf){ a=+a||0; b=+b||0; suf=suf||""; if(!b) return a?('<span style="color:#7fd0a0">＋'+a+suf+'（前期0）</span>'):'<span style="color:#8b93a2">前期0</span>'; var d=a-b, pct=Math.round(d/b*100), col=d>=0?"#7fd0a0":"#e6a4a4"; return '<span style="color:'+col+'">'+(d>=0?"▲":"▼")+Math.abs(pct)+'%</span><span style="color:#8b93a2"> 前期'+b+suf+'</span>'; }
      function stat(t,v,cmp){ return '<div style="flex:1;min-width:140px;background:#12161d;border:1px solid #262c36;border-radius:12px;padding:12px 14px"><div style="font-size:12px;color:#9aa3b2">'+t+'</div><div style="font-size:22px;font-weight:800;color:#eaeef2;margin-top:2px">'+v+'</div><div style="font-size:11px;margin-top:3px">'+cmp+'</div></div>'; }
      var g=document.createElement("div"); g.style.cssText="display:flex;gap:10px;flex-wrap:wrap;margin:2px 2px 14px";
      g.innerHTML=
        stat("PV", cur.pv||0, delta(cur.pv,prev.pv))+
        stat("ユニーク", cur.uniq||0, delta(cur.uniq,prev.uniq))+
        stat("予約クリック", cur.resv||0, delta(cur.resv,prev.resv))+
        stat("予約クリック率(CV近似)", (cur.cvr||0)+"%", delta(cur.cvr,prev.cvr,"%"));
      wrap.appendChild(g);
      wrap.appendChild(chartBlock("PV 推移", ser, "pv", "#5aa0ff", ""));
      wrap.appendChild(chartBlock("予約クリック率(CV近似) 推移", ser, "cvr", "#e7c873", "%"));
      var dbtn=document.createElement("button"); dbtn.textContent="詳細（ボタン別クリック）▶";
      dbtn.style.cssText="width:100%;margin:4px 2px 0;padding:11px;border-radius:10px;border:1px solid #262c36;background:#141922;color:#cfe4ff;font-weight:800;font-size:13px";
      var dbox=document.createElement("div"); dbox.style.display="none"; dbox.style.margin="8px 2px 0"; var op=false;
      dbtn.onclick=function(){ op=!op; dbox.style.display=op?"block":"none"; dbtn.textContent=op?"詳細（ボタン別クリック）▼":"詳細（ボタン別クリック）▶"; if(op&&!dbox.dataset.built){ buildDetail(dbox, r.labels||{}); dbox.dataset.built="1"; } };
      wrap.appendChild(dbtn); wrap.appendChild(dbox);
    }).catch(function(){ lab.innerHTML='\u{1F4C8} LPレポート <span class="cnt">取得エラー（実データ連携時のみ）</span>'; });

    function chartBlock(title, ser, key, color, suf){
      suf=suf||""; var box=document.createElement("div"); box.style.cssText="background:#12161d;border:1px solid #262c36;border-radius:12px;padding:12px;margin:0 2px 10px";
      var max=0; ser.forEach(function(d){ var v=+d[key]||0; if(v>max)max=v; }); if(max<=0)max=1;
      var n=Math.max(ser.length,1), bw=Math.max(6,Math.min(26,Math.floor(300/n))-4), gap=4, W=n*(bw+gap), H=90;
      var bars=ser.map(function(d,i){ var v=+d[key]||0, h=Math.round(v/max*H), x=i*(bw+gap); return '<rect x="'+x+'" y="'+(H-h)+'" width="'+bw+'" height="'+Math.max(h,1)+'" rx="2" fill="'+color+'"><title>'+d.date+'：'+v+suf+'</title></rect>'; }).join("");
      var lastv=ser.length?(+ser[ser.length-1][key]||0):0;
      box.innerHTML='<div style="font-size:12.5px;color:#cfe4ff;font-weight:700;margin-bottom:8px">'+title+' <span style="color:#8b93a2;font-weight:400">（最新 '+lastv+suf+'／最大 '+max+suf+'）</span></div>'+
        '<div style="overflow-x:auto"><svg width="'+W+'" height="'+(H+16)+'" style="display:block;min-width:100%">'+bars+
        '<text x="0" y="'+(H+13)+'" fill="#8b93a2" font-size="10">'+(ser[0]?ser[0].date:"")+'</text>'+
        '<text x="'+W+'" y="'+(H+13)+'" text-anchor="end" fill="#8b93a2" font-size="10">'+(ser.length?ser[ser.length-1].date:"")+'</text>'+
        '</svg></div>';
      return box;
    }
    function buildDetail(box, labels){
      var keys=Object.keys(labels).sort(function(a,b){return labels[b]-labels[a];});
      if(!keys.length){ box.innerHTML='<div class="hint">まだクリックの記録がありません（LP公開後のアクセスから記録されます）。</div>'; return; }
      box.innerHTML=keys.map(function(k){ return '<div style="display:flex;justify-content:space-between;align-items:center;background:#12161d;border:1px solid #262c36;border-radius:10px;padding:9px 12px;margin:6px 0"><span style="color:#cfe4ff;font-weight:700">'+esc(k)+'</span><span style="color:#eaeef2;font-weight:800">'+labels[k]+'</span></div>'; }).join("");
    }
  }

  tDM.onclick=function(){ _seltab(tDM); renderDM(); };
  tLP.onclick=function(){ _seltab(tLP); renderLP(); };
  // 予約シートの閉じる（ボタン／背景タップ）
  document.getElementById("resvclose").onclick=closeResv;
  document.getElementById("resvback").onclick=closeResv;
  document.getElementById("resvmodal").addEventListener("click",function(e){ if(e.target===this) closeResv(); });
  // 画像の拡大表示（投稿画像の確認）。原寸URLを渡して大きく見せる。
  var _imgbox=document.getElementById("imgbox");
  document.getElementById("imgboxClose").onclick=function(){ _imgbox.style.display="none"; document.getElementById("imgboxImg").src=""; };
  _imgbox.addEventListener("click",function(e){ if(e.target===_imgbox||e.target.id==="imgboxImg"){ _imgbox.style.display="none"; document.getElementById("imgboxImg").src=""; } });
  window.openImg=function(url){ if(!url)return; document.getElementById("imgboxImg").src=url; _imgbox.style.display="flex"; };

  // seedから決まる順列（日替わり・当日内は安定）。おすすめ先頭固定、それ以外は日ごとにシャッフル。
  function seededOrder(n, seed){ var a=[],i,s=(seed>>>0)||1; for(i=0;i<n;i++)a.push(i);
    for(i=n-1;i>0;i--){ s=(s*1664525+1013904223)>>>0; var j=s%(i+1),t=a[i];a[i]=a[j];a[j]=t; } return a; }
  function shuffleFeed(items){ var day=Math.floor(Date.now()/864e5);
    var reco=items.filter(function(x){return x.reco;}), rest=items.filter(function(x){return !x.reco;});
    var out=reco.slice(); seededOrder(rest.length, day+1).forEach(function(j){ out.push(rest[j]); }); return out; }

  GSEL = loadGsel() || defaultSel();
  loadRegional();
  FEED = shuffleFeed(FEED);
  render("feed");   // 内部で loadSched() が走り、予約データも起動時に温まる。
  loadFeedJson();   // 全商品（加工済みフィード画像）を読み込む＝「全商品から選ぶ」に約30品並ぶ
  loadCands();      // リール候補を共有ストアから読み込む（接続時）
})();
</script>

    var fu=document.getElementById("forceupd");
    if(fu) fu.onclick=function(){
      fu.textContent="更新中…";
      var done=function(){ location.reload(true); };
      var jobs=[];
      if(window.caches&&caches.keys) jobs.push(caches.keys().then(function(ks){ return Promise.all(ks.map(function(k){return caches.delete(k);})); }));
      if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations) jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){ return Promise.all(rs.map(function(r){return r.unregister();})); }));
      Promise.all(jobs).then(done).catch(done);
      setTimeout(done, 2500);
    };
  })();
</script>
</body>
</html>
