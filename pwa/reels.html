<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>投稿の確認（フィード / リール）</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  :root{--bg:#0f1115;--card:#181c23;--line:#262c36;--fg:#eaeef2;--sub:#9aa3b2;
        --ok:#1f9d55;--rd:#3b6fd6;--ng:#3a414d;--accent:#7fd1a0;--gold:#e0b56e;--reel:#7a4fd6}
  html,body{background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif}
  button{touch-action:manipulation;font-family:inherit}
  .topbar{position:sticky;top:0;z-index:20;background:rgba(15,17,21,.92);
    backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line)}
  .bar{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 12px) 16px 10px}
  .bar .back{border:1px solid var(--line);background:#181c23;color:var(--fg);font-size:13px;font-weight:800;padding:7px 13px;border-radius:999px}
  .bar h1{font-size:16px;font-weight:800;flex:1}
  .tabs{display:flex;gap:8px;padding:0 14px 12px}
  .tab{flex:1;text-align:center;padding:11px;border-radius:12px;border:1px solid var(--line);background:#141922;color:var(--sub);font-weight:800;font-size:14px}
  .tab.on{background:#12263a;border-color:#2f5a8f;color:#cfe4ff}
  .tab.on.reel{background:#241a33;border-color:#5a3fa0;color:#e2d3ff}
  #wrap{padding:14px 14px 60px;max-width:520px;margin:0 auto}
  .hint{color:var(--sub);font-size:12.5px;line-height:1.7;text-align:center;margin:2px 2px 16px}
  .seclabel{font-size:13px;font-weight:800;color:var(--fg);margin:8px 2px 10px;display:flex;align-items:center;gap:8px}
  .seclabel .cnt{color:var(--accent);font-size:12px;font-weight:800}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:16px;position:relative}
  .card.reco{border-color:var(--gold);box-shadow:0 0 0 1px rgba(224,181,110,.35)}
  .reco-badge{position:absolute;top:-11px;left:14px;background:linear-gradient(90deg,#e0b56e,#caa14e);color:#241c08;font-size:11.5px;font-weight:900;padding:4px 11px;border-radius:999px}
  .chead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .kind{font-size:12px;font-weight:800;color:#fff;background:var(--rd);padding:3px 10px;border-radius:999px}
  .kind.reel{background:var(--reel)}
  .cno{font-size:12.5px;color:var(--sub);font-weight:800}
  .mediaWrap{position:relative;border-radius:13px;overflow:hidden;background:#000;width:100%}
  .mediaWrap.feed{aspect-ratio:4/5}
  .mediaWrap.reel{aspect-ratio:9/16}
  .mediaWrap img,.mediaWrap video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
  .mediaWrap.feed img{object-fit:contain}   /* デザイン済みポスターは全体を必ず表示（切り取らない） */
  .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    background:linear-gradient(160deg,#2a2016,#241a33);color:#cbd3e0;font-weight:800;font-size:15px;text-align:center;padding:16px}
  .ph small{color:#9aa3b2;font-weight:700;font-size:12px}
  /* トリミング */
  .trim{margin:10px 2px 2px}
  .trimhd{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);font-weight:800;margin-bottom:6px}
  .trimhd b{color:#e2d3ff}
  .rangewrap{position:relative;height:34px}
  .rangewrap input[type=range]{position:absolute;left:0;top:0;width:100%;margin:0;-webkit-appearance:none;background:transparent;pointer-events:none}
  .rangewrap input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:20px;height:20px;border-radius:50%;background:var(--reel);border:2px solid #fff;margin-top:-8px}
  .rangewrap .track{position:absolute;left:0;right:0;top:15px;height:5px;border-radius:3px;background:#2a3140}
  .rangewrap .sel{position:absolute;top:15px;height:5px;border-radius:3px;background:var(--reel)}
  .cap{font-size:13.5px;line-height:1.6;margin:11px 2px 4px;white-space:pre-wrap;color:#dfe5ee}
  .more{color:#7fb0ff;font-weight:800;font-size:13px;cursor:pointer;margin:2px 2px 6px;display:inline-block}
  .seclabel.tag{margin-top:12px}
  .rankrow{margin:0 0 8px}
  .rankttl{font-size:11.5px;color:var(--sub);font-weight:800;margin:0 2px 6px;display:flex;align-items:center;gap:6px}
  .stars{color:var(--gold);letter-spacing:1px}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{border:1px solid var(--line);background:#12161d;color:#8ea0b6;font-size:12.5px;font-weight:700;padding:7px 11px;border-radius:999px;display:flex;align-items:center;gap:6px;transition:.12s}
  .chip .s{font-size:10px;color:var(--gold);letter-spacing:1px}
  .chip.on{background:#12263a;border-color:#2f5a8f;color:#bcd6ff}
  .chip.inb{border-style:dashed}
  .chip.on.inb{background:#241a33;border-color:#5a3fa0;color:#e2d3ff}
  .chip:active{transform:scale(.95)}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .btn{padding:12px;border-radius:12px;border:0;font-weight:800;font-size:14px;color:#fff}
  .btn.post{background:var(--ok)}.btn.resv{background:var(--rd)}
  .btn.redo{background:#2a3140;color:#cdd5e1}.btn.no{background:transparent;color:#7c8698;border:1px solid var(--line)}
  .resvbox{margin-top:8px;background:#10161f;border:1px solid var(--line);border-radius:12px;padding:11px;display:none;gap:8px;align-items:center;flex-wrap:wrap}
  .resvbox.open{display:flex}
  .resvbox label{font-size:12.5px;color:var(--sub);font-weight:800}
  .resvbox input{background:#0c1017;border:1px solid var(--line);color:var(--fg);border-radius:9px;padding:9px;font-size:13px}
  .resvbox .go{background:var(--rd);color:#fff;border:0;font-weight:800;padding:10px 14px;border-radius:10px;font-size:13px}
  /* 予約済み */
  .srow{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px}
  .sthumb{width:52px;height:65px;border-radius:8px;object-fit:cover;background:#000;flex:none;display:flex;align-items:center;justify-content:center;font-size:18px}
  .sthumb.reel{background:linear-gradient(160deg,#1a2233,#241a33)}
  .smeta{flex:1;min-width:0}
  .sk{font-size:11px;font-weight:800;color:#fff;padding:2px 8px;border-radius:999px;background:var(--rd)}
  .sk.reel{background:var(--reel)}
  .sdate{font-size:13.5px;font-weight:800;color:#cfe4ff;margin:3px 0 2px}
  .stxt{font-size:12px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .scancel{border:1px solid var(--line);background:#181c23;color:#9aa3b2;font-size:12px;font-weight:800;padding:7px 11px;border-radius:999px;flex:none}
  .empty{color:var(--sub);font-size:12.5px;text-align:center;padding:18px;border:1px dashed var(--line);border-radius:14px}
  /* 詳細モーダル */
  .tagsel{display:flex;flex-wrap:wrap;gap:6px;margin:2px 2px 10px}
  .tagsel .t{font-size:12.5px;font-weight:700;color:#bcd6ff;background:#12263a;border:1px solid #2f5a8f;border-radius:999px;padding:5px 10px}
  .tagsel .t.inb{color:#e2d3ff;background:#241a33;border-color:#5a3fa0}
  .btn.tagedit{width:100%;background:#232a37;color:#cdd5e1;margin-bottom:2px}
  .tebar{font-size:12.5px;color:var(--sub);font-weight:800;margin:2px 2px 12px}
  .tebar b{color:var(--accent)}
  .fetchbtn{width:100%;background:#245038;color:#dfeee5;border:0;border-radius:12px;padding:13px;font-weight:800;font-size:14px;margin:0 0 6px}
  .fetchbtn:disabled{opacity:.65}
  .fetchbtn.cd{background:#2a3140;color:#aeb8c6}
  .fetchnote{font-size:11px;color:#7c8698;line-height:1.5;margin:0 2px 16px}
  .reglabel{font-size:12px;color:#7fd1a0;font-weight:800;margin:2px 2px 8px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px}
  .regmeta{font-weight:600;color:#8b95a5;font-size:11px}
  #modal,#tagmodal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.72);display:none;align-items:flex-end}
  #modal.open,#tagmodal.open{display:flex}
  .sheet{background:var(--bg);width:100%;max-height:92vh;border-radius:20px 20px 0 0;border-top:1px solid var(--line);overflow:auto;padding:0 0 40px}
  .shhd{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .shhd h3{font-size:15px;font-weight:800;flex:1}
  .shhd .x{border:1px solid var(--line);background:#181c23;color:var(--fg);font-weight:800;border-radius:999px;padding:6px 12px;font-size:13px}
  .shbody{padding:14px 16px}
  .fs-video{position:relative;width:100%;aspect-ratio:9/16;background:#000;border-radius:14px;overflow:hidden}
  .fs-video video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
  .fs-img{width:100%;aspect-ratio:4/5;object-fit:contain;border-radius:14px;background:#000}
  .dmeta{font-size:13px;color:var(--sub);margin:12px 2px 4px;font-weight:800}
  .dcap{font-size:14px;line-height:1.65;white-space:pre-wrap;margin:6px 2px 12px}
  .dtags{font-size:13px;color:#8ea0ff;line-height:1.7;word-break:break-all;margin-bottom:14px}
  .dact{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  #toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translateX(-50%);background:#000;color:#fff;padding:11px 18px;border-radius:24px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:60;max-width:90%;text-align:center}
  #toast.show{opacity:.96}
  .devnote{margin:2px 2px 16px;font-size:11.5px;color:#c79a3a;background:#241d10;border:1px solid #4a3c17;border-radius:12px;padding:10px 12px;line-height:1.6}
  /* 入場コード（関係者専用ゲート） */
  .gate{position:fixed;inset:0;background:#0f1115;display:flex;flex-direction:column;justify-content:center;
    align-items:center;gap:18px;padding:30px;z-index:200}
  .gate h1{font-size:20px;letter-spacing:2px}
  .gate p{color:#9aa3b2;font-size:13px;text-align:center;line-height:1.7}
  .gate input{width:min(320px,80vw);padding:14px 16px;font-size:20px;text-align:center;letter-spacing:6px;
    border-radius:12px;border:1px solid #2a3542;background:#141b23;color:#fff;outline:none}
  .gate button{width:min(320px,80vw);padding:14px;font-size:16px;font-weight:700;border:0;border-radius:12px;
    background:#c8a24a;color:#1a1206}
  .gate .err{color:#ff8080;font-size:13px;min-height:18px}
  .gate a{color:#9aa3b2;font-size:13px;text-decoration:none;cursor:pointer}
  .gate p small{color:#7c8698;font-size:11.5px}
</style>
</head>
<body>
  <div class="gate" id="pcgate" style="display:none">
    <h1>🔑 最新タグの取得</h1>
    <p>地域の最新ハッシュタグを取得します。<br>取得コードを入力してください。<br><small>※取得すると全員に共有され、7日間は再取得できません。</small></p>
    <input id="pcpass" type="password" inputmode="numeric" autocomplete="off" placeholder="●●●●">
    <button id="pcgo">取得する</button>
    <div class="err" id="pcerr"></div>
    <a id="pccancel">キャンセル</a>
  </div>
  <header class="topbar">
    <div class="bar">
      <button class="back" onclick="location.href='./index.html'">← 戻る</button>
      <h1>投稿の確認</h1>
    </div>
    <div class="tabs">
      <div class="tab on" id="tabFeed" onclick="switchTab('feed')">📸 フィード投稿</div>
      <div class="tab reel" id="tabReel" onclick="switchTab('reel')">🎬 リール投稿</div>
    </div>
  </header>
  <div id="wrap">
    <div class="devnote">📡 予約はバックエンドに接続済み（接続後は予約時刻に自動投稿）。候補は接続時にシートから読み込み、未接続の間は組み込みの三条ポスターを表示します。</div>
    <div class="hint">各3案から選んで「今すぐ投稿」または「日時を決めて予約」。直したい時は「作り直す」で指示できます。</div>
    <div class="seclabel"><span id="secttl">📸 フィード投稿の候補</span> <span class="cnt">3案</span></div>
    <div id="cards"></div>
    <div class="seclabel" style="margin-top:22px">📅 予約済み <span class="cnt">フィード・リール共通</span></div>
    <div id="sched"></div>
  </div>
  <div id="modal"><div class="sheet"><div class="shhd"><h3 id="mtitle">投稿の詳細</h3><button class="x" onclick="closeModal()">閉じる</button></div><div class="shbody" id="mbody"></div></div></div>
  <div id="tagmodal"><div class="sheet"><div class="shhd"><h3>ハッシュタグを選択</h3><button class="x" onclick="closeTagEditor()">完了</button></div><div class="shbody" id="tagbody"></div></div></div>
  <div id="toast"></div>
<script src="./config.js"></script>
<script>
  var toastEl=document.getElementById("toast");
  function toast(t){toastEl.textContent=t;toastEl.classList.add("show");clearTimeout(window._tt);window._tt=setTimeout(function(){toastEl.classList.remove("show");},1800);}

  /* 最新タグ取得のパスコード（8888）。確認画面自体はコード不要・取得の時だけ確認する。 */
  var PC_HASH="2926a2731f4b312c08982cacf8061eb14bf65c1a87cc5d70e864e079c6220731"; // sha256("8888")
  function sha256(str){return crypto.subtle.digest("SHA-256",new TextEncoder().encode(str)).then(function(h){var a=new Uint8Array(h),s="";for(var i=0;i<a.length;i++)s+=("0"+a[i].toString(16)).slice(-2);return s;});}
  function requireFetchPass(cb){
    var g=document.getElementById("pcgate"), inp=document.getElementById("pcpass"), err=document.getElementById("pcerr");
    inp.value=""; err.textContent=""; g.style.display="flex"; setTimeout(function(){try{inp.focus();}catch(e){}},60);
    function close(){ g.style.display="none"; }
    function submit(){ var v=(inp.value||"").trim(); if(!v) return;
      sha256(v).then(function(h){ if(h===PC_HASH){ close(); cb(); } else { err.textContent="コードが違います"; inp.value=""; } }); }
    document.getElementById("pcgo").onclick=submit;
    document.getElementById("pccancel").onclick=close;
    inp.onkeydown=function(e){ if(e.key==="Enter") submit(); };
  }
  function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}
  function fmt(t){t=Math.max(0,Math.round(t));var m=Math.floor(t/60),s=t%60;return m+":"+(s<10?"0":"")+s;}

  /* ハッシュタグ辞書（★=人気の目安）＋インバウンド */
  var HTAGS=[
    {t:"京都グルメ",r:3},{t:"飯テロ",r:3},{t:"寿司",r:3},
    {t:"京都居酒屋",r:2},{t:"すし酒場",r:2},{t:"大衆酒場",r:2},{t:"海鮮",r:2},{t:"日本酒",r:2},
    {t:"河原町三条",r:1},{t:"三条グルメ",r:1},{t:"京都寿司",r:1},{t:"生ビール",r:1},{t:"すさび湯三条",r:1},
    {t:"sushi",r:3,inb:1},{t:"kyoto",r:3,inb:1},{t:"japanfood",r:2,inb:1},{t:"kyotofood",r:2,inb:1},{t:"visitkyoto",r:1,inb:1},{t:"japantrip",r:1,inb:1}
  ];
  var DEFAULT=["京都グルメ","河原町三条","京都居酒屋","すし酒場","三条グルメ","sushi","kyoto"]; // 国内5＋インバウンド2＝7
  var STAR={3:"★★★",2:"★★",1:"★"}, RANKTTL={3:"人気 大",2:"人気 中",1:"人気 小（上位ねらい）"};

  var FEEDCAP="こんにちは\n河原町三条店の【大衆寿司酒場すさび湯】です🍻\n\n本日のおすすめは、{NAME}です！\n新鮮なネタのお寿司も、豊富な一品料理も、うれしい価格でご用意しています。\nドリンク全品170円で、気兼ねなく乾杯を。\n\n♨️\"すさび湯\"とは\n『遊びに来る感覚で楽しんでほしい』という想いから、“遊ぶ”の語源である“すさぶ”と、日常に溶け込んだ“銭湯”を掛け合わせて“すさび湯”と名付けました。\n価格はカジュアルに、お寿司は本格的に。\n\n▪️▪️▪️▪️▪️▪️▪️▪️▪️▪️\n#すさび湯\n・営業時間\n月〜金 16:00〜23:00\n土日祝 11:00〜23:00\n・住所\n京都市中京区河原町通三条上る恵比寿町534-16\n京阪本線 三条駅から徒歩約4分\n▪️▪️▪️▪️▪️▪️▪️▪️▪️▪️\n\n新メニューやお得な情報も投稿していきます。\nぜひフォローお願いします！";
  var REELCAP="本日のおすすめは、{NAME}です！🍣\n河原町三条／すさび湯 三条";
  function cleanName(n){ return (n||"").replace(/\s*\d+$/,"").trim(); }        // 商品名末尾の数字を除去（例：サーモン三昧2→サーモン三昧）
  function capFor(tmpl,name){ return tmpl.replace(/\{NAME\}/g, cleanName(name)); }
  var SAMPLEVID="https://cdn.jsdelivr.net/gh/amami-cell/susabiyu-media@594980686729a6ec0fc2c41873615443d42fa9a4/preview/20260720125216_0788.mp4";

  /* サンプル候補（実データは後でバックエンドから差し込む） */
  var DATA={
    feed:[
      {name:"まぐろ三昧", copy:"旨い、安い、賑やかに。", img:"./sample/feed1.jpg", reco:true},
      {name:"サーモン三昧", copy:"この安さは、ちょっと反則。", img:"./sample/feed2.jpg", reco:false},
      {name:"トロ三昧", copy:"仕事帰りに、フラッと一杯。", img:"./sample/feed3.jpg", reco:false}
    ],
    reel:[
      {name:"本日のにぎり", copy:"できたてを、その場で。", video:SAMPLEVID, dur:48, reco:true},
      {name:"乾杯シーン", copy:"まずは一杯、いかがですか。", video:SAMPLEVID, dur:48, reco:false},
      {name:"揚げたて天ぷら", copy:"サクッと、揚げたて。", video:SAMPLEVID, dur:48, reco:false}
    ]
  };
  var SCHED=[
    {kind:"feed", name:"サーモン三昧", copy:"この安さは、ちょっと反則。", img:"./sample/feed2.jpg", when:"5/12(月) 18:00"},
    {kind:"reel", name:"本日のにぎり", copy:"できたてを、その場で。", video:SAMPLEVID, when:"5/14(水) 20:00"}
  ];

  var TAB="feed";
  function switchTab(k){
    TAB=k;
    document.getElementById("tabFeed").classList.toggle("on",k==="feed");
    document.getElementById("tabReel").classList.toggle("on",k==="reel");
    document.getElementById("secttl").textContent=(k==="feed"?"📸 フィード投稿の候補":"🎬 リール投稿の候補");
    render();
  }

  /* ===== ハッシュタグ編集（別画面） ===== */
  var REGIONAL=[];      // 「最新取得」で取得・共有されたタグ（保持される）
  var REG_LIVE=false;   // true=Instagramの今の活発さを反映 / false=調査済みの地域おすすめ
  var REG_UPDATED=0;    // 最新取得の更新日時(ms)
  var REG_NEXT=0;       // 次に再取得できる日時(ms)＝クールダウン明け
  var REG_COOLDOWN_DAYS=7;                         // IGのタグ検索は7日枠。1回取ったら7日は共有分を使う
  var REG_LS={t:"sb_reg_tags",u:"sb_reg_up",n:"sb_reg_nx",l:"sb_reg_live"};
  var REGION_NAME="河原町三条（京都）";
  // 実際に河原町三条・京都エリアで使われている飲食タグを調査して人気度で3段に整理（国内＋インバウンド）。
  // バックエンド未接続でも即使える“地域おすすめ”。接続時はこの並びをIGの活発さで上書き。
  var REGION_POOL=[
    {t:"京都ディナー",r:3},{t:"河原町グルメ",r:3},{t:"京都飲み",r:2},{t:"京都食べ歩き",r:2},
    {t:"河原町ディナー",r:2},{t:"京都寿司",r:2},{t:"京都ランチ",r:2},{t:"三条河原町",r:1},
    {t:"先斗町",r:1},{t:"木屋町グルメ",r:1},{t:"河原町居酒屋",r:1},{t:"京都晩ごはん",r:1},
    {t:"kyotojapan",r:3,inb:1},{t:"kyotofood",r:3,inb:1},{t:"kyotogourmet",r:2,inb:1},
    {t:"japanesefood",r:2,inb:1},{t:"izakaya",r:2,inb:1},{t:"kyotorestaurant",r:1,inb:1},
    {t:"kyotonight",r:1,inb:1},{t:"visitkyoto",r:1,inb:1},{t:"kawaramachi",r:1,inb:1}
  ];
  /* GAS(JSONP)で今の地域タグを取りに行く。config.jsのGAS_URL未設定なら reject（→調査済みプールにフォールバック） */
  function regJsonp(params){
    return new Promise(function(resolve,reject){
      var CFG=window.SUSABIYU||{}, GAS=(CFG.GAS_URL||"").trim();
      if(!GAS||GAS.indexOf("PASTE_")===0){ reject(new Error("no-backend")); return; }
      var cb="__rg"+Date.now(), s=document.createElement("script");
      var to=setTimeout(function(){cleanup();reject(new Error("timeout"));},12000);
      function cleanup(){clearTimeout(to);delete window[cb];if(s.parentNode)s.parentNode.removeChild(s);}
      window[cb]=function(d){cleanup();resolve(d);};
      // GAS側はAPP_KEY(=8888)を要求。確認画面もキーを送る（本アプリと同じsb_key、無ければ既定8888）。
      if(!params.key){ try{ params.key=localStorage.getItem("sb_key")||"8888"; }catch(e){ params.key="8888"; } }
      var q=Object.keys(params).map(function(k){return k+"="+encodeURIComponent(params[k]);}).join("&");
      s.src=GAS+(GAS.indexOf("?")>=0?"&":"?")+q+"&cb="+cb;
      s.onerror=function(){cleanup();reject(new Error("network"));};
      document.head.appendChild(s);
    });
  }
  function fmtDT(ms){ if(!ms) return "—"; var d=new Date(ms); return (d.getMonth()+1)+"/"+d.getDate()+" "+d.getHours()+":"+("0"+d.getMinutes()).slice(-2); }
  function fmtDate(ms){ if(!ms) return "—"; var d=new Date(ms); return (d.getMonth()+1)+"/"+d.getDate(); }
  function regApply(res,now){  // GAS応答→状態へ反映（共有ストアの内容）
    if(res&&res.ok&&res.tags&&res.tags.length){
      REGIONAL=res.tags; REG_LIVE=!!res.live;
      REG_UPDATED=res.updatedAt||now||0; REG_NEXT=res.nextAt||0; return true;
    }
    return false;
  }
  function regSaveLocal(){ try{ localStorage.setItem(REG_LS.t,JSON.stringify(REGIONAL)); localStorage.setItem(REG_LS.u,String(REG_UPDATED)); localStorage.setItem(REG_LS.n,String(REG_NEXT)); localStorage.setItem(REG_LS.l,REG_LIVE?"1":"0"); }catch(e){} }
  function regLoadLocal(){ try{ var t=JSON.parse(localStorage.getItem(REG_LS.t)||"null"); if(t&&t.length){ REGIONAL=t; REG_UPDATED=+localStorage.getItem(REG_LS.u)||0; REG_NEXT=+localStorage.getItem(REG_LS.n)||0; REG_LIVE=localStorage.getItem(REG_LS.l)==="1"; } }catch(e){} }
  /* 起動時：共有ストア(GAS)から最新取得を読む→無ければ端末保存を使う。誰かが取得済みなら全員に反映される。 */
  function loadRegional(){
    regLoadLocal();
    regJsonp({api:"regionaltags", region:REGION_NAME, peek:1}).then(function(res){
      if(regApply(res,Date.now())) regSaveLocal();
    }).catch(function(){});
  }
  var activeCard=null;
  function chip(h,sel){ return '<button class="chip'+(sel[h.t]?" on":"")+(h.inb?" inb":"")+'" data-t="'+esc(h.t)+'"><span>#'+esc(h.t)+'</span>'+(h.r?'<span class="s">'+STAR[h.r]+'</span>':"")+'</button>'; }
  function renderTagEditor(){
    var sel=activeCard._sel, body=document.getElementById("tagbody");
    var now=Date.now(), cd=(REG_NEXT&&now<REG_NEXT);   // クールダウン中＝先に誰かが取得済み
    var btnTxt=cd?("🔒 取得済み（次回取得可能 "+fmtDate(REG_NEXT)+"）"):"🔄 今の地域のおすすめを取得";
    var html='<div class="tebar">選択中 <b class="tesel">'+Object.keys(sel).length+'</b> 個 ／ 点線＝インバウンド</div>'+
      '<button class="fetchbtn'+(cd?" cd":"")+'" id="fetchreg">'+btnTxt+'</button>'+
      '<div class="fetchnote">※「今の人気（Instagram調べ）」はInstagram Graph APIの制限で、ハッシュタグ検索が7日間で30個まで（投稿処理と共有の枠）。1人が取得すると全員に共有され、次回取得までの日付が出ます。</div>';
    if(REGIONAL.length){
      var rlab=REG_LIVE?"🔥 最新取得（Instagram調べ）":"🕘 最新取得（地域おすすめ）";
      var nextTxt=cd?('次回取得可能 '+fmtDate(REG_NEXT)):'🔄 今すぐ再取得できます';
      var meta='<span class="regmeta">更新 '+fmtDT(REG_UPDATED)+' ・ '+nextTxt+'</span>';
      html+='<div class="reglabel">'+rlab+meta+'</div><div class="chips" id="regchips">';
      REGIONAL.forEach(function(h){ html+=chip(h,sel); }); html+='</div>';
    }
    [3,2,1].forEach(function(r){
      var items=HTAGS.filter(function(h){return h.r===r;});
      html+='<div class="rankrow"><div class="rankttl"><span class="stars">'+STAR[r]+'</span>'+RANKTTL[r]+'</div><div class="chips">';
      items.forEach(function(h){ html+=chip(h,sel); });
      html+='</div></div>';
    });
    body.innerHTML=html;
    body.querySelectorAll(".chip").forEach(function(ch){ ch.onclick=function(){ var t=ch.getAttribute("data-t"); if(sel[t]){delete sel[t];ch.classList.remove("on");}else{sel[t]=1;ch.classList.add("on");} body.querySelector(".tesel").textContent=Object.keys(sel).length; }; });
    document.getElementById("fetchreg").onclick=fetchRegional;
  }
  function fetchRegional(){
    var now=Date.now();
    if(REG_NEXT&&now<REG_NEXT){   // 先に誰かが取得済み→再取得はクールダウン明けまで。保存済み（共有分）を見せる。
      toast("すでに取得済みです（次回取得可能 "+fmtDate(REG_NEXT)+"）");
      renderTagEditor(); return;
    }
    requireFetchPass(function(){ doFetchRegional(Date.now()); });   // 取得の時だけコード確認（8888）
  }
  function doFetchRegional(now){
    var btn=document.getElementById("fetchreg"); if(btn){ btn.disabled=true; btn.textContent="🔎 "+REGION_NAME+"の人気タグを調べています…"; }
    // バックエンド接続時：GASがIGで調べて共有ストアに保存＋更新日時/次回日時を返す。未接続時：端末に疑似保存。
    regJsonp({api:"regionaltags", region:REGION_NAME}).then(function(res){
      var ok=regApply(res,now);
      if(!ok){ REGIONAL=REGION_POOL; REG_LIVE=false; REG_UPDATED=now; REG_NEXT=now+REG_COOLDOWN_DAYS*864e5; }
      regSaveLocal(); renderTagEditor();
      toast(REG_LIVE?"最新のおすすめタグを取得・共有しました":"地域のおすすめタグを更新しました");
    }).catch(function(){
      REGIONAL=REGION_POOL; REG_LIVE=false; REG_UPDATED=now; REG_NEXT=now+REG_COOLDOWN_DAYS*864e5;
      regSaveLocal(); renderTagEditor();
      toast("地域のおすすめタグを更新しました（この端末に保存）");
    });
  }
  function openTagEditor(card){ activeCard=card; renderTagEditor(); document.getElementById("tagmodal").classList.add("open"); }
  function closeTagEditor(){ document.getElementById("tagmodal").classList.remove("open"); if(activeCard&&activeCard._refresh) activeCard._refresh(); }

  function buildCard(it,i){
    var sel={}; DEFAULT.forEach(function(t){sel[t]=1;});
    var card=document.createElement("div"); card.className="card"+(it.reco?" reco":"");
    var head=(it.reco?'<div class="reco-badge">★ '+(TAB==="feed"?"フィード向きオススメ":"リール向きオススメ")+'</div>':"")+
      '<div class="chead"><span class="kind '+(TAB==="reel"?"reel":"")+'">'+(TAB==="feed"?"フィード":"リール")+'</span><span class="cno">候補 '+(i+1)+' / 3</span></div>';
    var media, trim="";
    if(TAB==="feed"){
      media='<div class="mediaWrap feed">'+(it.img?'<img src="'+it.img+'" alt="'+esc(it.name)+'">':'<div class="ph">'+esc(it.name)+'<small>📸 フィード画像 4:5</small></div>')+'</div>';
    } else {
      media='<div class="mediaWrap reel"><video src="'+it.video+'" playsinline preload="metadata" muted controls></video></div>';
      trim='<div class="trim"><div class="trimhd"><span>切り取り（リール用）</span><span><b class="tlen">--</b> / 元<span class="tall">--</span></span></div>'+
           '<div class="rangewrap"><div class="track"></div><div class="sel"></div>'+
           '<input type="range" class="ts" min="0" max="100" value="0"><input type="range" class="te" min="0" max="100" value="60"></div>'+
           '<div class="trimhd" style="margin-top:4px"><span class="tstart">開始 0:00</span><span class="tend">終了 0:30</span></div></div>';
    }
    var full=capFor(TAB==="feed"?FEEDCAP:REELCAP, it.name), short=full.length>70?full.slice(0,70)+"…":full;
    var cap='<div class="cap" data-full="'+esc(full)+'" data-short="'+esc(short)+'">'+esc(short)+'</div>'+
            (full.length>70?'<span class="more">…続きを読む</span>':"");
    var actions='<div class="actions"><button class="btn post">今すぐ投稿</button><button class="btn resv">日時を決めて予約</button>'+
      '<button class="btn redo">作り直す</button><button class="btn no">やめる</button></div>'+
      '<div class="resvbox"><label>予約日時</label><input type="date" class="rdate"><input type="time" class="rtime" value="18:00"><button class="go">この日時で予約</button></div>';
    var tagblock='<div class="seclabel tag">ハッシュタグ <span class="cnt tcnt"></span></div>'+
      '<div class="tagsel"></div><button class="btn tagedit">✏️ ハッシュタグを編集</button>';
    card.innerHTML=head+media+trim+cap+tagblock+actions;

    // 続きを読む
    var capEl=card.querySelector(".cap"), moreEl=card.querySelector(".more"), open=false;
    if(moreEl){ moreEl.onclick=function(){ open=!open; capEl.textContent=open?capEl.getAttribute("data-full"):capEl.getAttribute("data-short"); moreEl.textContent=open?"閉じる":"…続きを読む"; }; }
    // ハッシュタグ：確認画面は選択中のみ表示。編集は別画面。
    card._sel=sel;
    function refreshSel(){
      var wrap=card.querySelector(".tagsel"); wrap.innerHTML="";
      var chosen=HTAGS.filter(function(h){return sel[h.t];});
      Object.keys(sel).forEach(function(t){ if(!HTAGS.some(function(h){return h.t===t;})) chosen.push({t:t,inb:0}); });
      if(!chosen.length){ wrap.innerHTML='<span style="color:#7c8698;font-size:12.5px">（未選択）</span>'; }
      chosen.forEach(function(h){ var sp=document.createElement("span"); sp.className="t"+(h.inb?" inb":""); sp.textContent="#"+h.t; wrap.appendChild(sp); });
      card.querySelector(".tcnt").textContent=Object.keys(sel).length+"個";
    }
    card._refresh=refreshSel; refreshSel();
    card.querySelector(".tagedit").onclick=function(){ openTagEditor(card); };
    // 予約ピッカー開閉
    var rbox=card.querySelector(".resvbox");
    card.querySelector(".resv").onclick=function(){ rbox.classList.toggle("open"); };
    card.querySelector(".go").onclick=function(){
      var d=card.querySelector(".rdate").value, t=card.querySelector(".rtime").value||"18:00";
      if(!d){ toast("予約日を選んでください"); return; }
      var when=d+" "+t;
      var tags=Object.keys(sel).map(function(x){return "#"+x;}).join(" ");
      var raw=(TAB==="feed")?(it.img||""):(it.video||"");
      // IGサーバが取得できる絶対URLに解決（相対パスのままだと自動投稿できない）
      var media=raw?(function(){try{return new URL(raw, location.href).href;}catch(e){return raw;}})():"";
      var cap=capFor(TAB==="feed"?FEEDCAP:REELCAP, it.name);
      var go=card.querySelector(".go"); go.disabled=true;
      // バックエンド接続時：GASが予約投稿タブに書き込み→時刻になったら自動投稿。未接続時は下書き表示。
      regJsonp({api:"schedule", kind:TAB, name:it.name, when:when, media:media, caption:cap, hashtags:tags}).then(function(res){
        go.disabled=false;
        if(res&&res.ok){ toast(when+" に予約しました（自動投稿されます）"); rbox.classList.remove("open"); loadSched(); }
        else { toast("予約に失敗しました。時間をおいて再度お試しください"); }
      }).catch(function(){
        go.disabled=false; toast("（下書き）"+when+" に予約しました"); rbox.classList.remove("open");
      });
    };
    card.querySelector(".post").onclick=function(){ toast("（下書き）"+it.name+"を今すぐ投稿します・タグ"+Object.keys(sel).length+"件"); };
    card.querySelector(".redo").onclick=function(){ toast("（下書き）"+it.name+"の作り直しを依頼"); };
    card.querySelector(".no").onclick=function(){ toast("（下書き）この案をやめます"); };
    // リール：トリミング
    if(TAB==="reel"){ setupTrim(card,it); }
    return card;
  }

  function setupTrim(card,it){
    var v=card.querySelector("video"), ts=card.querySelector(".ts"), te=card.querySelector(".te"),
        sel=card.querySelector(".sel"), lenEl=card.querySelector(".tlen"), allEl=card.querySelector(".tall"),
        stEl=card.querySelector(".tstart"), enEl=card.querySelector(".tend");
    var TARGET=30, dur=it.dur||30;
    function apply(){
      var total=dur; var s=ts.value/100*total, e=te.value/100*total;
      if(e-s<3){ if(te===document.activeElement){ ts.value=Math.max(0,(e-3)/total*100);} else { te.value=Math.min(100,(s+3)/total*100);} s=ts.value/100*total; e=te.value/100*total; }
      sel.style.left=ts.value+"%"; sel.style.width=(te.value-ts.value)+"%";
      lenEl.textContent=fmt(e-s); allEl.textContent=fmt(total);
      stEl.textContent="開始 "+fmt(s); enEl.textContent="終了 "+fmt(e);
      try{ v.currentTime=s; }catch(x){}
    }
    function initRange(){
      dur=(v.duration&&isFinite(v.duration))?v.duration:dur;
      // 自動で先頭付近から30秒（頭0.5秒スキップ）を初期選択
      var start=Math.min(0.5,dur*0.02), end=Math.min(dur,start+TARGET);
      ts.value=start/dur*100; te.value=end/dur*100; apply();
    }
    ts.oninput=apply; te.oninput=apply;
    if(v.readyState>=1){ initRange(); } else { v.addEventListener("loadedmetadata",initRange); }
    apply();
  }

  function render(){
    var box=document.getElementById("cards"); box.innerHTML="";
    DATA[TAB].forEach(function(it,i){ box.appendChild(buildCard(it,i)); });
    renderSched();
  }
  /* 予約済み一覧を共有ストア(GAS)から読む。未接続なら現状のサンプルのまま。 */
  function loadSched(){
    regJsonp({api:"schedlist"}).then(function(res){
      if(res&&res.ok&&res.items){
        SCHED=res.items.map(function(it){
          var o={token:it.token, kind:(it.kind==="reel"?"reel":"feed"), name:it.name||"", copy:it.copy||"", when:it.when||""};
          if(o.kind==="reel") o.video=it.media||SAMPLEVID; else o.img=it.media||"";
          return o;
        });
        renderSched();
      }
    }).catch(function(){});
  }
  /* 投稿候補を共有ストア(GAS)から読む。未接続なら組み込みの三条ポスターのまま。 */
  function loadCands(){
    regJsonp({api:"cands"}).then(function(res){
      if(!res||!res.ok) return;
      if(res.feed&&res.feed.length){
        DATA.feed=res.feed.map(function(c){ return {name:c.name||"", copy:c.copy||"", img:c.media||"", reco:!!c.reco}; });
      }
      if(res.reel&&res.reel.length){
        DATA.reel=res.reel.map(function(c){ return {name:c.name||"", copy:c.copy||"", video:c.media||SAMPLEVID, dur:c.dur||48, reco:!!c.reco}; });
      }
      render();
    }).catch(function(){});
  }

  function renderSched(){
    var box=document.getElementById("sched"); box.innerHTML="";
    if(!SCHED.length){ box.innerHTML='<div class="empty">まだ予約はありません</div>'; return; }
    SCHED.forEach(function(s,idx){
      var row=document.createElement("div"); row.className="srow";
      var thumb=s.kind==="reel"?'<div class="sthumb reel">🎬</div>':(s.img?'<img class="sthumb" src="'+s.img+'">':'<div class="sthumb">🍣</div>');
      row.innerHTML=thumb+'<div class="smeta"><span class="sk '+(s.kind==="reel"?"reel":"")+'">'+(s.kind==="feed"?"フィード":"リール")+'</span>'+
        '<div class="sdate">'+esc(s.when)+'</div><div class="stxt">'+esc(cleanName(s.name))+'「'+esc(s.copy)+'」</div></div>'+
        '<button class="scancel">取消</button>';
      row.querySelector(".smeta").onclick=function(){ openDetail(s); };
      thumbClick(row,s);
      row.querySelector(".scancel").onclick=function(e){ e.stopPropagation(); if(!confirm("この予約を取り消しますか？")) return;
        if(s.token){ regJsonp({api:"schedcancel", token:s.token}).then(function(){ loadSched(); toast("予約を取り消しました"); }).catch(function(){ toast("取消に失敗しました"); }); }
        else { SCHED.splice(idx,1); renderSched(); toast("予約を取り消しました"); } };
      box.appendChild(row);
    });
  }
  function thumbClick(row,s){ row.querySelector(".sthumb").onclick=function(){ openDetail(s); }; }

  function openDetail(s){
    var m=document.getElementById("modal"), body=document.getElementById("mbody");
    document.getElementById("mtitle").textContent=(s.kind==="feed"?"フィード投稿の詳細":"リール投稿の詳細");
    var media = s.kind==="reel"
      ? '<div class="fs-video"><video src="'+s.video+'" playsinline autoplay muted loop controls></video></div>'
      : (s.img?'<img class="fs-img" src="'+s.img+'">':'<div class="fs-img" style="position:relative"><div class="ph">'+esc(s.name)+'<small>📸 フィード画像</small></div></div>');
    var tags=DEFAULT.map(function(t){return "#"+t;}).join(" ");
    body.innerHTML=media+
      '<div class="dmeta">予約日時</div><div class="dcap">'+esc(s.when)+'</div>'+
      '<div class="dmeta">本文</div><div class="dcap">'+esc(capFor(s.kind==="feed"?FEEDCAP:REELCAP, s.name))+'</div>'+
      '<div class="dmeta">ハッシュタグ</div><div class="dtags">'+tags+'</div>'+
      '<div class="dact"><button class="btn post" onclick="toast(\'（下書き）今すぐ投稿\')">今すぐ投稿</button>'+
      '<button class="btn resv" onclick="toast(\'（下書き）日時を変更\')">日時を変更</button></div>';
    m.classList.add("open");
  }
  function closeModal(){ var m=document.getElementById("modal"); var v=m.querySelector("video"); if(v){try{v.pause();}catch(x){}} m.classList.remove("open"); }
  document.getElementById("modal").addEventListener("click",function(e){ if(e.target===this) closeModal(); });
  document.getElementById("tagmodal").addEventListener("click",function(e){ if(e.target===this) closeTagEditor(); });

  render();
  loadCands();      // 投稿候補を共有ストアから読み込む（接続時。未接続は組み込みの三条ポスター）
  loadRegional();   // 共有ストアから「最新取得」を読み込む（他の人が取得済みならここで反映）
  loadSched();      // 予約済み一覧を共有ストアから読み込む（接続時）
</script>
</body>
</html>
