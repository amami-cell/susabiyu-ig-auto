<title>ぎふや 福岡天神 ・ 投稿確認</title>
<style>
  /* 三条アプリ(index.html)と同一の土台デザイン。ぎふや福岡天神の見本用に自己完結で実装。 */
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{--bg:#0f1115;--card:#181c23;--line:#262c36;--fg:#eaeef2;--sub:#9aa3b2;
        --ok:#1f9d55;--rd:#3b6fd6;--ng:#444b57;--accent:#7fd1a0}
  html,body{margin:0;background:var(--bg);color:var(--fg);overscroll-behavior-y:contain;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif}
  body{padding:0 0 env(safe-area-inset-bottom)}
  .topbar{position:sticky;top:0;z-index:10;background:rgba(15,17,21,.86);
    backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line)}
  .bar{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 12px) 16px 8px}
  .bar .logo{height:32px;width:auto;max-width:96px;border-radius:6px;display:block;flex:0 0 auto;object-fit:contain}
  .bar h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.2px;flex:1;
    min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .push{border:1px solid var(--line);background:#222835;color:var(--fg);
    font-size:12px;font-weight:700;padding:6px 11px;border-radius:999px}
  .bar .dot{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px;margin-left:10px}
  .bar .dot i{width:8px;height:8px;border-radius:50%;background:#c79a3a;display:inline-block}
  .tabs{display:flex;gap:6px;padding:0 16px 10px}
  button,.tab,.seg button,.gfilter button{touch-action:manipulation}
  .tab{border:1px solid var(--line);background:#181c23;color:var(--sub);font-size:13px;font-weight:800;
    padding:7px 16px;border-radius:999px;transition:.12s}
  .tab.on{background:#10301f;color:var(--accent);border-color:#1f4d33}
  .tab:active{transform:scale(.92)}
  .tabs .reeltab{margin-left:auto;border:1px solid var(--line);background:#181c23;color:var(--sub);
    font-size:12px;font-weight:800;padding:7px 13px;border-radius:999px;flex:0 0 auto;text-decoration:none;display:flex;align-items:center}
  .tabs .reeltab:active{transform:scale(.94)}
  .note{margin:14px 14px 0;padding:12px 15px;background:#15120d;border:1px solid #2a241a;border-radius:12px;color:#b3aa9b;font-size:12.5px;line-height:1.7;max-width:560px}
  @media(min-width:592px){.note{margin-left:auto;margin-right:auto}}
  /* ===== 確認（投稿カード） ===== */
  #feed{padding:14px 14px 28px;max-width:560px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:14px;
    transition:opacity .25s ease,transform .25s ease}
  .card.done{opacity:.55}
  .head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:9px}
  .time{font-size:13px;color:var(--sub)}
  .pat{font-size:14px;font-weight:700;color:#fff;background:#222835;padding:2px 9px;border-radius:999px}
  .remain{margin-left:auto;font-size:12px;font-weight:700;color:var(--accent);background:#10301f;padding:3px 9px;border-radius:999px}
  .mediaWrap{position:relative;border-radius:13px;overflow:hidden;background:#000;width:100%;aspect-ratio:4/5}
  .mediaWrap.story{aspect-ratio:9/16}
  .media{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover;background:#000}
  .cap{font-size:14px;line-height:1.55;margin:10px 2px 2px;white-space:pre-wrap}
  .tags{font-size:11.5px;color:#8f97c0;word-break:break-all;margin:6px 2px 0}
  .slot{margin-top:10px}
  .btns{display:flex;gap:8px}
  .btns button{flex:1;border:0;border-radius:13px;padding:13px 0;font-size:15px;font-weight:800;color:#fff;transition:transform .06s,opacity .15s}
  .ok{background:var(--ok)}.rd{background:var(--rd)}.ng{background:var(--ng)}
  .btns button:active{transform:scale(.96);opacity:.92}
  .copybtn{margin-top:8px;width:100%;border:1px solid var(--line);border-radius:12px;background:#12161d;color:var(--accent);font-weight:800;font-size:13.5px;padding:11px;display:flex;align-items:center;justify-content:center;gap:7px}
  .copybtn.done{background:#10301f;border-color:#1f4d33}
  .banner{text-align:center;font-size:15px;font-weight:800;padding:13px 0;border-radius:13px}
  .banner.okb{background:#10301f;color:var(--accent)}
  .banner.okb small{display:block;font-size:11px;font-weight:600;color:#6fb595;margin-top:4px}
  .banner.ngb{background:#23262d;color:#aeb6c2}
  .redoing{display:flex;align-items:center;justify-content:center;gap:10px;font-size:14px;color:#ffcf66;background:#241d10;padding:14px 0;border-radius:13px}
  .spin{width:16px;height:16px;border:3px solid #ffcf66;border-top-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  /* ===== 見本ギャラリー ===== */
  #gallery{padding:14px 14px 28px;max-width:560px;margin:0 auto}
  .gfilter{position:sticky;top:104px;z-index:9;width:max-content;margin:0 auto 14px;display:flex;gap:4px;
    background:rgba(15,17,21,.94);backdrop-filter:saturate(180%) blur(12px);
    border:1px solid var(--line);border-radius:999px;padding:5px;box-shadow:0 10px 30px rgba(0,0,0,.55)}
  .gfilter button{border:none;background:transparent;color:var(--sub);font-size:14px;font-weight:800;padding:11px 24px;border-radius:999px;transition:.12s;white-space:nowrap}
  .gfilter button.sel{background:#10301f;color:var(--accent)}
  .gsub{font-size:13px;font-weight:800;color:var(--accent);margin:6px 2px 10px;border-left:3px solid #1f4d33;padding-left:9px}
  .glist{display:flex;flex-direction:column;gap:14px;margin-bottom:8px}
  #gallery.fvid .gimg{display:none}
  #gallery.fimg .gvid{display:none}
  #gallery.fvid .gsub.imgonly,#gallery.fimg .gsub.vidonly{display:none}
  .gcard{background:#14110c;border:1px solid #241f16;border-radius:16px;overflow:hidden;padding-bottom:12px}
  .gcard .gmedia{width:100%;aspect-ratio:9/16;max-height:62vh;object-fit:cover;display:block;background:#000}
  .gcard.feed .gmedia{aspect-ratio:4/5;max-height:none}
  .gchead{display:flex;align-items:center;gap:8px;padding:10px 12px 0}
  .gcard .gt{font-size:14px;font-weight:800;color:#e8e0d0;flex:1;min-width:0}
  .gstate{font-size:12px;font-weight:800;padding:3px 11px;border-radius:999px;flex:0 0 auto}
  .gstate.on{color:var(--accent);background:#10301f}
  .gstate.off{color:#aeb6c2;background:#23262d}
  .gcard .gd{padding:2px 12px 0;font-size:12px;color:#9a917f}
  .seg{display:flex;gap:8px;margin:11px 12px 0}
  .seg button{flex:1;border:2px solid var(--line);background:transparent;color:var(--sub);border-radius:13px;padding:12px 0;font-size:14px;font-weight:800;transition:.15s}
  .seg button:active{transform:scale(.97)}
  .seg .seg-on.sel{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:0 4px 14px rgba(31,157,85,.35)}
  .seg .seg-off.sel{background:#c0473a;border-color:#c0473a;color:#fff;box-shadow:0 4px 14px rgba(192,71,58,.35)}
  /* ===== レポート ===== */
  #report{padding:14px 12px 36px;max-width:560px;margin:0 auto}
  .rephint{color:var(--sub);font-size:12px;text-align:center;margin:0 4px 14px;line-height:1.6}
  .repdoc{background:#fff;color:#1b2433;border-radius:14px;overflow:hidden}
  .rephd{background:linear-gradient(135deg,#1b2433,#2e3c52);color:#fff;padding:22px 22px}
  .rephd .t{font-size:20px;font-weight:800;letter-spacing:.5px}
  .rephd .s{font-size:13px;color:#cdd6e4;margin-top:4px}
  .rephd .p{font-size:14px;font-weight:700;margin-top:12px}
  .rephd .p small{display:block;font-size:12px;color:#aebbcf;font-weight:400;margin-top:3px}
  .repsec{padding:16px 18px 4px}
  .repsec h3{font-size:15px;font-weight:800;color:#1b2433;margin:0 0 12px;display:flex;align-items:center;gap:8px}
  .repsec h3::before{content:"";width:6px;height:18px;background:#e0a93b;border-radius:3px}
  .repkpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
  .repkpi{background:#f4f6f9;border-radius:12px;padding:14px 14px}
  .repkpi .l{font-size:12px;color:#6c7689;font-weight:700}
  .repkpi .v{font-size:26px;font-weight:800;color:#1b2433;margin-top:3px;line-height:1.1}
  .repkpi .v small{font-size:13px;color:#8a94a6;font-weight:700}
  .repkpi .d{display:inline-block;margin-top:8px;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px}
  .repkpi .prev{font-size:11px;color:#9aa3b2;margin-top:6px}
  .up{color:#127a40;background:#e3f5ea}.down{color:#b23b3b;background:#fbe7e7}.flat{color:#6c7689;background:#eceff3}
  .repbars{display:flex;align-items:flex-end;gap:3px;height:120px;background:#f4f6f9;border-radius:12px;padding:12px 12px 8px}
  .repbars i{flex:1;background:#33507f;border-radius:3px 3px 0 0;min-height:2px;opacity:.9}
  .repbars i.hot{background:#e0a93b;opacity:1}
  .repax{display:flex;justify-content:space-between;font-size:11px;color:#9aa3b2;margin:6px 4px 0}
  .repanal{display:flex;flex-direction:column;gap:10px}
  .repcard{background:#fff;border:1px solid #eef1f5;border-left:6px solid #ccc;border-radius:12px;padding:14px 16px}
  .repcard.good{border-left-color:#2bb673}.repcard.warn{border-left-color:#e0a93b}.repcard.act{border-left-color:#3b6fd6}
  .repcard h4{font-size:14px;font-weight:800;margin:0 0 8px}
  .repcard.good h4{color:#127a40}.repcard.warn h4{color:#a9781a}.repcard.act h4{color:#2a55b0}
  .repcard ul{margin:0;padding:0;list-style:none}
  .repcard li{font-size:13.5px;line-height:1.65;color:#384153;padding:5px 0 5px 16px;position:relative}
  .repcard li::before{content:"";position:absolute;left:2px;top:12px;width:7px;height:7px;border-radius:50%;background:#c4ccd8}
  .repcard.good li::before{background:#2bb673}.repcard.warn li::before{background:#e0a93b}.repcard.act li::before{background:#3b6fd6}
  .repcard li b{color:#1b2433;font-weight:800}
  .repposts{display:flex;flex-direction:column;gap:8px}
  .reppost{background:#f4f6f9;border-radius:12px;padding:9px 11px;display:flex;gap:11px;align-items:center}
  .reppost .rt{width:62px;height:62px;border-radius:10px;object-fit:cover;flex:0 0 auto;background:#e7ebf1}
  .reppost .ri{flex:1;min-width:0}
  .reppost .rl{display:flex;align-items:center;gap:8px;margin-bottom:5px}
  .reppost .rb{font-size:10.5px;font-weight:800;color:#fff;background:#8a94a6;border-radius:999px;padding:2px 9px}
  .reppost .rb.story{background:#c0567f}.reppost .rb.feed{background:#3b6fd6}.reppost .rb.reel{background:#7a4fd6}
  .reppost .rd{font-size:11.5px;color:#9aa3b2;font-weight:700}
  .reppost .rc{font-size:13px;color:#384153;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:5px}
  .reppost .rr{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .reppost .rr b{font-size:15px;color:#1b2433;font-weight:800}
  .reppost .rr small{font-size:11.5px;color:#6c7689}
  .repfoot{color:#9aa3b2;font-size:11px;text-align:center;padding:14px 16px 18px;line-height:1.6}
  #toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translateX(-50%);
    background:#000;color:#fff;padding:11px 18px;border-radius:24px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:30;max-width:90%;text-align:center}
  #toast.show{opacity:.96}
  .foot{color:#6f685d;font-size:10px;text-align:center;padding:20px 0 calc(env(safe-area-inset-bottom) + 16px)}
</style>
</head>

    {n:"15", t:"お品書き（縦）",      d:"和紙×明朝・縦書きで一覧完成"}
  ];
  var STORYVIDS = [
    {n:"01", t:"統一"},
    {n:"02", t:"巨大縦書き"},
    {n:"04", t:"にぎやか価格"},
    {n:"11", t:"雑誌風"},
    {n:"12", t:"本日のおすすめ"}
  ];
  var PATTERNS = [
    {img:"pattern_tanzaku.jpg", t:"短冊（メイン）", d:"福岡天神店の赤短冊＋見出し。安さ・名物訴求に強い。フィードの主役。"},
    {img:"pattern_bigname.jpg", t:"H 巨大縦書き", d:"料理名を大きく縦書き。名物1品押しに（元祖どてかつ・名物どて焼き）。"}
  ];

  // ===== ① 確認（三条と同じ：ストーリー中心のライブ確認） =====
  // ストーリーは毎日 11:00 / 17:00 / 20:00 に自動投稿。post_gifuya_story.py と同じローテーション式で
  // 「次に投稿される内容」を表示し、やめない限りそのまま自動投稿（三条と同じオプトアウト方式）。
  var CFG2 = window.GIFUYA || {};
  var GAS = (CFG2.GAS_URL||"").trim(), ACCT = (CFG2.ACCOUNT||"gifuyatenjin");
  var STORY_FILES = DYNVIDS.map(function(v){ return "dv_"+v.n+".mp4"; }); // 採用中10本＝ローテーション対象
  var STORY_TITLE = {}; DYNVIDS.forEach(function(v){ STORY_TITLE["dv_"+v.n+".mp4"] = v.t; });
  var SLOTS = [11,17,20], STORY_EPOCH = new Date(2026,0,1);              // 基準日は poster と一致
  var PLAN_LS = "gf_story_plan";
  function loadPlan(){ try{ return JSON.parse(localStorage.getItem(PLAN_LS)||"{}") || {}; }catch(e){ return {}; } }
  function savePlan(){ try{ localStorage.setItem(PLAN_LS, JSON.stringify(PLAN)); }catch(e){} }
  var PLAN = loadPlan();
  // 軽量JSONP：共有GASへ「やめる/差し替え/OK」を反映（自動投稿の判断に使用）。失敗しても端末表示は保持。
  var _jc=0;
  function gas(params){ if(!LIVE || !GAS || GAS.indexOf("PASTE_")===0) return;
    var cb="__gs"+(++_jc)+"_"+Date.now(), s=document.createElement("script");
    params.account=ACCT; params.cb=cb;
    window[cb]=function(){ try{ delete window[cb]; }catch(e){} if(s.parentNode) s.parentNode.removeChild(s); };
    var q=Object.keys(params).map(function(k){ return k+"="+encodeURIComponent(params[k]); }).join("&");
    s.src=GAS+(GAS.indexOf("?")>=0?"&":"?")+q; s.onerror=window[cb]; document.head.appendChild(s); }
  function pad2(n){ return ("0"+n).slice(-2); }
  function slotKey(d,h){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())+"-"+h; }
  function pickDefault(mid, si){ var days=Math.round((mid-STORY_EPOCH)/864e5);
    var idx=((days*3+si)%STORY_FILES.length + STORY_FILES.length)%STORY_FILES.length; return STORY_FILES[idx]; }
  function upcoming(n){ var out=[], now=Date.now(), day=new Date(); day.setHours(0,0,0,0);
    for(var k=0;k<14 && out.length<n;k++){ for(var i=0;i<SLOTS.length;i++){
        var t=new Date(day.getFullYear(),day.getMonth(),day.getDate(),SLOTS[i]);
        if(t.getTime()>now){ out.push({when:t, si:i, hour:SLOTS[i], mid:new Date(day.getFullYear(),day.getMonth(),day.getDate())}); if(out.length>=n) break; }
      } day.setDate(day.getDate()+1); } return out; }
  function whenLabel(t){ var now=new Date(); var d;
    if(t.toDateString()===now.toDateString()) d="本日";
    else { var tm=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1); d=(t.toDateString()===tm.toDateString())?"明日":((t.getMonth()+1)+"/"+t.getDate()); }
    return d+" "+pad2(t.getHours())+":"+pad2(t.getMinutes()); }
  function remainText(t){ var ms=t.getTime()-Date.now(); if(ms<=0) return "まもなく";
    var m=Math.floor(ms/60000), h=Math.floor(m/60), mn=m%60; return h>0?("あと"+h+"時間"+mn+"分"):("あと"+mn+"分"); }
  function effFile(key, mid, si){ var v=PLAN[key]; if(v && v!=="skip" && v!=="ok") return v; return pickDefault(mid,si); }

  var feed = document.getElementById("feed");
  var note = document.createElement("div"); note.className="note";
  note.innerHTML = "<b>投稿の確認</b>（三条と同じ確認画面）。ストーリーは毎日 <b>11:00・17:00・20:00</b> に自動投稿されます。下は<b>次に投稿される内容</b>です。<b>やめない限り、そのまま自動で投稿</b>されます。<br>各回を見て <b>投稿OK / 作り直す（別の動画へ差し替え）/ やめる（この回は投稿しない）</b>。"+(LIVE?"":"（現在は見本モードのため、操作は端末内のみ保存）");
  feed.appendChild(note);

  function seclabel2(txt){ var s=document.createElement("div"); s.textContent=txt;
    s.style.cssText="font-weight:800;margin:18px 4px 8px;color:#e7ecf3;font-size:15px"; feed.appendChild(s); }

  // --- ストーリー（自動投稿の予定・三条と同じカード） ---
  seclabel2("🎬 ストーリー（自動投稿の予定）");
  upcoming(6).forEach(function(slot){
    var key=slotKey(slot.when, slot.hour);
    var c=document.createElement("div"); c.className="card";
    function build(){
      var file=effFile(key, slot.mid, slot.si), title=STORY_TITLE[file]||file;
      c.innerHTML=
        '<div class="head"><span class="time">'+whenLabel(slot.when)+'</span><span class="pat">'+title+'</span><span class="remain">'+remainText(slot.when)+'</span></div>'+
        '<div class="mediaWrap story"><video class="media" src="gifuya/'+file+V+'" controls playsinline preload="metadata" webkit-playsinline></video></div>'+
        '<div class="slot"></div>';
      var sl=c.querySelector(".slot"), st=PLAN[key];
      c.classList.remove("done");
      if(st==="skip"){ sl.innerHTML='<div class="banner ngb">— 取りやめました（この回は投稿しません）<small>タップで戻す</small></div>'; c.classList.add("done");
        sl.querySelector(".banner").onclick=function(){ delete PLAN[key]; savePlan(); gas({api:"storyset",slot:key,action:"clear"}); build(); toast("戻しました"); }; return; }
      if(st==="ok"){ sl.innerHTML='<div class="banner okb">✓ 承認済み（'+slot.hour+':00に投稿されます）<small>タップで取り消し</small></div>';
        sl.querySelector(".banner").onclick=function(){ delete PLAN[key]; savePlan(); gas({api:"storyset",slot:key,action:"clear"}); build(); toast("取り消しました"); }; return; }
      sl.innerHTML='<div class="btns"><button class="ok">投稿OK</button><button class="rd">作り直す</button><button class="ng">やめる</button></div>';
      sl.querySelector(".ok").onclick=function(){ PLAN[key]="ok"; savePlan(); gas({api:"storyset",slot:key,action:"ok"}); build(); toast(LIVE?"承認しました":"承認しました（見本）"); };
      sl.querySelector(".rd").onclick=function(){ var cur=effFile(key,slot.mid,slot.si); var ni=(STORY_FILES.indexOf(cur)+1)%STORY_FILES.length;
        PLAN[key]=STORY_FILES[ni]; savePlan(); gas({api:"storyset",slot:key,action:"set",file:STORY_FILES[ni]}); build(); toast("別の動画に差し替えました"); };
      sl.querySelector(".ng").onclick=function(){ PLAN[key]="skip"; savePlan(); gas({api:"storyset",slot:key,action:"skip"}); build(); toast(LIVE?"この回はやめました":"やめました（見本）"); };
    }
    build();
    feed.appendChild(c);
  });

  // --- フィード投稿の候補（従来どおり・コピー/確認用の見本） ---
  seclabel2("📸 フィード投稿の候補");
  POSTS.forEach(function(p,i){
    var full = p.cap + "\n\n" + p.tags + " " + COMMON;
    var c = document.createElement("div"); c.className="card";
    c.innerHTML =
      '<div class="head"><span class="pat">'+p.pat+'</span><span class="time">'+p.when+'</span><span class="remain">フィード</span></div>'+
      '<div class="mediaWrap"><img class="media" loading="lazy" src="gifuya/'+p.img+'" alt=""></div>'+
      '<div class="cap"></div><div class="tags"></div>'+
      '<div class="slot"></div>'+
      '<button class="copybtn">📋 キャプションをコピー</button>';
    c.querySelector(".cap").textContent = p.cap;
    c.querySelector(".tags").textContent = p.tags + " " + COMMON;
    var slot = c.querySelector(".slot");
    function setButtons(){
      slot.innerHTML = '<div class="btns"><button class="ok">投稿OK</button><button class="rd">作り直す</button><button class="ng">やめる</button></div>';
      slot.querySelector(".ok").onclick = function(){ slot.innerHTML='<div class="banner okb">✓ 承認済み（予定時刻に投稿されます）<small>タップで取り消し</small></div>';
        slot.querySelector(".banner").onclick=function(){ setButtons(); }; c.classList.remove("done"); toast("承認しました（見本）"); };
      slot.querySelector(".rd").onclick = function(){ slot.innerHTML='<div class="redoing"><span class="spin"></span>作り直しています…</div>';
        setTimeout(function(){ setButtons(); toast("別案を作成しました（見本）"); }, 1500); };
      slot.querySelector(".ng").onclick = function(){ slot.innerHTML='<div class="banner ngb">— 取りやめました</div>'; c.classList.add("done"); };
    }
    setButtons();
    var cb = c.querySelector(".copybtn");
    cb.onclick = function(){ copy(full, function(){ cb.textContent="✓ コピーしました"; cb.classList.add("done"); toast("キャプションをコピーしました");
      setTimeout(function(){ cb.textContent="📋 キャプションをコピー"; cb.classList.remove("done"); },2200); }); };
    feed.appendChild(c);
  });

  // ===== ② 見本（ギャラリー・動画/画像フィルタ付き） =====
  var gal = document.getElementById("gallery");
  gal.className = "fvid";
  var filt = document.createElement("div"); filt.className="gfilter";
  filt.innerHTML = '<button data-f="fvid" class="sel">動画</button><button data-f="fimg">画像</button>';
  gal.appendChild(filt);
  filt.querySelectorAll("button").forEach(function(b){ b.onclick=function(){
    gal.className=b.dataset.f; filt.querySelectorAll("button").forEach(function(x){x.classList.remove("sel");}); b.classList.add("sel");
    window.scrollTo({top:0,behavior:"smooth"}); }; });

  var gnote = document.createElement("div"); gnote.className="note";
  gnote.innerHTML = "三条と同じ<b>見本ギャラリー</b>です。各見本を <b>採用する / 無しにする</b> で選ぶと、投稿ローテーションに入れる／外すを指定できます（見本モードのため選択状態のみ保存）。上の <b>動画／画像</b> で絞り込めます。";
  gal.appendChild(gnote);
  function sub(txt, cls){ var s=document.createElement("div"); s.className="gsub"+(cls?" "+cls:""); s.textContent=txt; gal.appendChild(s); }
  function list(){ var g=document.createElement("div"); g.className="glist"; gal.appendChild(g); return g; }
  // 1枚のカード（メディア＋採用する/無しにする）。三条の見本カードと同じ操作。
  function card(container, kind, feed, mediaHtml, title, desc, on){
    var c=document.createElement("div"); c.className="gcard "+kind+(feed?" feed":"");
    c.innerHTML =
      mediaHtml+
      '<div class="gchead"><span class="gt">'+title+'</span><span class="gstate '+(on?"on":"off")+'">'+(on?"採用中":"無し")+'</span></div>'+
      (desc?'<div class="gd">'+desc+'</div>':'')+
      '<div class="seg"><button class="seg-on'+(on?" sel":"")+'">採用する</button><button class="seg-off'+(on?"":" sel")+'">無しにする</button></div>';
    var st=c.querySelector(".gstate"), bon=c.querySelector(".seg-on"), boff=c.querySelector(".seg-off");
    function set(v){ st.className="gstate "+(v?"on":"off"); st.textContent=v?"採用中":"無し";
      bon.classList.toggle("sel",v); boff.classList.toggle("sel",!v); }
    bon.onclick=function(){ set(true); toast("採用にしました（見本）"); };
    boff.onclick=function(){ set(false); toast("無しにしました（見本）"); };
    container.appendChild(c);
  }

  // 動画：動きのあるストーリー（既定=採用中）
  sub("動きのあるストーリー（10本）★おすすめ","vidonly");
  var g1=list();
  DYNVIDS.forEach(function(v){ card(g1,"gvid",false,
    '<video class="gmedia" src="gifuya/dv_'+v.n+'.mp4'+V+'" controls playsinline preload="metadata" webkit-playsinline></video>',
    "D"+(+v.n)+" "+v.t, v.d, true); });
  // 動画：静止ベースのストーリー（既定=無し＝代替案）
  sub("ストーリー・デザインパターン（静止ベース・5本）","vidonly");
  var g2=list();
  STORYVIDS.forEach(function(v){ card(g2,"gvid",false,
    '<video class="gmedia" src="gifuya/sv_'+v.n+'.mp4'+V+'" controls playsinline preload="metadata" webkit-playsinline></video>',
    "S"+(+v.n)+" "+v.t, "", false); });
  // 動画：フェード
  sub("フェード動画（リール見本）","vidonly");
  var g3=list();
  card(g3,"gvid",false,'<video class="gmedia" src="gifuya/fade.mp4'+V+'" controls playsinline preload="metadata" webkit-playsinline></video>',"フェード見本","",true);
  // 画像：投稿（フィード）見本
  sub("投稿（フィード）見本・12本","imgonly");
  var g4=list();
  POSTS.forEach(function(p,i){ card(g4,"gimg",true,
    '<img class="gmedia" loading="lazy" src="gifuya/'+p.img+'" alt="">', (i+1)+" "+p.t, "", true); });
  // 画像：デザインの型
  sub("パターン見本・デザインの型","imgonly");
  var g5=list();
  PATTERNS.forEach(function(p){ card(g5,"gimg",true,
    '<img class="gmedia" loading="lazy" src="gifuya/'+p.img+'" alt="">', p.t, p.d, true); });

  // ===== ③ レポート（三条と同じ体裁・サンプル値） =====
  var rep = document.getElementById("report");
  function kpi(l,v,unit,dcls,dtxt,prev){
    return '<div class="repkpi"><div class="l">'+l+'</div><div class="v">'+v+(unit?' <small>'+unit+'</small>':'')+'</div>'+
      '<span class="d '+dcls+'">'+dtxt+'</span><div class="prev">'+prev+'</div></div>';
  }
  var bars=""; var vals=[42,55,48,63,70,58,66,80,74,88,95,82,90,104,98,112];
  vals.forEach(function(v,i){ bars+='<i class="'+(i>=vals.length-3?'hot':'')+'" style="height:'+v+'%"></i>'; });
  rep.innerHTML =
    '<div class="rephint">Instagram インサイト（見本のサンプル値です。実データは連携後に自動表示されます）</div>'+
    '<div class="repdoc">'+
      '<div class="rephd"><div class="t">Instagram インサイトレポート</div><div class="s">ぎふや 福岡天神店</div>'+
        '<div class="p">@gifuya_fukuokatenjin<small>集計期間：直近30日（見本）</small></div></div>'+
      '<div class="repsec"><h3>主要指標</h3><div class="repkpis">'+
        kpi("リーチ","12,480","","up","▲ 18%","前期 10,580")+
        kpi("閲覧数","31,200","","up","▲ 24%","前期 25,100")+
        kpi("プロフィール表示","1,340","","up","▲ 12%","前期 1,196")+
        kpi("フォロワー","842","","up","▲ 46","前期 796")+
      '</div></div>'+
      '<div class="repsec"><h3>リーチの推移</h3><div class="repbars">'+bars+'</div>'+
        '<div class="repax"><span>30日前</span><span>今日</span></div></div>'+
      '<div class="repsec"><h3>人気の投稿</h3><div class="repposts">'+
        '<div class="reppost"><img class="rt" src="gifuya/feed_01.jpg"><div class="ri"><div class="rl"><span class="rb feed">フィード</span><span class="rd">3日前</span></div>'+
          '<div class="rc">名物、元祖どぶ漬けどてかつ🍢</div><div class="rr"><b>2,140</b><small>リーチ</small><b>186</b><small>いいね</small></div></div></div>'+
        '<div class="reppost"><img class="rt" src="gifuya/feed_06.jpg"><div class="ri"><div class="rl"><span class="rb feed">フィード</span><span class="rd">6日前</span></div>'+
          '<div class="rc">福岡名物、炊き餃子。</div><div class="rr"><b>1,880</b><small>リーチ</small><b>152</b><small>いいね</small></div></div></div>'+
        '<div class="reppost"><img class="rt" src="gifuya/story_01.jpg"><div class="ri"><div class="rl"><span class="rb story">ストーリー</span><span class="rd">2日前</span></div>'+
          '<div class="rc">安くて、旨い。まずは一杯。</div><div class="rr"><b>980</b><small>閲覧</small><b>64</b><small>反応</small></div></div></div>'+
      '</div></div>'+
      '<div class="repsec"><h3>分析とアドバイス</h3><div class="repanal">'+
        '<div class="repcard good"><h4>好調なポイント</h4><ul><li>名物系（<b>どてかつ・炊き餃子</b>）の反応が高い。看板メニュー押しが効いています。</li><li>リーチが前期比 <b>+18%</b> と伸長。投稿頻度が安定してきました。</li></ul></div>'+
        '<div class="repcard warn"><h4>改善の余地</h4><ul><li>プロフィール表示に対し保存率がやや低め。<b>価格・営業時間</b>をキャプション冒頭に。</li></ul></div>'+
        '<div class="repcard act"><h4>次の一手</h4><ul><li>反応の良い名物投稿を<b>ストーリー（動く見本）</b>にも展開。</li><li>週末の <b>18:00台</b> 投稿が伸びやすい傾向。</li></ul></div>'+
      '</div></div>'+
      '<div class="repfoot">※本レポートは見本のサンプルです。@gifuya_fukuokatenjin の実データ連携後、自動で更新されます。</div>'+
    '</div>';

  // ===== タブ切替 =====
  var tabs = {tabFeed:feed, tabGallery:gal, tabReport:rep};
  function show(id){
    for (var k in tabs){ tabs[k].style.display = (k===id)?"":"none"; document.getElementById(k).classList.toggle("on", k===id); }
    window.scrollTo({top:0});
  }
  document.getElementById("tabFeed").onclick = function(){ show("tabFeed"); };
  document.getElementById("tabGallery").onclick = function(){ show("tabGallery"); };
  document.getElementById("tabReport").onclick = function(){ show("tabReport"); };
  document.getElementById("pushBtn").onclick = function(){ toast("見本モードのため通知は連携後に有効化されます"); };
})();
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function () {});
    });
  }
</script>
</body>
</html>
