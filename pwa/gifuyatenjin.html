<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ぎふや 福岡天神">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="icon" href="./icons/icon-192.png">
<title>ぎふや 福岡天神 ・ 投稿確認</title>
<style>
  /* 三条アプリ(index.html)と同一の土台デザイン。ぎふや福岡天神の見本用に自己完結で実装。 */
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{--bg:#0f1115;--card:#181c23;--line:#262c36;--fg:#eaeef2;--sub:#9aa3b2;
        --ok:#1f9d55;--rd:#3b6fd6;--ng:#444b57;--accent:#7fd1a0}
  html,body{margin:0;background:var(--bg);color:var(--fg);overscroll-behavior-y:contain;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif}
  body{padding:0 0 env(safe-area-inset-bottom)}
  .topbar{position:sticky;top:0;z-index:10;background:rgba(15,17,21,.86);
    backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line)}
  .bar{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 12px) 16px 8px}
  .bar .logo{height:32px;width:auto;max-width:96px;border-radius:6px;display:block;flex:0 0 auto;object-fit:contain}
  .bar h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.2px;flex:1;
    min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .push{border:1px solid var(--line);background:#222835;color:var(--fg);
    font-size:12px;font-weight:700;padding:6px 11px;border-radius:999px}
  .bar .dot{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px;margin-left:10px}
  .bar .dot i{width:8px;height:8px;border-radius:50%;background:#c79a3a;display:inline-block}
  .bar .dot i.beat{background:#37c66a;animation:dotbeat .9s ease-out}
  @keyframes dotbeat{0%{box-shadow:0 0 0 0 rgba(55,198,106,.6)}100%{box-shadow:0 0 0 7px rgba(55,198,106,0)}}
  .tabs{display:flex;gap:6px;padding:0 16px 10px}
  button,.tab,.seg button,.gfilter button{touch-action:manipulation}
  .tab{border:1px solid var(--line);background:#181c23;color:var(--sub);font-size:13px;font-weight:800;
    padding:7px 16px;border-radius:999px;transition:.12s}
  .tab.on{background:#10301f;color:var(--accent);border-color:#1f4d33}
  .tab:active{transform:scale(.92)}
  .tabs .reeltab{margin-left:auto;border:1px solid var(--line);background:#181c23;color:var(--sub);
    font-size:12px;font-weight:800;padding:7px 13px;border-radius:999px;flex:0 0 auto;text-decoration:none;display:flex;align-items:center}
  .tabs .reeltab:active{transform:scale(.94)}
  .note{margin:14px 14px 0;padding:12px 15px;background:#15120d;border:1px solid #2a241a;border-radius:12px;color:#b3aa9b;font-size:12.5px;line-height:1.7;max-width:560px}
  @media(min-width:592px){.note{margin-left:auto;margin-right:auto}}
  /* ===== 確認（投稿カード） ===== */
  #feed{padding:14px 14px 28px;max-width:560px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:14px;
    transition:opacity .25s ease,transform .25s ease}
  .card.done{opacity:.55}
  .head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:9px}
  .time{font-size:13px;color:var(--sub)}
  .pat{font-size:14px;font-weight:700;color:#fff;background:#222835;padding:2px 9px;border-radius:999px}
  .remain{margin-left:auto;font-size:12px;font-weight:700;color:var(--accent);background:#10301f;padding:3px 9px;border-radius:999px}
  .mediaWrap{position:relative;border-radius:13px;overflow:hidden;background:#000;width:100%;aspect-ratio:4/5}
  .mediaWrap.story{aspect-ratio:9/16}
  .media{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover;background:#000}
  .cap{font-size:14px;line-height:1.55;margin:10px 2px 2px;white-space:pre-wrap}
  .tags{font-size:11.5px;color:#8f97c0;word-break:break-all;margin:6px 2px 0}
  .slot{margin-top:10px}
  .btns{display:flex;gap:8px}
  .btns button{flex:1;border:0;border-radius:13px;padding:13px 0;font-size:15px;font-weight:800;color:#fff;transition:transform .06s,opacity .15s}
  .ok{background:var(--ok)}.rd{background:var(--rd)}.ng{background:var(--ng)}
  .btns button:active{transform:scale(.96);opacity:.92}
  .copybtn{margin-top:8px;width:100%;border:1px solid var(--line);border-radius:12px;background:#12161d;color:var(--accent);font-weight:800;font-size:13.5px;padding:11px;display:flex;align-items:center;justify-content:center;gap:7px}
  .copybtn.done{background:#10301f;border-color:#1f4d33}
  .banner{text-align:center;font-size:15px;font-weight:800;padding:13px 0;border-radius:13px}
  .banner.okb{background:#10301f;color:var(--accent)}
  .banner.okb small{display:block;font-size:11px;font-weight:600;color:#6fb595;margin-top:4px}
  .banner.ngb{background:#23262d;color:#aeb6c2}
  .redoing{display:flex;align-items:center;justify-content:center;gap:10px;font-size:14px;color:#ffcf66;background:#241d10;padding:14px 0;border-radius:13px}
  .spin{width:16px;height:16px;border:3px solid #ffcf66;border-top-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  /* ===== 見本ギャラリー ===== */
  #gallery{padding:14px 14px 28px;max-width:560px;margin:0 auto}
  .gfilter{position:sticky;top:104px;z-index:9;width:max-content;margin:0 auto 14px;display:flex;gap:4px;
    background:rgba(15,17,21,.94);backdrop-filter:saturate(180%) blur(12px);
    border:1px solid var(--line);border-radius:999px;padding:5px;box-shadow:0 10px 30px rgba(0,0,0,.55)}
  .gfilter button{border:none;background:transparent;color:var(--sub);font-size:14px;font-weight:800;padding:11px 24px;border-radius:999px;transition:.12s;white-space:nowrap}
  .gfilter button.sel{background:#10301f;color:var(--accent)}
  .gsub{font-size:13px;font-weight:800;color:var(--accent);margin:6px 2px 10px;border-left:3px solid #1f4d33;padding-left:9px}
  .glist{display:flex;flex-direction:column;gap:14px;margin-bottom:8px}
  #gallery.fvid .gimg{display:none}
  #gallery.fimg .gvid{display:none}
  #gallery.fvid .gsub.imgonly,#gallery.fimg .gsub.vidonly{display:none}
  .gcard{background:#14110c;border:1px solid #241f16;border-radius:16px;overflow:hidden;padding-bottom:12px}
  .gcard .gmedia{width:100%;aspect-ratio:9/16;max-height:62vh;object-fit:cover;display:block;background:#000}
  .gcard.feed .gmedia{aspect-ratio:4/5;max-height:none}
  .gchead{display:flex;align-items:center;gap:8px;padding:10px 12px 0}
  .gcard .gt{font-size:14px;font-weight:800;color:#e8e0d0;flex:1;min-width:0}
  .gstate{font-size:12px;font-weight:800;padding:3px 11px;border-radius:999px;flex:0 0 auto}
  .gstate.on{color:var(--accent);background:#10301f}
  .gstate.off{color:#aeb6c2;background:#23262d}
  .gcard .gd{padding:2px 12px 0;font-size:12px;color:#9a917f}
  .seg{display:flex;gap:8px;margin:11px 12px 0}
  .seg button{flex:1;border:2px solid var(--line);background:transparent;color:var(--sub);border-radius:13px;padding:12px 0;font-size:14px;font-weight:800;transition:.15s}
  .seg button:active{transform:scale(.97)}
  .seg .seg-on.sel{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:0 4px 14px rgba(31,157,85,.35)}
  .seg .seg-off.sel{background:#c0473a;border-color:#c0473a;color:#fff;box-shadow:0 4px 14px rgba(192,71,58,.35)}
  /* ===== レポート ===== */
  #report{padding:14px 12px 36px;max-width:560px;margin:0 auto}
  .rephint{color:var(--sub);font-size:12px;text-align:center;margin:0 4px 14px;line-height:1.6}
  .repdoc{background:#fff;color:#1b2433;border-radius:14px;overflow:hidden}
  .rephd{background:linear-gradient(135deg,#1b2433,#2e3c52);color:#fff;padding:22px 22px}
  .rephd .t{font-size:20px;font-weight:800;letter-spacing:.5px}
  .rephd .s{font-size:13px;color:#cdd6e4;margin-top:4px}
  .rephd .p{font-size:14px;font-weight:700;margin-top:12px}
  .rephd .p small{display:block;font-size:12px;color:#aebbcf;font-weight:400;margin-top:3px}
  .repsec{padding:16px 18px 4px}
  .repsec h3{font-size:15px;font-weight:800;color:#1b2433;margin:0 0 12px;display:flex;align-items:center;gap:8px}
  .repsec h3::before{content:"";width:6px;height:18px;background:#e0a93b;border-radius:3px}
  .repkpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
  .repkpi{background:#f4f6f9;border-radius:12px;padding:14px 14px}
  .repkpi .l{font-size:12px;color:#6c7689;font-weight:700}
  .repkpi .v{font-size:26px;font-weight:800;color:#1b2433;margin-top:3px;line-height:1.1}
  .repkpi .v small{font-size:13px;color:#8a94a6;font-weight:700}
  .repkpi .d{display:inline-block;margin-top:8px;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px}
  .repkpi .prev{font-size:11px;color:#9aa3b2;margin-top:6px}
  .up{color:#127a40;background:#e3f5ea}.down{color:#b23b3b;background:#fbe7e7}.flat{color:#6c7689;background:#eceff3}
  .repbars{display:flex;align-items:flex-end;gap:3px;height:120px;background:#f4f6f9;border-radius:12px;padding:12px 12px 8px}
  .repbars i{flex:1;background:#33507f;border-radius:3px 3px 0 0;min-height:2px;opacity:.9}
  .repbars i.hot{background:#e0a93b;opacity:1}
  .repax{display:flex;justify-content:space-between;font-size:11px;color:#9aa3b2;margin:6px 4px 0}
  .repanal{display:flex;flex-direction:column;gap:10px}
  .repcard{background:#fff;border:1px solid #eef1f5;border-left:6px solid #ccc;border-radius:12px;padding:14px 16px}
  .repcard.good{border-left-color:#2bb673}.repcard.warn{border-left-color:#e0a93b}.repcard.act{border-left-color:#3b6fd6}
  .repcard h4{font-size:14px;font-weight:800;margin:0 0 8px}
  .repcard.good h4{color:#127a40}.repcard.warn h4{color:#a9781a}.repcard.act h4{color:#2a55b0}
  .repcard ul{margin:0;padding:0;list-style:none}
  .repcard li{font-size:13.5px;line-height:1.65;color:#384153;padding:5px 0 5px 16px;position:relative}
  .repcard li::before{content:"";position:absolute;left:2px;top:12px;width:7px;height:7px;border-radius:50%;background:#c4ccd8}
  .repcard.good li::before{background:#2bb673}.repcard.warn li::before{background:#e0a93b}.repcard.act li::before{background:#3b6fd6}
  .repcard li b{color:#1b2433;font-weight:800}
  .repposts{display:flex;flex-direction:column;gap:8px}
  .reppost{background:#f4f6f9;border-radius:12px;padding:9px 11px;display:flex;gap:11px;align-items:center}
  .reppost .rt{width:62px;height:62px;border-radius:10px;object-fit:cover;flex:0 0 auto;background:#e7ebf1}
  .reppost .ri{flex:1;min-width:0}
  .reppost .rl{display:flex;align-items:center;gap:8px;margin-bottom:5px}
  .reppost .rb{font-size:10.5px;font-weight:800;color:#fff;background:#8a94a6;border-radius:999px;padding:2px 9px}
  .reppost .rb.story{background:#c0567f}.reppost .rb.feed{background:#3b6fd6}.reppost .rb.reel{background:#7a4fd6}
  .reppost .rd{font-size:11.5px;color:#9aa3b2;font-weight:700}
  .reppost .rc{font-size:13px;color:#384153;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:5px}
  .reppost .rr{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .reppost .rr b{font-size:15px;color:#1b2433;font-weight:800}
  .reppost .rr small{font-size:11.5px;color:#6c7689}
  .repfoot{color:#9aa3b2;font-size:11px;text-align:center;padding:14px 16px 18px;line-height:1.6}
  /* レポート操作バー（更新／PDF） */
  .repbar{display:flex;gap:8px;justify-content:center;margin:0 4px 14px}
  .repbar button{border:1px solid var(--line);background:#181c23;color:var(--sub);font-size:13px;font-weight:800;padding:9px 16px;border-radius:999px}
  .repbar button.pdf{background:#10301f;color:var(--accent);border-color:#1f4d33}
  .repbar button:active{transform:scale(.96)}
  .repbar button[disabled]{opacity:.5}
  /* グラフ操作（なぞって日付＋数値） */
  .repchart{position:relative;touch-action:none}
  .repbars i{transition:background .08s}
  .reptip{position:absolute;top:-6px;transform:translateX(-50%);background:#1b2433;color:#fff;font-size:12px;padding:5px 11px;border-radius:9px;display:none;white-space:nowrap;pointer-events:none;z-index:6;box-shadow:0 4px 14px rgba(0,0,0,.3)}
  .reptip b{font-size:14.5px;margin-right:7px}.reptip span{opacity:.82}
  .repnote{font-size:11px;color:#9aa3b2;margin:8px 2px 2px;line-height:1.5}
  /* タップで指標切替できるKPI */
  .repkpi.tap{cursor:pointer;transition:box-shadow .12s,transform .08s}
  .repkpi.tap:active{transform:scale(.98)}
  .repkpi.tap.on{box-shadow:0 0 0 2px #e0a93b inset}
  /* A4 出力モード（PDF生成時にクローンへ付与） */
  .repdoc.a4{width:794px;border-radius:0}
  .repdoc.a4 .repsec{padding:11px 26px 3px}.repdoc.a4 .repsec h3{margin:0 0 8px}
  .repdoc.a4 .rephd{padding:20px 26px}
  .repdoc.a4 .repkpis{grid-template-columns:1fr 1fr 1fr 1fr;margin-bottom:4px}
  .repdoc.a4 .repkpi{padding:11px 13px}.repdoc.a4 .repkpi .v{font-size:23px}
  .repdoc.a4 .repbars{height:96px}
  .repdoc.a4 .repposts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .repdoc.a4 .reppost{padding:7px 10px}.repdoc.a4 .reppost .rt{width:52px;height:52px}
  .repdoc.a4 .repnote{margin:1px 2px 3px}
  .repdoc.a4 .repbreak{break-before:page;page-break-before:always;padding-top:22px}
  .repdoc.a4 .repkpi.tap.on{box-shadow:none;background:#fbf3df;border:1px solid #efe1bb}
  .repdoc.a4.a4tight{font-size:12px}
  .repdoc.a4.a4tight .rephd{padding:13px 22px}.repdoc.a4.a4tight .repsec{padding:7px 22px 2px}
  .repdoc.a4.a4tight .repsec h3{font-size:13px;margin:0 0 5px}
  .repdoc.a4.a4tight .repkpi{padding:7px 10px}.repdoc.a4.a4tight .repkpi .v{font-size:18px}
  .repdoc.a4.a4tight .repbars{height:72px}
  .repdoc.a4.a4tight .reppost{padding:4px 8px}.repdoc.a4.a4tight .reppost .rt{width:42px;height:42px}
  .repdoc.a4.a4tight .repnote{font-size:10px;margin:0 2px 2px}.repdoc.a4.a4tight .repbreak{padding-top:14px}
  .repdoc.a4.a4tight2{font-size:11px}
  .repdoc.a4.a4tight2 .repcard{padding:8px 10px}.repdoc.a4.a4tight2 .repcard h4{font-size:12px;margin:0 0 4px}
  .repdoc.a4.a4tight2 .repcard li{margin:2px 0}.repdoc.a4.a4tight2 .repkpi .v{font-size:16px}
  .repdoc.a4.a4tight2 .repbars{height:58px}.repdoc.a4.a4tight2 .reppost .rt{width:36px;height:36px}
  .repdoc.a4.a4tight2 .repsec{padding:5px 20px 2px}
  #toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translateX(-50%);
    background:#000;color:#fff;padding:11px 18px;border-radius:24px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:30;max-width:90%;text-align:center}
  #toast.show{opacity:.96}
  .foot{color:#6f685d;font-size:10px;text-align:center;padding:20px 0 calc(env(safe-area-inset-bottom) + 16px)}
</style>
</head>
<body>
<header class="topbar">
  <div class="bar">
    <img class="logo" src="./icons/store_gifuyatenjin.png" alt="ぎふや 福岡天神店">
    <h1 id="storeName">ぎふや 福岡天神店</h1>
    <button class="push" id="pushBtn">🔔 通知</button>
    <div class="dot"><i></i><span id="modeTxt">見本モード</span></div>
  </div>
  <div class="tabs">
    <button class="tab on" id="tabFeed">確認</button>
    <button class="tab" id="tabGallery">見本</button>
    <button class="tab" id="tabReport">レポート</button>
    <a class="reeltab" href="./gifuya_reels.html">🎬 リール</a>
  </div>
</header>

<div id="feed"></div>
<div id="gallery" style="display:none"></div>
<div id="report" style="display:none"></div>

<div id="toast"></div>
<div class="foot">すさび湯グループ 投稿管理 ・ ぎふや 福岡天神店</div>

  var _jc=0;

    var q=Object.keys(params).map(function(k){ return k+"="+encodeURIComponent(params[k]); }).join("&");
    s.src=GAS+(GAS.indexOf("?")>=0?"&":"?")+q; s.onerror=window[cb]; document.head.appendChild(s); }
  // 読み取り用JSONP（応答をonDataで受け取る）。

    var q=Object.keys(params).map(function(k){ return k+"="+encodeURIComponent(params[k]); }).join("&");
    s.src=GAS+(GAS.indexOf("?")>=0?"&":"?")+q; s.onerror=function(){ try{ window[cb](); }catch(e){} }; document.head.appendChild(s); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m];}); }
  // seedから決まる順列（Fisher-Yates+LCG）。フィード候補の日替わりシャッフルで使用。
  function seededOrder(n, seed){ var a=[],i,s=(seed>>>0)||1; for(i=0;i<n;i++)a.push(i);

    function showAt(x){ var bs=barsEl.querySelectorAll("i"); if(!bs.length) return;
      var r=barsEl.getBoundingClientRect(), idx=Math.floor((x-r.left)/r.width*bs.length);
      idx=Math.max(0,Math.min(bs.length-1,idx));
      if(idx!==last){ haptic(6); last=idx; }
      for(var i=0;i<bs.length;i++){ bs[i].classList.toggle("hot",i===idx); }
      var b=bs[idx], br=b.getBoundingClientRect();
      tip.innerHTML='<b>'+fmtN(Number(b.getAttribute("data-v")))+'</b><span>'+esc(b.getAttribute("data-d"))+'</span>';
      tip.style.display="block";
      var cx=br.left+br.width/2-r.left; tip.style.left=Math.max(34,Math.min(r.width-34,cx))+"px"; }
    function hide(){ tip.style.display="none"; last=-1; var h=barsEl.querySelectorAll("i.hot"); for(var i=0;i<h.length;i++) h[i].classList.remove("hot"); }
    chart.addEventListener("touchstart",function(e){ e.preventDefault(); showAt(e.touches[0].clientX); },{passive:false});
    chart.addEventListener("touchmove",function(e){ e.preventDefault(); showAt(e.touches[0].clientX); },{passive:false});
    chart.addEventListener("touchend",hide); chart.addEventListener("touchcancel",hide);
    chart.addEventListener("mousedown",function(e){ showAt(e.clientX); });
    chart.addEventListener("mousemove",function(e){ if(e.buttons) showAt(e.clientX); });
    chart.addEventListener("mouseup",hide); chart.addEventListener("mouseleave",hide);
  }
  function sampleReport(){
    var ss=[42,55,48,63,70,58,66,80,74,88,95,82,90,104,98,112].map(function(v,i){return {date:"D"+(i+1),val:v};});

    '<div class="repdoc">'+
      '<div class="rephd"><div class="t">Instagram インサイトレポート</div><div class="s">ぎふや 福岡天神店</div>'+

      '<div class="repsec"><h3>主要指標</h3><div class="repkpis">'+

          '<div class="rc">名物、元祖どぶ漬けどてかつ🍢</div><div class="rr"><b>2,140</b><small>リーチ</small><b>186</b><small>いいね</small></div></div></div>'+
      '</div></div>'+
      '<div class="repsec repbreak"><h3>分析・まとめ（見本）</h3><div class="repanal">'+
        '<div class="repcard good"><h4>強み・良かった点</h4><ul><li>名物系（<b>どてかつ・炊き餃子</b>）の反応が高い。</li></ul></div>'+
        '<div class="repcard act"><h4>今後の施策</h4><ul><li>週末の <b>18:00台</b> 投稿が伸びやすい傾向。</li></ul></div>'+
      '</div></div>'+

  function realReport(d){
    var c=d.cur||{}, p=d.prev;
    function pctOf(cur,prev){ return (prev==null||prev===0)?null:Math.round((cur-prev)/prev*1000)/10; }
    function dp(cur,prev){ var pc=pctOf(cur,p&&prev); if(pc==null){ return {cls:'flat',txt:'—',prev:'—'}; }
      return {cls:pc>=0?'up':'down', txt:(pc>=0?'▲ ':'▼ ')+Math.abs(pc)+'%', prev:'前期 '+fmtN(p&&prev)}; }
    var kR=dp(c.reach,p&&p.reach), kV=dp(c.views,p&&p.views), kP=dp(c.pviews,p&&p.pviews);
    var fEnd=c.followersEnd||0, fStart=(p&&p.followersEnd)||c.followersStart||fEnd, fd=fEnd-fStart;
    // 日別データがあれば指標切替、無ければリーチ推移のみ。
    var hasDaily=!!(d.daily && d.daily.length);
    var series = hasDaily ? d.daily.map(function(r){ return {date:String(r.date), val:Number(r[repMetric])||0}; })
                          : (d.series||[]).map(function(s){ return {date:String(s.date||''), val:Number(s.reach)||0}; });
    if(!series.length) series=[{date:'',val:0}];
    var trendLbl=(hasDaily?(REP_METRICS[repMetric]||"リーチ"):"リーチ")+"の推移（日別）";
    var firstD=(d.days||30)+"日前", lastD="今日";
    var top=(d.posts&&d.posts.top)||[];
    var ph=top.slice(0,3).map(function(pp){ var st=pp.kind==='story', th=pp.thumb||pp.full||'';
      return '<div class="reppost">'+(th?'<img class="rt" src="'+th+'">':'<div class="rt" style="background:#e6ebf2"></div>')+
        '<div class="ri"><div class="rl"><span class="rb '+(st?'story':'feed')+'">'+(st?'ストーリー':'フィード')+'</span><span class="rd">'+esc(pp.date||'')+'</span></div>'+
        '<div class="rc">'+esc(String(pp.caption||'').slice(0,40))+'</div><div class="rr"><b>'+fmtN(pp.reach)+'</b><small>'+(st?'閲覧':'リーチ')+'</small><b>'+fmtN(st?pp.navigation:pp.likes)+'</b><small>'+(st?'遷移':'いいね')+'</small></div></div></div>';
    }).join('') || '<div class="rephint">まだ投稿データがありません。</div>';
    // ---- 分析・まとめ（実数値で具体化。データが無い項目は自動で省略）----
    var good=[],warn=[],act=[], cmp="前期比";
    var reachPct=pctOf(c.reach,p&&p.reach), pvPct=pctOf(c.pviews,p&&p.pviews);
    var linkRate=c.pviews?Math.round((c.links||0)/c.pviews*1000)/10:null;
    var bestDay="",bestV=-1; series.forEach(function(s){ if((Number(s.val)||0)>bestV){bestV=Number(s.val)||0;bestDay=s.date;} });
    if(reachPct!=null){ if(reachPct>0) good.push("リーチは <b>"+fmtN(c.reach)+"</b>（"+cmp+" <b>+"+reachPct+"%</b>）。露出が伸びています。");
      else if(reachPct<0) warn.push("リーチは <b>"+fmtN(c.reach)+"</b>（"+cmp+" <b>"+reachPct+"%</b>）。投稿の時間帯・内容を見直し。");
      else good.push("リーチは <b>"+fmtN(c.reach)+"</b>（"+cmp+" 横ばい）。"); }
    else good.push("リーチは <b>"+fmtN(c.reach)+"</b>。比較は前期のデータが揃うと表示されます。");
    if(bestDay) good.push("最も伸びた日は <b>"+esc(String(bestDay).slice(5))+"</b>（"+fmtN(bestV)+"）。この日の内容・時間を再現したい。");
    if(c.reach){ var vr=Math.round(c.views/c.reach*10)/10; if(vr>=1.5) good.push("1人あたり約 <b>"+vr+"回</b>見られています（リピート視聴が良好）。"); }
    if(pvPct!=null && pvPct<0) warn.push("プロフィール表示が "+cmp+" <b>"+pvPct+"%</b>。1枚目の訴求と固定リンクを強化。");
    if(linkRate!=null){ if(linkRate<4) warn.push("誘導率（リンク÷プロフ表示）が <b>"+linkRate+"%</b> と低め。予約リンクを毎回明示。");
      else good.push("誘導率 <b>"+linkRate+"%</b>。プロフィールから行動につながっています。"); }
    if(fd>0) good.push("フォロワー <b>+"+fd+"</b>（計 "+fmtN(fEnd)+"）。");
    else if(p&&p.followersEnd!=null) warn.push("フォロワー純増 <b>"+fd+"</b>。投稿頻度・導線を確認。");
    var sa=(d.posts&&d.posts.storyAvg)||null, sN=(d.posts&&d.posts.storyN)||0;
    if(sa&&sa.reach){ var tap=Math.round((sa.navigation||0)/sa.reach*100);
      good.push("ストーリーズ平均リーチ <b>"+fmtN(sa.reach)+"</b>／タップ率 <b>"+tap+"%</b>（"+sN+"本）。");
      if(tap<30){ warn.push("ストーリーズのタップ率が <b>"+tap+"%</b> と低め。1枚目を強い引き＋リンク明確に。");
        act.push("ストーリーズ1枚目を<b>結論ファースト</b>にしてタップ率UP。"); } }
    if(linkRate!=null&&linkRate<4) act.push("各投稿に<b>予約リンク</b>を必ず明示し、誘導率の底上げを狙う。");
    if(reachPct!=null&&reachPct<0) act.push("反応が落ちた期間。<b>投稿時間</b>を反応の良い曜日・時間に寄せる。");
    if(bestDay) act.push("伸びた <b>"+esc(String(bestDay).slice(5))+"</b> の型（内容・時間帯）を<b>再現</b>する。");
    if(fd<=0 && p&&p.followersEnd!=null) act.push("保存・シェアされやすい<b>保存版（まとめ）投稿</b>を増やしてフォロー転換を狙う。");
    if(!act.length) act.push("好調を維持。伸びた投稿の型を<b>横展開</b>し、頻度を保つ。");
    if(!good.length) good.push("データを蓄積中。日数が増えるほど精度が上がります。");
    if(!warn.length) warn.push("大きな課題は見当たりません。継続して様子を見ましょう。");
    function lis(a){ return a.map(function(x){ return "<li>"+x+"</li>"; }).join(""); }
    return '<div class="rephint">Instagram インサイト（@gifuya_fukuokatenjin・実データ）</div>'+
    '<div class="repdoc">'+
      '<div class="rephd"><div class="t">Instagram インサイトレポート</div><div class="s">ぎふや 福岡天神店</div>'+
        '<div class="p">@gifuya_fukuokatenjin<small>集計期間：直近'+(d.days||0)+'日'+(d.latestDate?'（〜'+esc(d.latestDate)+'）':'')+'</small></div></div>'+
      '<div class="repsec"><h3>主要指標</h3><div class="repkpis">'+
        kpi("リーチ",fmtN(c.reach),kR.cls,kR.txt,kR.prev,hasDaily?"reach":"")+
        kpi("閲覧数",fmtN(c.views),kV.cls,kV.txt,kV.prev,hasDaily?"views":"")+
        kpi("プロフィール表示",fmtN(c.pviews),kP.cls,kP.txt,kP.prev,hasDaily?"pviews":"")+
        kpi("フォロワー",fmtN(fEnd),(fd>=0?'up':'down'),(fd>=0?'▲ ':'▼ ')+Math.abs(fd),"前期 "+fmtN(fStart),hasDaily?"followers":"")+
      '</div></div>'+
      chartHtml(series,trendLbl,firstD,lastD,true)+
      '<div class="repsec"><h3>人気の投稿</h3><div class="repposts">'+ph+'</div></div>'+
      '<div class="repsec repbreak"><h3>分析・まとめ</h3><div class="repanal">'+
        '<div class="repcard good"><h4>強み・良かった点</h4><ul>'+lis(good)+'</ul></div>'+
        '<div class="repcard warn"><h4>反省点・課題</h4><ul>'+lis(warn)+'</ul></div>'+
        '<div class="repcard act"><h4>今後の施策</h4><ul>'+lis(act)+'</ul></div>'+
      '</div></div>'+
    '</div>';
  }
  // ===== PDF出力（A4 2ページ・html2pdfをCDNから遅延読込。オンライン時のみ）=====
  var PDF_LIB="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.3/dist/html2pdf.bundle.min.js";
  function loadScriptOnce(src,cb,onerr){ var s=document.createElement("script"); s.src=src; s.onload=cb; s.onerror=onerr||function(){toast("PDF部品の読込に失敗");}; document.head.appendChild(s); }
  function preloadPdfLib(){ if(window.html2pdf||window.__pdfPre) return; window.__pdfPre=1; loadScriptOnce(PDF_LIB,function(){},function(){window.__pdfPre=0;}); }
  function downloadReportPdf(){
    var src=rep.querySelector(".repdoc"); if(!src){ toast("レポートがありません"); return; }
    var btn=document.getElementById("repPdf"); if(btn&&btn.disabled) return; if(btn) btn.disabled=true; haptic(12);
    toast("PDF出力を準備中…"); var done=false;
    function finish(msg){ done=true; if(btn) btn.disabled=false; if(msg) toast(msg); }
    var watchdog=setTimeout(function(){ if(!done&&!window.html2pdf){ window.__pdfPre=0; finish("PDF部品を読み込めませんでした。電波の良い場所で再度お試しください"); } },15000);
    function go(){ if(done) return; clearTimeout(watchdog); if(!window.html2pdf){ finish("PDF生成に失敗"); return; }
      toast("PDFを出力中…（数秒かかります）");
      var holder=document.createElement("div"); holder.style.cssText="position:fixed;left:-99999px;top:0;width:794px;background:#fff";
      var clone=src.cloneNode(true); clone.classList.add("a4"); holder.appendChild(clone); document.body.appendChild(holder);
      (function fitA4(){ var P1=1040,P2=1050, br=clone.querySelector(".repbreak"); if(!br) return; var steps=0;
        while(br.offsetTop>P1 && steps<14){ if(steps===0) clone.classList.add("a4tight"); else if(steps===1) clone.classList.add("a4tight2");
          else { var ps=clone.querySelectorAll(".reppost"); if(ps.length>2) ps[ps.length-1].parentNode.removeChild(ps[ps.length-1]); else break; } steps++; }
        var guard=0; while((clone.scrollHeight-br.offsetTop)>P2 && guard<14){ if(guard===0) clone.classList.add("a4tight"); else if(guard===1) clone.classList.add("a4tight2");
          else { var longest=null,max=0,cards=clone.querySelectorAll(".repcard"); for(var ci=0;ci<cards.length;ci++){ var n=cards[ci].querySelectorAll("li").length; if(n>max){max=n;longest=cards[ci];} }
            if(longest&&max>2){ var ls=longest.querySelectorAll("li"); ls[ls.length-1].parentNode.removeChild(ls[ls.length-1]); } else break; } guard++; }
      })();
      window.html2pdf().set({ margin:[6,0,6,0],
        filename:"gifuya_insight_"+((reportData&&reportData.latestDate)||"report")+".pdf",
        image:{type:"jpeg",quality:0.95},
        html2canvas:{scale:2,backgroundColor:"#ffffff",useCORS:true,width:794,windowWidth:794,x:0,scrollX:0},
        jsPDF:{unit:"mm",format:"a4",orientation:"portrait"},
        pagebreak:{mode:["css","legacy"],before:".repbreak",avoid:[".repsec",".reppost",".repkpi",".repcard"]}
      }).from(clone).save().then(function(){ holder.remove(); finish("✓ PDF出力が完了しました（2ページ）"); })
        .catch(function(){ holder.remove(); finish("PDF作成に失敗しました。もう一度お試しください"); });
    }
    if(window.html2pdf){ setTimeout(go,60); } else loadScriptOnce(PDF_LIB,go,function(){ finish("PDF部品の読込に失敗。通信環境をご確認ください"); });
  }
  function wireReport(){
    var pb=document.getElementById("repPdf"); if(pb) pb.onclick=downloadReportPdf;
    var kps=rep.querySelectorAll(".repkpi.tap");
    for(var i=0;i<kps.length;i++){ kps[i].onclick=function(){ var mt=this.getAttribute("data-metric");
      if(mt&&mt!==repMetric){ repMetric=mt; haptic(10); if(reportData) renderReport(reportData); } }; }
    wireChartScrub();
  }
  function renderReport(d){
    var bar='<div class="repbar"><button id="repPdf" class="pdf">📄 PDF出力（A4）</button></div>';
    rep.innerHTML = bar + ((d && d.days>0 && d.cur) ? realReport(d) : sampleReport());
    wireReport();
  }
  renderReport(null);
  if(LIVE){ gasGet({api:"report"}, function(res){ if(res && !res.error){ reportData=res; renderReport(res); } }); }

  // ===== タブ切替 =====
  var tabs = {tabFeed:feed, tabGallery:gal, tabReport:rep};
  function show(id){
    for (var k in tabs){ tabs[k].style.display = (k===id)?"":"none"; document.getElementById(k).classList.toggle("on", k===id); }
    window.scrollTo({top:0});
  }
  document.getElementById("tabFeed").onclick = function(){ show("tabFeed"); };
  document.getElementById("tabGallery").onclick = function(){ show("tabGallery"); };
  document.getElementById("tabReport").onclick = function(){ show("tabReport"); preloadPdfLib(); };
  // ===== Web Push（三条と同じVAPIDを再利用。投稿完了などを端末に通知） =====
  var pushBtn = document.getElementById("pushBtn");
  function urlB64ToU8(s){ var pad="=".repeat((4-s.length%4)%4), b=(s+pad).replace(/-/g,"+").replace(/_/g,"/"), raw=atob(b), a=new Uint8Array(raw.length);
    for(var i=0;i<raw.length;i++) a[i]=raw.charCodeAt(i); return a; }
  function enablePush(){
    var vp=((CFG2.VAPID_PUBLIC)||"").trim();
    if(!("serviceWorker" in navigator) || !("PushManager" in window)){ toast("この端末は通知に対応していません"); return; }
    if(!LIVE || !vp){ toast("通知は準備中です（連携後に有効化）"); return; }
    Notification.requestPermission().then(function(perm){
      if(perm!=="granted"){ toast("通知が許可されませんでした"); return; }
      navigator.serviceWorker.ready.then(function(reg){
        return reg.pushManager.getSubscription().then(function(ex){
          return ex || reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:urlB64ToU8(vp)}); });
      }).then(function(sub){
        gas({api:"subscribe", sub:JSON.stringify(sub), ep:sub.endpoint, prefs:"ig"});
        pushBtn.textContent="🔔 通知ON"; toast("通知をオンにしました");
      }).catch(function(){ toast("通知の設定に失敗しました"); });
    });
  }
  navigator.serviceWorker && navigator.serviceWorker.ready.then(function(reg){
    reg.pushManager.getSubscription().then(function(s){ if(s) pushBtn.textContent="🔔 通知ON"; }).catch(function(){});
  });
  pushBtn.onclick = enablePush;
})();
</script>
