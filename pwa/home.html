<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>すさび湯 店舗ホーム</title>
<meta name="theme-color" content="#0f1115">
<style>
  :root{--bg:#0f1115;--card:#181c23;--line:#262b35;--fg:#e8ecf2;--sub:#9aa3b2;--accent:#7fd1a0}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  button{touch-action:manipulation;font-family:inherit}
  html,body{background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    min-height:100%;overscroll-behavior-y:none}
  .top{position:sticky;top:0;z-index:10;background:rgba(15,17,21,.88);backdrop-filter:saturate(180%) blur(12px);
    border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;
    padding:calc(env(safe-area-inset-top) + 14px) 18px 12px}
  .top h1{font-size:16px;font-weight:800;letter-spacing:.5px;flex:1}
  .top .done{display:none;border:1px solid #1f4d33;background:#10301f;color:var(--accent);
    font-size:13px;font-weight:800;padding:7px 16px;border-radius:999px}
  body.editing .top .done{display:inline-block}
  .top .gear{border:1px solid var(--line);background:var(--card);color:var(--sub);
    font-size:15px;padding:7px 12px;border-radius:999px}
  .hint{color:var(--sub);font-size:12px;text-align:center;margin:14px 16px 2px;line-height:1.7}

  /* 横スクロールのページ（携帯ホーム風・スナップ） */
  .pages{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;
    scrollbar-width:none}
  .pages::-webkit-scrollbar{display:none}
  .page{flex:0 0 100%;scroll-snap-align:start;padding:22px 18px 10px;
    display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:118px;gap:14px 10px;align-content:start;
    min-height:300px}
  .dots{display:flex;justify-content:center;gap:6px;margin:2px 0 10px}
  .dots i{width:6px;height:6px;border-radius:50%;background:#39404d}
  .dots i.on{background:var(--accent)}

  /* 店舗アイコン */
  .tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:7px;
    background:none;border:none;color:var(--fg)}
  .tile .ic{position:relative;width:74px;height:74px;border-radius:20px;overflow:hidden;background:var(--card);
    border:1px solid var(--line);box-shadow:0 6px 16px rgba(0,0,0,.35);
    display:flex;align-items:center;justify-content:center}
  .tile .ic img{width:100%;height:100%;object-fit:cover;display:block}
  .tile .ic .init{font-size:34px;font-weight:800;color:#e9dcc3;font-family:"Hiragino Mincho ProN",serif}
  .tile .nm{font-size:11px;font-weight:700;color:var(--fg);max-width:100px;text-align:center;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tile .sb{font-size:10px;color:var(--sub);margin-top:-4px;max-width:100px;text-align:center;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tile .prep{position:absolute;top:-5px;right:2px;background:#3a2f14;color:#ffd23f;border:1px solid #5c4a1c;
    font-size:9px;font-weight:800;padding:2px 7px;border-radius:999px}
  .tile:active .ic{transform:scale(.94)}
  /* 編集モード：ゆらゆら＋−バッジ */
  body.editing .tile .ic{animation:wig 0.35s ease-in-out infinite alternate}
  @keyframes wig{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}
  .tile .minus{display:none;position:absolute;top:-7px;left:6px;width:24px;height:24px;border-radius:50%;
    background:#c0473a;color:#fff;border:2px solid var(--bg);font-size:16px;font-weight:800;line-height:20px;z-index:2}
  body.editing .tile .minus{display:block}

  /* 表示/非表示の設定モーダル */
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;align-items:flex-end}
  .ov.show{display:flex}
  .sheet{background:#141821;border-radius:18px 18px 0 0;width:100%;max-height:76vh;overflow-y:auto;
    padding:18px 18px calc(env(safe-area-inset-bottom) + 22px)}
  .sheet h2{font-size:15px;margin-bottom:4px}
  .sheet .note{color:var(--sub);font-size:12px;margin-bottom:12px;line-height:1.6}
  .row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line)}
  .row .mini{width:40px;height:40px;border-radius:12px;overflow:hidden;background:var(--card);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .row .mini img{width:100%;height:100%;object-fit:cover}
  .row .mini span{font-size:18px;font-weight:800;color:#e9dcc3}
  .row .t{flex:1;min-width:0}
  .row .t b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .t small{font-size:11px;color:var(--sub)}
  .row input{width:20px;height:20px;accent-color:#1f9d55}
  .sheet .save{margin-top:16px;width:100%;background:#1f9d55;color:#fff;border:none;border-radius:12px;
    padding:14px 0;font-size:15px;font-weight:800}
  .foot{color:#5b6472;font-size:10px;text-align:center;padding:10px 0 calc(env(safe-area-inset-bottom) + 16px)}
</style>
</head>
<body>
<header class="top">
  <h1>すさび湯 店舗ホーム</h1>
  <button class="done" id="doneBtn">完了</button>
  <button class="gear" id="gearBtn">⚙︎ 店舗の表示</button>
</header>
<div class="hint">アイコンをタップで各店舗の確認画面へ。<b>長押し</b>で並びの編集（−で非表示）ができます。</div>
<div class="pages" id="pages"></div>
<div class="dots" id="dots"></div>
<div class="foot">すさび湯グループ 投稿管理</div>

<div class="ov" id="ov">
  <div class="sheet">
    <h2>表示する店舗</h2>
    <div class="note">チェックした店舗だけがホームに並びます。担当していない店舗は外してOK（あとからここで戻せます）。</div>
    <div id="rows"></div>
    <button class="save" id="saveBtn">保存する</button>
  </div>
</div>

<script src="stores.js"></script>
<script>
(function () {
  var STORES = window.SUSABIYU_STORES || [];
  var PER_PAGE = 12;   // 3列×4行
  var pagesEl = document.getElementById("pages");
  var dotsEl = document.getElementById("dots");
  var editing = false;

  function hiddenIds() {
    try { return JSON.parse(localStorage.getItem("sb_home_hidden") || "[]"); } catch (e) { return []; }
  }
  function setHidden(ids) {
    try { localStorage.setItem("sb_home_hidden", JSON.stringify(ids)); } catch (e) {}
  }
  function iconHtml(s, cls) {
    if (s.icon) return '<img src="' + s.icon + '" alt="">';
    return '<span class="' + (cls || "init") + '">' + (s.initial || s.name.charAt(0)) + '</span>';
  }

  function render() {
    var hid = hiddenIds();
    var vis = STORES.filter(function (s) { return hid.indexOf(s.id) < 0; });
    pagesEl.innerHTML = "";
    dotsEl.innerHTML = "";
    var pageCount = Math.max(1, Math.ceil(vis.length / PER_PAGE));
    for (var p = 0; p < pageCount; p++) {
      var pg = document.createElement("div");
      pg.className = "page";
      vis.slice(p * PER_PAGE, (p + 1) * PER_PAGE).forEach(function (s) {
        var t = document.createElement("button");
        t.className = "tile";
        t.setAttribute("data-id", s.id);
        t.innerHTML =
          '<span class="minus">−</span>' +
          '<span class="ic">' + iconHtml(s) + (s.live ? "" : '<span class="prep">準備中</span>') + '</span>' +
          '<span class="nm">' + s.name + '</span>' +
          '<span class="sb">' + s.short + '</span>';
        wireTile(t, s);
        pg.appendChild(t);
      });
      pagesEl.appendChild(pg);
      var d = document.createElement("i");
      if (p === 0) d.className = "on";
      dotsEl.appendChild(d);
    }
    if (pageCount <= 1) dotsEl.style.display = "none"; else dotsEl.style.display = "flex";
  }

  // ページ位置に応じてドットを更新
  pagesEl.addEventListener("scroll", function () {
    var idx = Math.round(pagesEl.scrollLeft / pagesEl.clientWidth);
    var ds = dotsEl.children;
    for (var i = 0; i < ds.length; i++) ds[i].className = i === idx ? "on" : "";
  }, { passive: true });

  function setEditing(on) {
    editing = on;
    document.body.classList.toggle("editing", on);
  }

  function wireTile(t, s) {
    var timer = null, moved = false;
    t.addEventListener("touchstart", function () {
      moved = false;
      timer = setTimeout(function () {
        setEditing(true);
        if (navigator.vibrate) { try { navigator.vibrate(15); } catch (e) {} }
      }, 550);
    }, { passive: true });
    t.addEventListener("touchmove", function () { moved = true; clearTimeout(timer); }, { passive: true });
    t.addEventListener("touchend", function () { clearTimeout(timer); }, { passive: true });
    // PC検証用: 右クリックでも編集モード
    t.addEventListener("contextmenu", function (e) { e.preventDefault(); setEditing(true); });
    t.addEventListener("click", function (e) {
      if (editing) {
        // 編集中: −で非表示。それ以外のタップは何もしない
        if (e.target.classList.contains("minus")) {
          var hid = hiddenIds();
          if (hid.indexOf(s.id) < 0) hid.push(s.id);
          setHidden(hid);
          render();
        }
        return;
      }
      if (moved) return;
      location.href = s.url;
    });
  }

  document.getElementById("doneBtn").onclick = function () { setEditing(false); };

  // 表示/非表示の設定シート
  var ov = document.getElementById("ov");
  var rowsEl = document.getElementById("rows");
  document.getElementById("gearBtn").onclick = function () {
    var hid = hiddenIds();
    rowsEl.innerHTML = "";
    STORES.forEach(function (s) {
      var r = document.createElement("label");
      r.className = "row";
      r.innerHTML =
        '<span class="mini">' + iconHtml(s, "") + '</span>' +
        '<span class="t"><b>' + s.name + '</b><small>' + s.short + (s.live ? "" : "・準備中") + '</small></span>' +
        '<input type="checkbox" data-id="' + s.id + '"' + (hid.indexOf(s.id) < 0 ? " checked" : "") + '>';
      rowsEl.appendChild(r);
    });
    ov.classList.add("show");
  };
  ov.addEventListener("click", function (e) { if (e.target === ov) ov.classList.remove("show"); });
  document.getElementById("saveBtn").onclick = function () {
    var hid = [];
    var cbs = rowsEl.querySelectorAll("input[type=checkbox]");
    for (var i = 0; i < cbs.length; i++) {
      if (!cbs[i].checked) hid.push(cbs[i].getAttribute("data-id"));
    }
    setHidden(hid);
    ov.classList.remove("show");
    setEditing(false);
    render();
  };

  render();
})();
</script>
</body>
</html>
