<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>initiate Co., Ltd</title>
<meta name="description" content="initiate株式会社 総合ページ">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="icon" href="./icons/icon-192.png">
<style>
  :root{
    --bg:#0f1115; --card:#171c26; --line:#2a303c;
    --fg:#ffffff; --sub:#b9c0cc; --accent:#e8b35a; --accent2:#7fd1a0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    -webkit-font-smoothing:antialiased}
  body{min-height:100svh;display:flex;flex-direction:column}
  .wrap{width:100%;max-width:760px;margin:0 auto;padding:0 16px;flex:1 0 auto;
    display:flex;flex-direction:column}
  /* ヒーロー（イニシエートロゴを白プレートに） */
  .hero{padding:56px 0 34px;text-align:center}
  .logoplate{background:#fff;border-radius:22px;padding:30px 26px 24px;max-width:420px;
    margin:0 auto;box-shadow:0 20px 56px rgba(0,0,0,.45)}
  .logoplate svg{width:100%;height:auto;display:block}
  .rule{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);
    margin:8px 0 30px}
  /* プレースホルダ：中身は後で差し込む */
  .ph{background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:30px 22px;text-align:center}
  .ph .badge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.14em;
    color:var(--accent);border:1px solid rgba(232,179,90,.4);background:rgba(232,179,90,.08);
    border-radius:999px;padding:5px 14px;margin-bottom:14px}
  .ph h2{margin:0 0 8px;font-size:18px;font-weight:800}
  .ph p{margin:0;color:var(--sub);font-size:14px;line-height:1.8}
  /* 店舗カードの受け皿（中身が来たら .grid に追加していく） */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;
    margin-top:26px}
  .grid:empty{display:none}
  footer{flex-shrink:0;text-align:center;color:var(--sub);font-size:12px;
    padding:30px 16px 34px;letter-spacing:.04em}
  @media (max-width:420px){ .hero{padding:48px 0 28px} .hero .logo{width:112px;height:112px} }
</style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <div class="logoplate">
        <svg viewBox="0 0 460 170" role="img" aria-label="株式会社イニシエート initiate Co., Ltd."
             font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans','Noto Sans JP',sans-serif">
          <text x="230" y="34" text-anchor="middle" font-size="17" letter-spacing="7" fill="#58595b" font-weight="600">株式会社</text>
          <text x="196" y="104" text-anchor="end" font-size="62" font-weight="800" fill="#231f20" letter-spacing="2">イニシ</text>
          <text x="266" y="104" text-anchor="start" font-size="62" font-weight="800" fill="#231f20" letter-spacing="2">エート</text>
          <g fill="#a6ce39">
            <circle cx="231" cy="55" r="3.3"/>
            <circle cx="231" cy="74" r="8.5"/>
            <circle cx="231" cy="92" r="12.5"/>
            <rect x="224.5" y="72" width="13" height="22" rx="6.5"/>
          </g>
          <text x="230" y="146" text-anchor="middle" font-size="18" letter-spacing="3" fill="#7a7c7e" font-weight="500">initiate  Co., Ltd.</text>
          <rect x="150" y="158" width="160" height="2.4" rx="1.2" fill="#c3dd63"/>
        </svg>
      </div>
    </header>
    <div class="rule"></div>

    <!-- ▼▼ ここに総合ページの中身を差し込む（店舗一覧・会社情報など。オーナーから共有後に実装）▼▼ -->
    <section class="ph" id="content">
      <span class="badge">準備中</span>
      <h2>総合ページ 準備中</h2>
      <p>内容は追って掲載します。<br>（店舗一覧・会社情報などをここに差し込みます）</p>
    </section>
    <div class="grid" id="stores"><!-- 店舗カードはここへ --></div>
    <!-- ▲▲ 差し込みここまで ▲▲ -->
  </div>

  <footer>© initiate Co., Ltd</footer>
</body>
</html>
