<script>
'use strict';
/* =======================================================================

   本番Instagram発火（予約/今すぐ/OK予約）は全てモック(no-op)。
   ======================================================================= */

/* ---------- 店舗マスター（イニシエート portfolio） ---------- */
const STORE_MASTER = [
  { id:'sanjo',        name:'すさび湯三条',        handle:'susabiyu_sanjyo',            area:'京都・河原町三条', dept:'initiate', connected:true  },

  { id:'kumatori',     name:'熊の鳥焼',            handle:'', area:'大阪',       dept:'initiate', connected:false },
  { id:'lucua',        name:'ルクアLargo',         handle:'', area:'梅田',       dept:'initiate', connected:false },
  { id:'tanukiya',     name:'味のたぬきや',        handle:'', area:'大阪',       dept:'initiate', connected:false },
  { id:'gold',         name:'GOLD梅田',            handle:'', area:'梅田',       dept:'initiate', connected:false },
  { id:'sannomiya',    name:'すさび湯 三宮',       handle:'', area:'神戸・三宮', dept:'initiate', connected:false },
  { id:'kadoma',       name:'門真Largo',           handle:'', area:'大阪・門真', dept:'initiate', connected:false },
  { id:'temmabashi',   name:'すさび湯 天満橋',     handle:'', area:'大阪・天満橋', dept:'initiate', connected:false },
  { id:'goldohatsu',   name:'GOLDお初天神',        handle:'', area:'梅田・お初天神', dept:'initiate', connected:false },
  { id:'gifuya',       name:'ぎふや 天満橋',       handle:'', area:'大阪・天満橋', dept:'initiate', connected:false },
  { id:'shinjuku',     name:'すさび湯 新宿東口',   handle:'', area:'東京・新宿', dept:'initiate', connected:false },
  { id:'kabukicho',    name:'すさび湯 歌舞伎町',   handle:'', area:'東京・歌舞伎町', dept:'initiate', connected:false },
  { id:'ndanda',       name:'んだんだ',            handle:'', area:'大阪',       dept:'initiate', connected:false },
];
const DEPTS = ['全社','第一','第二','第三','第五','第六','第七','第八','イニシエート','HASSIN','HARE','MITOMO','KOIFUKU','プロペルインターナショナル'];
const ACTIVE_DEPTS = new Set(['全社','イニシエート']); // 本アプリに実在する営業部

/* ---------- 日付ユーティリティ（JST） ---------- */
const JST_OFF = 9*3600*1000;
function nowJST(){ return new Date(Date.now()+JST_OFF); }
function jstDate(ms){ return new Date(ms+JST_OFF); }
function ymd(d){ return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0'); }
const WK=['日','月','火','水','木','金','土'];
const HOLIDAYS = new Set(['2026-01-01','2026-01-12','2026-02-11','2026-02-23','2026-03-20','2026-04-29','2026-05-03','2026-05-04','2026-05-05','2026-05-06','2026-07-20','2026-08-11','2026-09-21','2026-09-22','2026-09-23','2026-10-12','2026-11-03','2026-11-23','2026-11-24','2026-12-24']);
function isHoliday(dStr){ return HOLIDAYS.has(dStr); }
function relPosted(ms){
  const diff=Date.now()-ms,h=diff/3600000,d=diff/86400000;
  if(h<1) return {t:'1時間以内',cls:'bg-emerald-100 text-emerald-800'};
  if(h<=24) return {t:Math.round(h)+'時間前',cls:'bg-emerald-100 text-emerald-800'};
  if(d<=3) return {t:Math.floor(d)+'日前',cls:'bg-amber-100 text-amber-800'};
  if(d<=35) return {t:Math.floor(d)+'日前',cls:'bg-red-100 text-red-700'};
  return {t:'35日なし',cls:'bg-red-100 text-red-700'};
}
function fmtJP(ms){ const d=jstDate(ms); return `${d.getUTCMonth()+1}/${d.getUTCDate()}(${WK[d.getUTCDay()]}) ${String(d.getUTCHours()).padStart(2,'0')}:${String(d.getUTCMinutes()).padStart(2,'0')}`; }

/* ---------- 乱数・サムネ（画像崩れ防止：SVGデータURI） ---------- */
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const PAL=[['#fde68a','#f59e0b'],['#fecaca','#ef4444'],['#bbf7d0','#10b981'],['#c7d2fe','#6366f1'],['#fbcfe8','#db2777'],['#bae6fd','#0ea5e9'],['#ddd6fe','#8b5cf6'],['#fed7aa','#fb923c']];
function svgThumb(seed,label){ const r=mulberry32(hashStr(seed)); const c=PAL[Math.floor(r()*PAL.length)]; const lab=(label||'').slice(0,2);
  const svg=`<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='${c[0]}'/><stop offset='1' stop-color='${c[1]}'/></linearGradient></defs><rect width='120' height='120' fill='url(%23g)'/><text x='60' y='72' font-size='44' font-family='sans-serif' font-weight='700' fill='rgba(255,255,255,.85)' text-anchor='middle'>${lab}</text></svg>`;
  return 'data:image/svg+xml;utf8,'+svg.replace(/#/g,'%23'); }

/* ---------- モックmonitor ---------- */
function buildMock(){
  const stores={}; const nJ=nowJST();
  const todayUTCms=Date.UTC(nJ.getUTCFullYear(),nJ.getUTCMonth(),nJ.getUTCDate());
  STORE_MASTER.forEach(s=>{
    if(!s.connected){ stores[s.id]={at:null,err:'',savedOk:true,connected:false,posts:[],stories:[],stat:{fol:{},mon:{},hist:{},monErr:null}}; return; }
    const r=mulberry32(hashStr(s.id)+7); const dense=r();
    const posts=[],stories=[];
    for(let back=28;back>=0;back--){
      const dayMs=todayUTCms-back*86400000-JST_OFF+(10+Math.floor(r()*10))*3600000;
      let feedN=0; const p=r();
      if(dense>0.66) feedN=p<0.5?1:(p<0.85?2:0);
      else if(dense>0.33) feedN=p<0.4?1:(p<0.6?2:0);
      else feedN=p<0.22?1:0;
      for(let k=0;k<feedN;k++){ const likes=Math.round(2+r()*(dense>0.66?180:dense>0.33?45:12)); const reach=Math.round(likes*(14+r()*30));
        posts.push({at:new Date(dayMs+k*1800000).toISOString(),id:s.id+'_f'+back+'_'+k,url:'https://www.instagram.com/'+s.handle+'/',type:r()<0.25?'CAROUSEL_ALBUM':(r()<0.2?'VIDEO':'IMAGE'),likes,saved:Math.round(likes*0.05*r()),comments:Math.round(r()*3),reach,views:r()<0.4?Math.round(reach*1.4):0,thumb:svgThumb(s.id+back+k,s.name),caption:'本日のおすすめ。'+s.name+' から🍶 #'+s.id}); }
      let stN=0; const q=r(); if(dense>0.5) stN=q<0.5?2:(q<0.8?1:0); else stN=q<0.35?1:0;
      for(let k=0;k<stN;k++){ const views=Math.round(20+r()*90);
        stories.push({at:new Date(dayMs+3600000+k*1200000).toISOString(),id:s.id+'_s'+back+'_'+k,url:'https://www.instagram.com/stories/'+s.handle+'/'+(17000000000+hashStr(s.id+back+k)%9000000000),type:r()<0.3?'VIDEO':'IMAGE',views,replies:Math.round(r()*2),thumb:svgThumb(s.id+'st'+back+k,s.name)}); }
    }
    posts.sort((a,b)=>new Date(b.at)-new Date(a.at)); stories.sort((a,b)=>new Date(b.at)-new Date(a.at));
    const fol={}; let base=Math.round(200+r()*1600); for(let i=27;i>=0;i--){ const d=jstDate(todayUTCms-i*86400000); base+=Math.round((r()-0.4)*4); fol[ymd(d)]=base; }
    const mon={}; for(let m=5;m>=0;m--){ const dt=new Date(Date.UTC(nJ.getUTCFullYear(),nJ.getUTCMonth()-m,1)); mon[dt.getUTCFullYear()+'-'+String(dt.getUTCMonth()+1).padStart(2,'0')]=Math.round(1500+r()*7000); }
    const thisMon=nJ.getUTCFullYear()+'-'+String(nJ.getUTCMonth()+1).padStart(2,'0');
    const mf=posts.filter(p=>p.at.slice(0,7)===thisMon), ms2=stories.filter(p=>p.at.slice(0,7)===thisMon);
    const hist={}; hist[thisMon]={n:mf.length,sn:ms2.length,likes:mf.reduce((a,p)=>a+p.likes,0),reach:mf.reduce((a,p)=>a+p.reach,0),saved:mf.reduce((a,p)=>a+p.saved,0),views:mf.reduce((a,p)=>a+(p.views||0),0),sviews:ms2.reduce((a,p)=>a+p.views,0),comments:mf.reduce((a,p)=>a+p.comments,0)};
    stores[s.id]={at:new Date().toISOString(),err:'',savedOk:true,connected:true,posts,stories,stat:{fol,mon,hist,monErr:null}};
  });
  const bench=[{k:'lo',stores:0,likes:1.8,reach:368,fol:9.5},{k:'mid',stores:0,likes:41.5,reach:2533,fol:13.7},{k:'hi',stores:0,likes:124.3,reach:5646,fol:20.8}];
  return {stores,bench,_mock:true};
}

/* ---------- 提案（②）モック ---------- */
const THEMES_POST=['忘年会コースのご案内','予約限定ランチ','個室で少人数の宴会','お庭のもみじと夜の店','仕事帰りにカウンターで一杯','季節の旬・本日の一皿','名物をもう一度'];
const THEMES_STORY=['忘年会予約の後押し','本日の仕入れ','今夜の空席のご案内'];
function buildPlans(){
  const plans={}; const nJ=nowJST(); const base=Date.UTC(nJ.getUTCFullYear(),nJ.getUTCMonth(),nJ.getUTCDate());
  const WHY=[s=>`10月客数4975と前年9231の約半分。まず来店理由を作る`,s=>`Google★2.9・口コミ1369件。評価の底上げが必要`,s=>`過去最多反応はランチ告知（♥278・♥231）`,s=>`12月宴会の山へ先に仕込む。ネット予約7組で前年並み止まり`,s=>`媒体経由の客数が先月比-12%。回遊を作る`];
  STORE_MASTER.filter(s=>s.connected).forEach((s,idx)=>{
    const r=mulberry32(hashStr(s.id)+555);
    if(r()<0.35){ return; } // 提案が無い店
    const count=[4,6,6,8][Math.floor(r()*4)]; const days=[7,14][Math.floor(r()*2)];
    const items=[];
    for(let i=0;i<count;i++){
      const isStory = i===count-1; // 最後の1本をストーリーに
      const dayOff=1+Math.floor(r()*days); const hour=11+Math.floor(r()*8); // 11-18
      const at=new Date(base+dayOff*86400000 + hour*3600000 + (r()<0.5?0:1800000)*1 - JST_OFF);
      const theme = isStory? THEMES_STORY[Math.floor(r()*THEMES_STORY.length)] : THEMES_POST[Math.floor(r()*THEMES_POST.length)];
      const tag='#'+s.id+' #グルメ #今夜ごはん #乾杯 #おすすめ';
      const cap = isStory
        ? `【重ねる文字】${theme}\n【一言】ご予約はプロフィールから📩`
        : `こんにちは😊${s.name}です‼️\n${theme}をご用意しました。\n${s.area}でお待ちしています🍶\nご予約はプロフィール欄のネットからどうぞ🙇🏻‍♂️\n\n${tag}`;
      // 一部は既にOK/予約済にして①の数字を動かす
      let mark='', booked=false;
      const pr=r(); if(pr<0.18){ mark='ok'; booked=true; } else if(pr<0.30){ mark='ok'; } else if(pr<0.40){ mark='ng'; }
      items.push({ id:'pi_'+s.id+'_'+i, at:at.toISOString(), kind:isStory?'story':'post', theme,
        why: WHY[Math.floor(r()*WHY.length)](s), caption:cap,
        photoName: r()<0.6?('DSC_'+(3000+Math.floor(r()*900))+'.jpg'):'ホットペッパー',
        thumb: r()<0.85? svgThumb(s.id+'plan'+i,s.name): '', mark, booked });
    }
    plans[s.id]={ store:s, at:new Date(base - Math.floor(r()*5)*86400000 + 14*3600000).toISOString(),
      by:(r()<0.5?'天見　真悟（まとめて）':'天見　真悟'), yen:14+Math.floor(r()*8), days, count, photos:8+Math.floor(r()*30), hint:'', items };
  });
  return plans;
}

/* ---------- 集計 ---------- */
function windowDays(n){ const nJ=nowJST(); const base=Date.UTC(nJ.getUTCFullYear(),nJ.getUTCMonth(),nJ.getUTCDate()); const a=[]; for(let i=n-1;i>=0;i--){ const ms=base-i*86400000; a.push({ms,str:ymd(jstDate(ms)),dow:jstDate(ms).getUTCDay()}); } return a; }
function planStats(id){ const pl=PLANS[id]; if(!pl) return {open:0,ok:0,booked:0,ng:0,has:false};
  let open=0,ok=0,booked=0,ng=0; pl.items.forEach(it=>{ if(it.booked){booked++;} else if(it.mark==='ok'){ok++;} else if(it.mark==='ng'){ng++;} else {open++;} }); return {open,ok,booked,ng,has:true}; }
function computeStore(s){
  const raw=MON.stores[s.id]||{connected:false,posts:[],stories:[],stat:{},err:''};
  const connected=raw.connected!==false&&s.connected;
  const posts=raw.posts||[],stories=raw.stories||[],err=raw.err||'';
  const win=windowDays(14); const since14=win[0].ms;
  const feed14=posts.filter(p=>new Date(p.at).getTime()>=since14);
  const st14=stories.filter(p=>new Date(p.at).getTime()>=since14);
  const avg=(arr,f)=>arr.length?arr.reduce((a,p)=>a+f(p),0)/arr.length:null;
  const hLikes=avg(feed14,p=>p.likes),hSaved=avg(feed14,p=>p.saved),hCom=avg(feed14,p=>p.comments);
  const lastMs=Math.max(posts.length?new Date(posts[0].at).getTime():0, stories.length?new Date(stories[0].at).getTime():0);
  let bucket='none';
  if(!connected) bucket='unlinked';
  else if(err) bucket='err';
  else { const h=(Date.now()-lastMs)/3600000,d=h/24; if(!lastMs) bucket='d35'; else if(h<=24) bucket='h24'; else if(d<=3) bucket='d3'; else if(d<=35) bucket='d4'; else bucket='d35'; }
  const dayMap={}; win.forEach(w=>dayMap[w.str]={feed:[],story:[]});
  posts.forEach(p=>{ const k=ymd(jstDate(new Date(p.at).getTime())); if(dayMap[k]) dayMap[k].feed.push(p); });
  stories.forEach(p=>{ const k=ymd(jstDate(new Date(p.at).getTime())); if(dayMap[k]) dayMap[k].story.push(p); });
  const ps=planStats(s.id);
  return { store:s, connected, err, posts, stories, feed14, st14, win, dayMap, lastMs, bucket, hLikes, hSaved, hCom,
    reserveN: connected? ps.booked:0, planN: connected? ps.open:0, planOK: connected? ps.ok:0 };
}
function computeAll(){ return STORE_MASTER.filter(inDept).map(computeStore); }
function inDept(s){ if(UI.dept==='全社') return true; return s.dept==='initiate' && UI.dept==='イニシエート'; }

    for(let i=0;i<count;i++){ const isStory=i===count-1; const at=new Date(base+(1+Math.floor(r()*days))*86400000+(11+Math.floor(r()*8))*3600000);
      const theme=isStory?THEMES_STORY[Math.floor(r()*THEMES_STORY.length)]:THEMES_POST[Math.floor(r()*THEMES_POST.length)];
      items.push({id:'pi_'+id+'_n'+i,at:at.toISOString(),kind:isStory?'story':'post',theme,why:'過去の反応と今の予約状況から、来店理由を作る',caption:`こんにちは😊${s.name}です‼️\n${theme}。\nご予約はプロフィールから🙇🏻‍♂️\n#${id} #グルメ #おすすめ #今夜ごはん #乾杯`,photoName:'DSC_'+(3000+Math.floor(r()*900))+'.jpg',thumb:svgThumb(id+'new'+i+Date.now(),s.name),mark:'',booked:false}); }
    PLANS[id]={store:s,at:new Date().toISOString(),by:'天見　真悟',yen:17,days,count,photos:24,hint:PLAN_UI.hint,items}; renderPlan(); }, 1200); };
