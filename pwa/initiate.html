<script>
'use strict';
/* =======================================================================

   本番Instagram発火（予約/今すぐ/OK予約）は全てモック(no-op)。
   ======================================================================= */

/* ---------- 店舗マスター（イニシエート portfolio） ---------- */
const STORE_MASTER = [
  { id:'sanjo',        name:'すさび湯三条',        handle:'susabiyu_sanjyo',            area:'京都・河原町三条', dept:'initiate', connected:true  },

  { id:'kumatori',     name:'熊の鳥焼',            handle:'', area:'大阪',       dept:'initiate', connected:false },
  { id:'lucua',        name:'ルクアLargo',         handle:'', area:'梅田',       dept:'initiate', connected:false },
  { id:'tanukiya',     name:'味のたぬきや',        handle:'', area:'大阪',       dept:'initiate', connected:false },
  { id:'gold',         name:'GOLD梅田',            handle:'', area:'梅田',       dept:'initiate', connected:false },
  { id:'sannomiya',    name:'すさび湯 三宮',       handle:'', area:'神戸・三宮', dept:'initiate', connected:false },
  { id:'kadoma',       name:'門真Largo',           handle:'', area:'大阪・門真', dept:'initiate', connected:false },
  { id:'temmabashi',   name:'すさび湯 天満橋',     handle:'', area:'大阪・天満橋', dept:'initiate', connected:false },
  { id:'goldohatsu',   name:'GOLDお初天神',        handle:'', area:'梅田・お初天神', dept:'initiate', connected:false },
  { id:'gifuya',       name:'ぎふや 天満橋',       handle:'', area:'大阪・天満橋', dept:'initiate', connected:false },
  { id:'shinjuku',     name:'すさび湯 新宿東口',   handle:'', area:'東京・新宿', dept:'initiate', connected:false },
  { id:'kabukicho',    name:'すさび湯 歌舞伎町',   handle:'', area:'東京・歌舞伎町', dept:'initiate', connected:false },
  { id:'ndanda',       name:'んだんだ',            handle:'', area:'大阪',       dept:'initiate', connected:false },
];
const DEPTS = ['全社','第一','第二','第三','第五','第六','第七','第八','イニシエート','HASSIN','HARE','MITOMO','KOIFUKU','プロペルインターナショナル'];
const ACTIVE_DEPTS = new Set(['全社','イニシエート']); // 本アプリに実在する営業部

/* ---------- 日付ユーティリティ（JST） ---------- */
const JST_OFF = 9*3600*1000;
function nowJST(){ return new Date(Date.now()+JST_OFF); }
function jstDate(ms){ return new Date(ms+JST_OFF); }
function ymd(d){ return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0'); }
const WK=['日','月','火','水','木','金','土'];
const HOLIDAYS = new Set(['2026-01-01','2026-01-12','2026-02-11','2026-02-23','2026-03-20','2026-04-29','2026-05-03','2026-05-04','2026-05-05','2026-05-06','2026-07-20','2026-08-11','2026-09-21','2026-09-22','2026-09-23','2026-10-12','2026-11-03','2026-11-23','2026-11-24','2026-12-24']);
function isHoliday(dStr){ return HOLIDAYS.has(dStr); }
function relPosted(ms){
  const diff=Date.now()-ms,h=diff/3600000,d=diff/86400000;
  if(h<1) return {t:'1時間以内',cls:'bg-emerald-100 text-emerald-800'};
  if(h<=24) return {t:Math.round(h)+'時間前',cls:'bg-emerald-100 text-emerald-800'};
  if(d<=3) return {t:Math.floor(d)+'日前',cls:'bg-amber-100 text-amber-800'};
  if(d<=35) return {t:Math.floor(d)+'日前',cls:'bg-red-100 text-red-700'};
  return {t:'35日なし',cls:'bg-red-100 text-red-700'};
}
function fmtJP(ms){ const d=jstDate(ms); return `${d.getUTCMonth()+1}/${d.getUTCDate()}(${WK[d.getUTCDay()]}) ${String(d.getUTCHours()).padStart(2,'0')}:${String(d.getUTCMinutes()).padStart(2,'0')}`; }

/* ---------- 乱数・サムネ（画像崩れ防止：SVGデータURI） ---------- */
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const PAL=[['#fde68a','#f59e0b'],['#fecaca','#ef4444'],['#bbf7d0','#10b981'],['#c7d2fe','#6366f1'],['#fbcfe8','#db2777'],['#bae6fd','#0ea5e9'],['#ddd6fe','#8b5cf6'],['#fed7aa','#fb923c']];
function svgThumb(seed,label){ const r=mulberry32(hashStr(seed)); const c=PAL[Math.floor(r()*PAL.length)]; const lab=(label||'').slice(0,2);
  const svg=`<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='${c[0]}'/><stop offset='1' stop-color='${c[1]}'/></linearGradient></defs><rect width='120' height='120' fill='url(%23g)'/><text x='60' y='72' font-size='44' font-family='sans-serif' font-weight='700' fill='rgba(255,255,255,.85)' text-anchor='middle'>${lab}</text></svg>`;
  return 'data:image/svg+xml;utf8,'+svg.replace(/#/g,'%23'); }

/* ---------- モックmonitor ---------- */
function buildMock(){
  const stores={}; const nJ=nowJST();
  const todayUTCms=Date.UTC(nJ.getUTCFullYear(),nJ.getUTCMonth(),nJ.getUTCDate());
  STORE_MASTER.forEach(s=>{
    if(!s.connected){ stores[s.id]={at:null,err:'',savedOk:true,connected:false,posts:[],stories:[],stat:{fol:{},mon:{},hist:{},monErr:null}}; return; }
    const r=mulberry32(hashStr(s.id)+7); const dense=r();
    const posts=[],stories=[];
    for(let back=28;back>=0;back--){
      const dayMs=todayUTCms-back*86400000-JST_OFF+(10+Math.floor(r()*10))*3600000;
      let feedN=0; const p=r();
      if(dense>0.66) feedN=p<0.5?1:(p<0.85?2:0);
      else if(dense>0.33) feedN=p<0.4?1:(p<0.6?2:0);
      else feedN=p<0.22?1:0;
      for(let k=0;k<feedN;k++){ const likes=Math.round(2+r()*(dense>0.66?180:dense>0.33?45:12)); const reach=Math.round(likes*(14+r()*30));
        posts.push({at:new Date(dayMs+k*1800000).toISOString(),id:s.id+'_f'+back+'_'+k,url:'https://www.instagram.com/'+s.handle+'/',type:r()<0.25?'CAROUSEL_ALBUM':(r()<0.2?'VIDEO':'IMAGE'),likes,saved:Math.round(likes*0.05*r()),comments:Math.round(r()*3),reach,views:r()<0.4?Math.round(reach*1.4):0,thumb:svgThumb(s.id+back+k,s.name),caption:'本日のおすすめ。'+s.name+' から🍶 #'+s.id}); }
      let stN=0; const q=r(); if(dense>0.5) stN=q<0.5?2:(q<0.8?1:0); else stN=q<0.35?1:0;
      for(let k=0;k<stN;k++){ const views=Math.round(20+r()*90);
        stories.push({at:new Date(dayMs+3600000+k*1200000).toISOString(),id:s.id+'_s'+back+'_'+k,url:'https://www.instagram.com/stories/'+s.handle+'/'+(17000000000+hashStr(s.id+back+k)%9000000000),type:r()<0.3?'VIDEO':'IMAGE',views,replies:Math.round(r()*2),thumb:svgThumb(s.id+'st'+back+k,s.name)}); }
    }
    posts.sort((a,b)=>new Date(b.at)-new Date(a.at)); stories.sort((a,b)=>new Date(b.at)-new Date(a.at));
    const fol={}; let base=Math.round(200+r()*1600); for(let i=27;i>=0;i--){ const d=jstDate(todayUTCms-i*86400000); base+=Math.round((r()-0.4)*4); fol[ymd(d)]=base; }
    const mon={}; for(let m=5;m>=0;m--){ const dt=new Date(Date.UTC(nJ.getUTCFullYear(),nJ.getUTCMonth()-m,1)); mon[dt.getUTCFullYear()+'-'+String(dt.getUTCMonth()+1).padStart(2,'0')]=Math.round(1500+r()*7000); }
    const thisMon=nJ.getUTCFullYear()+'-'+String(nJ.getUTCMonth()+1).padStart(2,'0');
    const mf=posts.filter(p=>p.at.slice(0,7)===thisMon), ms2=stories.filter(p=>p.at.slice(0,7)===thisMon);
    const hist={}; hist[thisMon]={n:mf.length,sn:ms2.length,likes:mf.reduce((a,p)=>a+p.likes,0),reach:mf.reduce((a,p)=>a+p.reach,0),saved:mf.reduce((a,p)=>a+p.saved,0),views:mf.reduce((a,p)=>a+(p.views||0),0),sviews:ms2.reduce((a,p)=>a+p.views,0),comments:mf.reduce((a,p)=>a+p.comments,0)};
    stores[s.id]={at:new Date().toISOString(),err:'',savedOk:true,connected:true,posts,stories,stat:{fol,mon,hist,monErr:null}};
  });
  const bench=[{k:'lo',stores:0,likes:1.8,reach:368,fol:9.5},{k:'mid',stores:0,likes:41.5,reach:2533,fol:13.7},{k:'hi',stores:0,likes:124.3,reach:5646,fol:20.8}];
  return {stores,bench,_mock:true};
}

/* ---------- 提案（②）モック ---------- */
const THEMES_POST=['忘年会コースのご案内','予約限定ランチ','個室で少人数の宴会','お庭のもみじと夜の店','仕事帰りにカウンターで一杯','季節の旬・本日の一皿','名物をもう一度'];
const THEMES_STORY=['忘年会予約の後押し','本日の仕入れ','今夜の空席のご案内'];
function buildPlans(){
  const plans={}; const nJ=nowJST(); const base=Date.UTC(nJ.getUTCFullYear(),nJ.getUTCMonth(),nJ.getUTCDate());
  const WHY=[s=>`10月客数4975と前年9231の約半分。まず来店理由を作る`,s=>`Google★2.9・口コミ1369件。評価の底上げが必要`,s=>`過去最多反応はランチ告知（♥278・♥231）`,s=>`12月宴会の山へ先に仕込む。ネット予約7組で前年並み止まり`,s=>`媒体経由の客数が先月比-12%。回遊を作る`];
  STORE_MASTER.filter(s=>s.connected).forEach((s,idx)=>{
    const r=mulberry32(hashStr(s.id)+555);
    if(r()<0.35){ return; } // 提案が無い店
    const count=[4,6,6,8][Math.floor(r()*4)]; const days=[7,14][Math.floor(r()*2)];
    const items=[];
    for(let i=0;i<count;i++){
      const isStory = i===count-1; // 最後の1本をストーリーに
      const dayOff=1+Math.floor(r()*days); const hour=11+Math.floor(r()*8); // 11-18
      const at=new Date(base+dayOff*86400000 + hour*3600000 + (r()<0.5?0:1800000)*1 - JST_OFF);
      const theme = isStory? THEMES_STORY[Math.floor(r()*THEMES_STORY.length)] : THEMES_POST[Math.floor(r()*THEMES_POST.length)];
      const tag='#'+s.id+' #グルメ #今夜ごはん #乾杯 #おすすめ';
      const cap = isStory
        ? `【重ねる文字】${theme}\n【一言】ご予約はプロフィールから📩`
        : `こんにちは😊${s.name}です‼️\n${theme}をご用意しました。\n${s.area}でお待ちしています🍶\nご予約はプロフィール欄のネットからどうぞ🙇🏻‍♂️\n\n${tag}`;
      // 一部は既にOK/予約済にして①の数字を動かす
      let mark='', booked=false;
      const pr=r(); if(pr<0.18){ mark='ok'; booked=true; } else if(pr<0.30){ mark='ok'; } else if(pr<0.40){ mark='ng'; }
      items.push({ id:'pi_'+s.id+'_'+i, at:at.toISOString(), kind:isStory?'story':'post', theme,
        why: WHY[Math.floor(r()*WHY.length)](s), caption:cap,
        photoName: r()<0.6?('DSC_'+(3000+Math.floor(r()*900))+'.jpg'):'ホットペッパー',
        thumb: r()<0.85? svgThumb(s.id+'plan'+i,s.name): '', mark, booked });
    }
    plans[s.id]={ store:s, at:new Date(base - Math.floor(r()*5)*86400000 + 14*3600000).toISOString(),
      by:(r()<0.5?'天見　真悟（まとめて）':'天見　真悟'), yen:14+Math.floor(r()*8), days, count, photos:8+Math.floor(r()*30), hint:'', items };
  });
  return plans;
}

function buildPlansFromMON(){

    const st=MON.stores[sid]; const props=(st&&st.proposals)||[]; if(!props.length) return;
    const s=STORE_MASTER.find(x=>x.id===sid); if(!s) return;
    plans[sid]={ store:s, at:(st.at||new Date().toISOString()), by:'自動下書き（文例）', yen:0, days:7, count:props.length, photos:0, hint:'',
      items: props.map((p,i)=>({ id:p.id||('prop_'+sid+'_'+i), at:p.at, kind:p.kind||'post', theme:p.theme||'提案', why:p.why||'', caption:p.caption||'', photoName:'', thumb:p.thumb||'', mark:'', booked:false })) };
  });
  return plans;
}

/* 検索の正規化：NFKC→小文字→カタカナをひらがなに（GOLD/gold・スサビ/すさび・半角カナを吸収） */
function norm(s){ s=(s||'').normalize('NFKC').toLowerCase(); return s.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60)); }
function andMatch(hay,q){ const n=norm(hay); return norm(q).split(/\s+/).filter(Boolean).every(t=>n.includes(t)); }

function windowDays(n){ const nJ=nowJST(); const base=Date.UTC(nJ.getUTCFullYear(),nJ.getUTCMonth(),nJ.getUTCDate()); const a=[]; for(let i=n-1;i>=0;i--){ const ms=base-i*86400000; a.push({ms,str:ymd(jstDate(ms)),dow:jstDate(ms).getUTCDay()}); } return a; }
function planStats(id){ const pl=PLANS[id]; if(!pl) return {open:0,ok:0,booked:0,ng:0,has:false};
  let open=0,ok=0,booked=0,ng=0; pl.items.forEach(it=>{ if(it.booked){booked++;} else if(it.mark==='ok'){ok++;} else if(it.mark==='ng'){ng++;} else {open++;} }); return {open,ok,booked,ng,has:true}; }
function computeStore(s){
  const raw=MON.stores[s.id]||{connected:false,posts:[],stories:[],stat:{},err:''};
  const connected=raw.connected!==false&&s.connected;
  const posts=raw.posts||[],stories=raw.stories||[],err=raw.err||'';
  const win=windowDays(14); const since14=win[0].ms;
  const feed14=posts.filter(p=>new Date(p.at).getTime()>=since14);
  const st14=stories.filter(p=>new Date(p.at).getTime()>=since14);
  const avg=(arr,f)=>arr.length?arr.reduce((a,p)=>a+f(p),0)/arr.length:null;
  const hLikes=avg(feed14,p=>p.likes),hSaved=avg(feed14,p=>p.saved),hCom=avg(feed14,p=>p.comments);
  const lastMs=Math.max(posts.length?new Date(posts[0].at).getTime():0, stories.length?new Date(stories[0].at).getTime():0);
  let bucket='none';
  if(!connected) bucket='unlinked';
  else if(err) bucket='err';
  else { const h=(Date.now()-lastMs)/3600000,d=h/24; if(!lastMs) bucket='d35'; else if(h<=24) bucket='h24'; else if(d<=3) bucket='d3'; else if(d<=35) bucket='d4'; else bucket='d35'; }
  const dayMap={}; win.forEach(w=>dayMap[w.str]={feed:[],story:[]});
  posts.forEach(p=>{ const k=ymd(jstDate(new Date(p.at).getTime())); if(dayMap[k]) dayMap[k].feed.push(p); });
  stories.forEach(p=>{ const k=ymd(jstDate(new Date(p.at).getTime())); if(dayMap[k]) dayMap[k].story.push(p); });
  const ps=planStats(s.id);
  return { store:s, connected, err, posts, stories, feed14, st14, win, dayMap, lastMs, bucket, hLikes, hSaved, hCom,
    reserveN: connected? reservedFuture(s.id):0, planN: connected? ps.open:0, planOK: connected? ps.ok:0 };
}
function computeAll(){ return STORE_MASTER.filter(inDept).map(computeStore); }

function buildReservations(){

  if(MON && !MON._mock){
    const res=[];
    Object.keys(MON.stores||{}).forEach(sid=>{
      const st=MON.stores[sid]; const ops=(st&&st.ops)||[]; const s=STORE_MASTER.find(x=>x.id===sid); if(!s) return;
      ops.forEach((o,i)=>{ const img=(o.thumb && /\.(jpg|jpeg|png|webp)(\?|$)/i.test(o.thumb))? o.thumb : svgThumb(sid+(o.id||i), s.name);
        res.push({ id:'res_'+sid+'_'+(o.id||i), storeId:sid, at:o.at, kind:o.kind||'story', caption:o.caption||'', by:'自動投稿', state:o.state, reason:o.state==='failed'?'投稿に失敗（ログ要確認）':'', thumb:img, url:'https://www.instagram.com/'+s.handle+'/' }); });
    });
    return res;
  }
  const res=[];
  Object.values(PLANS||{}).forEach(pl=>{ pl.items.forEach(it=>{ if(it.booked){ const t=new Date(it.at).getTime();
    res.push({ id:'res_'+it.id, storeId:pl.store.id, at:it.at, kind:it.kind, caption:it.caption, by:pl.by.replace('（まとめて）',''), state: t>Date.now()?'reserved':'posted', reason:'', thumb: it.thumb||svgThumb(it.id,pl.store.name), url:'https://www.instagram.com/'+pl.store.handle+'/' }); } }); });
  STORE_MASTER.filter(s=>s.connected).forEach(s=>{ (MON.stores[s.id].posts||[]).slice(0,2).forEach((p,i)=>{ res.push({ id:'res_p_'+s.id+i, storeId:s.id, at:p.at, kind:'post', caption:p.caption, by:'自動投稿', state:'posted', reason:'', thumb:p.thumb, url:p.url }); }); });
  const fs=STORE_MASTER.filter(s=>s.connected);
  if(fs[1]) res.push({ id:'res_fail1', storeId:fs[1].id, at:new Date(Date.now()-6*3600000).toISOString(), kind:'post', caption:'週末のおすすめコース、金土で満席予想です。', by:'天見　真悟', state:'failed', reason:'画像の縦横比がInstagramの条件外', thumb:svgThumb('fail1',fs[1].name), url:'' });
  return res;
}

  root.innerHTML=`<div class="fixed inset-0 z-50 bg-black/40 grid place-items-start sm:place-items-center p-0 sm:p-3 overflow-auto" id="composeBg"><div class="bg-white w-full max-w-[860px] sm:rounded-2xl shadow-2xl min-h-full sm:min-h-0 sm:max-h-[92vh] overflow-auto">
    <div class="flex items-center justify-between px-4 py-3 border-b border-slate-100 sticky top-0 bg-white z-10"><h3 class="font-bold">Instagram に投稿 <span class="text-[11px] font-semibold text-amber-600">（テスト：本番には出ません）</span></h3><button onclick="closeCompose()" class="w-8 h-8 grid place-items-center rounded-lg hover:bg-slate-100">✕</button></div>

      <div class="p-4 space-y-4 border-r border-slate-100">

        <div><div class="text-[12px] font-bold text-slate-500 mb-1">2. 画像</div>
          <div class="flex gap-1.5 text-[12px]"><button class="ratio px-2 py-1 rounded-lg bg-[var(--btn)] text-white" data-r="45">縦4:5</button><button class="ratio px-2 py-1 rounded-lg bg-slate-100" data-r="11">正方形</button><button class="ratio px-2 py-1 rounded-lg bg-slate-100" data-r="st">ストーリー</button></div>
          <div class="mt-2 flex flex-wrap gap-1.5 text-[12px]">
            <label class="cursor-pointer px-2 py-1 rounded-lg bg-slate-100 hover:bg-slate-200">📁端末から<input id="cFile" type="file" accept="image/*" multiple hidden></label>
            <button type="button" id="cFromStore" class="px-2 py-1 rounded-lg bg-slate-100 hover:bg-slate-200">📷店の写真・媒体</button>
            <button type="button" id="cDesign" class="px-2 py-1 rounded-lg bg-slate-100 hover:bg-slate-200">🎨販促画像で作る</button>
            <span id="cImgNote" class="text-[11px] text-emerald-600 self-center"></span>
          </div>
          <div id="cOverlay" hidden class="mt-2"><input placeholder="写真に重ねる見出し（14字）" class="w-full border border-slate-300 rounded-lg px-2 py-1 text-sm mb-1"><input placeholder="一言（24字）" class="w-full border border-slate-300 rounded-lg px-2 py-1 text-sm"></div>
        </div>
        <div><div class="text-[12px] font-bold text-slate-500 mb-1">3. 文</div>
          <div class="flex gap-1.5"><input id="cTell" placeholder="伝えたいこと（例：11月の限定メニュー）" class="flex-1 border border-slate-300 rounded-lg px-2 py-1.5 text-sm"><button id="cAI" class="text-[12px] font-bold text-white bg-[var(--btn)] rounded-lg px-2.5">✨AIで3通り</button></div>
          <div id="cAIout" class="mt-2 space-y-1.5"></div>
          <textarea id="cBody" rows="4" class="mt-2 w-full border border-slate-300 rounded-lg px-2 py-2 text-sm" placeholder="本文"></textarea>
          <div class="text-[11px] text-slate-400 tnum text-right"># <span id="cTag">0</span>/5 ・ <span id="cLen">0</span>/2200</div>
        </div>
        <div><div class="text-[12px] font-bold text-slate-500 mb-1">4. いつ</div>
          <div class="flex items-center gap-2 text-[12px]"><button id="cWhenR" class="px-2 py-1 rounded-lg bg-[var(--btn)] text-white">🕒予約</button><button id="cWhenN" class="px-2 py-1 rounded-lg bg-slate-100">⚡今すぐ</button><input id="cDate" type="datetime-local" step="900" class="border border-slate-300 rounded-lg px-2 py-1 text-sm"></div>
        </div>
      </div>
      <div class="p-4 bg-slate-50">
        <div class="text-[12px] font-bold text-slate-400 mb-2">プレビュー</div>
        <div class="mx-auto max-w-[280px] bg-white rounded-xl ring-1 ring-slate-200 overflow-hidden">
          <div class="flex items-center gap-2 px-2.5 py-2"><span class="w-7 h-7 rounded-full ig-grad"></span><span id="pName" class="text-[12px] font-semibold"></span></div>
          <div id="pImg" class="w-full aspect-[4/5] bg-slate-100 grid place-items-center text-slate-300 text-sm">画像</div>
          <div class="px-2.5 py-2 text-[18px]">♡ 💬 ➤</div><div id="pBody" class="px-2.5 pb-3 text-[12px] text-slate-700 whitespace-pre-wrap"></div>

  </div></div>`;
  const nd=new Date(nowJST().getTime()); nd.setUTCDate(nd.getUTCDate()+1); nd.setUTCHours(18,0,0,0); const pad=n=>String(n).padStart(2,'0');
  document.getElementById('cDate').value=`${nd.getUTCFullYear()}-${pad(nd.getUTCMonth()+1)}-${pad(nd.getUTCDate())}T18:00`;
  const upd=()=>{ const sid=document.getElementById('cStore').value; const s=STORE_MASTER.find(x=>x.id===sid); document.getElementById('pName').textContent=s?s.handle:''; const body=document.getElementById('cBody').value; document.getElementById('pBody').textContent=body; document.getElementById('cLen').textContent=body.length; document.getElementById('cTag').textContent=(body.match(/#/g)||[]).length; };
  document.getElementById('cStore').addEventListener('change',upd); document.getElementById('cBody').addEventListener('input',upd);
  document.querySelectorAll('.ratio').forEach(b=>b.onclick=()=>{ document.querySelectorAll('.ratio').forEach(x=>x.className='ratio px-2 py-1 rounded-lg bg-slate-100'); b.className='ratio px-2 py-1 rounded-lg bg-[var(--btn)] text-white'; const r=b.dataset.r,img=document.getElementById('pImg'); img.className='w-full bg-slate-100 grid place-items-center text-slate-300 text-sm '+(r==='11'?'aspect-square':r==='st'?'aspect-[9/16]':'aspect-[4/5]'); document.getElementById('cOverlay').hidden = r!=='st'; });
  // 画像ソース配線
  const curStore=()=>document.getElementById('cStore').value;
  document.getElementById('cFromStore').onclick=()=>openPhotoPicker(curStore(),(src)=>setComposeImg(src));
  document.getElementById('cDesign').onclick=()=>{ const tell=document.getElementById('cTell').value||document.getElementById('cBody').value.slice(0,20); openDesignEditor({ storeId:curStore(), tell, onDone:(url)=>{ openCompose(); setTimeout(()=>{ if(url) setComposeImg(url); },60); } }); };
  document.getElementById('cFile').onchange=e=>{ const f=e.target.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>setComposeImg(rd.result,'端末'); rd.readAsDataURL(f); };
  document.getElementById('cAI').onclick=()=>{ const tell=document.getElementById('cTell').value||'今日のおすすめ'; const out=document.getElementById('cAIout'); out.innerHTML='<div class="text-[12px] text-slate-400">書いています…</div>';
    setTimeout(()=>{ const sid=document.getElementById('cStore').value; const s=STORE_MASTER.find(x=>x.id===sid);
      const cands=[`こんにちは😊${s.name}です‼️\n${tell}をご用意しました。\nご予約はプロフィール欄のネットからどうぞ🙇🏻‍♂️\n#${s.id} #グルメ #今夜ごはん #乾杯 #おすすめ`,`【${tell}】\n${s.name}の自慢の一皿、今だけ。\n画像をチェック👀\n#${s.id} #居酒屋 #ディナー #食べスタグラム #地元グルメ`,`${tell}✨\n仕事終わりの一杯に。\nお待ちしています🍶\n#${s.id} #今日のごはん #晩酌 #名物 #予約受付中`];
      out.innerHTML=cands.map(c=>`<button class="w-full text-left text-[12px] bg-white border border-slate-200 rounded-lg px-2 py-1.5 hover:border-indigo-300" onclick="document.getElementById('cBody').value=this.dataset.c; document.getElementById('cBody').dispatchEvent(new Event('input'));" data-c="${c.replace(/"/g,'&quot;')}">${c.replace(/\n/g,'<br>')}</button>`).join(''); },700); };
  const setWhen=m=>{ document.getElementById('cWhenR').className='px-2 py-1 rounded-lg '+(m==='r'?'bg-[var(--btn)] text-white':'bg-slate-100'); document.getElementById('cWhenN').className='px-2 py-1 rounded-lg '+(m==='n'?'bg-[var(--btn)] text-white':'bg-slate-100'); document.getElementById('cDate').style.display=m==='n'?'none':''; document.getElementById('cSubmit').textContent=m==='n'?'⚡投稿する':'🕒予約する'; document.getElementById('cSubmit').dataset.mode=m; };
  document.getElementById('cWhenR').onclick=()=>setWhen('r'); document.getElementById('cWhenN').onclick=()=>setWhen('n'); setWhen('r');
  document.getElementById('cSubmit').onclick=()=>{ const m=document.getElementById('cSubmit').dataset.mode; const s=STORE_MASTER.find(x=>x.id===document.getElementById('cStore').value); alert((m==='n'?'【テスト・今すぐ投稿】':'【テスト・予約】')+`\n店: ${s.name}\n本文: ${document.getElementById('cBody').value.slice(0,40)}…\n\n※モックです。実際のInstagramには投稿していません。`); closeCompose(); };
  // 入力途中で背景クリック→下書き確認
  document.getElementById('composeBg').addEventListener('click',(e)=>{ if(e.target.id==='composeBg'){ const body=document.getElementById('cBody').value; if(body.trim() && !confirm('下書きを破棄しますか？')) return; closeCompose(); } });
  upd();
}
window.closeCompose=function(){ document.getElementById('modalRoot').innerHTML=''; document.onkeydown=null; };
function setComposeImg(src,note){ const img=document.getElementById('pImg'); if(!img) return; img.style.backgroundImage=`url('${src}')`; img.style.backgroundSize='cover'; img.style.backgroundPosition='center'; img.textContent=''; const n=document.getElementById('cImgNote'); if(n) n.textContent=note?'付けました':'付けました'; }
window.setComposeImg=setComposeImg;

let tourI=0;
function openTour(){ tourI=0; drawTour(); }
function drawTour(){ const r=document.getElementById('tourRoot'); r.innerHTML=`<div class="fixed inset-0 z-[60] bg-black/50 grid place-items-center p-4" id="tourBg"><div class="bg-white rounded-2xl shadow-2xl max-w-[440px] w-full p-5"><div class="text-[11px] font-bold text-slate-400 mb-2">使い方 ${tourI+1}/9</div><div class="text-[15px] leading-7">${TOUR[tourI]}</div><div class="flex items-center gap-2 mt-4"><button onclick="closeTour()" class="text-[12px] text-slate-400">閉じる</button><div class="flex-1"></div>${tourI>0?'<button onclick="tourStep(-1)" class="text-[13px] font-semibold px-3 py-1.5 rounded-lg bg-slate-100">戻る</button>':''}<button onclick="tourStep(1)" class="text-[13px] font-bold text-white bg-[var(--btn)] px-3 py-1.5 rounded-lg">${tourI<8?'次へ':'はじめる'}</button></div></div></div>`; document.getElementById('tourBg').addEventListener('click',e=>{ if(e.target.id==='tourBg') closeTour(); }); }

/* ====== 写真選びモーダル（5-2・compose＆提案カード共通） ====== */
const PHOTO_FOLDERS=['すべて','231024 料理','230919 内観外観','231105 コース','231201 ドリンク'];
function mockStorePhotos(sid){ const r=mulberry32(hashStr(sid||'x')+3); const a=[]; for(let i=0;i<18;i++){ a.push({ name:'DSC_'+(3000+Math.floor(r()*900))+'.jpg', folder:PHOTO_FOLDERS[1+Math.floor(r()*4)], thumb:svgThumb((sid||'x')+'ph'+i,'📷') }); } return a; }
function mockMediaPhotos(sid){ const r=mulberry32(hashStr(sid||'y')+9); const a=[]; for(let i=0;i<10;i++){ a.push({ src:(i%2?'ホットペッパー':'ぐるなび'), thumb:svgThumb((sid||'y')+'md'+i,'媒') }); } return a; }
const PICK_UI={ tab:'store', folder:'すべて' };
function openPhotoPicker(sid, onPick){
  PICK_UI.tab='store'; PICK_UI.folder='すべて';
  const root=document.getElementById('modalRoot2')||(()=>{ const d=document.createElement('div'); d.id='modalRoot2'; document.body.appendChild(d); return d; })();
  function draw(){
    const s=STORE_MASTER.find(x=>x.id===sid);
    const tabBtn=(k,l)=>`<button onclick="PICK_UI.tab='${k}';window.__pickDraw()" class="text-[12px] font-semibold px-2.5 py-1 rounded-lg ${PICK_UI.tab===k?'bg-[var(--btn)] text-white':'bg-slate-100 text-slate-600'}">${l}</button>`;
    let body='';
    if(PICK_UI.tab==='store'){
      const photos=mockStorePhotos(sid).filter(p=>PICK_UI.folder==='すべて'||p.folder===PICK_UI.folder);
      const chips=PHOTO_FOLDERS.map(f=>`<button onclick="PICK_UI.folder='${f}';window.__pickDraw()" class="text-[11px] px-2 py-0.5 rounded-full ${PICK_UI.folder===f?'bg-[var(--btn)] text-white':'bg-slate-100 text-slate-500'}">${f}</button>`).join('');
      body=`<div class="flex flex-wrap gap-1 mb-2">${chips}</div><div class="grid grid-cols-3 sm:grid-cols-5 gap-2">${photos.map((p,i)=>`<button onclick="window.__pickPhoto(${i})" class="group"><img src="${p.thumb}" class="aspect-square w-full rounded-lg object-cover ring-1 ring-slate-200 group-hover:ring-2 group-hover:ring-indigo-400"><div class="text-[9px] text-slate-400 truncate">${p.name}</div></button>`).join('')}</div>`;
      window.__pickPhoto=i=>{ onPick(photos[i].thumb, photos[i].name); closePick(); };
    } else if(PICK_UI.tab==='media'){
      const photos=mockMediaPhotos(sid);
      body=`<div class="text-[11px] text-slate-400 mb-2">ホットペッパー・ぐるなびの店ページから取り込み</div><div class="grid grid-cols-3 sm:grid-cols-5 gap-2">${photos.map((p,i)=>`<button onclick="window.__pickMedia(${i})" class="group relative"><img src="${p.thumb}" class="aspect-square w-full rounded-lg object-cover ring-1 ring-slate-200 group-hover:ring-2 group-hover:ring-indigo-400"><span class="absolute bottom-0 inset-x-0 text-[8px] text-white bg-red-500/80 rounded-b-lg text-center">${p.src}</span></button>`).join('')}</div>`;
      window.__pickMedia=i=>{ onPick(photos[i].thumb, photos[i].src); closePick(); };
    } else {
      body=`<label class="block border-2 border-dashed border-slate-300 rounded-xl p-8 text-center cursor-pointer hover:bg-slate-50"><div class="text-3xl mb-1">📁</div><div class="text-[13px] text-slate-500">端末から画像を選ぶ（複数可＝カルーセル）</div><input id="pickFile" type="file" accept="image/*" multiple hidden></label>`;
    }
    root.innerHTML=`<div class="fixed inset-0 z-[55] bg-black/40 grid place-items-center p-3" id="pickBg"><div class="bg-white w-full max-w-[640px] max-h-[86vh] overflow-auto rounded-2xl shadow-2xl">
      <div class="flex items-center gap-2 px-4 py-3 border-b border-slate-100 sticky top-0 bg-white"><div class="flex gap-1.5">${tabBtn('store','📷店の写真')}${tabBtn('media','🌐媒体から')}${tabBtn('file','📁端末から')}</div><div class="flex-1"></div><span class="text-[11px] text-slate-400">${s?s.name:''}</span><a href="#" onclick="event.preventDefault();alert('Driveフォルダを開く（モック）')" class="text-[12px] text-sky-600">↗</a><button onclick="closePick()" class="w-8 h-8 grid place-items-center rounded-lg hover:bg-slate-100">✕</button></div>
      <div class="p-4">${body}</div></div></div>`;
    document.getElementById('pickBg').addEventListener('click',e=>{ if(e.target.id==='pickBg') closePick(); });
    const pf=document.getElementById('pickFile'); if(pf) pf.onchange=e=>{ const f=e.target.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ onPick(rd.result,f.name); closePick(); }; rd.readAsDataURL(f); };
  }
  window.__pickDraw=draw; draw();
}
window.closePick=function(){ const r=document.getElementById('modalRoot2'); if(r) r.innerHTML=''; };

      <button onclick="dzExport('png')" class="px-2 py-1 bg-slate-700 rounded">PNG</button>
      <button onclick="dzToInsta()" class="px-2 py-1 bg-emerald-600 rounded font-bold">📸Instagramへ</button>
      <button onclick="closeCompose()" class="px-2 py-1 bg-slate-700 rounded">閉じる</button>
    </div>
    <div class="flex-1 flex min-h-0">
      <div class="w-[220px] bg-slate-800 text-white overflow-auto p-2 text-[12px] space-y-2">
        <div><div class="font-bold text-slate-300 mb-1">③型</div><div class="grid grid-cols-2 gap-1">${DZ_TYPES.map((t,i)=>`<button onclick="dzType(${i})" class="px-1.5 py-1 bg-slate-700 rounded text-[11px] hover:bg-slate-600">${t}</button>`).join('')}</div></div>
        <div><div class="font-bold text-slate-300 mb-1">配色</div><div class="grid grid-cols-2 gap-1">${DZ_PAL.map((p,i)=>`<button onclick="dzPal(${i})" class="flex items-center gap-1 px-1.5 py-1 bg-slate-700 rounded text-[11px] hover:bg-slate-600"><span class="w-3 h-3 rounded-full" style="background:${p[1]}"></span>${p[0]}</button>`).join('')}</div><button onclick="dzRandom()" class="mt-1 w-full px-1.5 py-1 bg-indigo-600 rounded text-[11px]">🎲おまかせ</button></div>
        <div><div class="font-bold text-slate-300 mb-1">④文言（AI3通り）</div><div class="space-y-1">${['落ち着き','元気','手書きPOP'].map((t,i)=>`<button onclick="dzTone(${i})" class="w-full px-1.5 py-1 bg-slate-700 rounded text-[11px] text-left hover:bg-slate-600">${t}</button>`).join('')}</div></div>
        <div><div class="font-bold text-slate-300 mb-1">⑤追加</div><div class="grid grid-cols-2 gap-1"><button onclick="dzAdd('text')" class="px-1.5 py-1 bg-slate-700 rounded text-[11px]">＋文字</button><button onclick="dzAddPhoto()" class="px-1.5 py-1 bg-slate-700 rounded text-[11px]">＋写真</button><button onclick="dzAdd('rect')" class="px-1.5 py-1 bg-slate-700 rounded text-[11px]">＋四角</button><button onclick="dzAdd('circle')" class="px-1.5 py-1 bg-slate-700 rounded text-[11px]">＋丸</button><button onclick="dzAdd('line')" class="px-1.5 py-1 bg-slate-700 rounded text-[11px]">＋線</button></div></div>
      </div>
      <div class="flex-1 grid place-items-center overflow-auto p-4" id="dzStage"></div>
      <div class="w-[160px] bg-slate-800 text-white overflow-auto p-2 text-[12px]"><div class="font-bold text-slate-300 mb-1">レイヤー</div><div id="dzLayers" class="space-y-1"></div><div class="mt-2 text-[10px] text-slate-400">選択中：Deleteで削除／Ctrl+Dで複製／矢印で微調整</div></div>
    </div></div>`;
  document.getElementById('dzTitle').oninput=e=>{ const t=DZ.els.find(x=>x.type==='text'); if(t){ t.text=e.target.value; dzRender(); } };
  dzRender();
  document.onkeydown=dzKey;
}
function dzRender(){
  const stage=document.getElementById('dzStage'); if(!stage) return; const S=DZ.S;
  let html=`<div id="dzCanvas" style="position:relative;width:${DZ.W*S}px;height:${DZ.H*S}px;background:${DZ.bg};box-shadow:0 10px 40px rgba(0,0,0,.5);overflow:hidden">`;
  DZ.els.forEach((el,i)=>{ const sel=i===DZ.sel; const base=`position:absolute;left:${el.x*S}px;top:${el.y*S}px;width:${el.w*S}px;height:${el.h*S}px;transform:rotate(${el.rot||0}deg);transform-origin:center;cursor:move;${sel?'outline:2px solid #6366f1;':''}`;
    if(el.type==='text') html+=`<div data-i="${i}" style="${base}display:flex;align-items:center;color:${el.color};font-weight:${el.weight||700};font-size:${el.size*S}px;line-height:1.1;overflow:hidden;white-space:pre-wrap">${(el.text||'').replace(/</g,'&lt;')}</div>`;
    else if(el.type==='rect') html+=`<div data-i="${i}" style="${base}background:${el.bg||'#000'}"></div>`;
    else if(el.type==='circle') html+=`<div data-i="${i}" style="${base}background:${el.bg||'#000'};border-radius:9999px"></div>`;
    else if(el.type==='line') html+=`<div data-i="${i}" style="${base}background:${el.bg||'#fff'};height:${Math.max(2,4*S)}px"></div>`;
    else if(el.type==='image') html+=`<div data-i="${i}" style="${base}background-image:url('${el.src}');background-size:cover;background-position:center"></div>`;
    if(sel) html+=`<div data-rs="${i}" style="position:absolute;left:${(el.x+el.w)*S-6}px;top:${(el.y+el.h)*S-6}px;width:12px;height:12px;background:#6366f1;border-radius:3px;cursor:nwse-resize;z-index:99"></div><div data-rot="${i}" style="position:absolute;left:${(el.x+el.w/2)*S-6}px;top:${el.y*S-20}px;width:12px;height:12px;background:#10b981;border-radius:9999px;cursor:grab;z-index:99"></div>`;
  });
  html+=`</div>`; stage.innerHTML=html;
  // layers
  document.getElementById('dzLayers').innerHTML=DZ.els.map((el,i)=>`<button onclick="DZ.sel=${i};dzRender()" class="w-full text-left px-1.5 py-1 rounded text-[11px] ${i===DZ.sel?'bg-indigo-600':'bg-slate-700'}">${i+1}. ${el.type==='text'?('文字「'+(el.text||'').slice(0,6)+'」'):el.type}</button>`).reverse().join('');
  dzBindDrag();
}
function dzBindDrag(){
  const canvas=document.getElementById('dzCanvas'); if(!canvas) return; const S=DZ.S;
  canvas.querySelectorAll('[data-i]').forEach(node=>{ node.onmousedown=e=>{ e.preventDefault(); const i=+node.dataset.i; DZ.sel=i; const el=DZ.els[i]; const sx=e.clientX,sy=e.clientY,ox=el.x,oy=el.y;
    const mv=ev=>{ el.x=ox+(ev.clientX-sx)/S; el.y=oy+(ev.clientY-sy)/S; dzRender(); }; const up=()=>{ document.removeEventListener('mousemove',mv); document.removeEventListener('mouseup',up); dzPush(); }; document.addEventListener('mousemove',mv); document.addEventListener('mouseup',up); }; });
  const rs=canvas.querySelector('[data-rs]'); if(rs) rs.onmousedown=e=>{ e.preventDefault();e.stopPropagation(); const i=+rs.dataset.rs; const el=DZ.els[i]; const sx=e.clientX,sy=e.clientY,ow=el.w,oh=el.h;
    const mv=ev=>{ el.w=Math.max(20,ow+(ev.clientX-sx)/S); el.h=Math.max(20,oh+(ev.clientY-sy)/S); if(el.type==='text') el.size=Math.max(16,el.h*0.7); dzRender(); }; const up=()=>{ document.removeEventListener('mousemove',mv); document.removeEventListener('mouseup',up); dzPush(); }; document.addEventListener('mousemove',mv); document.addEventListener('mouseup',up); };
  const rot=canvas.querySelector('[data-rot]'); if(rot) rot.onmousedown=e=>{ e.preventDefault();e.stopPropagation(); const i=+rot.dataset.rot; const el=DZ.els[i]; const cx=(el.x+el.w/2)*S, cy=(el.y+el.h/2)*S; const rect=canvas.getBoundingClientRect();
    const mv=ev=>{ const dx=(ev.clientX-rect.left)-cx, dy=(ev.clientY-rect.top)-cy; el.rot=Math.round(Math.atan2(dy,dx)*180/Math.PI+90); dzRender(); }; const up=()=>{ document.removeEventListener('mousemove',mv); document.removeEventListener('mouseup',up); dzPush(); }; document.addEventListener('mousemove',mv); document.addEventListener('mouseup',up); };
}
function dzKey(e){ if(!DZ||DZ.sel<0) return; const el=DZ.els[DZ.sel]; if(e.target && (e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')) return;
  if(e.key==='Delete'||e.key==='Backspace'){ DZ.els.splice(DZ.sel,1); DZ.sel=-1; dzRender(); dzPush(); e.preventDefault(); }
  else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='d'){ const c=JSON.parse(JSON.stringify(el)); c.x+=20;c.y+=20; DZ.els.push(c); DZ.sel=DZ.els.length-1; dzRender(); dzPush(); e.preventDefault(); }
  else if(e.key.startsWith('Arrow')){ const d=e.shiftKey?10:2; if(e.key==='ArrowLeft')el.x-=d; if(e.key==='ArrowRight')el.x+=d; if(e.key==='ArrowUp')el.y-=d; if(e.key==='ArrowDown')el.y+=d; dzRender(); e.preventDefault(); } }
window.dzType=i=>{ const t=DZ_TYPES[i]; const title=(DZ.els.find(x=>x.type==='text')||{}).text||'本日のおすすめ'; const sub=(DZ.els[2]||{}).text||'ご予約はプロフィールから';
  if(t==='余白と縦書き'){ DZ.els=[{type:'text',x:760,y:120,w:200,h:900,rot:0,text:title.split('').join('\n'),color:DZ.fg,size:80,weight:800}]; }
  else if(t==='文字だけ'){ DZ.els=[{type:'text',x:90,y:520,w:900,h:160,rot:0,text:title,color:DZ.fg,size:120,weight:800},{type:'text',x:90,y:720,w:900,h:60,rot:0,text:sub,color:DZ.fg,size:40,weight:600}]; }
  else if(t==='数字どーん'){ DZ.els=[{type:'text',x:90,y:300,w:900,h:400,rot:0,text:'¥980',color:DZ.ac,size:300,weight:800},{type:'text',x:90,y:760,w:900,h:60,rot:0,text:title,color:DZ.fg,size:52,weight:700}]; }
  else if(t==='クーポン券'){ DZ.els=[{type:'rect',x:90,y:450,w:900,h:450,rot:0,bg:DZ.ac},{type:'text',x:120,y:520,w:840,h:120,rot:0,text:title,color:'#fff',size:72,weight:800},{type:'text',x:120,y:720,w:840,h:60,rot:0,text:sub,color:'#fff',size:40,weight:600}]; }
  else { DZ.els=[{type:'rect',x:60,y:900,w:960,h:300,rot:0,bg:'rgba(0,0,0,.4)'},{type:'text',x:90,y:940,w:900,h:120,rot:0,text:title,color:DZ.fg,size:92,weight:800},{type:'text',x:90,y:1080,w:900,h:60,rot:0,text:sub,color:DZ.fg,size:40,weight:600}]; }
  DZ.sel=-1; dzRender(); dzPush(); };
window.dzPal=i=>{ const p=DZ_PAL[i]; DZ.bg=p[1]; DZ.fg=p[2]; DZ.ac=p[3]; DZ.els.forEach(el=>{ if(el.type==='text'&&el.color!==DZ.ac) el.color=DZ.fg; }); dzRender(); dzPush(); };
window.dzRandom=()=>{ dzType(Math.floor(Math.random()*DZ_TYPES.length)); dzPal(Math.floor(Math.random()*DZ_PAL.length)); };
window.dzTone=i=>{ const t=DZ.els.find(x=>x.type==='text'); if(!t) return; const base=document.getElementById('dzTitle').value||'本日のおすすめ'; t.text=[`${base}`,`${base}🔥今だけ！`,`★${base}★`][i]; dzRender(); dzPush(); };
window.dzAdd=type=>{ const el=type==='text'?{type:'text',x:200,y:200,w:600,h:100,rot:0,text:'テキスト',color:DZ.fg,size:72,weight:700}:type==='line'?{type:'line',x:200,y:300,w:600,h:8,rot:0,bg:DZ.fg}:{type,x:300,y:300,w:300,h:300,rot:0,bg:DZ.ac}; DZ.els.push(el); DZ.sel=DZ.els.length-1; dzRender(); dzPush(); };
window.dzAddPhoto=()=>{ openPhotoPicker(DZ.onDone?null:null,(src)=>{ DZ.els.push({type:'image',x:140,y:140,w:800,h:800,rot:0,src}); DZ.sel=DZ.els.length-1; dzRender(); dzPush(); }); };
window.dzUndo=()=>{ if(DZ.hi>0){ DZ.hi--; const o=JSON.parse(DZ.hist[DZ.hi]); DZ.bg=o.bg; DZ.els=o.els; DZ.sel=-1; dzRender(); } };
window.dzRedo=()=>{ if(DZ.hi<DZ.hist.length-1){ DZ.hi++; const o=JSON.parse(DZ.hist[DZ.hi]); DZ.bg=o.bg; DZ.els=o.els; DZ.sel=-1; dzRender(); } };
async function dzToCanvas(){ const cv=document.createElement('canvas'); cv.width=DZ.W; cv.height=DZ.H; const ctx=cv.getContext('2d'); ctx.fillStyle=DZ.bg; ctx.fillRect(0,0,DZ.W,DZ.H);
  for(const el of DZ.els){ ctx.save(); ctx.translate(el.x+el.w/2, el.y+el.h/2); ctx.rotate((el.rot||0)*Math.PI/180); ctx.translate(-el.w/2,-el.h/2);
    if(el.type==='rect'){ ctx.fillStyle=el.bg||'#000'; ctx.fillRect(0,0,el.w,el.h); }
    else if(el.type==='circle'){ ctx.fillStyle=el.bg||'#000'; ctx.beginPath(); ctx.ellipse(el.w/2,el.h/2,el.w/2,el.h/2,0,0,7); ctx.fill(); }
    else if(el.type==='line'){ ctx.fillStyle=el.bg||'#fff'; ctx.fillRect(0,el.h/2-2,el.w,4); }
    else if(el.type==='text'){ ctx.fillStyle=el.color||'#fff'; ctx.font=`${el.weight||700} ${el.size}px "Noto Sans JP",sans-serif`; ctx.textBaseline='top'; (el.text||'').split('\n').forEach((ln,k)=>ctx.fillText(ln,0,k*el.size*1.1)); }
    else if(el.type==='image'){ if((el.src||'').startsWith('data:image/svg')){ ctx.fillStyle=DZ.ac; ctx.fillRect(0,0,el.w,el.h); } else { try{ const img=await new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=el.src; }); ctx.drawImage(img,0,0,el.w,el.h); }catch(e){ ctx.fillStyle='#ccc'; ctx.fillRect(0,0,el.w,el.h); } } }
    ctx.restore(); }
  return cv; }
window.dzExport=async(fmt)=>{ const cv=await dzToCanvas(); let url; try{ url=cv.toDataURL(fmt==='png'?'image/png':'image/jpeg',0.92); }catch(e){ alert('画像化に失敗しました（写真の取り込み元によっては書き出せません）'); return; } const a=document.createElement('a'); a.href=url; a.download='promo.'+(fmt==='png'?'png':'jpg'); a.click(); };
window.dzToInsta=async()=>{ const cv=await dzToCanvas(); let url; try{ url=cv.toDataURL('image/jpeg',0.92); }catch(e){ url=''; } const done=DZ.onDone; closeCompose(); document.onkeydown=null; if(done) done(url); else { openCompose(); setTimeout(()=>{ if(url) setComposeImg(url); },50); } };

/* ====== 更新監視（軽量ポーリング・initiate_version.json） ====== */
function startVersionPolling(){ let last=null; async function check(){ try{ const r=await fetch('./initiate_version.json?_='+Date.now(),{cache:'no-store'}); if(!r.ok) return; const j=await r.json(); if(last!==null && j.latest && j.latest!==last){ const b=document.getElementById('updateBanner'); if(b) b.hidden=false; } if(j.latest) last=j.latest; }catch(e){} }
  check(); setInterval(()=>{ if(!document.hidden) check(); }, 30000); }

/* ====== ルーター ====== */
const VIEWS={sns:'view-sns',plan:'view-plan',posts:'view-posts',seika:'view-seika',accounts:'view-accounts'};
let CURRENT='sns';
function route(){ let h=location.hash.replace(/^#/,'')||'sns'; let tab='sns';
  if(h==='sns/plan')tab='plan'; else if(h==='sns/posts')tab='posts'; else if(h==='sns/seika')tab='seika'; else if(h==='sns/accounts')tab='accounts'; else tab='sns';
  CURRENT=tab;
  document.querySelectorAll('.view').forEach(v=>v.hidden=true); document.getElementById(VIEWS[tab]).hidden=false;
  document.querySelectorAll('.tab').forEach(a=>{ const on=a.dataset.tab===tab; a.classList.toggle('border-[var(--btn)]',on); a.classList.toggle('text-slate-900',on); a.classList.toggle('border-transparent',!on); a.classList.toggle('text-slate-500',!on); });
  renderActive();
}
function renderActive(){ renderSummary(); if(CURRENT==='sns')renderSNS(); else if(CURRENT==='plan')renderPlan(); else if(CURRENT==='posts')renderPosts(); else if(CURRENT==='seika')renderSeika(); else renderAccounts(); }
function rerenderActive(){ renderDeptChips(); renderActive(); }
window.addEventListener('hashchange',route);

/* ====== 起動 ====== */
(async function init(){ MON=await loadMonitor(); PLANS=(MON && !MON._mock)?buildPlansFromMON():buildPlans(); RES=buildReservations(); renderDeptChips(); route(); startVersionPolling();
  try{ if(localStorage.getItem('tour:sns')!=='1'){ /* 初回はツアーを促すだけ（自動では出さない） */ } }catch(e){}
})();
</script>
