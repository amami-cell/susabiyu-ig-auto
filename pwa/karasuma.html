<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>鮨処すさび湯 四条烏丸（仮）</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:#0b0f14;color:#e8edf3;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
  .gate{position:fixed;inset:0;background:#0b0f14;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:18px;padding:30px;z-index:10}
  .gate h1{font-size:20px;letter-spacing:2px}
  .gate p{color:#8b96a5;font-size:13px;text-align:center;line-height:1.7}
  .gate input{width:min(320px,80vw);padding:14px 16px;font-size:20px;text-align:center;letter-spacing:6px;border-radius:12px;border:1px solid #2a3542;background:#141b23;color:#fff;outline:none}
  .gate button{width:min(320px,80vw);padding:14px;font-size:16px;font-weight:700;border:0;border-radius:12px;background:#c8a24a;color:#1a1206}
  .gate .err{color:#ff8080;font-size:13px;min-height:18px}
  header{padding:18px 16px 6px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  header h1{font-size:19px;letter-spacing:1px}
  header .sub{color:#c8a24a;font-size:12px;letter-spacing:2px}
  .note{margin:8px 16px 14px;padding:10px 14px;background:#141b23;border:1px solid #22303e;border-radius:12px;color:#9aa6b5;font-size:12.5px;line-height:1.7}
  .grid{padding:0 12px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
  .card{background:#121821;border:1px solid #1f2a37;border-radius:16px;overflow:hidden}
  .card .ttl{padding:10px 14px;font-size:14.5px;font-weight:700}
  .card .ttl small{color:#8b96a5;font-weight:400;margin-left:8px}
  .card video{width:100%;aspect-ratio:9/16;background:#000;display:block}
  #app{display:none}
</style>
</head>
<body>
<div class="gate" id="gate">
  <h1>🍣 鮨処すさび湯 四条烏丸</h1>
  <p>このページは関係者専用です。<br>入場コードを入力してください。</p>
  <input id="pass" type="password" inputmode="numeric" autocomplete="off" placeholder="●●●●●●">
  <button id="go">入る</button>
  <div class="err" id="err"></div>
  <a href="./" style="color:#8b96a5;font-size:13px;text-decoration:none">← 三条アプリへ戻る</a>
</div>
<div id="app">
  <header>
    <h1>鮨処すさび湯 四条烏丸</h1><span class="sub">見本保管（仮ページ）</span><a href="./" style="margin-left:auto;color:#8b96a5;font-size:13px;text-decoration:none">← 三条アプリ</a>
  </header>
  <div class="note">
    上品系テンプレの保管場所です。烏丸店のInstagram連携・確認/レポート機能は、アカウント情報が揃い次第この場所に本実装します。三条の見本には表示されません。
  </div>
  <div class="grid" id="grid"></div>
</div>
<script>
(function () {
  "use strict";
  var HASH = "92925488b28ab12584ac8fcaa8a27a0f497b2c62940c8f4fbc8ef19ebc87c43e";
  var VIDS = [
    { l: "王道", u: "https://cdn.jsdelivr.net/gh/amami-cell/susabiyu-media@9fffa2ff4d16058e55c56923d96a72047145d7d2/preview/20260629192105_9458.mp4" },
    { l: "賑やか", u: "https://cdn.jsdelivr.net/gh/amami-cell/susabiyu-media@597126d3f3039aae33150c588586650fb7c9d4bd/preview/20260629192237_8997.mp4" },
    { l: "雑誌風", u: "https://cdn.jsdelivr.net/gh/amami-cell/susabiyu-media@d2a353b2329ab390e2b57d387d7b01dcc21968d1/preview/20260628195502_2660.mp4" },
    { l: "全画面", u: "https://cdn.jsdelivr.net/gh/amami-cell/susabiyu-media@9b5b4822ade15e67c2ac4aa7c80218415f9899e5/preview/20260629192406_4848.mp4" },
    { l: "お品書き", u: "https://cdn.jsdelivr.net/gh/amami-cell/susabiyu-media@a872a2633f1117f51aa01bb2a499634534f48c36/preview/20260628213000_1473.mp4" },
    { l: "お品書き（縦書き）", u: "https://cdn.jsdelivr.net/gh/amami-cell/susabiyu-media@0584cc59aee59b40d4eec0d689846b0f268faee7/preview/20260628220608_2867.mp4" },
    { l: "回転レーン", u: "https://cdn.jsdelivr.net/gh/amami-cell/susabiyu-media@e30782aa0e6d859234c0ff08714f51dbd36d0467/preview/20260629092201_4293.mp4" },
    { l: "店主おすすめ", u: "https://cdn.jsdelivr.net/gh/amami-cell/susabiyu-media@8f850d4a4fb00a479b0fddb4dea4233100337cba/preview/20260628232708_3117.mp4" },
    { l: "グリッド→ズーム", u: "https://cdn.jsdelivr.net/gh/amami-cell/susabiyu-media@dcc774c639b5024cb41f13e864fb7fe5cd599b08/preview/20260629192557_8677.mp4" },
    { l: "暖簾くぐり", u: "https://cdn.jsdelivr.net/gh/amami-cell/susabiyu-media@275d89ad1ed076bc08ebe0d79de8bcaccc553172/preview/20260629105023_7301.mp4" },
    { l: "季節の旬", u: "https://cdn.jsdelivr.net/gh/amami-cell/susabiyu-media@07d3a3c48f79d6bc9031b39079460ea867448cd9/preview/20260629105157_0812.mp4" }
  ];
  function sha256(str) {
    return crypto.subtle.digest("SHA-256", new TextEncoder().encode(str)).then(function (h) {
      var a = new Uint8Array(h), s = "";
      for (var i = 0; i < a.length; i++) s += ("0" + a[i].toString(16)).slice(-2);
      return s;
    });
  }
  function open_() {
    document.getElementById("gate").style.display = "none";
    var app = document.getElementById("app");
    app.style.display = "block";
    var g = document.getElementById("grid");
    VIDS.forEach(function (v, i) {
      var c = document.createElement("div"); c.className = "card";
      c.innerHTML = '<div class="ttl">' + (i + 1) + '. ' + v.l + '<small>上品系</small></div>' +
        '<video controls playsinline preload="' + (i < 2 ? "metadata" : "none") + '" src="' + v.u + '"></video>';
      g.appendChild(c);
    });
  }
  function tryPass() {
    var v = (document.getElementById("pass").value || "").trim();
    if (!v) return;
    sha256(v).then(function (h) {
      if (h === HASH) {
        try { localStorage.setItem("kar_ok", "1"); } catch (e) {}
        open_();
      } else {
        document.getElementById("err").textContent = "コードが違います";
        document.getElementById("pass").value = "";
      }
    });
  }
  document.getElementById("go").onclick = tryPass;
  document.getElementById("pass").addEventListener("keydown", function (e) { if (e.key === "Enter") tryPass(); });
  var ok = false;
  try { ok = localStorage.getItem("kar_ok") === "1"; } catch (e) {}
  if (ok) open_();
})();
</script>
</body>
</html>
